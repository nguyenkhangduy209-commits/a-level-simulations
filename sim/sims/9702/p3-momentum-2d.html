<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, DY = SIM.dynamics;
  var course = ui.course('9702'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Collisions and explosions in two dimensions', g: g, tags: ['9702 3.3.2 Momentum in 2D', '9702 3.3.3–3.3.4 Elastic / inelastic', '9702 1.4 Vectors'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 16 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 4, onFrame: function () { drawAll(); } });
  ui.legend(sceneCard, [{ color: 'var(--c-s1)', label: 'disc / fragment 1' }, { color: 'var(--c-s2)', label: 'disc / fragment 2' }, { color: 'var(--c-s3)', label: 'fragment 3' },
    { color: 'var(--c-velocity)', label: 'velocity' }, { color: 'var(--c-accel)', label: 'centre of mass (straight line, constant speed)' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var cM = ui.canvas(plotWrap), cK = ui.canvas(plotWrap);
  var vpM = new SIM.view.Viewport(cM, { pad: 26 }), vpK = new SIM.view.Viewport(cK, { pad: 10 });
  var tblCard = pg.card('left', 'Momentum components');
  var tblEl = ui.h('div', { style: 'overflow-x:auto' }); tblCard.appendChild(tblEl);

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var mode = ui.select(paramCard, { label: 'Collision', value: 'elastic', options: [
    { value: 'elastic', label: 'Elastic: smooth discs, kinetic energy conserved' },
    { value: 'stick', label: 'Perfectly inelastic: discs stick together' },
    { value: 'one', label: 'Exam: final velocity of body 1 given, find body 2' },
    { value: 'dirs', label: 'Exam: both final directions given, find both speeds' },
    { value: 'explode', label: 'Explosion into 2 or 3 fragments' }] }, update);
  var prm = ui.params(paramCard, [
    { key: 'm1', label: 'Mass 1', sym: 'm<sub>1</sub>', unit: 'kg', min: 0.1, max: 2000, step: 0.1, value: 1 },
    { key: 'm2', label: 'Mass 2', sym: 'm<sub>2</sub>', unit: 'kg', min: 0.1, max: 2000, step: 0.1, value: 1 },
    { key: 'm3', label: 'Mass 3', sym: 'm<sub>3</sub>', unit: 'kg', min: 0.1, max: 2000, step: 0.1, value: 1 },
    { key: 'r1', label: 'Radius of disc 1', sym: 'r<sub>1</sub>', unit: 'm', min: 0.05, max: 3, step: 0.01, value: 0.5 },
    { key: 'r2', label: 'Radius of disc 2', sym: 'r<sub>2</sub>', unit: 'm', min: 0.05, max: 3, step: 0.01, value: 0.5 },
    { key: 'b', label: 'Impact parameter (sideways offset of the centres)', sym: 'b', unit: 'm', min: 0, max: 0.99, step: 0.001, value: 0 },
    { key: 'u1', label: 'Speed of body 1 before', sym: 'u<sub>1</sub>', unit: 'm s<sup>−1</sup>', min: 0, max: 50, step: 0.01, value: 4 },
    { key: 'tu1', label: 'Direction of body 1 before', sym: 'α<sub>1</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: 0 },
    { key: 'u2', label: 'Speed of body 2 before', sym: 'u<sub>2</sub>', unit: 'm s<sup>−1</sup>', min: 0, max: 50, step: 0.01, value: 0 },
    { key: 'tu2', label: 'Direction of body 2 before', sym: 'α<sub>2</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: 90 },
    { key: 'v1', label: 'Speed of 1 after', sym: 'v<sub>1</sub>', unit: 'm s<sup>−1</sup>', min: 0, max: 50, step: 0.01, value: 3 },
    { key: 'tv1', label: 'Direction of 1 after', sym: 'β<sub>1</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: 60 },
    { key: 'v2', label: 'Speed of 2 after', sym: 'v<sub>2</sub>', unit: 'm s<sup>−1</sup>', min: 0, max: 50, step: 0.01, value: 6 },
    { key: 'tv2', label: 'Direction of 2 after', sym: 'β<sub>2</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: -30 },
    { key: 'dts', label: 'Strobe interval', sym: 'Δt', unit: 's', min: 0.05, max: 1, step: 0.05, value: 0.2 }
  ], update);
  var three = ui.toggle(paramCard, { label: 'Three fragments (otherwise two)', value: true }, update);
  var trails = ui.toggle(paramCard, { label: 'Show fading trails', value: true }, drawAll);
  var strobe = ui.toggle(paramCard, { label: 'Show strobe positions at equal time intervals', value: true }, drawAll);

  ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  function P(o) { return Object.assign({ m1: 1, m2: 1, m3: 1, r1: 0.5, r2: 0.5, b: 0, u1: 4, tu1: 0, u2: 0, tu2: 90, v1: 3, tv1: 60, v2: 6, tv2: -30, dts: 0.2 }, o); }
  var presetCtl = ui.presets(presetCard, [
    { name: 'Elastic, head-on (b = 0): 2.0 kg at 3.0 m s⁻¹ on 1.0 kg at rest', m: 'elastic', v: P({ m1: 2, m2: 1, u1: 3, b: 0, r1: 0.4, r2: 0.3 }), note: 'Same as the 1-D result: v₁ = 1.0, v₂ = 4.0 m s<sup>−1</sup> along the original line.' },
    { name: 'Elastic, equal masses, one at rest: paths at 90°', m: 'elastic', v: P({ b: 0.5 }), note: 'b = 0.5 m with r₁ + r₂ = 1.0 m: the line of centres is at 30°. The target leaves along it at 4 cos 30° = 3.46 m s<sup>−1</sup>; the striker at 4 sin 30° = 2.00 m s<sup>−1</sup>, at 90° to the target.' },
    { name: 'Elastic glancing: light puck on a heavy one', m: 'elastic', v: P({ m1: 1, m2: 3, u1: 5, b: 0.6, r1: 0.5, r2: 0.5 }), note: 'Momentum and KE are both conserved; the light puck is deflected through a large angle.' },
    { name: 'Cars collide at a junction and lock together', m: 'stick', v: P({ m1: 1200, m2: 1500, u1: 15, tu1: 0, u2: 10, tu2: 90, r1: 2, r2: 2, b: 0 }), note: 'p = (18 000, 15 000) N s ⇒ v = 23 400 ÷ 2700 = 8.68 m s<sup>−1</sup> at 39.8°. KE falls from 210 kJ to 102 kJ.' },
    { name: 'Pucks stick: 0.20 kg at 3.0 m s⁻¹ meets 0.30 kg at 2.0 m s⁻¹ at 90°', m: 'stick', v: P({ m1: 0.2, m2: 0.3, u1: 3, tu1: 0, u2: 2, tu2: 90, r1: 0.1, r2: 0.12, b: 0 }), note: 'p = (0.60, 0.60) N s ⇒ V = 1.70 m s<sup>−1</sup> at 45°. KE 1.50 J → 0.72 J.' },
    { name: '2.0 kg at 5.0 m s⁻¹ hits 3.0 kg at rest; 2.0 kg leaves at 3.0 m s⁻¹ at 60°', m: 'one', v: P({ m1: 2, m2: 3, u1: 5, tu1: 0, u2: 0, v1: 3, tv1: 60, r1: 0.4, r2: 0.45 }), note: 'x: 10 = 3.0 + 3v cos β; y: 0 = 5.20 + 3v sin β ⇒ 2.91 m s<sup>−1</sup> at 36.6° below the original line.' },
    { name: '2m at 5.0 m s⁻¹ hits 3m at rest; both leave at 30° (9702/21 M/J 24 Q3)', m: 'dirs', v: P({ m1: 2, m2: 3, u1: 5, tu1: 0, u2: 0, tv1: 30, tv2: -30, r1: 0.4, r2: 0.45 }), note: 'Take m = 1 kg (it cancels). y: 2v sin 30° = 3w sin 30°; x: 10 = (2v + 3w) cos 30° ⇒ v = 2.9, w = 1.9 m s<sup>−1</sup>.' },
    { name: 'Firework at rest: 3m at 4.0, 2m at 6.0 at 90° (9702/23 M/J 23 Q3)', m: 'explode', three: true, v: P({ m1: 3, m2: 2, m3: 1, u1: 0, tu1: 0, v1: 4, tv1: 0, v2: 6, tv2: 90, r1: 0.6 }), note: 'Total momentum stays zero: fragment C has momentum (−12m, −12m) ⇒ θ = 45°, v = 17 m s<sup>−1</sup>.' },
    { name: 'Moving 4.0 kg body splits in two: 1.0 kg sideways', m: 'explode', three: false, v: P({ m1: 1, m2: 3, u1: 3, tu1: 0, v1: 6, tv1: 90, r1: 0.6 }), note: 'Total momentum (12, 0) N s stays the same: the 3.0 kg piece has momentum (12, −6) ⇒ 4.47 m s<sup>−1</sup> at −26.6°.' }
  ], function (p) { clock.pause(); mode.set(p.m, true); if (p.three !== undefined) three.set(p.three, true); prm.set(p.v, true); update(); clock.seek(0); });

  ui.notes(noteCard, [
    'Momentum is a vector: conserve the <b>x</b> and <b>y</b> components separately, or draw a closed momentum vector diagram (p before = p after).',
    'The centre of mass moves in a straight line at constant velocity throughout — before, during and after — because no external force acts.',
    'Elastic: total KE is conserved. For smooth discs only the velocity components along the line of centres change, and along that line the relative speed of approach equals the relative speed of separation.',
    'Equal masses, one at rest, elastic: the two final velocities are at 90° to each other.',
    'Sticking together (perfectly inelastic): common velocity = total momentum ÷ total mass. KE is lost but momentum is not.',
    'An explosion from rest: total momentum after is still zero, but KE increases (stored chemical energy is released).',
    'Kinetic energy is a scalar: add ½mv² for each body without directions.'
  ]);

  /* ---------- model ---------- */
  var res = null, info = null, tc = 1, T = 2, bodiesAt = null, view = null;
  function V(m, t) { return DY.polar(m, t); }
  function update() {
    var md = mode.get(), v = prm.values, ex = md === 'explode', disc = md === 'elastic' || md === 'stick', cols = ui.colors();
    // visibility
    prm.show('m3', ex && three.get()); three.el.style.display = ex ? '' : 'none';
    prm.show('u2', !ex); prm.show('tu2', !ex); prm.show('r2', !ex); prm.show('b', disc);
    prm.label('r1', ex ? 'Radius of the whole body <span class="sym">r</span>' : 'Radius of disc 1 <span class="sym">r<sub>1</sub></span>');
    prm.label('u1', ex ? 'Speed of the whole body before <span class="sym">u</span>' : 'Speed of body 1 before <span class="sym">u<sub>1</sub></span>');
    prm.label('tu1', ex ? 'Direction of the whole body before <span class="sym">α</span>' : 'Direction of body 1 before <span class="sym">α<sub>1</sub></span>');
    prm.show('v1', md === 'one' || ex); prm.show('tv1', md === 'one' || md === 'dirs' || ex);
    prm.show('v2', ex && three.get()); prm.show('tv2', md === 'dirs' || (ex && three.get()));
    if (disc) prm.range('b', 0, Math.round(0.99 * (v.r1 + v.r2) * 1000) / 1000, 0.001);
    v = prm.values;
    var u1 = V(v.u1, v.tu1), u2 = V(v.u2, v.tu2);
    info = { md: md };
    if (ex) {
      var Mx = v.m1 + v.m2 + (three.get() ? v.m3 : 0), ms = three.get() ? [v.m1, v.m2, v.m3] : [v.m1, v.m2];
      if (three.get()) res = DY.collide2D({ mode: 'explode', m1: v.m1, m2: v.m2, m3: v.m3, uC: u1, v1: V(v.v1, v.tv1), v2: V(v.v2, v.tv2) });
      else { res = DY.collide2D({ mode: 'explode', m1: v.m1, m2: 0, m3: v.m2, uC: u1, v1: V(v.v1, v.tv1), v2: [0, 0] }); res.two = true; }
      var vs = res.two ? [res.v1, res.v3] : [res.v1, res.v2, res.v3];
      var radii = ms.map(function (m) { return v.r1 * Math.cbrt(m / Mx); });
      tc = 1; T = 2.5;
      bodiesAt = function (t) {
        var dt = t - tc, cm = DY.scale(u1, dt);
        if (t < tc) return { list: [{ id: 'w', x: cm, v: u1, r: v.r1, m: Mx, c: cols.resultant, n: 'whole' }], cm: cm, after: false };
        return { list: vs.map(function (w, i) { return { id: 'f' + i, x: DY.scale(w, dt), v: w, r: radii[i], m: ms[i], c: [cols.s1, cols.s2, cols.s3][i], n: String(i + 1) }; }), cm: cm, after: true };
      };
      info.vs = vs; info.ms = ms; info.M = Mx;
    } else {
      var w = DY.add(u1, DY.scale(u2, -1)), wm = Math.hypot(w[0], w[1]), Rs = v.r1 + v.r2, d;
      if (disc) {
        res = DY.discCollision({ m1: v.m1, m2: v.m2, r1: v.r1, r2: v.r2, u1: u1, u2: u2, b: v.b, mode: md });
        d = res.noCollision ? [0, 1.5 * Rs] : res.d;
      } else {
        res = DY.collide2D({ mode: md, m1: v.m1, m2: v.m2, u1: u1, u2: u2, v1: V(v.v1, v.tv1), a1: v.tv1, a2: v.tv2 });
        if (wm < 1e-12) res.noCollision = 'Same velocity: the bodies never meet';
        d = wm > 1e-12 ? DY.scale(w, Rs / wm) : [0, 1.5 * Rs];
      }
      tc = wm > 1e-12 ? U.clamp(6 * Rs / wm, 0.4, 6) : 1; T = 2 * tc;
      var nc = !!res.noCollision || !!res.invalid;
      var tr = DY.pairTrack(v.m1, v.m2, u1, u2, nc ? u1 : res.v1, nc ? u2 : res.v2, d, nc ? 1e9 : tc);
      bodiesAt = function (t) {
        var s = tr(t);
        return { list: [{ id: 'a', x: s.x1, v: s.v1, r: v.r1, m: v.m1, c: cols.s1, n: '1' }, { id: 'b', x: s.x2, v: s.v2, r: v.r2, m: v.m2, c: cols.s2, n: '2' }], cm: s.cm, after: s.after };
      };
      info.d = d; info.contact = DY.scale(d, (v.m1 / (v.m1 + v.m2)) - v.r2 / Rs);   // contact point at tc (centre of mass at origin)
    }
    clock.setDuration(T);
    // world bounds over the whole run (fixed while playing)
    var x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (var i = 0; i <= 80; i++) bodiesAt(T * i / 80).list.forEach(function (b) { x0 = Math.min(x0, b.x[0] - b.r); x1 = Math.max(x1, b.x[0] + b.r); y0 = Math.min(y0, b.x[1] - b.r); y1 = Math.max(y1, b.x[1] + b.r); });
    var sp = Math.max(x1 - x0, y1 - y0, 1e-3), mg = sp * 0.08;
    view = [x0 - mg, x1 + mg, y0 - mg, y1 + mg];
    var vmax = 1e-9; for (var j = 0; j <= 4; j++) bodiesAt(T * j / 4).list.forEach(function (b) { vmax = Math.max(vmax, Math.hypot(b.v[0], b.v[1])); });
    info.vmax = vmax;
    readout(); drawAll();
  }

  /* ---------- drawing ---------- */
  function drawAll() { drawScene(); drawMomentum(); drawKE(); readout(); }

  /* ---------- real-life props (soft pastel style, top view; only in the "Real life" look) ---------- */
  var SC = SIM.scene, LINE = 'rgba(60,60,90,.22)';
  function rrect(c, x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h); c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  /** which surface the situation is on: 'road' (cars at a junction), 'baize' (exam-style snooker balls) or 'air' (air-hockey table) */
  function surfaceKind() {
    var v = prm.values, md = info && info.md;
    if (md !== 'explode' && v.m1 >= 200 && v.m2 >= 200) return 'road';
    if (md === 'one' || md === 'dirs') return 'baize';
    return 'air';
  }
  /** a road band through screen point (px, py) along math angle a (deg), half-width hw px */
  function roadBand(c, px, py, a, hw) {
    var dk = SC.dark(), L = vp.w + vp.h;
    c.save(); c.translate(px, py); c.rotate(-U.rad(a));
    c.fillStyle = dk ? '#3b3f4b' : '#cdd0d9'; c.fillRect(-L, -hw, 2 * L, 2 * hw);
    c.fillStyle = dk ? '#4a4f5d' : '#e4e6ec'; c.fillRect(-L, -hw - 4, 2 * L, 4); c.fillRect(-L, hw, 2 * L, 4);
    c.restore();
  }
  function roadDashes(c, px, py, a, hw) {
    var L = vp.w + vp.h;
    c.save(); c.translate(px, py); c.rotate(-U.rad(a)); c.strokeStyle = SC.dark() ? 'rgba(240,235,200,.5)' : 'rgba(255,255,255,.95)'; c.lineWidth = 2; c.setLineDash([12, 10]);
    c.beginPath(); c.moveTo(-L, 0); c.lineTo(-hw * 1.2, 0); c.moveTo(hw * 1.2, 0); c.lineTo(L, 0); c.stroke(); c.restore();
  }
  function surface(c) {
    var kind = surfaceKind(), dk = SC.dark(), W = vp.w, H = vp.h, v = prm.values;
    c.save();
    if (kind === 'road') {
      c.fillStyle = dk ? '#2c4430' : '#d6ebcc'; c.fillRect(0, 0, W, H);
      var cp = info.contact || [0, 0], px = vp.X(cp[0]), py = vp.Y(cp[1]), hw = Math.max(18, Math.max(v.r1, v.r2) * vp.scale * 1.6);
      roadBand(c, px, py, v.tu1, hw); if (Math.abs(((v.tu2 - v.tu1) % 180 + 180) % 180) > 1) roadBand(c, px, py, v.tu2, hw);
      roadDashes(c, px, py, v.tu1, hw); if (Math.abs(((v.tu2 - v.tu1) % 180 + 180) % 180) > 1) roadDashes(c, px, py, v.tu2, hw);
    } else {
      var felt = kind === 'baize' ? (dk ? '#2f5a46' : '#a9d8b8') : (dk ? '#2a3346' : '#eef4fb'), rim = kind === 'baize' ? (dk ? '#5a4330' : '#e2bf95') : (dk ? '#46557a' : '#bfd0ee');
      c.fillStyle = rim; c.fillRect(0, 0, W, H);
      c.fillStyle = felt; rrect(c, 7, 7, W - 14, H - 14, 12); c.fill();
      c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 1; rrect(c, 7.5, 7.5, W - 15, H - 15, 12); c.stroke();
      if (kind === 'air') {   // the air holes: a sparse, faint dot pattern
        c.fillStyle = dk ? 'rgba(255,255,255,.07)' : 'rgba(80,110,160,.12)';
        for (var yy = 22; yy < H - 12; yy += 22) for (var xx = 22 + (yy % 44 ? 11 : 0); xx < W - 12; xx += 22) { c.beginPath(); c.arc(xx, yy, 1.2, 0, 2 * Math.PI); c.fill(); }
      }
    }
    c.restore();
  }
  /** a small car seen from above, centred at (x, y), heading at math angle a (rad), length about 2.2 r px */
  function topCar(c, x, y, r, color, a) {
    var L = 2.2 * r, Wd = 1.25 * r, dk = SC.dark(), body = SC.shade(color, dk ? -0.25 : 0.4);
    c.save(); c.translate(x, y); c.rotate(-a);
    c.fillStyle = 'rgba(0,0,0,.14)'; rrect(c, -L / 2 + 2, -Wd / 2 + 3, L, Wd, Wd * 0.35); c.fill();
    c.fillStyle = body; c.strokeStyle = LINE; c.lineWidth = 1; rrect(c, -L / 2, -Wd / 2, L, Wd, Wd * 0.35); c.fill(); c.stroke();
    c.fillStyle = dk ? 'rgba(150,190,220,.7)' : 'rgba(190,225,245,.95)';
    rrect(c, L * 0.08, -Wd * 0.36, L * 0.16, Wd * 0.72, 3); c.fill();   // windscreen
    rrect(c, -L * 0.36, -Wd * 0.32, L * 0.1, Wd * 0.64, 3); c.fill();   // rear window
    c.fillStyle = SC.shade(body, 0.2); rrect(c, -L * 0.24, -Wd * 0.36, L * 0.3, Wd * 0.72, 4); c.fill();   // roof
    c.fillStyle = '#fff3b8'; c.fillRect(L / 2 - 3, -Wd * 0.4, 2.5, Wd * 0.18); c.fillRect(L / 2 - 3, Wd * 0.22, 2.5, Wd * 0.18);
    c.restore();
  }
  /** where (and how big) the impact / explosion burst is drawn: world point + size in px; null if nothing happens */
  function burstAt() {
    if (!res || res.noCollision || res.invalid) return null;
    if (info.md === 'explode') { var e = bodiesAt(tc); return { p: e.cm, size: 50 }; }
    if ((info.md === 'elastic' || info.md === 'stick') && info.contact) return { p: info.contact, size: 30 };
    var l = bodiesAt(tc).list; if (l.length < 2) return null;
    return { p: [(l[0].x[0] + l[1].x[0]) / 2, (l[0].x[1] + l[1].x[1]) / 2], size: 30 };
  }

  function drawScene() {
    if (!bodiesAt) return;
    var col = ui.colors(), t = clock.t, v = prm.values, real = SC.real();
    var vw = hold ? hold.view : view;   // frozen while a velocity arrow is dragged, so the tip stays under the pointer
    vp.fit(vw[0], vw[1], vw[2], vw[3]);
    var c = vp.begin();
    if (real) surface(c);
    // surface grid (top view)
    var gt = U.niceTicks(view[0], view[1], 8);
    c.strokeStyle = col.grid; c.lineWidth = 1;

    U.niceTicks(view[2], view[3], 6).ticks.forEach(function (y) { c.beginPath(); c.moveTo(0, vp.Y(y)); c.lineTo(vp.w, vp.Y(y)); c.stroke(); });

    tblEl.innerHTML = '<table class="tbl"><tr><th>body</th><th>m / kg</th><th>speed / m s⁻¹</th><th>direction</th><th>p<sub>x</sub> / N s</th><th>p<sub>y</sub> / N s</th><th>KE / J</th></tr>' +
      rows.map(function (r) { var m = DY.magAng(r[2]); return '<tr><td>' + r[0] + '</td><td>' + U.sf(r[1]) + '</td><td>' + U.sf(m.mag) + '</td><td>' + dirT(r[2]) + '</td><td>' + U.sf(r[1] * r[2][0]) + '</td><td>' + U.sf(r[1] * r[2][1]) + '</td><td>' + U.sf(DY.ke(r[1], r[2])) + '</td></tr>'; }).join('') +
      '<tr><th>total before</th><td></td><td></td><td></td><th>' + U.sf(sb[0]) + '</th><th>' + U.sf(sb[1]) + '</th><th>' + U.sf(res.KE0) + '</th></tr>' +
      '<tr><th>total after</th><td></td><td></td><td></td><th>' + U.sf(sa[0]) + '</th><th>' + U.sf(sa[1]) + '</th><th>' + U.sf(res.noCollision ? res.KE0 : res.KE1) + '</th></tr></table>';
  }

  /* ---------- direct manipulation: drag a velocity arrow tip (speed + direction), tap a body to type its mass ---------- */
  var geo = null, hold = null, ix = null;
  function editable(k) { var r = prm.rows[k]; return !!r && r.row.style.display !== 'none' && !r.range.disabled; }
  /** which inputs a drawn body controls right now: { sp: speed key, an: angle key, m: mass key, name } (null keys = solved / not an input) */
  function keysFor(id, after) {
    var md = info.md;
    if (md === 'explode') {
      if (id === 'w') return { sp: 'u1', an: 'tu1', m: null, name: 'the whole body' };
      var i = Number(id.slice(1)), tw = three.get();
      if (i === 0) return { sp: 'v1', an: 'tv1', m: 'm1', name: 'fragment 1' };
      if (i === 1) return tw ? { sp: 'v2', an: 'tv2', m: 'm2', name: 'fragment 2' } : { sp: null, an: null, m: 'm2', name: 'fragment 2' };
      return { sp: null, an: null, m: 'm3', name: 'fragment 3' };
    }
    var j = id === 'a' ? 1 : 2, o = { sp: null, an: null, m: 'm' + j, name: 'body ' + j };
    if (!after) { o.sp = 'u' + j; o.an = 'tu' + j; }
    else if (md === 'one' && j === 1) { o.sp = 'v1'; o.an = 'tv1'; }
    else if (md === 'dirs') o.an = 'tv' + j;
    return o;
  }
  function snapAng(a) { if (a > 180) a -= 360; var r = Math.round(a), s15 = Math.round(a / 15) * 15; if (Math.abs(a - s15) <= 2) r = s15; return r === -180 ? 180 : r; }
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function setKey(k, v) { var r = prm.rows[k], o = {}; o[k] = U.clamp(v, Number(r.spec.min), Number(r.spec.max)); clock.pause(); prm.set(o); }
  function ask(k, title, sub, x, y, opt) {
    var r = prm.rows[k];
    ui.askNumber(Object.assign({ title: title, sub: sub, value: prm.values[k], min: Number(r.spec.min), max: Number(r.spec.max), step: 0.1, decimals: 2, at: { x: x, y: y },
      onInput: function (v) { setKey(k, v); touched(); } }, opt));
  }
  ix = SIM.view.interact(cv, {
    handles: function () {
      if (!geo || !res || res.invalid) return [];
      var col = ui.colors(), out = [];
      geo.list.forEach(function (b) {
        var ks = keysFor(b.id, geo.after);
        if (ks.m && editable(ks.m)) out.push({ id: 'm:' + b.id, kind: 'm', key: ks.m, name: ks.name, x: b.X, y: b.Y, r: Math.max(14, b.rp * 0.9), color: b.c });
        var spOk = ks.sp && editable(ks.sp), anOk = ks.an && editable(ks.an);
        if (!spOk && !anOk) return;
        var s = Math.hypot(b.v[0], b.v[1]), tx = b.X + b.v[0] * geo.ks, ty = b.Y - b.v[1] * geo.ks;
        if (s < 1e-9 || Math.hypot(tx - b.X, ty - b.Y) < b.rp + 6) { tx = b.X + b.rp + 16; ty = b.Y; }   // at rest: a grab point just beside the body
        out.push({ id: 'v:' + b.id, kind: 'v', sp: spOk ? ks.sp : null, an: anOk ? ks.an : null, name: ks.name, bx: b.X, by: b.Y, x: tx, y: ty, color: col.velocity });
      });
      if (hold && !out.some(function (h) { return h.id === hold.id; })) out.push(hold.h);   // keep the dragged handle alive
      return out;
    },
    onDrag: function (hd, x, y) {
      if (hd.kind !== 'v') return;
      if (!hold) {
        var before = !geo.after;
        hold = { id: hd.id, h: hd, view: view.slice(), ks: geo.ks, bx: hd.bx, by: hd.by, before: before };
        clock.pause(); if (before) clock.seek(0);
      }
      var vx = (x - hold.bx) / hold.ks, vy = -(y - hold.by) / hold.ks, o = {};
      if (hd.sp) { var r = prm.rows[hd.sp]; o[hd.sp] = U.clamp(Math.round(Math.hypot(vx, vy) * 10) / 10, Number(r.spec.min), Number(r.spec.max)); }
      if (hd.an && Math.hypot(x - hold.bx, y - hold.by) > 8) o[hd.an] = snapAng(SIM.view.screenAngle(hold.bx, hold.by, x, y));
      hd.x = x; hd.y = y;
      prm.set(o); if (hold.before) clock.seek(0);
      if (ui.syncChips) ui.syncChips();
    },
    onDrop: function () { if (hold) { hold = null; update(); touched(); } },
    onTap: function (hd, x, y) {
      if (hd.kind === 'm') ask(hd.key, 'Mass of ' + hd.name, 'Type the mass in kilograms.', x, y, { unit: 'kg', quick: [0.5, 1, 2, 5] });
      else if (hd.sp) ask(hd.sp, 'Speed of ' + hd.name, 'Type the speed; drag the arrow tip to change its direction.', x, y, { unit: 'm s⁻¹', quick: [0, 2, 4, 6] });
      else ask(hd.an, 'Direction of ' + hd.name, 'Angle anticlockwise from +x (negative = clockwise).', x, y, { unit: '°', step: 1, decimals: 1, quick: [-45, 0, 30, 45, 90] });
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Drag a velocity arrow tip to set speed and direction · tap the tip to type the speed · tap a body to type its mass');

  ui.onTheme(drawAll);
  vp.onResize = drawScene; vpM.onResize = drawMomentum; vpK.onResize = drawKE;
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
