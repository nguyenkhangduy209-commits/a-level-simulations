<script>
(function () {
  'use strict';
  // Cambridge rounding: exact halves round away from zero (49.05 → 49.1); toPrecision alone can round 49.05 down (binary floating point)
  (function (sf, dp) { SIM.util.sf = function (x, n) { return typeof x === 'number' && isFinite(x) ? sf(x * (1 + 1e-12), n) : sf(x, n); };
    SIM.util.dp = function (x, d) { return typeof x === 'number' && isFinite(x) ? dp(x * (1 + 1e-12), d) : dp(x, d); }; })(SIM.util.sf, SIM.util.dp);
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, ST = SIM.statics;
  var course = ui.course('9702'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Moments, beams, centre of gravity and couples', g: g,
    tags: ['9702 4.1 Turning effects of forces', '9702 4.2 Equilibrium of forces'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 26 });
  ui.legend(sceneCard, [
    { color: 'var(--c-weight)', label: 'weight W (at centre of gravity)' }, { color: 'var(--c-applied)', label: 'applied forces' },
    { color: 'var(--c-normal)', label: 'support / pivot reactions' }, { color: 'var(--c-component)', label: 'line of action and perpendicular distance' },
    { color: 'var(--accent)', label: 'O: point moments are taken about' }]);
  var momWrap = ui.h('div', { class: 'readout' }); sceneCard.appendChild(momWrap);

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var mode = ui.select(paramCard, { label: 'Situation', value: 'pin', options: [
    { value: 'pin', label: 'Beam on one pivot or hinge (any forces)' },
    { value: 'supports', label: 'Beam on two supports (vertical loads)' },
    { value: 'couple', label: 'Couple: two equal, opposite, parallel forces' }] }, function () { refreshSolveOptions(); update('*'); });
  var solve = ui.select(paramCard, { label: 'Solve for (principle of moments)', value: 'none', options: [{ value: 'none', label: '—' }] }, function () { update('*'); });
  var prm = ui.params(paramCard, [
    { key: 'L', label: 'Beam length', sym: 'L', unit: 'm', min: 0.2, max: 10, step: 0.01, value: 4 },
    { key: 'W', label: 'Weight of beam (0 = light beam)', sym: 'W', unit: 'N', min: 0, max: 2000, step: 0.01, value: 0 },
    { key: 'xG', label: 'Centre of gravity from left end', sym: 'x<sub>G</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 2 },
    { key: 'xP', label: 'Pivot / hinge position', sym: 'x<sub>P</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 2 },
    { key: 'xA', label: 'Support A position', sym: 'x<sub>A</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 0 },
    { key: 'xB', label: 'Support B position', sym: 'x<sub>B</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 4 },
    { key: 'F1', label: 'Force F<sub>1</sub> magnitude', sym: 'F<sub>1</sub>', unit: 'N', min: 0, max: 2000, step: 0.01, value: 200 },
    { key: 'x1', label: 'F<sub>1</sub> position from left end', sym: 'x<sub>1</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 3 },
    { key: 'a1', label: 'F<sub>1</sub> direction (anticlockwise from →; −90° = down)', sym: 'θ<sub>1</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: -90 },
    { key: 'F2', label: 'Force F<sub>2</sub> magnitude (0 = absent)', sym: 'F<sub>2</sub>', unit: 'N', min: 0, max: 2000, step: 0.01, value: 300 },
    { key: 'x2', label: 'F<sub>2</sub> position from left end', sym: 'x<sub>2</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 0.5 },
    { key: 'a2', label: 'F<sub>2</sub> direction (anticlockwise from →)', sym: 'θ<sub>2</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: -90 },
    { key: 'F3', label: 'Force F<sub>3</sub> magnitude (0 = absent)', sym: 'F<sub>3</sub>', unit: 'N', min: 0, max: 2000, step: 0.01, value: 0 },
    { key: 'x3', label: 'F<sub>3</sub> position from left end', sym: 'x<sub>3</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 4 },
    { key: 'a3', label: 'F<sub>3</sub> direction (anticlockwise from →)', sym: 'θ<sub>3</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: -90 },
    { key: 'Fc', label: 'Each force of the couple', sym: 'F', unit: 'N', min: 0, max: 500, step: 0.01, value: 15 },
    { key: 'dc', label: 'Distance between the points of application', sym: 'd', unit: 'm', min: 0.01, max: 5, step: 0.01, value: 0.4 },
    { key: 'thc', label: 'Angle between each force and the bar', sym: 'θ', unit: '°', min: 0, max: 180, step: 0.5, value: 90 },
    { key: 'xO', label: 'Take moments about O at (from left end)', sym: 'x<sub>O</sub>', unit: 'm', min: 0, max: 4, step: 0.001, value: 0 }
  ], update);
  var uniform = ui.toggle(paramCard, { label: 'Uniform beam (centre of gravity at the midpoint)', value: true }, function () { update('*'); });
  var showPerp = ui.toggle(paramCard, { label: 'Show lines of action and perpendicular distances from O', value: true }, function () { draw(); });
  var showPoly = ui.toggle(paramCard, { label: 'Show force polygon (vector triangle for 3 forces)', value: true }, function () { draw(); });
  var btnRow = ui.h('div', { class: 'row' }); paramCard.appendChild(btnRow);
  btnRow.appendChild(ui.h('button', { class: 'btn', text: 'Move O to pivot / support A', onclick: function () {
    prm.set({ xO: mode.get() === 'supports' ? prm.values.xA : prm.values.xP }); } }));

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var SOLVE = {
    pin: [{ value: 'none', label: '— (just analyse)' }, { value: 'F1', label: 'F₁ magnitude for balance' }, { value: 'F2', label: 'F₂ magnitude for balance' },
      { value: 'F3', label: 'F₃ magnitude for balance' }, { value: 'x1', label: 'position x₁ of F₁ for balance' },
      { value: 'W', label: 'weight W of the beam' }, { value: 'xG', label: 'centre of gravity x_G of the beam' }],
    supports: [{ value: 'none', label: '— (just analyse)' }, { value: 'x1:RA', label: 'x₁ when on the point of tipping about B (R_A = 0)' },
      { value: 'x1:RB', label: 'x₁ when on the point of tipping about A (R_B = 0)' }, { value: 'F1:RA', label: 'F₁ when R_A = 0' }, { value: 'F1:RB', label: 'F₁ when R_B = 0' }],
    couple: [{ value: 'none', label: '—' }]
  };
  function refreshSolveOptions() {
    var sel = solve.el, list = SOLVE[mode.get()], cur = solve.get();
    while (sel.children && sel.children.length) sel.removeChild(sel.children[0]);
    if (sel.options) sel.options.length = 0;
    list.forEach(function (o) { sel.appendChild(ui.h('option', { value: o.value, text: o.label })); });
    solve.set(list.some(function (o) { return o.value === cur; }) ? cur : 'none', true);
  }
  refreshSolveOptions();

  var presetCtl = ui.presets(presetCard, [
    { name: 'Light beam on two end supports: 200 N at 2 m, 300 N at 1 m', mode: 'supports', solve: 'none', uniform: true,
      values: { L: 4, W: 0, xA: 0, xB: 4, F1: 200, x1: 2, F2: 300, x2: 1, F3: 0, xO: 0 }, note: 'Take moments about A to remove R_A: R_B × 4 = 200 × 2 + 300 × 1 ⇒ R_B = 175 N, R_A = 325 N.' },
    { name: 'Uniform plank on two supports: how far can a 600 N person walk?', mode: 'supports', solve: 'x1:RA', uniform: true,
      values: { L: 6, W: 200, xA: 1, xB: 4, F1: 600, x1: 5, F2: 0, F3: 0, xO: 4 }, note: 'On the point of tipping about B, R_A = 0. Take moments about B.' },
    { name: 'See-saw: find the unknown force (principle of moments)', mode: 'pin', solve: 'F1', uniform: true,
      values: { L: 4, W: 0, xP: 2, F1: 100, x1: 3.2, a1: -90, F2: 300, x2: 0.4, a2: -90, F3: 0, xO: 2 }, note: 'Sum of clockwise moments = sum of anticlockwise moments about the pivot: F₁ × 1.2 = 300 × 1.6.' },
    { name: '9702/22 O/N 24 Q3(c): hinged shelf held by a wire at 50°', mode: 'pin', solve: 'F2', uniform: true,
      values: { L: 0.65, W: 33, xP: 0, F1: 1.5, x1: 0.53, a1: -90, F2: 40, x2: 0.325, a2: 130, F3: 0, xO: 0 }, note: 'Moments about the hinge A: 33 × 0.325 + 1.5 × 0.53 = T sin 50° × 0.325 ⇒ T = 46 N (mark scheme).' },
    { name: '9702/21 M/J 23 Q2(a): hinged beam with spring, block and string at 30°', mode: 'pin', solve: 'W', uniform: true,
      values: { L: 1.2, W: 1, xP: 0, F1: 8.2, x1: 0.5, a1: 90, F2: 0.3, x2: 0.8, a2: -90, F3: 4.8, x3: 1.2, a3: -30, xO: 0 }, note: '8.2 × 0.50 = W × 0.60 + 0.30 × 0.80 + 2.4 × 1.2 ⇒ W = 1.6 N. Hinge horizontal force = 4.8 cos 30° = 4.2 N. (String drawn to the right; only the size of the horizontal component is asked.)' },
    { name: 'Non-uniform rod balanced on a pivot: find the centre of gravity', mode: 'pin', solve: 'xG', uniform: false,
      values: { L: 2, W: 12, xG: 1, xP: 0.8, F1: 5, x1: 0, a1: -90, F2: 0, F3: 0, xO: 0.8 }, note: 'The weight acts at the centre of gravity: 5 × 0.80 = 12 × (x_G − 0.80) ⇒ x_G = 1.13 m.' },
    { name: 'Force at an angle on a hinged rod: perpendicular distance', mode: 'pin', solve: 'F1', uniform: true,
      values: { L: 2, W: 40, xP: 0, F1: 20, x1: 2, a1: 120, F2: 0, F3: 0, xO: 0 }, note: 'Moment of F₁ = F₁ × (2.0 sin 60°), not F₁ × 2.0. F₁ × 1.732 = 40 × 1.0 ⇒ F₁ = 23.1 N.' },
    { name: 'Couple on a steering wheel: 15 N each side, 0.40 m apart', mode: 'couple', solve: 'none', uniform: true,
      values: { Fc: 15, dc: 0.4, thc: 90, xO: 0.2 }, note: 'Torque of a couple = one force × perpendicular distance between the forces = 15 × 0.40 = 6.0 N m. Move O: the total moment does not change.' },
    { name: 'Couple with forces at 30° to the bar', mode: 'couple', solve: 'none', uniform: true,
      values: { Fc: 20, dc: 0.5, thc: 30, xO: -0.3 }, note: 'Perpendicular separation = 0.50 sin 30° = 0.25 m ⇒ torque = 20 × 0.25 = 5.0 N m.' }
  ], function (p) {
    style = /see-saw/i.test(p.name) ? 'seesaw' : /person/i.test(p.name) ? 'walk' : /shelf/i.test(p.name) ? 'shelf' : /non-uniform rod/i.test(p.name) ? 'rod' : /hinged/i.test(p.name) ? 'hinged' : 'auto';
    mode.set(p.mode, true); refreshSolveOptions(); solve.set(p.solve, true); uniform.set(p.uniform, true);
    if (p.values.L !== undefined) setRanges(p.values.L);
    prm.set(p.values);
  });

  ui.notes(noteCard, [
    'Moment = force × <b>perpendicular</b> distance from the point to the <b>line of action</b> of the force. For a force at angle θ to the beam, d⊥ = d sin θ.',
    'A force whose line of action passes through the point has <b>zero</b> moment about it — take moments about an unknown force (hinge, pivot, support) to remove it.',
    'The weight of the beam acts at its <b>centre of gravity</b> (the midpoint only if the beam is uniform). Don’t forget it.',
    'Equilibrium needs <b>both</b> no resultant force <b>and</b> no resultant moment (about every point).',
    'A support can only push. If a calculation gives a negative reaction, the beam has already tipped about the other support.',
    'Couple: a pair of equal, opposite, parallel forces (not in line). Resultant force zero, so it produces rotation only. Torque = one force × perpendicular distance between the lines of action — the same about any point.',
    'Units: N m for moments and torques (not J).'
  ]);

  /* ---------- model ---------- */
  var KEYS = ['xG', 'xP', 'xA', 'xB', 'x1', 'x2', 'x3'];
  function setRanges(L) {
    KEYS.forEach(function (k) { prm.range(k, 0, L, 0.001); });
    if (mode.get() !== 'couple') prm.range('xO', 0, L, 0.001);
  }
  function baseModel() {
    var v = prm.values;
    return { L: v.L, W: v.W, xG: v.xG, mode: mode.get(), xP: v.xP, xA: v.xA, xB: v.xB,
      loads: [{ x: v.x1, F: v.F1, ang: v.a1, name: 'F₁' }, { x: v.x2, F: v.F2, ang: v.a2, name: 'F₂' }, { x: v.x3, F: v.F3, ang: v.a3, name: 'F₃' }] };
  }
  var res = null, solved = null, lastLocked = null;
  function update(key) {
    var v = prm.values, md = mode.get();
    if (key === 'L' || key === '*') setRanges(v.L);
    if (md === 'couple') prm.range('xO', -v.dc, 2 * v.dc, 0.001);
    var sol = solve.get();
    if (sol === 'xG' && uniform.get()) uniform.set(false, true);
    if (uniform.get()) prm.set({ xG: v.L / 2 }, true);
    // visibility
    var beamKeys = ['L', 'W', 'xG', 'F1', 'x1', 'F2', 'x2', 'F3', 'x3'];
    beamKeys.forEach(function (k) { prm.show(k, md !== 'couple'); });
    ['a1', 'a2', 'a3'].forEach(function (k) { prm.show(k, md === 'pin'); });
    prm.show('xP', md === 'pin'); prm.show('xA', md === 'supports'); prm.show('xB', md === 'supports');
    ['Fc', 'dc', 'thc'].forEach(function (k) { prm.show(k, md === 'couple'); });
    prm.show('xG', md !== 'couple'); prm.lock('xG', uniform.get() && md !== 'couple', v.L / 2);
    uniform.el.style.display = md === 'couple' ? 'none' : '';
    solve.row.style.display = md === 'couple' ? 'none' : '';
    // solve
    if (lastLocked) { prm.lock(lastLocked, lastLocked === 'xG' && uniform.get()); lastLocked = null; }
    solved = null;
    if (md !== 'couple' && sol !== 'none') {
      var parts = sol.split(':'), k = parts[0], target = parts[1] || 'M';
      var r = ST.solveUnknown(baseModel(), k, target);
      var lim = { F1: [0, 2000], F2: [0, 2000], F3: [0, 2000], x1: [0, v.L], W: [0, 2000], xG: [0, v.L] }[k];
      solved = { key: k, target: target, value: r.value, why: r.why };
      if (isFinite(r.value) && r.value >= lim[0] - 1e-9 && r.value <= lim[1] + 1e-9) {
        var o = {}; o[k] = U.clamp(r.value, lim[0], lim[1]); prm.set(o, true); prm.lock(k, true, o[k]); lastLocked = k; solved.ok = true;
      } else {
        solved.ok = false;
        if (isFinite(r.value)) solved.why = (r.value < lim[0] ? 'the required value (' + U.sf(r.value) + ') is negative' : 'the required value (' + U.sf(r.value) + ') is beyond ' + (k.charAt(0) === 'x' ? 'the end of the beam' : 'the slider range')) + ', so no equilibrium is possible this way';
      }
    }
    res = md === 'couple' ? null : ST.solveBeam(baseModel());
    tip(); draw(); readout();
  }

  /* ---------- drawing ---------- */
  function angTxt(a) { return U.num(a, 1) + '°'; }
  function draw() {
    var col = ui.colors(), v = prm.values, md = mode.get();
    var c;
    if (md === 'couple') { drawCouple(); return; }
    var L = v.L;
    vp.fit(-0.14 * L, 1.14 * L, -0.42 * L, 0.42 * L);
    c = vp.begin();
    var by = vp.Y(0), th = Math.max(8, Math.min(16, vp.scale * L * 0.03));
    scene = { md: md, by: by, th: th, L: L, arrows: [] };
    var real = SC.real();
    if (real) {   // backdrop, wall / stands / trestles, ropes and springs, then the plank itself and what sits on it
      realBack(c, col, v, md, L, by, th);
      realRopes(c, v, md, L, by, th);
      realBeam(c, L, by, th);
      realLoads(c, v, md, L, by, th);
    } else {
    // wall for a hinge at an end
    if (md === 'pin' && (v.xP < 1e-9 || v.xP > L - 1e-9)) {
      var wx = vp.X(v.xP), dir = v.xP < 1e-9 ? -1 : 1;
      c.save(); c.fillStyle = col.surface; c.fillRect(Math.min(wx, wx + dir * 14), by - 90, 14, 180); c.strokeStyle = col['object-line']; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(wx, by - 90); c.lineTo(wx, by + 90); c.stroke(); c.restore();
    }
    // beam
    c.save(); c.fillStyle = col.object; c.strokeStyle = col['object-line']; c.lineWidth = 1.5;
    c.beginPath(); c.rect(vp.X(0), by - th / 2, vp.X(L) - vp.X(0), th); c.fill(); c.stroke(); c.restore();
    }
    // scale ticks
    var tk = U.niceTicks(0, L, 6);
    tk.ticks.forEach(function (t) { if (t < -1e-9 || t > L + 1e-9) return; D.line(c, [[vp.X(t), by + th / 2], [vp.X(t), by + th / 2 + 5]], col.muted, { width: 1 }); D.label(c, U.num(t, 3), vp.X(t), by + th / 2 + 13, real ? col.ink : col.muted, { size: 10, bg: real }); });
    // supports / pivot
    function tri(x) { var px = vp.X(x); c.save(); c.fillStyle = col.surface; c.strokeStyle = col['object-line']; c.lineWidth = 1.4; c.beginPath(); c.moveTo(px, by + th / 2); c.lineTo(px - 11, by + th / 2 + 20); c.lineTo(px + 11, by + th / 2 + 20); c.closePath(); c.fill(); c.stroke(); c.restore(); }
    if (md === 'supports') { if (!real) { tri(v.xA); tri(v.xB); } D.label(c, 'A', vp.X(v.xA), by + th / 2 + 30, col.ink, { bold: true, bg: real }); D.label(c, 'B', vp.X(v.xB), by + th / 2 + 30, col.ink, { bold: true, bg: real }); }
    else { c.save(); c.fillStyle = col['object-line']; c.beginPath(); c.arc(vp.X(v.xP), by, 4, 0, 2 * Math.PI); c.fill(); c.restore(); if (!real && v.xP > 1e-9 && v.xP < L - 1e-9) tri(v.xP); D.label(c, real && (v.xP < 1e-9 || v.xP > L - 1e-9) ? 'hinge' : 'pivot', vp.X(v.xP), by + th / 2 + 30, real ? col.ink : col.muted, { size: 11, bg: real }); }
    if (!res) return;
    if (res.invalid) { D.label(c, res.invalid, vp.w / 2, 18, col.warn, { bold: true, size: 12 }); }
    var all = res.all || res.forces;
    var mags = all.map(function (f) { return f.F; });
    var k = SIM.view.forceScale(mags, Math.min(120, vp.h * 0.3));
    // O marker
    var ox = vp.X(v.xO);
    c.save(); c.strokeStyle = col.accent; c.lineWidth = 2; c.beginPath(); c.arc(ox, by, 7, 0, 2 * Math.PI); c.stroke(); c.restore();
    D.label(c, 'O', ox, by - 16, col.accent, { bold: true });
    all.forEach(function (f) {
      if (!(f.F > 1e-12)) return;
      var color = f.kind === 'weight' ? col.weight : f.kind === 'reaction' ? col.normal : col.applied;
      var a = U.rad(f.ang), px = vp.X(f.x), len = Math.max(14, f.F * k);
      var lab = (f.kind === 'weight' ? 'W' : f.name.replace('_', '')) + ' = ' + U.sf(f.F) + ' N';
      // draw so that the arrow tail is at the beam for pushes away, head at the beam for pushes towards
      var sx = px, sy = by, ex = px + Math.cos(a) * len, ey = by - Math.sin(a) * len;
      if (f.kind === 'reaction' && Math.sin(a) > 0.5) { sx = px - Math.cos(a) * len; sy = by + Math.sin(a) * len + th / 2 + 22; ex = px; ey = by + th / 2 + 22; }
      D.arrow(c, sx, sy, ex, ey, color, { label: lab });
      if (f.kind === 'weight') scene.arrows.push({ kind: 'W', x: ex, y: ey, off: ex - px, color: color });
      else if (f.kind !== 'reaction' && LOADIX[f.name]) scene.arrows.push({ kind: 'F', i: LOADIX[f.name], x: ex, y: ey, off: ex - px, color: color });
      if (showPerp.get() && f.kind !== 'reaction' && Math.abs(Math.cos(a)) > 1e-6 && Math.abs(Math.sin(a)) > 1e-6 && Math.abs(f.x - v.xO) > 1e-9) {
        // line of action through (x,0) along (cos a, sin a); foot of perpendicular from O
        var t = (v.xO - f.x) * Math.cos(a), fx = f.x + t * Math.cos(a), fy = t * Math.sin(a);
        var ext = 2 * L;
        D.line(c, [vp.P(f.x - ext * Math.cos(a), -ext * Math.sin(a)), vp.P(f.x + ext * Math.cos(a), ext * Math.sin(a))], col.component, { dash: [4, 5], width: 1.1 });
        D.line(c, [[ox, by], vp.P(fx, fy)], col.component, { width: 1.8 });
        D.rightAngle(c, vp.X(fx), vp.Y(fy), Math.atan2(-(fy - 0), -(fx - v.xO)) , 7, col.component);
        D.label(c, 'd⊥ = ' + U.sf(ST.perpDist(f, v.xO)) + ' m', (ox + vp.X(fx)) / 2, (by + vp.Y(fy)) / 2, col.component, { size: 11, bg: true });
      }
    });
    if (md === 'pin' && res && !res.balanced) {
      var cw = res.Mnet < 0;
      c.save(); c.strokeStyle = col.warn; c.lineWidth = 2; c.beginPath(); c.arc(vp.X(v.xP), by, 30, cw ? -2.4 : -0.7, cw ? -0.7 : -2.4, !cw); c.stroke(); c.restore();

    if (solved) {
      if (solved.ok) R.badge('Solved: ' + solveLabel(solved.key) + ' = ' + s3(solved.value) + ' ' + (solved.key.charAt(0) === 'x' ? 'm' : 'N'), 'ok');
      else R.badge('Cannot solve for ' + solveLabel(solved.key) + ': ' + (solved.why || 'no solution'), 'warn');
    }
    // moments about O
    var all = res.all, sumCW = 0, sumACW = 0;
    R.head('Moments about O (x<sub>O</sub> = ' + U.num(v.xO, 4).replace('-', '−') + ' m)');
    all.forEach(function (f) {
      if (!(f.F > 1e-12)) return;
      var M = ST.momentAbout(f, v.xO);
      if (M > 0) sumACW += M; else sumCW -= M;
      var nm = f.kind === 'weight' ? 'W' : f.name.replace(/_(\w)/, '<sub>$1</sub>');
      R.eq('moment of ' + nm, momentWork(f, v.xO), Math.abs(M) < 1e-12 ? '0' : s3(Math.abs(M)) + ' ' + sense(M), 'N m', 'Moment = force × perpendicular distance from O to its line of action. Look at which way it would turn the beam about O.');
    });
    R.eq('Σ clockwise', '', sumCW, 'N m', 'Add the sizes of all the clockwise moments about O.');
    R.eq('Σ anticlockwise', '', sumACW, 'N m', 'Add the sizes of all the anticlockwise moments about O. In equilibrium (reactions included) the two sums are equal.');
    var bal = res.balanced;
    if (md === 'pin') {
      R.head('Principle of moments about the pivot (x<sub>P</sub> = ' + U.num(v.xP, 4) + ' m)');
      var cw = 0, acw = 0, cwT = [], acwT = [];
      res.forces.forEach(function (f) {
        var M = ST.momentAbout(f, v.xP); if (Math.abs(M) < 1e-12) return;
        var nm = f.kind === 'weight' ? 'W' : f.name;
        var t = s3(f.F) + '×' + s3(ST.perpDist(f, v.xP));
        if (M < 0) { cw -= M; cwT.push(t); } else { acw += M; acwT.push(t); }
      });
      R.eq('Σ clockwise', cwT.join(' + ') || '0', cw, 'N m', 'Take moments about the pivot: the pivot force passes through it, so it has no moment and drops out.');
      R.eq('Σ anticlockwise', acwT.join(' + ') || '0', acw, 'N m', 'Principle of moments: for equilibrium, sum of clockwise moments = sum of anticlockwise moments about any point.');
      if (bal) R.badge('Equilibrium: no resultant moment about the pivot', 'ok');
      else R.badge('Not in equilibrium: resultant moment ' + s3(Math.abs(res.Mnet)) + ' N m ' + sense(res.Mnet), 'warn');
      R.head('Force from the pivot / hinge on the beam' + (bal ? '' : ' (needed for zero resultant force)'));
      R.eq('ΣF<sub>x</sub> applied', 'sum of F cos θ', res.sumApplied.x, 'N', 'Resolve every applied force (and the weight) horizontally, right positive.');
      R.eq('ΣF<sub>y</sub> applied', 'sum of F sin θ (up +)', res.sumApplied.y, 'N', 'Resolve vertically, up positive. The weight counts as a downward force.');
      R.eq('R<sub>x</sub>', '−ΣF<sub>x</sub>', res.R.x, 'N', 'No resultant force in equilibrium, so the pivot must supply the opposite of the other horizontal forces.');
      R.eq('R<sub>y</sub>', '−ΣF<sub>y</sub>', res.R.y, 'N', 'Likewise vertically: the pivot balances the other vertical forces.');
      R.eq('|R|', '√(R<sub>x</sub>² + R<sub>y</sub>²) = √(' + sq(res.R.x) + '² + ' + sq(res.R.y) + '²)', res.Rmag, 'N', 'The two components are perpendicular, so the size of the pivot force comes from Pythagoras.');
      if (res.Rmag > 1e-9) R.eq('direction of R', 'tan⁻¹(R<sub>y</sub> ÷ R<sub>x</sub>), anticlockwise from →', U.dp(res.Rang, 1) + '°', '', 'tan of the angle = vertical component ÷ horizontal component; the signs say which quadrant.');
    } else {
      R.head('Take moments about support A (removes R<sub>A</sub>)');
      var terms = [], tot = 0, span = v.xB - v.xA;
      res.forces.forEach(function (f) { if (!(f.F > 1e-12)) return; var M = -ST.momentAbout(f, v.xA); tot += M; terms.push(s3(f.F) + ' × ' + (f.x - v.xA < 0 ? '(' + s3(f.x - v.xA) + ')' : s3(f.x - v.xA))); });
      R.eq('R<sub>B</sub> × (x<sub>B</sub> − x<sub>A</sub>)', 'Σ load × (x − x<sub>A</sub>) = ' + (terms.join(' + ') || '0'), tot, 'N m', 'Take moments about A: R<sub>A</sub> acts through A, so it has no moment. The moment of R<sub>B</sub> balances the moments of the loads.');
      R.eq('R<sub>B</sub>', s3(tot) + ' ÷ ' + s3(span), res.RB, 'N', 'Divide the total moment by the distance from A to B.');
      R.head('Resolve vertically');
      R.eq('R<sub>A</sub>', 'total load − R<sub>B</sub> = ' + s3(-res.sumApplied.y) + ' − ' + s3(res.RB), res.RA, 'N', 'No resultant vertical force: upward reactions together equal the total downward load.');
      if (res.tips) R.badge('A support cannot pull: R<sub>' + (res.tips === 'B' ? 'A' : 'B') + '</sub> &lt; 0 ⇒ the beam tips about ' + res.tips, 'warn');
      else if (res.limiting) R.badge('On the point of tipping (one reaction is zero)', 'warn');
      else R.badge('Equilibrium: both reactions push up', 'ok');
    }
    R.head('Check');
    var chk = ST.sumM(res.all, v.xO);
    R.eq('Σ moments about O', 'all forces including reactions (zero about every point in equilibrium)', Math.abs(chk) < 1e-9 * res.scale ? 0 : chk, 'N m', 'In equilibrium the resultant moment is zero about every point, so this check works wherever O is.');
    R.render();
    // moment balance meter under the scene
    var tot2 = sumCW + sumACW;
    momWrap.innerHTML = '<div class="head">About O: Σ clockwise ' + s3(sumCW) + ' N m vs Σ anticlockwise ' + s3(sumACW) + ' N m</div>' +
      '<div class="meter"><div style="width:' + (tot2 > 0 ? (100 * sumCW / tot2).toFixed(1) : 50) + '%;background:var(--c-applied)"></div></div>';
  }
  function sq(x) { return x < 0 ? '(' + U.sf(x) + ')' : U.sf(x); }
  function solveLabel(k) { return { F1: 'F₁', F2: 'F₂', F3: 'F₃', x1: 'x₁', W: 'W', xG: 'x_G' }[k] || k; }
  function coupleReadout() {
    var v = prm.values, cp = ST.couple(v.Fc, v.dc, v.thc), s3 = U.sf;
    R.html('<div class="head">Two equal and opposite forces F at the ends of a bar of length d, each at θ to the bar.</div>');
    R.head('Torque of the couple');
    R.eq('perpendicular distance', 'd sin θ = ' + s3(v.dc) + ' × sin ' + U.dp(v.thc, 1) + '°', cp.dPerp, 'm', 'Torque uses the perpendicular distance between the two lines of action, not the length of the bar.');
    R.eq('torque of couple', 'F × d sin θ = ' + s3(v.Fc) + ' × ' + s3(cp.dPerp), cp.torque, 'N m', 'Torque of a couple = one of the forces × perpendicular distance between them.');
    R.eq('resultant force', 'F + (−F)', 0, 'N', 'The forces are equal and opposite, so a couple gives no resultant force: it only turns the object.');
    R.head('Moments about O (x<sub>O</sub> = ' + U.num(v.xO, 4).replace('-', '−') + ' m from the left force)');
    cp.forces.forEach(function (f, i) {
      var M = ST.momentAbout(f, v.xO);
      R.eq('force ' + (i + 1), Math.abs(f.x - v.xO) < 1e-12 ? 'acts through O' : 'F × ' + s3(Math.abs(f.x - v.xO)) + ' × sin ' + U.dp(v.thc, 1) + '°', Math.abs(M) < 1e-12 ? '0' : s3(Math.abs(M)) + ' ' + sense(M), 'N m', 'Moment of this force about O = F × perpendicular distance from O to its line of action.');
    });
    R.eq('total', 'sum (independent of O)', Math.abs(cp.momentAbout(v.xO)) < 1e-12 ? '0' : s3(Math.abs(cp.momentAbout(v.xO))) + ' ' + sense(cp.momentAbout(v.xO)), 'N m', 'Add the two moments about O. The total is F × d sin θ wherever O is: the torque of a couple does not depend on the point.');
    if (cp.torque > 1e-12) R.badge('Rotation only: zero resultant force, non-zero torque', 'info');
    else R.badge('θ = 0° or 180°: the forces act along the same line, so there is no couple', 'warn');
    R.render();
  }

  /* ---------- direct manipulation: drag loads / pivot / supports / O along the beam, tap to type ---------- */
  function locked(k) { var r = prm.rows[k]; return !!(r && r.range.disabled); }
  function spec(k) { return prm.rows[k].spec; }
  function decOf(st) { var t = String(st); return t.indexOf('.') < 0 ? 0 : t.length - t.indexOf('.') - 1; }
  function setVal(k, val, step) {
    var sp = spec(k), o = {};
    val = U.clamp(val, Number(sp.min), Number(sp.max));
    if (step) val = Number((Math.round(val / step) * step).toFixed(decOf(step)));
    o[k] = U.clamp(val, Number(sp.min), Number(sp.max));
    if (o[k] !== prm.values[k]) prm.set(o);
  }
  function ask(k, x, y, title, sub, quick, onDone) {
    var sp = spec(k);
    return ui.askNumber({ title: title, sub: sub, value: prm.values[k], min: Number(sp.min), max: Number(sp.max), step: Number(sp.step) < 0.01 ? 0.01 : Number(sp.step), decimals: 3,
      unit: sp.unit, at: { x: x, y: y }, quick: quick, onInput: function (val) { setVal(k, val); }, onDone: onDone });
  }
  /** add an extra button (e.g. Remove) to the number editor that is open now */
  function popAction(ed, label, fn) {
    var sg = ui.stage(), ch = sg && sg.el && sg.el.children, pe = null, k;
    if (!ch) return;
    for (k = ch.length - 1; k >= 0 && !pe; k--) if (ch[k].classList && ch[k].classList.contains('pop')) pe = ch[k];
    var acts = pe && pe.children ? Array.prototype.filter.call(pe.children, function (e) { return e.classList && e.classList.contains('pop-actions'); })[0] : null;
    if (!acts) return;
    acts.insertBefore(ui.h('button', { class: 'btn', type: 'button', text: label, onclick: function () { if (ed && ed.close) ed.close(); fn(); } }), acts.firstChild || null);
  }
  /** an unused force slot (magnitude 0 = absent), or 0 if all three are in use */
  function freeSlot() {
    for (var i = 1; i <= 3; i++) if (!(prm.values['F' + i] > 1e-12) && !locked('F' + i) && !locked('x' + i)) return i;
    return 0;
  }
  function askSize(i, x, y, onDone) {
    var ed = ask('F' + i, x, y, 'Size of force F' + SUBS[i], 'Type the magnitude in newtons.', [10, 50, 100, 200], onDone);
    popAction(ed, 'Remove F' + SUBS[i], function () { var o = {}; o['F' + i] = 0; prm.set(o); });
  }
  /** placeMode swallows the tap, so put the first-time hint away ourselves once the student has used it */
  function hideTip() { var sg = ui.stage(); if (sg && sg.tip && sg.tip.style) sg.tip.style.display = 'none'; }
  /** "+ Add a force": tap the beam to place it (x), type its size, then (pivot mode) its direction */
  function startAdd() {
    if (mode.get() === 'couple' || !freeSlot()) return;
    ui.placeMode({ prompt: 'Tap the beam where F' + SUBS[freeSlot()] + ' acts', onPlace: function (x, y) {
      var i = freeSlot(); hideTip(); if (!i || mode.get() === 'couple' || !scene) return;
      var L = prm.values.L, wx = U.clamp(vp.toWorld(x, y)[0], 0, L), st = posStep();
      var o = {}; o['x' + i] = U.clamp(Number((Math.round(wx / st) * st).toFixed(decOf(st))), 0, L); o['F' + i] = 100; o['a' + i] = -90;
      prm.set(o);
      var px = vp.X(o['x' + i]), py = scene.by;
      askSize(i, px, py - 40, function () {
        if (mode.get() !== 'pin' || !(prm.values['F' + i] > 1e-12)) return;
        ask('a' + i, px, py - 40, 'Direction of F' + SUBS[i], 'Anticlockwise from → (pointing right). −90° = straight down, 90° = straight up.', [-90, 90, 0, 180]);
      });
    } });
  }
  function posStep() { var L = prm.values.L; return L >= 4 ? 0.05 : L >= 1 ? 0.01 : 0.005; }
  var LOADIX = { 'F₁': 1, 'F₂': 2, 'F₃': 3 }, SUBS = ['', '₁', '₂', '₃'];
  var scene = null;
  var ix = SIM.view.interact(cv, {
    handles: function () {
      if (!scene) return [];
      var v = prm.values, col = ui.colors(), hs = [];
      if (scene.md === 'couple') {
        scene.forces.forEach(function (f) { hs.push({ id: 'c' + f.i, kind: 'cf', i: f.i, bx: f.bx, x: f.x, y: f.y, color: col.applied }); });
        hs.push({ id: 'cd', kind: 'cd', x: vp.X(scene.d), y: scene.by + 22, color: col['object-line'] });
        hs.push({ id: 'O', kind: 'O', x: vp.X(v.xO), y: scene.by, color: col.accent });
        return hs;
      }
      scene.arrows.forEach(function (a) {
        if (a.kind === 'W') { if (!locked('W') || !locked('xG')) hs.push({ id: 'W', kind: 'W', x: a.x, y: a.y, off: a.off, color: a.color }); }
        else if (!locked('F' + a.i) || !locked('x' + a.i)) hs.push({ id: 'F' + a.i, kind: 'F', i: a.i, x: a.x, y: a.y, off: a.off, color: a.color });
      });
      if (!(v.W > 1e-12) && !locked('W')) hs.push({ id: 'W', kind: 'W', x: vp.X(v.xG), y: scene.by - scene.th / 2 - 16, off: 0, color: col.weight });
      var py = scene.by + scene.th / 2 + 13;
      if (scene.md === 'pin') hs.push({ id: 'P', kind: 'pos', key: 'xP', x: vp.X(v.xP), y: py, color: col['object-line'] });
      else { hs.push({ id: 'A', kind: 'pos', key: 'xA', x: vp.X(v.xA), y: py, color: col['object-line'] }); hs.push({ id: 'B', kind: 'pos', key: 'xB', x: vp.X(v.xB), y: py, color: col['object-line'] }); }
      hs.push({ id: 'O', kind: 'pos', key: 'xO', x: vp.X(v.xO), y: scene.by, color: col.accent });
      hs.push({ id: 'L', kind: 'L', x: vp.X(scene.L), y: scene.by, color: col['object-line'] });
      return hs;
    },
    onDrag: function (h, x, y) {
      var wx = vp.toWorld(x - (h.off || 0), y)[0];
      if (h.kind === 'F') { if (!locked('x' + h.i)) setVal('x' + h.i, wx, posStep()); }
      else if (h.kind === 'W') { if (!locked('xG') && !uniform.get()) setVal('xG', wx, posStep()); }
      else if (h.kind === 'pos') setVal(h.key, wx, posStep());
      else if (h.kind === 'O') setVal('xO', wx, 0.01);
      else if (h.kind === 'cf') {
        var a = SIM.view.screenAngle(h.bx, scene.by, x, y);
        if (h.i === 0) a = (a + 180) % 360;
        if (a > 180) a = a > 270 ? 0 : 180;
        setVal('thc', a, 1);
      }
    },
    onTap: function (h, x, y) {
      if (h.kind === 'F') { if (!locked('F' + h.i)) askSize(h.i, x, y); }
      else if (h.kind === 'W') { if (!locked('W')) ask('W', x, y, 'Weight of the beam W', '0 makes it a light beam.', [0, 10, 50, 100]); }
      else if (h.kind === 'L') ask('L', x, y, 'Length of the beam L', 'Positions along the beam are kept within 0 to L.', [1, 2, 4, 6]);
      else if (h.kind === 'pos') ask(h.key, x, y, { xP: 'Pivot position x<sub>P</sub>', xA: 'Support A position x<sub>A</sub>', xB: 'Support B position x<sub>B</sub>', xO: 'Take moments about O at x<sub>O</sub>' }[h.key], 'Distance from the left end of the beam.');
      else if (h.kind === 'O') ask('xO', x, y, 'Take moments about O at x<sub>O</sub>', 'Distance from the left force.');
      else if (h.kind === 'cf') ask('Fc', x, y, 'Each force of the couple F', 'Type the magnitude in newtons.', [5, 10, 15, 20]);
      else if (h.kind === 'cd') ask('dc', x, y, 'Distance between the forces d', 'Length of the bar between the points of application.', [0.2, 0.4, 0.5, 1]);
    },
    onHover: function () { draw(); }
  });
  /** keep the hint clear of the + button over the top-right of the stage (desktop only: on phones the hint sits below the stage) */
  function tipClear(t, o) {
    if (!t || !t.style || (typeof matchMedia === 'function' && matchMedia('(max-width: 720px)').matches)) return;
    if (o.bottom) { t.style.top = 'auto'; t.style.bottom = '10px'; } else t.style.maxWidth = 'calc(100% - ' + o.right + 'px)';
  }
  var addBtn = ui.stageAction({ label: 'Add a force', icon: '+', onClick: startAdd }), lastTip = null;
  function tip() {
    if (addBtn) addBtn.show(mode.get() !== 'couple' && !!freeSlot());
    var t = mode.get() === 'couple' ? 'Drag an arrow tip to change θ · tap it to type F · drag O · tap the bar end to type d'
      : 'Press + Add a force, tap the beam where it acts, then type its size' + (mode.get() === 'pin' ? ' and direction' : '') + ' · drag a force along the beam · tap its arrow to change or remove it · drag the ' + (mode.get() === 'pin' ? 'pivot' : 'supports') + ' or O';
    if (t !== lastTip) { lastTip = t; tipClear(ui.stageTip(t), { right: 195 }); }   // only re-show the hint when it actually changes
  }

  ui.onTheme(draw);
  vp.onResize = draw;
  update('*');
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
