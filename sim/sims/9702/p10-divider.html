    /** an analogue dial meter: frac 0…1 of full scale (or −1…1 with centreZero); letter 'A' | 'V' | 'G' */

      if (sn === 'th') pA.draw({ x: [-10, 100], xLabel: 'temperature / °C', yLabel: 'V_out / V', series: [{ fn: function (T) { var d = dividerAt(IV.thermistorR(T, DEF.thermistor)).d; return d.invalid ? NaN : d.Vout; }, color: col.s1 }], cursor: v.T, title: 'illustrative thermistor model' });
      else if (sn === 'ldr') pA.draw({ x: [0, 100], xLabel: 'light intensity / a.u.', yLabel: 'V_out / V', series: [{ fn: function (Lx) { var d = dividerAt(IV.ldrR(Lx, DEF.ldr)).d; return d.invalid ? NaN : d.Vout; }, color: col.s1 }], cursor: v.Lx, title: 'illustrative LDR model' });
      else pA.draw({ x: [0, 100], xLabel: 'R₂ / kΩ', yLabel: 'V_out / V', series: [{ fn: function (r2) { var d = CI.divider(v.Vin, v.R1 * 1e3, r2 * 1e3, load.get() ? v.RL * 1e3 : null); return d.invalid ? NaN : d.Vout; }, color: col.s1 }], cursor: v.R2, title: load.get() ? 'with load' : 'no load' });
      pB.draw({ x: [0.1, 100], xLabel: 'R_L / kΩ', yLabel: 'V_out / V', series: [{ fn: function (rl) { var d = dividerAt(sn !== 'none' ? sensorR() : null), dd = CI.divider(v.Vin, d.top, d.bot, rl * 1e3); return dd.invalid ? NaN : dd.Vout; }, color: col.s3 }],
        hlines: [{ y: CI.divider(v.Vin, dividerAt(sensor.get() !== 'none' ? sensorR() : null).top, dividerAt(sensor.get() !== 'none' ? sensorR() : null).bot).Vout || 0, label: 'no load' }], cursor: load.get() ? v.RL : undefined, title: 'loading lowers V_out' });
    } else {
      var p = M.pot;
      if (p.invalid) return;
      var base = { E0: v.E0, r0: v.r0, Rs: v.Rs, Rw: v.Rw, L: v.Lc / 100, Ex: v.Ex, rx: v.rx, Rg: v.Rg };
      pA.draw({ x: [0, v.Lc], xLabel: 'l / cm', yLabel: 'V across AJ / V', series: [{ fn: function (cm) { return p.k * cm / 100; }, color: col.s4 }], hlines: [{ y: v.Ex, label: 'E_x' }], cursor: v.xc, title: 'gradient = potential gradient' });
      pB.draw({ x: [0, v.Lc], xLabel: 'l / cm', yLabel: 'I_G / mA', series: [{ fn: function (cm) { var q = CI.potentiometer(Object.assign({ x: cm / 100 }, base)); return q.galvError ? NaN : q.Ig * 1e3; }, color: col.s2, steps: 200 }], cursor: v.xc, title: 'zero at balance' });
    }
  }

  /* ---------- live working ---------- */
  function readout() {
    if (!M) return;
    var s3 = U.sf, v = prm.values;
    R.clear();
    if (M.div) {
      var dv = M.div, d = dv.d, sn = sensor.get(), top = spos.get() === 'top';
      if (d.invalid) { R.badge(d.invalid, 'warn').render(); return; }
      if (sn !== 'none') {
        R.badge('Sensor resistance from an illustrative model curve', 'info');
        R.eq(sn === 'th' ? 'R<sub>thermistor</sub>' : 'R<sub>LDR</sub>', 'at ' + (sn === 'th' ? U.num(v.T, 3) + ' °C' : U.num(v.Lx, 3) + ' a.u.'), sn === 'th' ? IV.thermistorR(v.T, DEF.thermistor) : IV.ldrR(v.Lx, DEF.ldr), 'Ω', 'Read the sensor’s resistance at this temperature / light intensity from its characteristic (here a model curve).');
      }
      R.head('Potential divider (output across the bottom resistor)');
      if (load.get()) R.eq('R<sub>bottom</sub> ∥ R<sub>L</sub>', '(1/' + s3(dv.bot) + ' + 1/' + s3(v.RL * 1e3) + ')<sup>−1</sup>', d.R2eff, 'Ω', 'The load is in parallel with the bottom resistor, so combine them first: 1/R = 1/R₂ + 1/R<sub>L</sub>.');
      R.eq('I', 'V<sub>in</sub> ÷ (R<sub>top</sub> + R<sub>bottom</sub>) = ' + s3(v.Vin) + ' ÷ (' + s3(dv.top) + ' + ' + s3(d.R2eff) + ')', d.I, 'A', 'The two parts are in series, so the same current flows through both: I = V<sub>in</sub> ÷ total resistance.');
      R.eq('V<sub>out</sub>', 'V<sub>in</sub> × R<sub>bottom</sub> ÷ (R<sub>top</sub> + R<sub>bottom</sub>) = ' + s3(v.Vin) + ' × ' + s3(d.R2eff) + ' ÷ ' + s3(dv.top + d.R2eff), d.Vout, 'V', 'The supply p.d. is shared in the ratio of the resistances, so the bottom part gets the fraction R<sub>bottom</sub> ÷ (R<sub>top</sub> + R<sub>bottom</sub>).');
      R.eq('p.d. across top', 'V<sub>in</sub> − V<sub>out</sub>', d.V1, 'V', 'Kirchhoff’s second law: the p.d.s across the two parts add up to the supply e.m.f.');
      if (load.get()) { var nl = CI.divider(v.Vin, dv.top, dv.bot); R.eq('without load', 'V<sub>in</sub> R<sub>bottom</sub>/(R<sub>top</sub> + R<sub>bottom</sub>)', nl.Vout, 'V', 'Without the load the bottom resistor alone is across the output, so V<sub>out</sub> is larger: the load lowers it.'); }
      if (sn !== 'none') {
        R.head('As the ' + (sn === 'th' ? 'temperature' : 'light intensity') + ' increases');
        R.html('<div class="eq">R<sub>' + (sn === 'th' ? 'thermistor' : 'LDR') + '</sub> decreases, so the p.d. across it decreases. The output is across the ' + (top ? 'fixed resistor' : (sn === 'th' ? 'thermistor' : 'LDR')) + ', so V<sub>out</sub> <b>' + (top ? 'increases' : 'decreases') + '</b>.</div>');
      }
      R.render(); return;
    }
    var p = M.pot, st = M.std;
    if (p.invalid) { R.badge(p.invalid, 'warn').render(); return; }
    R.head('Driver circuit: potential gradient along AB');
    R.eq('I<sub>wire</sub>', 'E₀ ÷ (r₀ + R<sub>s</sub> + R<sub>w</sub>) = ' + s3(v.E0) + ' ÷ (' + s3(v.r0) + ' + ' + s3(v.Rs) + ' + ' + s3(v.Rw) + ')', p.Iwire, 'A', 'The driver cell, its internal resistance, the series resistor and the whole wire are all in series.');
    R.eq('V<sub>AB</sub>', 'I<sub>wire</sub> R<sub>w</sub>', p.Vwire, 'V', 'V = IR for the uniform wire: this is the total p.d. available along AB.');
    R.eq('potential gradient', 'V<sub>AB</sub> ÷ L = ' + s3(p.Vwire) + ' ÷ ' + U.num(v.Lc, 4) + ' cm', p.k / 100, 'V cm<sup>−1</sup>', 'The wire is uniform, so the p.d. along it is shared equally per centimetre: p.d. ∝ length.');
    R.head('Balance point for the test cell (nu&#8203;ll method: galvanometer reads zero)');
    if (p.hasBalance) R.eq('l<sub>x</sub>', 'E<sub>x</sub> ÷ gradient = ' + s3(v.Ex) + ' ÷ ' + s3(p.k / 100), p.balance * 100, 'cm', 'At balance the p.d. across AJ equals E<sub>x</sub>, so the balance length is E<sub>x</sub> ÷ (p.d. per cm).');
    else R.badge('No balance point: E_x is more than the p.d. across the whole wire (' + s3(p.Vwire) + ' V)', 'warn');
    if (p.galvError) R.badge(p.galvError, 'warn');
    else {
      var bal = p.hasBalance && Math.abs(v.xc / 100 - p.balance) < 1e-6;
      R.eq('I<sub>G</sub> at l = ' + s3(v.xc) + ' cm', bal ? 'balanced: no current in the test cell' : 'p.d. across AJ = ' + s3(p.VAJ) + ' V ≠ E<sub>x</sub>', Math.abs(p.Ig) < 1e-12 ? 0 : p.Ig * 1e3, 'mA', 'The galvanometer current is zero only when the p.d. across AJ exactly equals the e.m.f. of the test cell.');
      if (!bal && Math.abs(p.Ig) > 1e-12) R.eq('terminal p.d. of test cell', 'E<sub>x</sub> − I r<sub>x</sub> = ' + s3(v.Ex) + ' − ' + s3(p.Itest) + ' × ' + s3(v.rx) + ' (not the e.m.f. while current flows)', v.Ex - p.Itest * v.rx, 'V', 'Away from balance a current flows in the test cell, so its terminal p.d. is less than its e.m.f. (lost volts Ir).');
    }
    R.head('Comparing e.m.f.s: E<sub>x</sub>/E<sub>s</sub> = l<sub>x</sub>/l<sub>s</sub>');
    if (st.hasBalance && p.hasBalance) {
      R.eq('l<sub>s</sub>', 'standard cell balance = ' + s3(v.Es) + ' ÷ ' + s3(p.k / 100), st.balance * 100, 'cm', 'With the same driver circuit (same potential gradient), find the balance length for the standard cell too.');
      R.eq('E<sub>x</sub>', 'E<sub>s</sub> × l<sub>x</sub> ÷ l<sub>s</sub> = ' + s3(v.Es) + ' × ' + s3(p.balance * 100) + ' ÷ ' + s3(st.balance * 100), CI.compareEmf(v.Es, st.balance, p.balance), 'V', 'Balance length ∝ e.m.f. for the same potential gradient, so E<sub>x</sub> ÷ E<sub>s</sub> = l<sub>x</sub> ÷ l<sub>s</sub>.');
    } else R.html('<div class="eq">Both cells need a balance point on the wire to compare them.</div>');
    R.render();
  }

  /* ---------- direct manipulation: drag the jockey / sensor / resistors, tap a component to type its value ---------- */
  function locked(k) { var r = prm.rows[k]; return !!(r && r.range.disabled); }
  function spec(k) { return prm.rows[k].spec; }
  function decOf(st) { var t = String(st); return t.indexOf('.') < 0 ? 0 : t.length - t.indexOf('.') - 1; }
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function setVal(k, val, step) {
    var sp = spec(k), o = {};
    if (!isFinite(val)) return;
    val = U.clamp(val, Number(sp.min), Number(sp.max));
    if (step) val = Number((Math.round(val / step) * step).toFixed(decOf(step)));
    o[k] = U.clamp(val, Number(sp.min), Number(sp.max));
    if (o[k] !== prm.values[k]) { prm.set(o); touched(); }
  }
  function ask(k, x, y, title, sub, quick) {
    if (locked(k)) return;
    var sp = spec(k), st = Number(sp.step);
    ui.askNumber({ title: title, sub: sub, value: prm.values[k], min: Number(sp.min), max: Number(sp.max), step: st, decimals: Math.max(decOf(st), 2),
      unit: sp.unit, at: { x: x, y: y }, quick: quick, onInput: function (val) { setVal(k, val); } });
  }
  /* resistances span decades: dragging up / right multiplies, down / left divides (×2 every 40 px), kept to about 2 s.f. */
  function niceStep(val, minStep) { return Math.max(minStep, Math.pow(10, Math.floor(Math.log10(Math.max(Math.abs(val), 1e-9))) - 1)); }
  function logDrag(h, x, y, minStep) { var v0 = Math.max(h.v0, minStep * 10), val = v0 * Math.pow(2, ((x - h.x) - (y - h.y)) / 40); setVal(h.key, val, niceStep(val, minStep)); }
  var POT = { xA: 2.5, xB: 13.5, yW: 5 };
  function potX(cm) { return POT.xA + (POT.xB - POT.xA) * cm / prm.values.Lc; }
  var TITLES = {
    Vin: ['Supply e.m.f. V<sub>in</sub>', 'Negligible internal resistance.', [3, 6, 9, 12]],
    R1: ['Top resistor R₁', 'Drag the resistor up / down to scale it, or type a value.', [1, 2, 5, 10]],
    R2: ['Bottom resistor R₂', 'The output is taken across this resistor.', [1, 2, 5, 10]],
    RL: ['Load resistance R<sub>L</sub>', 'In parallel with the bottom resistor.', [1, 2, 10, 100]],
    T: ['Thermistor temperature T', 'Drag the thermistor up to warm it, down to cool it.', [0, 25, 50, 100]],
    Lx: ['Light intensity on the LDR', 'Drag the LDR up for brighter light, down for darker.', [0, 20, 50, 100]],
    E0: ['Driver cell e.m.f. E₀', 'Sets the p.d. across the wire.', [1.5, 2, 2.5, 6]],
    Rs: ['Series resistor R<sub>s</sub>', 'In the driver circuit: a larger R<sub>s</sub> lowers the potential gradient.', [0, 5, 10, 20]],
    Ex: ['Test cell e.m.f. E<sub>x</sub>', 'The cell being measured.', [0.5, 1.0, 1.2, 1.5]],
    Rg: ['Galvanometer resistance R<sub>G</sub>', 'Does not change the balance length.', [10, 50, 100]],
    Lc: ['Length of the wire L', 'Jockey positions stay within 0 to L.', [50, 100, 150, 200]],
    Rw: ['Resistance of the whole wire R<sub>w</sub>', 'Uniform wire: resistance is proportional to length.', [5, 6.86, 10, 20]]
  };
  var ix = SIM.view.interact(cv, {
    handles: function () {
      if (!M) return [];
      var col = ui.colors(), v = prm.values, hs = [];
      function add(id, key, wx, wy, extra) { if (locked(key)) return; var o = { id: id, key: key, x: vp.X(wx), y: vp.Y(wy), v0: v[key], color: col['object-line'] }; for (var e in extra || {}) o[e] = extra[e]; hs.push(o); }
      if (mode.get() === 'div') {
        var sn = sensor.get(), top = spos.get() === 'top', sk = sn === 'th' ? 'T' : 'Lx';
        add('Vin', 'Vin', 3, 3.8, { kind: 'tap' });
        if (sn !== 'none' && top) add('S', sk, 7, 6, { kind: 'sensor', color: col.s1 }); else add('R1', 'R1', 7, 6, { kind: 'R' });
        if (sn !== 'none' && !top) add('S', sk, 7, 2, { kind: 'sensor', color: col.s1 }); else add('R2', 'R2', 7, 2, { kind: 'R' });
        if (load.get()) add('RL', 'RL', 9.5, 2.5, { kind: 'R' });
      } else {
        add('J', 'xc', potX(U.clamp(v.xc, 0, v.Lc)), POT.yW - 0.6, { kind: 'jockey', color: col.accent });
        add('E0', 'E0', 8, 8, { kind: 'tap' }); add('Rs', 'Rs', 10.8, 8, { kind: 'tap' });
        add('Ex', 'Ex', 5, 1.5, { kind: 'tap' }); add('Rg', 'Rg', 8, 1.5, { kind: 'tap' });
        add('Lc', 'Lc', POT.xB + 0.45, POT.yW, { kind: 'tap' }); add('Rw', 'Rw', POT.xA - 0.45, POT.yW, { kind: 'tap' });
      }
      return hs;
    },
    onDrag: function (h, x, y) {
      var v = prm.values;
      if (h.kind === 'jockey') {
        var cm = (vp.toWorld(x, y)[0] - POT.xA) / (POT.xB - POT.xA) * v.Lc, p = M && M.pot;
        // snap onto the balance point when the jockey is within a few pixels of it
        if (p && p.hasBalance && !p.invalid && Math.abs(vp.X(potX(p.balance * 100)) - x) < 6) { var o = { xc: U.clamp(p.balance * 100, 0, v.Lc) }; if (o.xc !== v.xc) { prm.set(o); touched(); } }
        else setVal('xc', cm, 0.1);
      } else if (h.kind === 'sensor') setVal(h.key, h.v0 - (y - h.y) / (h.key === 'T' ? 3 : 2), 0.5);
      else if (h.kind === 'R') logDrag(h, x, y, 0.01);
    },
    onTap: function (h, x, y) { var t = TITLES[h.key === 'xc' ? '' : h.key]; if (h.key === 'xc') ask('xc', x, y, 'Jockey position l', 'Distance from A along the wire.'); else if (t) ask(h.key, x, y, t[0], t[1], t[2]); },
    onHover: function () { drawScene(); }
  });
  var lastTip = null;
  function tip() {
    var t = mode.get() === 'pot' ? 'Drag the jockey along the wire to find the balance point · tap a cell, G, R_s or the wire ends to type values'
      : sensor.get() !== 'none' ? 'Drag the ' + (sensor.get() === 'th' ? 'thermistor up to warm it' : 'LDR up for more light') + ' · drag a resistor up / down · tap a component to type its value'
      : 'Drag a resistor up / down to change it · tap the cell or a resistor to type its value';
    if (t !== lastTip) { lastTip = t; ui.stageTip(t); }
  }

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
