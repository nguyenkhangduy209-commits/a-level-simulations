<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interference and diffraction</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/phys-superposition.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, SP = SIM.superpos;
  var pg = ui.page({ title: 'Two-source interference and single-gap diffraction', g: 9.81,
    tags: ['9702 8.3 Interference, λ = ax/D', '9702 8.2 Diffraction (qualitative)', '9702 8.1.1 superposition'] });
  (function hideG() { try { var t = document.querySelector('header').children[2], l = t.children[t.children.length - 1]; if (l && /g =/.test(l.innerHTML)) l.style.display = 'none'; } catch (e) { /* header layout changed */ } })();

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 8 });
  var PERIOD = 1.5;
  var clock = new SIM.anim.Clock(sceneCard, { duration: 6, loop: true, onFrame: function () {
    clock.tLabel.textContent = 't = ' + (clock.t / PERIOD).toFixed(2) + ' T (slow motion)'; drawScene(); } });
  ui.legend(sceneCard, [
    { color: 'var(--c-s1)', label: 'crest (+ displacement)' }, { color: 'var(--c-s2)', label: 'trough (− displacement)' },
    { color: 'var(--c-s4)', label: 'paths S₁P and S₂P' }, { color: 'var(--ink)', label: 'screen: bright = large average intensity' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var pI = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'intensity ÷ one source alone', xLabel: 'y on screen' });
  var pD = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'path difference ÷ λ', xLabel: 'y on screen' });

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var mode = ui.select(paramCard, { label: 'Experiment', value: 'two', options: [
    { value: 'two', label: 'Two sources / double slit' }, { value: 'gap', label: 'Single gap: diffraction (qualitative only)' }] }, update);
  var wtype = ui.select(paramCard, { label: 'Waves', value: 'light', options: [
    { value: 'light', label: 'Light (double slit)' }, { value: 'micro', label: 'Microwaves (two slits)' },
    { value: 'sound', label: 'Sound (two loudspeakers)' }, { value: 'water', label: 'Water (ripple tank, two dippers)' }] }, update);
  var phase = ui.select(paramCard, { label: 'Sources', value: '0', options: [
    { value: '0', label: 'in phase (0°)' }, { value: '180', label: 'in antiphase (180°)' }] }, update);
  var prm = ui.params(paramCard, [
    { key: 'lamN', label: 'Wavelength', sym: 'λ', unit: 'nm', min: 380, max: 750, step: 1, value: 600 },
    { key: 'aMM', label: 'Slit separation', sym: 'a', unit: 'mm', min: 0.05, max: 2, step: 0.01, value: 0.5 },
    { key: 'Dm', label: 'Slits to screen', sym: 'D', unit: 'm', min: 0.2, max: 5, step: 0.001, value: 2 },
    { key: 'lamC', label: 'Wavelength', sym: 'λ', unit: 'cm', min: 1, max: 6, step: 0.1, value: 3 },
    { key: 'aC', label: 'Slit separation', sym: 'a', unit: 'cm', min: 2, max: 40, step: 0.5, value: 10 },
    { key: 'DmM', label: 'Slits to detector line', sym: 'D', unit: 'm', min: 0.2, max: 3, step: 0.01, value: 1 },
    { key: 'fS', label: 'Frequency', sym: 'f', unit: 'Hz', min: 200, max: 4000, step: 10, value: 1000 },
    { key: 'vS', label: 'Speed of sound', sym: 'v', unit: 'm s<sup>−1</sup>', min: 300, max: 360, step: 1, value: 340 },
    { key: 'aS', label: 'Loudspeaker separation', sym: 'a', unit: 'm', min: 0.2, max: 3, step: 0.01, value: 1.5 },
    { key: 'DS', label: 'Speakers to listening line', sym: 'D', unit: 'm', min: 1, max: 20, step: 0.1, value: 8 },
    { key: 'lamW', label: 'Wavelength', sym: 'λ', unit: 'cm', min: 0.5, max: 5, step: 0.1, value: 1.5 },
    { key: 'aW', label: 'Dipper separation', sym: 'a', unit: 'cm', min: 1, max: 20, step: 0.1, value: 6 },
    { key: 'DW', label: 'Dippers to observation line', sym: 'D', unit: 'cm', min: 5, max: 100, step: 1, value: 40 },
    { key: 'A2', label: 'Amplitude of S₂ ÷ amplitude of S₁', sym: 'A₂/A₁', unit: '', min: 0, max: 1, step: 0.05, value: 1 },
    { key: 'yP', label: 'Point P on the screen (% of half-width shown)', sym: 'P', unit: '%', min: -100, max: 100, step: 0.5, value: 22 },
    { key: 'bl', label: 'Gap width ÷ wavelength', sym: 'b/λ', unit: '', min: 0.5, max: 10, step: 0.1, value: 1.5 }
  ], update);
  var coherent = ui.toggle(paramCard, { label: 'Coherent sources (constant phase difference)', value: true }, update);
  var avgView = ui.toggle(paramCard, { label: 'Show average intensity instead of the instantaneous waves' }, update);

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Young double slit: 600 nm, a = 0.50 mm, D = 2.0 m', mode: 'two', wtype: 'light', values: { lamN: 600, aMM: 0.5, Dm: 2, A2: 1, yP: 22 }, note: 'x = λD/a = 600 × 10⁻⁹ × 2.0 ÷ 0.50 × 10⁻³ = 2.4 mm.' },
    { name: '9702/21 M/J 25 Q4: 720 nm, a = 0.16 mm, nine dark fringes span 3.2 cm', mode: 'two', wtype: 'light', values: { lamN: 720, aMM: 0.16, Dm: 0.889, A2: 1, yP: 0 }, note: 'First to ninth dark fringe = 8 spacings ⇒ x = 3.2/8 = 0.40 cm; D = ax/λ = 0.89 m. Halving a doubles x.' },
    { name: 'Microwaves: λ = 3.0 cm, slits 10 cm apart, detector 1.0 m away', mode: 'two', wtype: 'micro', values: { lamC: 3, aC: 10, DmM: 1, A2: 1, yP: 40 }, note: 'Here x is not ≪ D, so λ = ax/D is only approximate: compare the exact positions.' },
    { name: 'Two loudspeakers in phase, 1.0 kHz, 1.5 m apart, 8.0 m away', mode: 'two', wtype: 'sound', values: { fS: 1000, vS: 340, aS: 1.5, DS: 8, A2: 1, yP: 30 }, note: 'Walking along the line, the sound is loud and quiet alternately. λ = v/f = 0.34 m.' },
    { name: 'Two loudspeakers in antiphase: quiet at the centre line', mode: 'two', wtype: 'sound', phase: '180', values: { fS: 680, vS: 340, aS: 1.5, DS: 8, A2: 1, yP: 0 }, note: 'Equal paths but 180° phase difference ⇒ destructive interference on the centre line.' },
    { name: 'Ripple tank: two dippers in phase, 6.0 cm apart, λ = 1.5 cm', mode: 'two', wtype: 'water', values: { lamW: 1.5, aW: 6, DW: 40, A2: 1, yP: 25 }, note: 'Lines of maximum and minimum disturbance spread out from between the dippers.' },
    { name: 'Unequal amplitudes: fringes visible but dark fringes not dark', mode: 'two', wtype: 'light', values: { lamN: 600, aMM: 0.5, Dm: 2, A2: 0.4, yP: 0 }, note: 'Good contrast needs similar amplitudes at the screen.' },
    { name: 'Two separate lamps: not coherent, so no fringes', mode: 'two', wtype: 'light', coherent: false, values: { lamN: 600, aMM: 0.5, Dm: 2, A2: 1, yP: 22 }, note: 'Independent sources have a randomly changing phase difference: the pattern shifts too fast to see — uniform illumination.' },
    { name: 'Single gap about one wavelength wide: strong spreading (qualitative)', mode: 'gap', values: { bl: 1.2 }, note: 'Diffraction is greatest when the gap width is similar to the wavelength.' },
    { name: 'Single gap much wider than the wavelength: little spreading (qualitative)', mode: 'gap', values: { bl: 8 }, note: 'The waves pass through almost as a parallel beam; only the edges spread a little.' }
  ], function (p) {
    mode.set(p.mode, true); if (p.wtype) wtype.set(p.wtype, true); phase.set(p.phase || '0', true); coherent.set(p.coherent !== false, true);
    clock.pause(); prm.set(p.values); clock.seek(0);
  });

  ui.notes(noteCard, [
    'λ = ax/D uses <b>a</b> = slit (source) separation, <b>x</b> = fringe separation (bright to adjacent bright), <b>D</b> = slits to screen. It assumes D ≫ a and x ≪ D.',
    'Count <b>spacings</b>, not fringes: from the 1st to the 9th dark fringe is 8 spacings.',
    'Constructive interference where the <b>path difference</b> is nλ, destructive where it is (n + ½)λ — for sources <b>in phase</b>. For sources in antiphase it is the other way round.',
    'Fringes are seen only with <b>coherent</b> sources (constant phase difference, so the same frequency). Similar amplitudes give dark fringes that are really dark.',
    'Decreasing a, or increasing D or λ, spreads the fringes out (x ∝ λD/a).',
    'Each slit must <b>diffract</b> the light so that the two sets of waves overlap; diffraction is greatest when the gap width ≈ λ.',
    'Single-gap diffraction is <b>qualitative only</b> in 9702 AS: no formula is needed or given here.'
  ]);

  /* ---------- model ---------- */
  function geom() {
    var v = prm.values, t = wtype.get();
    if (t === 'light') return { lam: v.lamN * 1e-9, a: v.aMM * 1e-3, D: v.Dm, unitY: 'mm', kY: 1e3, uL: 'nm', kL: 1e9 };
    if (t === 'micro') return { lam: v.lamC * 1e-2, a: v.aC * 1e-2, D: v.DmM, unitY: 'cm', kY: 1e2, uL: 'cm', kL: 1e2 };
    if (t === 'sound') return { lam: v.vS / v.fS, a: v.aS, D: v.DS, unitY: 'm', kY: 1, uL: 'm', kL: 1 };
    return { lam: v.lamW * 1e-2, a: v.aW * 1e-2, D: v.DW * 1e-2, unitY: 'cm', kY: 1e2, uL: 'cm', kL: 1e2 };
  }
  var G = null;
  function update() {
    var two = mode.get() === 'two', t = wtype.get();
    wtype.row.style.display = two ? '' : 'none'; phase.row.style.display = two ? '' : 'none';
    coherent.el.style.display = two ? '' : 'none'; avgView.el.style.display = two ? '' : 'none';
    var keys = { light: ['lamN', 'aMM', 'Dm'], micro: ['lamC', 'aC', 'DmM'], sound: ['fS', 'vS', 'aS', 'DS'], water: ['lamW', 'aW', 'DW'] };
    Object.keys(keys).forEach(function (k) { keys[k].forEach(function (q) { prm.show(q, two && k === t); }); });
    prm.show('A2', two); prm.show('yP', two); prm.show('bl', !two);
    plotWrap.style.display = two ? '' : 'none';
    if (two) {
      G = geom();
      G.phase = phase.get() === '180' ? Math.PI : 0;
      G.x = SP.fringeSpacing(G.lam, G.a, G.D);
      G.Y = Math.min(4.5 * G.x, 0.75 * G.D);           // half-width of screen shown
      G.yP = G.Y * prm.values.yP / 100;
      G.fr = SP.fringes(G.lam, G.a, G.D, G.phase, G.Y);
      // 2-D view geometry in units of a (true scale only when it fits)
      G.trueScale = G.D / G.a <= 12 && G.a / G.lam <= 14;
      if (G.trueScale) { G.lamD = G.lam / G.a; G.DD = G.D / G.a; G.YD = G.Y / G.a; }
      else { G.lamD = Math.max(G.lam / G.a, 1 / 10); G.DD = 9; G.YD = 3.4; }
    }
    drawScene(); drawPlots(); readout();
  }

  /* ---------- colour helpers ---------- */
  function rgb(s) {
    s = String(s || '').trim();
    if (s[0] === '#') { if (s.length === 4) s = '#' + s[1] + s[1] + s[2] + s[2] + s[3] + s[3]; return [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)]; }
    var m = s.match(/[\d.]+/g); return m && m.length >= 3 ? [+m[0], +m[1], +m[2]] : [128, 128, 128];
  }
  var off = document.createElement('canvas'), offCtx = off.getContext('2d');
  /** render fn(x, y) ∈ [−1, 1] (or [0,1] in intensity mode) over a world box into the viewport */
  function field(c, x0, x1, y0, y1, fn, intensityMode) {
    var col = ui.colors(), bg = rgb(col.panel), cp = rgb(col.s1), cn = rgb(col.s2), ink = rgb(col.ink);
    var px0 = vp.X(x0), px1 = vp.X(x1), py0 = vp.Y(y1), py1 = vp.Y(y0);
    var W = Math.max(8, Math.min(220, Math.round((px1 - px0) / 3))), H = Math.max(8, Math.min(160, Math.round((py1 - py0) / 3)));
    off.width = W; off.height = H;
    var img = offCtx.createImageData(W, H), d = img.data;
    for (var j = 0; j < H; j++) for (var i = 0; i < W; i++) {
      var x = x0 + (x1 - x0) * (i + 0.5) / W, y = y1 - (y1 - y0) * (j + 0.5) / H, v = fn(x, y), k = 4 * (j * W + i), tgt, w;
      if (!isFinite(v)) { tgt = bg; w = 0; }
      else if (intensityMode) { tgt = ink; w = U.clamp(v, 0, 1) * 0.85; }
      else { tgt = v >= 0 ? cp : cn; w = Math.min(1, Math.abs(v)) * 0.9; }
      d[k] = bg[0] + (tgt[0] - bg[0]) * w; d[k + 1] = bg[1] + (tgt[1] - bg[1]) * w; d[k + 2] = bg[2] + (tgt[2] - bg[2]) * w; d[k + 3] = 255;
    }
    offCtx.putImageData(img, 0, 0);
    c.save(); c.imageSmoothingEnabled = true; c.drawImage(off, px0, py0, px1 - px0, py1 - py0); c.restore();
  }

  /* ---------- scene ---------- */
  function drawScene() {
    var col = ui.colors();
    if (mode.get() === 'gap') return drawGap(col);
    if (!G) return;
    var two = G, wt = 2 * Math.PI * clock.t / PERIOD, DD = G.DD, YD = G.YD, lamD = G.lamD;
    var stripW = Math.max(DD, 2 * YD) * 0.09;
    vp.fit(-0.9, DD + stripW * 2.6, -YD * 1.08, YD * 1.08);
    var c = vp.begin();
    var ph = G.phase, A2 = prm.values.A2, coh = coherent.get();
    if (!coh) ph = (Math.sin(Math.floor(clock.t * 5) * 12.9898) * 43758.5453 % 1) * 2 * Math.PI; // jumps randomly
    var kD = 2 * Math.PI / lamD;
    if (avgView.get()) {
      field(c, 0, DD, -YD, YD, function (x, y) {
        var dl = Math.hypot(x, y + 0.5) - Math.hypot(x, y - 0.5);
        return SP.intensity(dl, lamD, G.phase, 1, A2, coh) / Math.pow(1 + A2, 2);   // display units (a = 1)
      }, true);
    } else {
      field(c, 0, DD, -YD, YD, function (x, y) {
        var r1 = Math.hypot(x, y - 0.5), r2 = Math.hypot(x, y + 0.5);
        return (Math.cos(kD * r1 - wt) + A2 * Math.cos(kD * r2 - wt + ph)) / (1 + A2);
      }, false);
    }
    // barrier / sources
    c.fillStyle = col['object-line'];
    if (wtype.get() === 'light' || wtype.get() === 'micro') {
      c.fillRect(vp.X(0) - 3, vp.Y(YD), 6, vp.Y(0.5) - vp.Y(YD) - 3); c.fillRect(vp.X(0) - 3, vp.Y(0.5) + 3, 6, vp.Y(-0.5) - vp.Y(0.5) - 6); c.fillRect(vp.X(0) - 3, vp.Y(-0.5) + 3, 6, vp.Y(-YD) - vp.Y(-0.5) - 3);
    }
    D.particle(c, vp.X(0), vp.Y(0.5), 5, { label: '' }); D.particle(c, vp.X(0), vp.Y(-0.5), 5, {});
    D.label(c, 'S₁', vp.X(0) - 14, vp.Y(0.5), col.ink, { size: 12, bold: true }); D.label(c, 'S₂', vp.X(0) - 14, vp.Y(-0.5), col.ink, { size: 12, bold: true });
    // display screen and P
    var yPd = G.trueScale ? G.yP / G.a : YD * prm.values.yP / 100;
    D.line(c, [vp.P(DD, -YD), vp.P(DD, YD)], col.ink, { width: 2 });
    D.line(c, [vp.P(0, 0.5), vp.P(DD, yPd)], col.s4, { width: 1.6 }); D.line(c, [vp.P(0, -0.5), vp.P(DD, yPd)], col.s4, { width: 1.6 });
    c.fillStyle = col.s4; c.beginPath(); c.arc(vp.X(DD), vp.Y(yPd), 5, 0, 7); c.fill(); D.label(c, 'P', vp.X(DD) - 10, vp.Y(yPd) - 10, col.s4, { bold: true });
    // real-scale fringe strip
    var sx = vp.X(DD + stripW * 0.9), sw = vp.X(DD + stripW * 2.0) - sx, top = vp.Y(YD), bot = vp.Y(-YD), n = 120, inkc = rgb(col.ink), bg = rgb(col.panel);
    for (var i = 0; i < n; i++) {
      var y = G.Y * (1 - 2 * (i + 0.5) / n), I = SP.intensity(SP.pathDiff(y, G.a, G.D), G.lam, G.phase, 1, A2, coh) / Math.pow(1 + A2, 2), w = U.clamp(I, 0, 1);
      c.fillStyle = 'rgb(' + Math.round(bg[0] + (inkc[0] - bg[0]) * w) + ',' + Math.round(bg[1] + (inkc[1] - bg[1]) * w) + ',' + Math.round(bg[2] + (inkc[2] - bg[2]) * w) + ')';
      c.fillRect(sx, top + (bot - top) * i / n, sw, (bot - top) / n + 1);
    }
    c.strokeStyle = col['object-line']; c.strokeRect(sx, top, sw, bot - top);
    var yPs = top + (bot - top) * (1 - prm.values.yP / 100) / 2;
    D.arrow(c, sx + sw + 14, yPs, sx + sw + 2, yPs, col.s4, { head: 6, width: 1.6 });
    D.label(c, 'screen (to scale)', sx + sw / 2, top - 8, col.muted, { size: 10 });
    D.label(c, '±' + U.sf(G.Y * G.kY) + ' ' + G.unitY, sx + sw / 2, bot + 9, col.muted, { size: 10 });
    D.label(c, G.trueScale ? '2-D view to scale (amplitude decrease with distance ignored)' : '2-D view NOT to scale: λ and D shortened to fit (pattern shape only)', vp.X(DD / 2), vp.Y(YD) + 10, col.muted, { size: 11, bg: true });
    if (!coh) D.label(c, 'incoherent: phase difference keeps changing — no stable fringes', vp.X(DD / 2), vp.Y(-YD) - 12, col.warn, { size: 12, bold: true, bg: true });
  }
  function drawGap(col) {
    var bl = prm.values.bl, wt = 2 * Math.PI * clock.t / PERIOD, lam = 1, b = bl;
    var Y = Math.max(7, b * 0.8 + 3), X1 = 2 * Y * 1.3, X0 = -4;
    vp.fit(X0, X1, -Y, Y);
    var c = vp.begin();
    field(c, X0, 0, -Y, Y, function (x, y) { return Math.cos(2 * Math.PI * x / lam - wt) * 0.9; }, false);
    field(c, 0, X1, -Y, Y, function (x, y) { return SP.gapField(x, y, wt / (2 * Math.PI), lam, b, Math.max(4, Math.min(24, Math.round(b * 2.5))), 1); }, false);
    c.fillStyle = col['object-line'];
    c.fillRect(vp.X(0) - 4, vp.Y(Y), 8, vp.Y(b / 2) - vp.Y(Y)); c.fillRect(vp.X(0) - 4, vp.Y(-b / 2), 8, vp.Y(-Y) - vp.Y(-b / 2));
    // edges of the geometric shadow
    D.line(c, [vp.P(0, b / 2), vp.P(X1, b / 2)], col.muted, { dash: [5, 5], width: 1.2 });
    D.line(c, [vp.P(0, -b / 2), vp.P(X1, -b / 2)], col.muted, { dash: [5, 5], width: 1.2 });
    D.label(c, 'QUALITATIVE ONLY — dashed lines: edge of the beam without diffraction', vp.w / 2, 14, col.warn, { size: 12, bold: true, bg: true });
    D.label(c, 'gap', vp.X(0) + 18, vp.Y(b / 2) - 10, col.ink, { size: 11, bg: true });
  }

  /* ---------- plots ---------- */
  function drawPlots() {
    if (mode.get() !== 'two' || !G) return;
    var col = ui.colors(), A2 = prm.values.A2, coh = coherent.get(), k = G.kY;
    pI.draw({ x: [-G.Y * k, G.Y * k], y: [0, 4.2], xLabel: 'y / ' + G.unitY,
      series: [{ fn: function (yy) { return SP.intensity(SP.pathDiff(yy / k, G.a, G.D), G.lam, G.phase, 1, A2, coh); }, color: col.s1, steps: 800 }],
      cursor: G.yP * k, vlines: G.fr.bright.filter(function (b) { return Math.abs(b.n) <= 1.5; }).map(function (b) { return { x: b.y * k, label: 'Δ = ' + U.num(b.n, 2) + 'λ' }; }) });
    pD.draw({ x: [-G.Y * k, G.Y * k], xLabel: 'y / ' + G.unitY,
      series: [{ fn: function (yy) { return SP.pathDiff(yy / k, G.a, G.D) / G.lam; }, color: col.s4 }],
      cursor: G.yP * k, hlines: [{ y: 1, label: 'Δ = λ' }, { y: -1, label: 'Δ = −λ' }] });
  }

  /* ---------- live working ---------- */
  function readout() {
    R.clear();
    if (mode.get() === 'gap') {
      var bl = prm.values.bl;
      R.badge('Single-gap diffraction is qualitative only (8.2): no calculation is required', 'warn');
      R.head('What to look for');
      R.html('<div class="eq">' + (bl <= 2 ? 'Gap width similar to the wavelength: the waves <b>spread out a lot</b> beyond the gap (nearly semicircular wavefronts).' :
        bl <= 5 ? 'Gap a few wavelengths wide: noticeable spreading, mostly near the edges of the beam.' :
        'Gap much wider than the wavelength: the waves pass through as an <b>almost parallel beam</b>; very little spreading.') + '</div>');
      R.html('<div class="eq">The wavelength does <b>not</b> change on passing through the gap (same speed, same frequency).</div>');
      R.render(); return;
    }
    var s3 = U.sf, k = G.kY, u = G.unitY;
    if (wtype.get() === 'sound') R.eq('λ', 'v ÷ f = ' + U.num(prm.values.vS, 4) + ' ÷ ' + U.num(prm.values.fS, 5), G.lam, 'm');
    R.head('Fringe separation: λ = ax/D ⇒ x = λD/a');
    R.eq('x', 'λD ÷ a = ' + s3(G.lam) + ' m × ' + s3(G.D) + ' m ÷ ' + s3(G.a) + ' m = ' + s3(G.x) + ' m', G.x * k, u);
    var b1 = G.fr.bright.filter(function (b) { return b.n > 0; })[0];
    var approxOK = G.a / G.D <= 0.05 && G.x / G.D <= 0.05;
    if (approxOK) R.badge('D ≫ a and x ≪ D: λ = ax/D applies', 'ok');
    else R.badge('x or a is not small compared with D: λ = ax/D is only approximate here — compare the exact positions', 'warn');
    if (G.phase === 0) R.head('Exact bright fringes (path difference nλ)'); else R.head('Exact bright fringes (antiphase: path difference (n + ½)λ)');
    G.fr.bright.filter(function (b) { return b.n > 0; }).slice(0, 3).forEach(function (b) {
      R.eq('Δ = ' + U.num(b.n, 2) + 'λ', 'exact y (formula ΔD/a = ' + s3(b.yApprox * k) + ' ' + u + ')', b.y * k, u);
    });
    if (!b1) R.html('<div class="eq">No bright fringe other than the centre within the screen shown.</div>');
    var nMaxPossible = Math.floor(G.a / G.lam - 1e-12);
    if (!approxOK) R.eq('largest order', 'path difference cannot exceed a: n &lt; a/λ = ' + s3(G.a / G.lam), String(nMaxPossible));
    R.head('At point P');
    var dl = SP.pathDiff(G.yP, G.a, G.D), ratio = dl / G.lam, coh = coherent.get(), A2 = prm.values.A2;
    R.eq('y<sub>P</sub>', 'distance from the centre line', G.yP * k, u);
    R.eq('Δ', 'S₂P − S₁P (exact geometry)', dl * G.kL, G.uL);
    R.eq('Δ ÷ λ', '', U.num(ratio, 3));
    var frac = ratio - Math.floor(ratio), eff = G.phase ? (frac + 0.5) % 1 : frac;
    var kind = Math.abs(eff) < 0.02 || Math.abs(eff - 1) < 0.02 ? 'constructive (bright / loud)' : Math.abs(eff - 0.5) < 0.02 ? 'destructive (dark / quiet)' : 'in between';
    if (!coh) R.badge('Not coherent: the phase difference changes randomly, so no fixed bright or dark points', 'warn');
    else R.eq('interference', G.phase ? 'antiphase sources: bright when Δ = (n + ½)λ' : 'in-phase sources: bright when Δ = nλ', kind);
    R.eq('intensity', 'relative to one source alone', SP.intensity(dl, G.lam, G.phase, 1, A2, coh), '');
    R.head('Conditions for observable fringes');
    R.html('<div class="eq">' + (coh ? '✓ coherent sources (constant phase difference)' : '✗ sources not coherent') + '</div>');
    R.html('<div class="eq">' + (A2 >= 0.8 ? '✓ similar amplitudes — dark fringes almost completely dark' : A2 > 0 ? '△ unequal amplitudes — fringes visible but poor contrast' : '✗ only one source — no interference') + '</div>');
    R.render();
  }

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  update();
  clock.seek(0);
  presetCtl.fromQuery();
})();
</script>
</body>
