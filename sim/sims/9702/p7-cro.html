<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cathode-ray oscilloscope</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/phys-waves.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  // Cambridge rounding: exact halves round away from zero (49.05 → 49.1); toPrecision alone can round 49.05 down (binary floating point)
  (function (sf, dp) { SIM.util.sf = function (x, n) { return typeof x === 'number' && isFinite(x) ? sf(x * (1 + 1e-12), n) : sf(x, n); };
    SIM.util.dp = function (x, d) { return typeof x === 'number' && isFinite(x) ? dp(x * (1 + 1e-12), d) : dp(x, d); }; })(SIM.util.sf, SIM.util.dp);
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, WV = SIM.waves;
  var course = ui.course('9702'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Cathode-ray oscilloscope: time-base and y-gain', tags: ['9702 7.1 Progressive waves (CRO)'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 16 });
  ui.legend(sceneCard, [{ color: 'var(--c-s1)', label: 'trace 1' }, { color: 'var(--c-s3)', label: 'trace 2 (same frequency)' }, { color: 'var(--accent)', label: 'one period / amplitude read-off' }]);

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var prm = ui.params(paramCard, [
    { key: 'f', label: 'Signal frequency', sym: 'f', unit: 'Hz', min: 1, max: 100000, step: 1, value: 5000 },
    { key: 'V0', label: 'Signal amplitude (peak)', sym: 'V<sub>0</sub>', unit: 'V', min: 0.001, max: 50, step: 0.001, value: 3 },
    { key: 'tb', label: 'Time-base setting (number; unit below)', sym: '', unit: '', min: 0.01, max: 10, step: 0.01, value: 0.05 },
    { key: 'yg', label: 'Y-gain setting (number; unit below)', sym: '', unit: '', min: 0.01, max: 10, step: 0.01, value: 1 },
    { key: 'V2', label: 'Trace 2 amplitude', sym: 'V<sub>2</sub>', unit: 'V', min: 0, max: 50, step: 0.001, value: 2 },
    { key: 'phi', label: 'Trace 2 lags trace 1 by', sym: 'Δφ', unit: '°', min: 0, max: 360, step: 1, value: 90 },
    { key: 'vw', label: 'Wave speed (to find λ)', sym: 'v', unit: 'm s<sup>−1</sup>', min: 1, max: 5000, step: 1, value: 340 }
  ], update);
  var tbUnit = ui.select(paramCard, { label: 'Time-base unit', value: '1e-3', options: [
    { value: '1e-6', label: 'µs / div' }, { value: '1e-3', label: 'ms / div' }, { value: '1', label: 's / div' }] }, function () { update('*'); });
  var ygUnit = ui.select(paramCard, { label: 'Y-gain unit', value: '1', options: [
    { value: '1e-3', label: 'mV / div' }, { value: '1', label: 'V / div' }] }, function () { update('*'); });
  var two = ui.toggle(paramCard, { label: 'Show a second trace (phase difference)', value: false }, function () { update('*'); });
  var em = ui.toggle(paramCard, { label: 'Electromagnetic wave: use c = 3.00 × 10<sup>8</sup> m s<sup>−1</sup> for λ', value: false }, function () { update('*'); });
  var guides = ui.toggle(paramCard, { label: 'Show read-off guides', value: true }, function () { draw(); });

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Sound at 5000 Hz on 0.05 ms/div: divisions per cycle', tb: '1e-3', yg: '1', two: false, values: { f: 5000, V0: 3, tb: 0.05, yg: 1, vw: 340 },
      note: 'T = 1/5000 = 0.20 ms = 4.0 div × 0.05 ms/div.' },
    { name: 'Microphone trace on 0.50 ms/div and 0.20 V/div: f and amplitude', tb: '1e-3', yg: '1', two: false, values: { f: 400, V0: 0.6, tb: 0.5, yg: 0.2, vw: 340 },
      note: 'One cycle = 5.0 div ⇒ T = 5.0 × 0.50 ms = 2.5 ms ⇒ f = 400 Hz. Amplitude = 3.0 div × 0.20 V/div = 0.60 V.' },
    { name: 'Wavelength of sound from the trace (v = 330 m/s, 0.50 ms/div)', tb: '1e-3', yg: '1', two: false, values: { f: 500, V0: 2, tb: 0.5, yg: 1, vw: 330 },
      note: 'T = 4.0 div × 0.50 ms = 2.0 ms ⇒ f = 500 Hz ⇒ λ = v/f = 330 ÷ 500 = 0.66 m.' },
    { name: 'Two traces 90° out of phase', tb: '1e-3', yg: '1', two: true, values: { f: 1000, V0: 3, tb: 0.2, yg: 1, V2: 2, phi: 90, vw: 340 },
      note: 'One cycle = 5.0 div; trace 2 is shifted 1.25 div ⇒ Δφ = 360° × 1.25 ÷ 5.0 = 90°.' },
    { name: 'Two microphones in antiphase', tb: '1e-3', yg: '1e-3', two: true, values: { f: 250, V0: 0.03, tb: 1, yg: 10, V2: 0.03, phi: 180, vw: 340 },
      note: 'Shifted by half a cycle (2.0 div of 4.0 div) ⇒ 180°. Amplitude 30 mV = 3.0 div × 10 mV/div.' },
    { name: 'Trace too tall: choose a better y-gain', tb: '1e-3', yg: '1', two: false, values: { f: 2000, V0: 6, tb: 0.1, yg: 1, vw: 340 },
      note: 'Amplitude 6.0 div > 4 div half-screen: the peaks are off the screen. Use 2 V/div.' },
    { name: 'Trace too compressed: choose a better time-base', tb: '1e-3', yg: '1', two: false, values: { f: 20000, V0: 2, tb: 1, yg: 1, vw: 340 },
      note: '200 cycles across the screen cannot be counted. Use about 0.02 ms/div.' }
  ], function (p) { tbUnit.set(p.tb, true); ygUnit.set(p.yg, true); two.set(p.two, true); prm.set(p.values); });

  ui.notes(noteCard, [
    'Time-base is <b>time per division</b> (horizontal). Period T = (divisions for one cycle) × time-base. Then f = 1/T.',
    'Y-gain is <b>voltage per division</b> (vertical). Amplitude = (divisions from the centre line to a peak) × y-gain — not peak-to-peak.',
    'Measure across several cycles and divide for a more precise period.',
    'Convert ms and µs to s before using f = 1/T.',
    'Phase difference between two traces = 360° × (horizontal shift) ÷ (divisions per cycle).',
    'The screen here is 10 divisions wide and 8 divisions high (exam diagrams often use 1 cm squares: “ms cm<sup>−1</sup>” means the same as ms/div).'
  ]);

  /* ---------- model ---------- */
  var r = null;
  function tb() { return prm.values.tb * Number(tbUnit.get()); }
  function yg() { return prm.values.yg * Number(ygUnit.get()); }
  function update() {
    var v = prm.values;
    prm.show('V2', two.get()); prm.show('phi', two.get()); prm.show('vw', !em.get());
    r = WV.cro({ f: v.f, V0: v.V0, tb: tb(), yg: yg() });
    draw(); readout();
  }
  function fmtTime(t) { var a = Math.abs(t); return a < 1e-3 ? U.sf(t * 1e6) + ' µs' : a < 1 ? U.sf(t * 1e3) + ' ms' : U.sf(t) + ' s'; }
  function fmtV(x) { return Math.abs(x) < 1 ? U.sf(x * 1e3) + ' mV' : U.sf(x) + ' V'; }

  /* ---------- drawing ---------- */
  function draw() {
    if (!r) return;
    var col = ui.colors(), v = prm.values;
    var RL = real();
    if (RL) vp.fit(-0.9, 10.9, -6.95, 4.85); else vp.fit(-0.3, 10.3, -4.3, 4.3);
    var c = vp.begin();
    if (RL) croPanel(c);
    else { c.save(); c.fillStyle = col.bg; c.fillRect(vp.X(0), vp.Y(4), vp.X(10) - vp.X(0), vp.Y(-4) - vp.Y(4)); c.restore(); }
    var gMain = RL ? 'rgba(170,240,205,.42)' : col.muted, gLine = RL ? 'rgba(170,240,205,.18)' : col.grid;
    for (var i = 0; i <= 10; i++) D.line(c, [vp.P(i, -4), vp.P(i, 4)], i === 5 ? gMain : gLine, { width: i === 5 ? 1.2 : 1 });
    for (var j = -4; j <= 4; j++) D.line(c, [vp.P(0, j), vp.P(10, j)], j === 0 ? gMain : gLine, { width: j === 0 ? 1.2 : 1 });
    for (var m = 0; m <= 50; m++) { D.line(c, [vp.P(m / 5, -0.08), vp.P(m / 5, 0.08)], gMain, { width: 1 }); }
    for (var n = -20; n <= 20; n++) { D.line(c, [vp.P(4.92, n / 5), vp.P(5.08, n / 5)], gMain, { width: 1 }); }
    var tbv = tb(), ygv = yg();
    function trace(V, lagDeg, color, dash) {
      var pts = [], N = Math.min(6000, Math.max(800, Math.ceil(r.cycles * 40)));
      for (var k = 0; k <= N; k++) {
        var xd = 10 * k / N, t = xd * tbv, y = V * Math.sin(2 * Math.PI * v.f * t - U.rad(lagDeg)) / ygv;
        pts.push(vp.P(xd, U.clamp(y, -4.15, 4.15)));
      }
      if (RL) {   // soft phosphor glow: a wide faint stroke under the sharp trace
        c.save(); c.globalAlpha = 0.25; D.line(c, pts, color, { width: 6, dash: dash }); c.restore();
      }
      D.line(c, pts, color, { width: 2, dash: dash });
    }
    c.save(); c.beginPath(); c.rect(vp.X(0), vp.Y(4.2), vp.X(10) - vp.X(0), vp.Y(-4.2) - vp.Y(4.2)); c.clip();
    if (r.cycles <= 400) {
      trace(v.V0, 0, RL ? '#8ff5b8' : col.s1);
      if (two.get() && v.V2 > 0) trace(v.V2, v.phi, RL ? '#ffd98f' : col.s3, [6, 4]);
    }
    c.restore();
    if (guides.get() && !r.tooMany && r.divPerCycle <= 10) {
      // one period from the first upward zero crossing (t = 0) to t = T
      var yG = -Math.min(r.ampDiv, 4) - 0.3;
      D.arrow(c, vp.X(0), vp.Y(Math.max(yG, -4.1)), vp.X(r.divPerCycle), vp.Y(Math.max(yG, -4.1)), col.accent, { width: 1.6, head: 7 });
      D.label(c, 'one cycle = ' + U.sf(r.divPerCycle) + ' div', vp.X(r.divPerCycle / 2), vp.Y(Math.max(yG, -4.1)) - 10, col.accent, { size: 11, bg: true });
      if (!r.clipped) {
        var xa = r.divPerCycle / 4;
        D.arrow(c, vp.X(xa), vp.Y(0), vp.X(xa), vp.Y(r.ampDiv), col.accent, { width: 1.6, head: 7 });
        D.label(c, U.sf(r.ampDiv) + ' div', vp.X(xa) + 6, vp.Y(r.ampDiv / 2), col.accent, { size: 11, align: 'left', bg: true });
      }
      if (two.get() && v.V2 > 0 && v.phi > 0 && v.phi < 360) {
        var sh = v.phi / 360 * r.divPerCycle;
        D.arrow(c, vp.X(xa), vp.Y(3.6), vp.X(xa + sh), vp.Y(3.6), col.s3, { width: 1.4, head: 6 });
        D.label(c, 'shift ' + U.sf(sh) + ' div', vp.X(xa + sh / 2), vp.Y(3.6) - 10, col.s3, { size: 11, bg: true });
      }
    }
    var msg = r.cycles > 400 ? 'Too many cycles to display: decrease the time-base setting' : r.clipped ? 'Trace goes off the screen: increase the y-gain setting (more V per div)' : r.tooMany ? 'Too many cycles to count accurately: decrease the time-base setting' : r.tooFew ? 'Less than one cycle on screen: increase the time-base setting' : '';
    if (msg) D.label(c, msg, vp.w / 2, 12, col.warn, { bold: true, size: 12, bg: true });
    // two separate labels so each can be tapped to type its setting
    var ygTxt = 'y-gain ' + U.num(v.yg, 3) + ' ' + { '1e-3': 'mV/div', '1': 'V/div' }[ygUnit.get()];
    var tbTxt = 'time-base ' + U.num(v.tb, 3) + ' ' + { '1e-6': 'µs/div', '1e-3': 'ms/div', '1': 's/div' }[tbUnit.get()];
    if (RL) {   // the settings sit under the two big knobs; tapping a knob types its setting
      var kr = knobR(), kyy = vp.Y(-5.62);
      D.label(c, tbTxt.replace('time-base ', ''), vp.X(KTB), kyy + kr + 11, col.ink, { size: 11, bold: true, bg: true });
      D.label(c, ygTxt.replace('y-gain ', ''), vp.X(KYG), kyy + kr + 11, col.ink, { size: 11, bold: true, bg: true });
      labels = { yg: { x: vp.X(KYG), y: kyy }, tb: { x: vp.X(KTB), y: kyy } };
      if (ix) ix.paint(c);
      return;
    }
    c.save(); c.font = '11px system-ui, sans-serif';
    var wY = (c.measureText && c.measureText(ygTxt).width) || ygTxt.length * 6, wT = (c.measureText && c.measureText(tbTxt).width) || tbTxt.length * 6;
    c.restore();
    var xY = vp.w - 18, xT = xY - wY - 18;
    D.label(c, ygTxt, xY, vp.h - 8, col.muted, { align: 'right', size: 11 });
    D.label(c, tbTxt, xT, vp.h - 8, col.muted, { align: 'right', size: 11 });
    labels = { yg: { x: xY - wY / 2, y: vp.h - 12 }, tb: { x: xT - wT / 2, y: vp.h - 12 } };
    if (ix) ix.paint(c);
  }

  /* ---------- real-life look: a soft, rounded oscilloscope front panel ---------- */
  var SC = SIM.scene, KTB = 7.0, KYG = 9.3;
  function real() { return !!(SC && SC.real && SC.real()); }
  function rr(c, x, y, w, h, rad) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, rad); else c.rect(x, y, w, h); }
  function knobR() { return Math.max(9, Math.min(22, vp.scale * 0.55)); }
  /** knob pointer position: frac 0…1 maps to the usual 270° sweep (7 o'clock → 5 o'clock) */
  function knob(c, x, y, rad, frac, name) {
    var dk = SC.dark(), a = (0.75 + 1.5 * U.clamp(frac, 0, 1)) * Math.PI;
    c.save();
    c.strokeStyle = dk ? 'rgba(220,230,245,.35)' : 'rgba(80,90,120,.3)'; c.lineWidth = 1;
    for (var i = 0; i <= 10; i++) { var t = (0.75 + 0.15 * i) * Math.PI; c.beginPath(); c.moveTo(x + Math.cos(t) * rad * 1.15, y + Math.sin(t) * rad * 1.15); c.lineTo(x + Math.cos(t) * rad * 1.3, y + Math.sin(t) * rad * 1.3); c.stroke(); }
    c.fillStyle = 'rgba(70,60,110,.14)'; c.beginPath(); c.arc(x + 1.5, y + 2.5, rad, 0, 2 * Math.PI); c.fill();
    c.fillStyle = dk ? '#6b7488' : '#f4f1fa'; c.beginPath(); c.arc(x, y, rad, 0, 2 * Math.PI); c.fill();
    c.fillStyle = dk ? '#7d879c' : '#ffffff'; c.beginPath(); c.arc(x - rad * 0.12, y - rad * 0.14, rad * 0.72, 0, 2 * Math.PI); c.fill();
    c.strokeStyle = dk ? 'rgba(255,255,255,.25)' : 'rgba(90,80,140,.28)'; c.beginPath(); c.arc(x, y, rad, 0, 2 * Math.PI); c.stroke();
    c.strokeStyle = '#e88a8a'; c.lineWidth = Math.max(2, rad * 0.14); c.lineCap = 'round';
    c.beginPath(); c.moveTo(x + Math.cos(a) * rad * 0.2, y + Math.sin(a) * rad * 0.2); c.lineTo(x + Math.cos(a) * rad * 0.82, y + Math.sin(a) * rad * 0.82); c.stroke();
    c.restore();
    if (name) D.label(c, name, x, y - rad * 1.3 - 7, dk ? '#c9d0e0' : '#7b7894', { size: 9, bold: true });
  }
  function croPanel(c) {
    var dk = SC.dark(), x0 = vp.X(-0.8), x1 = vp.X(10.8), y0 = vp.Y(4.8), y1 = vp.Y(-6.9);
    c.save();
    c.fillStyle = 'rgba(70,60,110,.12)'; rr(c, x0 + 3, y0 + 5, x1 - x0, y1 - y0, 18); c.fill();
    c.fillStyle = dk ? '#3d4456' : '#e6e3f2'; rr(c, x0, y0, x1 - x0, y1 - y0, 18); c.fill();
    c.strokeStyle = dk ? 'rgba(255,255,255,.12)' : 'rgba(90,80,140,.22)'; c.lineWidth = 1.2; c.stroke();
    var bx0 = vp.X(-0.35), bx1 = vp.X(10.35), by0 = vp.Y(4.35), by1 = vp.Y(-4.35);   // bezel round the screen
    c.fillStyle = dk ? '#2b3140' : '#cfcbe2'; rr(c, bx0, by0, bx1 - bx0, by1 - by0, 14); c.fill();
    var sx0 = vp.X(-0.12), sx1 = vp.X(10.12), sy0 = vp.Y(4.12), sy1 = vp.Y(-4.12);
    c.fillStyle = dk ? '#14302b' : '#1f4a42'; rr(c, sx0, sy0, sx1 - sx0, sy1 - sy0, 10); c.fill();
    c.fillStyle = 'rgba(255,255,255,.05)'; rr(c, sx0 + 4, sy0 + 4, (sx1 - sx0) * 0.6, (sy1 - sy0) * 0.25, 8); c.fill();   // a gentle glass sheen
    c.restore();
    var kr = knobR(), ky = vp.Y(-5.62), small = kr * 0.62;
    // power button with a green lamp, intensity and focus knobs, CH1 input socket
    c.save();
    c.fillStyle = dk ? '#596276' : '#f7f5fc'; rr(c, vp.X(0.1) - small, ky - small * 0.7, small * 2, small * 1.4, 6); c.fill();
    c.strokeStyle = 'rgba(90,80,140,.25)'; c.stroke();
    c.fillStyle = '#8fe0a6'; c.beginPath(); c.arc(vp.X(0.1), ky, Math.max(2, small * 0.28), 0, 2 * Math.PI); c.fill();
    c.restore();
    D.label(c, 'POWER', vp.X(0.1), ky - kr * 1.3 - 7, dk ? '#c9d0e0' : '#7b7894', { size: 9, bold: true });
    knob(c, vp.X(1.7), ky, small, 0.6, 'INTENSITY'); knob(c, vp.X(3.2), ky, small, 0.45, 'FOCUS');
    c.save(); c.fillStyle = dk ? '#8a93a6' : '#d9d4ea'; c.beginPath(); c.arc(vp.X(4.75), ky, small * 0.8, 0, 2 * Math.PI); c.fill();
    c.fillStyle = dk ? '#2b3140' : '#8a86a6'; c.beginPath(); c.arc(vp.X(4.75), ky, small * 0.35, 0, 2 * Math.PI); c.fill(); c.restore();
    D.label(c, 'CH1 IN', vp.X(4.75), ky - kr * 1.3 - 7, dk ? '#c9d0e0' : '#7b7894', { size: 9, bold: true });
    // big knobs: pointer follows the setting (log scale)
    var lg = function (x, lo, hi) { return (Math.log10(x) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)); };
    knob(c, vp.X(KTB), ky, kr, lg(Math.max(tb(), 1e-9), 1e-8, 10), 'TIME / DIV');
    knob(c, vp.X(KYG), ky, kr, lg(Math.max(yg(), 1e-9), 1e-5, 10), 'VOLTS / DIV');
  }

  /* ---------- working ---------- */
  function readout() {
    if (!r) return;
    var v = prm.values, s3 = U.sf, tbv = tb(), ygv = yg();
    R.clear();
    R.head('Horizontal: time-base ' + fmtTime(tbv) + ' per div');
    R.eq('divisions per cycle', 'T ÷ time-base = ' + fmtTime(r.T) + ' ÷ ' + fmtTime(tbv), r.divPerCycle, 'div', 'The time-base says how much time each horizontal division represents, so dividing the period by it gives the length of one cycle on the screen.');
    R.eq('T', 'divisions × time-base = ' + s3(r.divPerCycle) + ' × ' + fmtTime(tbv), fmtTime(r.T), '', 'In the exam you read the number of divisions for one complete cycle off the screen, then multiply by the time-base to get the period.');
    R.eq('f', '1 ÷ T = 1 ÷ ' + (r.T < 1e-3 ? '(' + s3(r.T) + ')' : s3(r.T)) + ' s', r.fRead, 'Hz', 'Frequency is the number of cycles per second, f = 1/T. Convert the period to seconds first.');
    R.eq('cycles on screen', '10 div ÷ ' + s3(r.divPerCycle) + ' div', r.cycles, '', 'The screen is 10 divisions wide; several complete cycles on screen let you measure the period more precisely.');
    R.head('Vertical: y-gain ' + fmtV(ygv) + ' per div');
    R.eq('amplitude on screen', 'V<sub>0</sub> ÷ y-gain = ' + fmtV(v.V0) + ' ÷ ' + fmtV(ygv), r.ampDiv, 'div', 'The y-gain is the voltage per vertical division, so the peak voltage divided by it gives the height of a peak above the centre line.');
    R.eq('amplitude', 'divisions × y-gain = ' + s3(r.ampDiv) + ' × ' + fmtV(ygv), fmtV(r.ampRead), '', 'Amplitude is measured from the centre line (equilibrium) to a peak, then multiplied by the y-gain.');
    R.eq('peak-to-peak', '2 × amplitude', r.ppDiv, 'div', 'Peak-to-peak is crest to trough, twice the amplitude. Do not quote it as the amplitude.');
    if (r.clipped) R.badge('Peaks are off the 8-division screen: use a larger V/div setting', 'warn');
    if (r.tooMany) R.badge('More than 40 cycles on screen: use a smaller time-base setting', 'warn');
    if (r.tooFew) R.badge('Less than one complete cycle on screen: use a larger time-base setting', 'warn');
    if (two.get()) {
      var sh = v.phi / 360 * r.divPerCycle;
      R.head('Phase difference between the traces');
      R.eq('horizontal shift', 'Δφ/360° × divisions per cycle', sh, 'div', 'One whole cycle on the screen corresponds to 360°, so the horizontal shift is the same fraction of a cycle as Δφ is of 360°.');
      R.eq('Δφ', '360° × shift ÷ divisions per cycle = 360° × ' + s3(sh) + ' ÷ ' + s3(r.divPerCycle), U.dp(v.phi, 1) + '°', '', 'Phase difference = (shift ÷ divisions per cycle) × 360°.');
      R.eq('Δφ', 'in radians', s3(U.rad(v.phi)) + ' rad', '', '360° = 2π rad, so multiply the angle in degrees by π/180.');
      R.eq('time difference', 'shift × time-base', fmtTime(sh * tbv), '', 'The same horizontal shift read as a time: divisions × time-base.');
    }
    R.head('Wavelength');
    var speed = em.get() ? WV.C : v.vw;
    R.eq('λ', 'v ÷ f = ' + s3(speed) + ' ÷ ' + s3(r.fRead), speed / r.fRead, 'm', 'The wave equation v = fλ links the speed, the frequency read from the screen and the wavelength.');
    R.render();
  }

  /* ---------- direct manipulation: drag the trace peak (amplitude), the end of one cycle (frequency), trace 2's peak (phase, V₂); tap the settings ---------- */
  var labels = null, ix = null;
  function locked(k) { var rw = prm.rows[k]; return !!(rw && rw.range.disabled); }
  function sig3(x) { return Number(x.toPrecision(3)); }
  function snapAngle(a) { a = Math.round(a); var near = Math.round(a / 15) * 15; return Math.abs(a - near) <= 2 ? near : a; }
  function setVals(o) {
    var out = {}, any = false;
    Object.keys(o).forEach(function (k) { var sp = prm.rows[k].spec, val = U.clamp(o[k], Number(sp.min), Number(sp.max)); if (val !== prm.values[k]) { out[k] = val; any = true; } });
    if (any) { prm.set(out); if (ui.syncChips) ui.syncChips(); }
  }
  function ask(k, x, y, title, sub, quick, unit) {
    var sp = prm.rows[k].spec;
    ui.askNumber({ title: title, sub: sub, value: prm.values[k], min: Number(sp.min), max: Number(sp.max), step: Number(sp.step), decimals: 3, unit: unit !== undefined ? unit : sp.unit,
      at: { x: x, y: y }, quick: quick, onInput: function (val) { var o = {}; o[k] = val; setVals(o); } });
  }
  function onScreen(xd, yd) { return xd >= 0 && xd <= 10 && Math.abs(yd) <= 4.2; }
  ix = SIM.view.interact(cv, {
    handles: function () {
      if (!r || !labels) return [];
      var col = ui.colors(), v = prm.values, hs = [], dpc = r.divPerCycle, show = r.cycles <= 400;
      if (show && !locked('V0') && dpc / 4 <= 10) hs.push({ id: 'V0', x: vp.X(dpc / 4), y: vp.Y(Math.min(r.ampDiv, 4.1)), color: col.s1 });
      if (show && !locked('f') && dpc >= 0.3 && dpc <= 10) hs.push({ id: 'f', x: vp.X(dpc), y: vp.Y(0), color: col.accent });
      if (show && two.get() && v.V2 > 0) {
        var x2 = (0.25 + v.phi / 360) * dpc, y2 = Math.min(v.V2 / yg(), 4.1);
        if (x2 > 10 && dpc <= 10) x2 -= dpc;
        if (onScreen(x2, y2) && !(locked('phi') && locked('V2'))) hs.push({ id: 'tr2', x: vp.X(x2), y: vp.Y(y2), color: col.s3 });
      }
      if (!locked('tb')) hs.push({ id: 'tb', kind: 'pill', w: 96, h: 22, x: labels.tb.x, y: labels.tb.y, color: col.muted });
      if (!locked('yg')) hs.push({ id: 'yg', kind: 'pill', w: 96, h: 22, x: labels.yg.x, y: labels.yg.y, color: col.muted });
      return hs;
    },
    onDrag: function (hd, x, y) {
      var w = vp.toWorld(x, y), v = prm.values;
      if (hd.id === 'V0') setVals({ V0: sig3(U.clamp(Math.round(w[1] * 10) / 10, 0.1, 4.2) * yg()) });
      else if (hd.id === 'f') setVals({ f: sig3(1 / (U.clamp(w[0], 0.2, 10) * tb())) });
      else if (hd.id === 'tr2') {
        var o = {};
        if (!locked('phi')) { var ph = ((w[0] / r.divPerCycle - 0.25) * 360 % 360 + 360) % 360; o.phi = snapAngle(ph); }
        if (!locked('V2')) o.V2 = sig3(U.clamp(Math.round(w[1] * 10) / 10, 0.1, 4.2) * yg());
        setVals(o);
      }
    },
    onTap: function (hd, x, y) {
      var tu = { '1e-6': 'µs/div', '1e-3': 'ms/div', '1': 's/div' }[tbUnit.get()], yu = { '1e-3': 'mV/div', '1': 'V/div' }[ygUnit.get()];
      if (hd.id === 'V0') ask('V0', x, y, 'Signal amplitude V₀', 'Peak voltage (centre line to peak).', [0.5, 1, 2, 3]);
      else if (hd.id === 'f') ask('f', x, y, 'Signal frequency f', 'The period T = 1/f sets how many divisions one cycle takes.', [50, 400, 1000, 5000]);
      else if (hd.id === 'tr2') ask(locked('phi') ? 'V2' : 'phi', x, y, locked('phi') ? 'Trace 2 amplitude V₂' : 'Trace 2 lags trace 1 by Δφ', locked('phi') ? '' : 'Drag the peak sideways to shift it, up/down for V₂.', locked('phi') ? null : [45, 90, 180, 270]);
      else if (hd.id === 'tb') ask('tb', x, y, 'Time-base setting', 'Time per horizontal division (unit set below: ' + tu + ').', [0.05, 0.1, 0.2, 0.5, 1, 2, 5], tu);
      else if (hd.id === 'yg') ask('yg', x, y, 'Y-gain setting', 'Voltage per vertical division (unit set below: ' + yu + ').', [0.1, 0.2, 0.5, 1, 2, 5, 10], yu);
    },
    onHover: function () { draw(); }
  });
  ui.stageTip('Drag the peak to set the amplitude · drag the end of one cycle to set f · drag trace 2’s peak for Δφ · tap the time-base or y-gain label to type it');

  ui.onTheme(draw);
  vp.onResize = draw;
  update('*');
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
