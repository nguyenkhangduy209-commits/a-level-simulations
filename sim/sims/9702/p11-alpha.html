<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha-particle scattering</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/phys-particles.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, PP = SIM.particles;
  var pg = ui.page({ title: 'α-particle scattering and the nuclear atom (qualitative)', g: 9.81,
    tags: ['9702 11.1.1 α-scattering', '9702 11.1.2 nuclear atom'] });
  (function hideG() { try { var t = document.querySelector('header').children[2], l = t.children[t.children.length - 1]; if (l && /g =/.test(l.innerHTML)) l.style.display = 'none'; } catch (e) { /* header layout changed */ } })();

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 8 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 10, onFrame: function () { drawScene(); } });
  ui.legend(sceneCard, [{ color: 'var(--c-s4)', label: 'α-particle paths' }, { color: 'var(--c-s2)', label: 'nucleus (positive; size exaggerated)' }, { color: 'var(--c-s1)', label: 'deflected by more than 90°' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var cvH = ui.canvas(plotWrap), vH = new SIM.view.Viewport(cvH, { pad: 6 });

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var model = ui.select(paramCard, { label: 'Atom model', value: 'nucleus', options: [
    { value: 'nucleus', label: 'Nuclear atom: tiny positive nucleus' }, { value: 'spread', label: 'Comparison: positive charge spread through the atom' }] }, update);
  var prm = ui.params(paramCard, [
    { key: 'Ek', label: 'α-particle kinetic energy (relative)', sym: 'E<sub>k</sub>', unit: '', min: 0.3, max: 4, step: 0.05, value: 1 },
    { key: 'K', label: 'Charge of the nucleus (relative)', sym: 'Q', unit: '', min: 0.25, max: 2, step: 0.05, value: 1 },
    { key: 'B', label: 'Beam half-width (scaled units)', sym: 'b<sub>max</sub>', unit: '', min: 0.5, max: 8, step: 0.1, value: 4 },
    { key: 'N', label: 'Number of α-particles drawn', sym: 'N', unit: '', min: 5, max: 60, step: 1, value: 31 }
  ], update);
  var traces = ui.toggle(paramCard, { label: 'Show complete paths', value: true }, update);

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Beam of α-particles aimed at a gold nucleus', model: 'nucleus', values: { Ek: 1, K: 1, B: 4, N: 31 }, note: 'Most paths are barely deviated; the few that pass very close to the nucleus are deflected through large angles.' },
    { name: 'Higher α-particle energy: fewer large deflections', model: 'nucleus', values: { Ek: 3, K: 1, B: 4, N: 31 }, note: 'Faster α-particles get closer before being turned, but are deflected less at the same distance.' },
    { name: 'Larger nuclear charge: more deflection', model: 'nucleus', values: { Ek: 1, K: 2, B: 4, N: 31 }, note: 'Greater positive charge ⇒ stronger repulsion ⇒ larger deflections.' },
    { name: 'Wide beam: almost all pass far from any nucleus', model: 'nucleus', values: { Ek: 1, K: 1, B: 8, N: 41 }, note: 'In the real foil the nuclei are very far apart compared with their size: nearly all α-particles go straight through.' },
    { name: 'Comparison: positive charge spread throughout the atom', model: 'spread', values: { Ek: 1, K: 1, B: 6, N: 31 }, note: 'Spread-out charge can only cause tiny deflections — it cannot explain the rare large-angle scattering.' }
  ], function (p) { model.set(p.model, true); clock.pause(); prm.set(p.values); clock.seek(0); });

  ui.notes(noteCard, [
    '<b>Most</b> α-particles pass straight through or with very small deflection ⇒ the atom is mostly <b>empty space</b>.',
    'A <b>very small</b> fraction are deflected through more than 90° ⇒ the positive charge and most of the mass are concentrated in a <b>tiny nucleus</b>.',
    'The deflection is caused by electrostatic <b>repulsion</b> between the positive α-particle and the positive nucleus — not by collisions with electrons.',
    'The nucleus is about 10⁻¹⁵–10⁻¹⁴ m across, the atom about 10⁻¹⁰ m: the picture exaggerates the nucleus enormously.',
    'Nuclear atom: protons and neutrons in the nucleus, electrons orbiting outside it.',
    'This simulation uses <b>scaled units</b>: it is qualitative only — do not take numbers from it.'
  ]);

  /* ---------- model ---------- */
  var tracks = [], XM = 12, RA = 6, KSCALE = 0.2; // scaled force constant: closest head-on approach = 0.2 × Q/E_k units
  function update() {
    var v = prm.values, n = Math.round(v.N);
    tracks = [];
    for (var i = 0; i < n; i++) {
      var b = n === 1 ? 0 : -v.B + 2 * v.B * i / (n - 1);
      if (Math.abs(b) < 1e-6) b = 1e-3; // avoid an exactly head-on path (it retraces itself)
      tracks.push(PP.alphaTrack({ b: b, Ek: v.Ek, K: KSCALE * v.K, xmax: XM, model: model.get(), Ra: RA }));
    }
    var T = 0; tracks.forEach(function (t) { T = Math.max(T, t.tEnd); });
    clock.setDuration(T);
    drawScene(); drawHist(); readout();
  }

  /* ---------- scene ---------- */
  function drawScene() {
    var col = ui.colors(), c;
    vp.fit(-XM, XM, -XM * 0.56, XM * 0.56); c = vp.begin();
    var RL = real();
    if (RL) chamber(c);
    if (RL) atom(c);
    else if (model.get() === 'spread') {
      c.save(); c.globalAlpha = 0.18; c.fillStyle = col.s2; c.beginPath(); c.arc(vp.X(0), vp.Y(0), RA * vp.scale, 0, 7); c.fill(); c.restore();
      c.save(); c.setLineDash([4, 4]); c.strokeStyle = col.s2; c.beginPath(); c.arc(vp.X(0), vp.Y(0), RA * vp.scale, 0, 7); c.stroke(); c.restore();
      D.label(c, 'positive charge spread through the atom', vp.X(0), vp.Y(RA) - 10, col.s2, { size: 11, bg: true });
    } else {
      c.fillStyle = col.s2; c.beginPath(); c.arc(vp.X(0), vp.Y(0), 5, 0, 7); c.fill();
      D.label(c, 'nucleus', vp.X(0) + 8, vp.Y(0) + 12, col.s2, { size: 11, align: 'left', bg: true });
    }
    var t = clock.t;
    tracks.forEach(function (tr) {
      var back = tr.deflection > 90, colr = back ? col.s1 : col.s4;
      if (traces.get()) {
        c.save(); c.globalAlpha = 0.55; c.strokeStyle = colr; c.lineWidth = back ? 2 : 1.2; c.beginPath();
        for (var i = 0; i < tr.x.length; i += Math.max(1, Math.floor(tr.x.length / 300))) { var px = vp.X(tr.x[i]), py = vp.Y(tr.y[i]); if (i) c.lineTo(px, py); else c.moveTo(px, py); }
        c.lineTo(vp.X(tr.x[tr.x.length - 1]), vp.Y(tr.y[tr.y.length - 1])); c.stroke(); c.restore();
      }
      var p = PP.trackAt(tr, t);
      if (RL) flash(c, tr, t);
      c.fillStyle = colr; c.beginPath(); c.arc(vp.X(p[0]), vp.Y(p[1]), 3.2, 0, 7); c.fill();
    });
    if (RL) detector(c, t);
    D.label(c, 'α source →', vp.X(-XM) + 8, 14, col.muted, { size: 11, align: 'left', bg: RL });
    D.label(c, 'QUALITATIVE — scaled units, not to scale', vp.w - 8, 14, col.warn, { size: 11, align: 'right', bold: true, bg: RL });
    if (ix) ix.paint(c);
  }
  /* ---------- real-life look: evacuated chamber, α source in a lead block, gold nucleus, fluorescent screen with flashes, a rotating microscope ---------- */
  var SC = SIM.scene, RS = XM * 0.5;   // radius of the fluorescent screen (scaled units)
  function real() { return !!(SC && SC.real && SC.real()); }
  function rr(c, x, y, w, h, rad) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, rad); else c.rect(x, y, w, h); }
  function chamber(c) {
    var dk = SC.dark(), W = vp.w, H = vp.h, v = prm.values;
    c.save();
    c.fillStyle = dk ? '#1f2233' : '#2f3350'; rr(c, 2, 2, W - 4, H - 4, 18); c.fill();   // dark inside the evacuated chamber, so the flashes show
    c.strokeStyle = dk ? '#596080' : '#cfc6e8'; c.lineWidth = 4; c.stroke();
    // fluorescent (zinc sulfide) screen: a faint ring round the foil
    c.strokeStyle = 'rgba(170,240,205,.22)'; c.lineWidth = 6; c.beginPath(); c.arc(vp.X(0), vp.Y(0), RS * vp.scale, 0, 2 * Math.PI); c.stroke();
    // lead block holding the α source, with a slot for the beam
    var bx0 = vp.X(-XM) + 4, bx1 = vp.X(-XM + 0.9), hb = Math.min(XM * 0.5, v.B + 1);
    c.fillStyle = dk ? '#6d7488' : '#9ea4b8'; rr(c, bx0, vp.Y(hb), bx1 - bx0, vp.Y(-hb) - vp.Y(hb), 6); c.fill();
    c.fillStyle = '#f2c96b'; c.beginPath(); c.arc(bx0 + 6, vp.Y(0), 3.5, 0, 2 * Math.PI); c.fill();
    c.restore();
    D.label(c, 'vacuum', vp.w - 10, vp.h - 14, 'rgba(220,225,245,.75)', { size: 10, align: 'right', bold: true });
    D.label(c, 'lead block', (bx0 + bx1) / 2 + 18, vp.Y(-hb) + 12, 'rgba(220,225,245,.85)', { size: 10, bold: true });
    D.label(c, 'fluorescent screen', vp.X(0), vp.Y(-RS) + 12, 'rgba(170,240,205,.85)', { size: 10, bold: true });
  }
  function atom(c) {
    if (model.get() === 'spread') {   // positive charge spread through the atom, electrons dotted in it
      c.save(); c.globalAlpha = 0.35; c.fillStyle = '#f4b6c9'; c.beginPath(); c.arc(vp.X(0), vp.Y(0), RA * vp.scale, 0, 2 * Math.PI); c.fill(); c.globalAlpha = 1;
      c.fillStyle = '#bcd4ff'; for (var i = 0; i < 14; i++) { var a = i * 2.39996, rr2 = RA * 0.85 * Math.sqrt((i + 0.5) / 14); c.beginPath(); c.arc(vp.X(rr2 * Math.cos(a)), vp.Y(rr2 * Math.sin(a)), 2.2, 0, 2 * Math.PI); c.fill(); }
      c.restore();
      D.label(c, 'positive charge spread through the atom', vp.X(0), vp.Y(RA) - 10, ui.colors().s2, { size: 11, bg: true });
    } else {
      c.save(); c.globalAlpha = 0.25; c.fillStyle = '#f2c96b'; c.beginPath(); c.arc(vp.X(0), vp.Y(0), 13, 0, 2 * Math.PI); c.fill(); c.restore();
      SC.ball(c, vp.X(0), vp.Y(0), 6, { color: '#f2c96b' });
      D.label(c, 'gold nucleus', vp.X(0) + 9, vp.Y(0) + 14, '#f2d58f', { size: 11, align: 'left', bold: true });
    }
  }
  /** where (and when) a track first leaves the screen radius: a flash there, then a faint mark that stays */
  function crossing(tr) {
    if (tr._cross !== undefined) return tr._cross;
    var out = null;
    for (var i = 1; i < tr.x.length; i++) if (Math.hypot(tr.x[i], tr.y[i]) >= RS && Math.hypot(tr.x[i - 1], tr.y[i - 1]) < RS && tr.x[i] * tr.x[i - 1] + tr.y[i] * tr.y[i - 1] > 0 && Math.hypot(tr.x[i], tr.y[i]) > Math.hypot(tr.x[i - 1], tr.y[i - 1])) { out = { x: tr.x[i], y: tr.y[i], t: tr.t[i] }; }
    tr._cross = out; return out;
  }
  function flash(c, tr, t) {
    var cr = crossing(tr); if (!cr || t < cr.t) return;
    var k = (t - cr.t) / 0.5, x = vp.X(cr.x), y = vp.Y(cr.y);
    c.save();
    c.fillStyle = 'rgba(170,250,200,.55)'; c.beginPath(); c.arc(x, y, 1.8, 0, 2 * Math.PI); c.fill();
    if (k <= 1) { c.globalAlpha = 1 - k; c.fillStyle = '#c8ffd9'; c.beginPath(); c.arc(x, y, 3 + 7 * k, 0, 2 * Math.PI); c.fill(); }
    c.restore();
  }
  /** microscope that is rotated round the foil to count flashes at different angles */
  function detector(c, t) {
    var T = clock.duration || 1, a = Math.PI * U.clamp(t / T, 0, 1) * 0.95 + 0.1, R = RS * vp.scale, cx = vp.X(0), cy = vp.Y(0);
    var x = cx + Math.cos(a) * (R + 14), y = cy - Math.sin(a) * (R + 14);
    c.save(); c.translate(x, y); c.rotate(-a);
    c.fillStyle = '#d8ccef'; rr(c, -2, -6, 26, 12, 5); c.fill(); c.fillStyle = '#b9aee0'; rr(c, 20, -8, 8, 16, 3); c.fill();
    c.restore();
  }

  /* deflection distribution for a beam spread over a whole atom (log scale, qualitative) */
  function drawHist() {
    var col = ui.colors(), c = vH.begin(), v = prm.values;
    vH.fit(-0.12, 1.05, -0.2, 1.08);
    var bins;
    if (model.get() === 'nucleus') bins = PP.deflectionHistogram(150 * KSCALE * v.K / v.Ek, v.Ek, KSCALE * v.K, 6000, 10);
    else { bins = new Array(18).fill(0); tracks.forEach(function (tr) { bins[Math.min(17, Math.floor(tr.deflection / 10))]++; }); }
    var mx = Math.max.apply(null, bins.map(function (b) { return Math.log10(1 + b); })) || 1;
    D.line(c, [vH.P(0, 1.0), vH.P(0, 0), vH.P(1, 0)], col.ink, { width: 1.4 });
    bins.forEach(function (b, i) {
      var h = Math.log10(1 + b) / mx, x0 = vH.X(i / 18) + 1, x1 = vH.X((i + 1) / 18) - 1;
      c.fillStyle = i >= 9 ? col.s1 : col.s4; c.fillRect(x0, vH.Y(h), x1 - x0, vH.Y(0) - vH.Y(h));
    });
    [0, 90, 180].forEach(function (a) { D.label(c, a + '°', vH.X(a / 180), vH.Y(-0.08), col.muted, { size: 10 }); });
    D.label(c, 'deflection angle', vH.X(0.5), vH.Y(-0.16), col.ink, { size: 11 });
    D.label(c, 'number of α-particles (log scale)', vH.X(0.02), vH.Y(1.03), col.ink, { size: 11, align: 'left' });
    D.label(c, model.get() === 'nucleus' ? 'beam spread over a whole atom' : 'from the paths drawn', vH.X(1.0), vH.Y(0.85), col.muted, { size: 10, align: 'right' });
  }

  /* ---------- live working ---------- */
  function readout() {
    var n = tracks.length, back = tracks.filter(function (t) { return t.deflection > 90; }).length, small = tracks.filter(function (t) { return t.deflection < 10; }).length;
    R.clear();
    R.badge('Qualitative only: scaled units — use the observations, not the numbers', 'warn');
    R.head('Observations (paths drawn — the drawn beam is aimed close to one nucleus)');
    R.eq('deflected less than 10°', '', small + ' of ' + n, '', 'These pass far from the nucleus, where the repulsion is weak. In a real foil this is nearly every α-particle.');
    R.eq('deflected more than 90°', '', back + ' of ' + n, '', 'Only an α-particle heading almost straight at a tiny, massive, positive nucleus can be turned back.');
    R.head('Inferences');
    if (model.get() === 'nucleus') {
      R.html('<div class="eq">Most α-particles are hardly deflected ⇒ most of the atom is <b>empty space</b>.</div>');
      R.html('<div class="eq">A few are deflected through large angles (some back towards the source) ⇒ the positive charge and most of the mass are in a <b>very small, dense nucleus</b>.</div>');
      R.html('<div class="eq">Only α-particles passing very close to the nucleus are strongly repelled — this is rare because the nucleus is tiny.</div>');
    } else {
      R.html('<div class="eq">With the positive charge spread through the whole atom, every deflection is small. No α-particle can be turned back.</div>');
      R.html('<div class="eq">This contradicts the observed large-angle scattering ⇒ the charge must be concentrated in a nucleus.</div>');
    }
    R.render();
  }

  /* ---------- direct manipulation: drag the beam edge to aim, tap the nucleus / source to type ---------- */
  function locked(k) { var r = prm.rows[k]; return !!(r && r.range.disabled); }
  function spec(k) { return prm.rows[k].spec; }
  function decOf(st) { var t = String(st); return t.indexOf('.') < 0 ? 0 : t.length - t.indexOf('.') - 1; }
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function setVal(k, val, step) {
    var sp = spec(k), o = {};
    if (!isFinite(val)) return;
    val = U.clamp(val, Number(sp.min), Number(sp.max));
    if (step) val = Number((Math.round(val / step) * step).toFixed(decOf(step)));
    o[k] = U.clamp(val, Number(sp.min), Number(sp.max));
    if (o[k] !== prm.values[k]) { prm.set(o); touched(); }
  }
  function ask(k, x, y, title, sub, quick) {
    if (locked(k)) return;
    var sp = spec(k), st = Number(sp.step);
    ui.askNumber({ title: title, sub: sub, value: prm.values[k], min: Number(sp.min), max: Number(sp.max), step: st, decimals: Math.max(decOf(st), 2),
      unit: sp.unit, at: { x: x, y: y }, quick: quick, onInput: function (val) { setVal(k, val); } });
  }
  var SRCX = -XM + 1.2;
  var ix = SIM.view.interact(cv, {
    handles: function () {
      var col = ui.colors(), v = prm.values, hs = [];
      if (!locked('B')) { hs.push({ id: 'Bt', x: vp.X(SRCX), y: vp.Y(v.B), color: col.s4 }); hs.push({ id: 'Bb', x: vp.X(SRCX), y: vp.Y(-v.B), color: col.s4 }); }
      if (!locked('Ek')) hs.push({ id: 'Ek', x: vp.X(SRCX), y: vp.Y(0), color: col.s4 });
      if (!locked('K')) hs.push({ id: 'K', x: vp.X(0), y: vp.Y(0), color: col.s2 });
      return hs;
    },
    onDrag: function (h, x, y) {
      if (h.id === 'Bt' || h.id === 'Bb') setVal('B', Math.abs(vp.toWorld(x, y)[1]), 0.1);
    },
    onTap: function (h, x, y) {
      if (h.id === 'K') ask('K', x, y, 'Charge of the nucleus Q (relative)', 'Larger positive charge ⇒ stronger repulsion ⇒ larger deflections.', [0.5, 1, 1.5, 2]);
      else if (h.id === 'Ek') ask('Ek', x, y, 'α-particle kinetic energy (relative)', 'Faster α-particles are deflected less at the same distance.', [0.5, 1, 2, 3]);
      else ask('B', x, y, 'Beam half-width b<sub>max</sub>', 'How far from the line through the nucleus the outermost α-particles are aimed.', [1, 2, 4, 8]);
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Drag the top or bottom edge of the beam to aim closer to the nucleus · tap the nucleus to type its charge · tap the source to type the α energy');

  ui.onTheme(function () { drawScene(); drawHist(); });
  vp.onResize = drawScene; vH.onResize = drawHist;
  update();
  clock.seek(0);
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
