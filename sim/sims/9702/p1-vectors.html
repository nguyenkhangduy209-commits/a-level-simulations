<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, DY = SIM.dynamics;
  var course = ui.course('9702'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Scalars and vectors: add, subtract and resolve coplanar vectors', g: g, tags: ['9702 1.4 Scalars and vectors'] });

  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 34 });
  ui.legend(sceneCard, [{ color: 'var(--c-s1)', label: 'vector A' }, { color: 'var(--c-s2)', label: 'vector B (or −B, −A)' },
    { color: 'var(--c-resultant)', label: 'result R' }, { color: 'var(--c-component)', label: 'components of R along the chosen axes' }]);
  var tblCard = pg.card('left', 'Components');
  var tblEl = ui.h('div', { style: 'overflow-x:auto' }); tblCard.appendChild(tblEl);

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var QTY = { gen: { u: 'units', n: 'vector' }, disp: { u: 'm', n: 'displacement' }, vel: { u: 'm s<sup>−1</sup>', n: 'velocity' }, force: { u: 'N', n: 'force' } };
  var look = null;   // real-life scene chosen by the preset (null = pick from quantity / operation)
  var qty = ui.select(paramCard, { label: 'Quantity', value: 'vel', options: [{ value: 'vel', label: 'velocity (m s⁻¹)' }, { value: 'disp', label: 'displacement (m)' }, { value: 'force', label: 'force (N)' }, { value: 'gen', label: 'any vector' }] }, function () { look = null; update(); });
  var op = ui.select(paramCard, { label: 'Operation', value: 'add', options: [{ value: 'add', label: 'R = A + B' }, { value: 'sub', label: 'R = A − B' },
    { value: 'dv', label: 'R = B − A  (change Δv = v₂ − v₁, with v₁ = A, v₂ = B)' }, { value: 'res', label: 'Resolve A into two perpendicular components' }] }, function () { look = null; update(); });
  var prm = ui.params(paramCard, [
    { key: 'A', label: 'Magnitude of A', sym: '|A|', unit: '', min: 0, max: 300, step: 0.1, value: 4 },
    { key: 'tA', label: 'Direction of A (anticlockwise from +x)', sym: 'θ<sub>A</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: 90 },
    { key: 'B', label: 'Magnitude of B', sym: '|B|', unit: '', min: 0, max: 300, step: 0.1, value: 3 },
    { key: 'tB', label: 'Direction of B (anticlockwise from +x)', sym: 'θ<sub>B</sub>', unit: '°', min: -180, max: 180, step: 0.5, value: 0 },
    { key: 'phi', label: 'Axes for components: x′ axis at angle', sym: 'φ', unit: '°', min: -90, max: 90, step: 0.5, value: 0 },
    { key: 'psi', label: 'Wanted direction of A + B (for the aim button)', sym: 'ψ', unit: '°', min: -180, max: 180, step: 0.5, value: 90 }
  ], update);
  var para = ui.toggle(paramCard, { label: 'Show parallelogram as well as the triangle' }, update);
  var comps = ui.toggle(paramCard, { label: 'Show components of the result', value: true }, update);
  var btnRow = ui.h('div', { class: 'row' }); paramCard.appendChild(btnRow);
  var aimMsg = '';
  btnRow.appendChild(ui.h('button', { class: 'btn', text: 'Aim A so that A + B points along ψ', onclick: function () {
    var v = prm.values, rel = v.B * Math.sin(U.rad(v.tB - v.psi)) / (v.A || 1e-300);
    if (op.get() !== 'add') { aimMsg = 'The aim button works with R = A + B.'; update(); return; }
    if (!(v.A > 0) || Math.abs(rel) > 1) { aimMsg = 'Impossible: |A| is too small to cancel the component of B across the wanted direction.'; update(); return; }
    // need A sin(θA − ψ) = −B sin(θB − ψ); two choices, keep the one whose resultant points along +ψ
    var base = Math.asin(-rel), cands = [base, Math.PI - base], best = null;
    cands.forEach(function (c) {
      var th = U.deg(c) + v.psi, along = v.A * Math.cos(c) + v.B * Math.cos(U.rad(v.tB - v.psi));
      if (along > 1e-9 && (best === null || along > best.along)) best = { th: th, along: along };
    });
    if (!best) { aimMsg = 'Impossible: the result would point the opposite way.'; update(); return; }
    var th = ((best.th + 540) % 360) - 180; aimMsg = '';
    prm.set({ tA: Math.round(th * 1e4) / 1e4 });
  } }));

  ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Boat heads straight across at 4.0 m s⁻¹; river flows at 3.0 m s⁻¹', q: 'vel', op: 'add', v: { A: 4, tA: 90, B: 3, tB: 0, phi: 0, psi: 90 }, note: 'Resultant 5.0 m s<sup>−1</sup> at 53.1° to the bank (downstream). The boat drifts downstream.' },
    { name: 'Boat aims upstream to cross straight over (2.5 in water, river 1.5)', q: 'vel', op: 'add', v: { A: 2.5, tA: 126.869898, B: 1.5, tB: 0, phi: 0, psi: 90 }, note: 'Heading 36.9° upstream of straight across gives a resultant of 2.0 m s<sup>−1</sup> straight across. Try the aim button.' },
    { name: 'Plane 200 km h⁻¹ heading north, wind from the west at 50 km h⁻¹', q: 'gen', op: 'add', v: { A: 200, tA: 90, B: 50, tB: 0, phi: 0, psi: 90 }, note: 'A wind FROM the west blows TOWARDS the east. Ground velocity 206 km h<sup>−1</sup> at 14.0° east of north (76.0° from +x). Units here are km h<sup>−1</sup>.' },
    { name: 'Plane must fly due north: wind 50 km h⁻¹ from the west', q: 'gen', op: 'add', v: { A: 200, tA: 104.477512, B: 50, tB: 0, phi: 0, psi: 90 }, note: 'Heading 14.5° west of north cancels the wind: ground speed √(200² − 50²) = 194 km h<sup>−1</sup>.' },
    { name: 'Ball rebounds from a wall: 8 m s⁻¹ in, 6 m s⁻¹ out', q: 'vel', op: 'dv', v: { A: 8, tA: 0, B: 6, tB: 180, phi: 0, psi: 90 }, note: 'Δv = v₂ − v₁ = (−6) − (+8) = −14 m s<sup>−1</sup>: magnitude 14, not 2.' },
    { name: 'Turning a corner at constant speed 10 m s⁻¹ (east → north)', q: 'vel', op: 'dv', v: { A: 10, tA: 0, B: 10, tB: 90, phi: 0, psi: 90 }, note: 'Speed is unchanged but velocity changes: |Δv| = 10√2 = 14.1 m s<sup>−1</sup>, pointing north-west.' },
    { name: 'Two forces at right angles: 3.0 N and 4.0 N', q: 'force', op: 'add', v: { A: 4, tA: 0, B: 3, tB: 90, phi: 0, psi: 0 }, note: 'R = 5.0 N at 36.9° to the 4.0 N force.' },
    { name: 'Two equal forces of 10 N at 120°', q: 'force', op: 'add', v: { A: 10, tA: 0, B: 10, tB: 120, phi: 0, psi: 0 }, note: 'Resultant 10 N along the bisector (60°). Not 20 N.' },
    { name: 'Resolve a 20 N force at 30° above the horizontal', q: 'force', op: 'res', v: { A: 20, tA: 30, B: 0, tB: 0, phi: 0, psi: 0 }, note: 'Horizontal 20 cos 30° = 17.3 N, vertical 20 sin 30° = 10.0 N.' },
    { name: 'Resolve a weight of 50 N along and perpendicular to a 30° slope', q: 'force', op: 'res', v: { A: 50, tA: -90, B: 0, tB: 0, phi: 30, psi: 0 }, note: 'Along the slope: 50 sin 30° = 25 N (down the slope). Perpendicular: 50 cos 30° = 43.3 N (into the slope).' },
    { name: 'Displacement: 3.0 km east then 4.0 km north', q: 'disp', op: 'add', v: { A: 3, tA: 0, B: 4, tB: 90, phi: 0, psi: 0 }, note: 'Distance travelled 7.0 km (scalar); displacement 5.0 km at 53.1° north of east (vector). Units here are km.' }
  ], function (p) {
    look = /Boat/.test(p.name) ? 'river' : /Plane/.test(p.name) ? 'plane' : /rebounds/.test(p.name) ? 'wall' : /corner/.test(p.name) ? 'corner' : /slope/.test(p.name) ? 'slope' : /Displacement/.test(p.name) ? 'map' : 'crate';
    qty.set(p.q, true); op.set(p.op, true); aimMsg = ''; prm.set(p.v);
  });

  ui.notes(noteCard, [
    '<b>Scalars</b> have magnitude only (distance, speed, mass, time, energy, power, pressure). <b>Vectors</b> have magnitude and direction (displacement, velocity, acceleration, force, weight, momentum).',
    'Add vectors <b>tip to tail</b>; the resultant goes from the first tail to the last tip. Magnitudes only add when the vectors are parallel.',
    'Subtracting: A − B = A + (−B). A change in velocity Δv = v₂ − v₁ (final minus initial).',
    'Components of a vector of size F at angle θ to an axis: F cos θ along the axis, F sin θ perpendicular to it.',
    'Wind or current “<b>from</b> the west” moves <b>towards</b> the east.',
    'Give a direction with the resultant: an angle to a stated line (e.g. “53° to the bank”).'
  ]);

  var res = null;
  function sq(x) { return x < 0 ? '(' + U.sf(x) + ')²' : U.sf(x) + '²'; }
  function V(m, t) { return DY.polar(m, t); }
  function update() {
    var v = prm.values, o = op.get(), u = QTY[qty.get()].u;
    var resolving = o === 'res';
    ['B', 'tB'].forEach(function (k) { prm.show(k, !resolving); });
    prm.show('psi', o === 'add'); btnRow.style.display = o === 'add' ? '' : 'none';
    para.el.style.display = o === 'add' ? '' : 'none';
    var A = V(v.A, v.tA), B = V(v.B, v.tB), Rv, first, second, lab2;
    if (o === 'add') { Rv = DY.add(A, B); first = { v: A, n: 'A' }; second = { v: B, n: 'B' }; }
    else if (o === 'sub') { Rv = DY.add(A, DY.scale(B, -1)); first = { v: A, n: 'A' }; second = { v: DY.scale(B, -1), n: '−B' }; }
    else if (o === 'dv') { Rv = DY.add(B, DY.scale(A, -1)); first = { v: B, n: 'B (v₂)' }; second = { v: DY.scale(A, -1), n: '−A (−v₁)' }; }
    else { Rv = A; first = { v: A, n: 'A' }; second = null; }
    var tiny = 1e-6 * Math.max(v.A, v.B, 1e-9);
    Rv = Rv.map(function (x) { return Math.abs(x) < tiny ? 0 : x; });
    var ma = DY.magAng(Rv), ph = U.rad(v.phi), ex = [Math.cos(ph), Math.sin(ph)], ey = [-Math.sin(ph), Math.cos(ph)];
    var Rx = Rv[0] * ex[0] + Rv[1] * ex[1], Ry = Rv[0] * ey[0] + Rv[1] * ey[1];
    if (Math.abs(Rx) < tiny) Rx = 0; if (Math.abs(Ry) < tiny) Ry = 0;
    res = { A: A, B: B, R: Rv, first: first, second: second, Rx: Rx, Ry: Ry, ex: ex, ey: ey };
    var ang = function (x) { return U.dp(x, 1) + '°'; };
    var nm = QTY[qty.get()].n;
    R.clear();
    if (aimMsg) R.badge(aimMsg, 'warn');
    R.badge('Angles measured anticlockwise from the +x axis' + (Math.abs(v.phi) > 1e-9 ? '; components along x′ at ' + ang(v.phi) + ' and y′ perpendicular' : ''), 'info');
    R.head('Components (x, y)');
    R.eq('A<sub>x</sub>', U.num(v.A, 4) + ' cos ' + ang(v.tA), A[0], u, 'The component of a vector along an axis is its magnitude × cos(angle to that axis).'); R.eq('A<sub>y</sub>', U.num(v.A, 4) + ' sin ' + ang(v.tA), A[1], u, 'Perpendicular to the x axis the component is magnitude × sin(angle from +x).');
    if (!resolving) {
      R.eq('B<sub>x</sub>', U.num(v.B, 4) + ' cos ' + ang(v.tB), B[0], u, 'Resolve B the same way: magnitude × cos(angle from +x).'); R.eq('B<sub>y</sub>', U.num(v.B, 4) + ' sin ' + ang(v.tB), B[1], u, '…and magnitude × sin(angle from +x) for the y component.');
      var sx = o === 'add' ? ' + ' : ' − ', a1 = o === 'dv' ? 'B' : 'A', a2 = o === 'dv' ? 'A' : 'B', p1 = o === 'dv' ? B : A, p2 = o === 'dv' ? A : B;
      R.head('Result R = ' + a1 + sx + a2 + (o === 'dv' ? ' (Δv)' : ''));
      R.eq('R<sub>x</sub>', a1 + '<sub>x</sub>' + sx + a2 + '<sub>x</sub> = ' + U.sf(p1[0]) + sx + '(' + U.sf(p2[0]) + ')', Rv[0], u, 'Vectors add (or subtract) component by component: x components combine on their own.');
      R.eq('R<sub>y</sub>', a1 + '<sub>y</sub>' + sx + a2 + '<sub>y</sub> = ' + U.sf(p1[1]) + sx + '(' + U.sf(p2[1]) + ')', Rv[1], u, 'The y components combine on their own too, independently of x.');
      R.eq('|R|', '√(R<sub>x</sub>² + R<sub>y</sub>²) = √(' + sq(Rv[0]) + ' + ' + sq(Rv[1]) + ')', ma.mag, u, 'The two components are perpendicular, so Pythagoras gives the magnitude of the result.');
      if (ma.mag > 1e-9) R.eq('direction', 'tan⁻¹(R<sub>y</sub> ÷ R<sub>x</sub>), quadrant from the signs', ang(ma.ang), '', 'The angle comes from tan θ = R<sub>y</sub>/R<sub>x</sub>; the signs of the components tell you the quadrant.');
      else R.badge('The result is zero: the vectors cancel, so it has no direction', 'ok');
      var pv = first.v, qv = second.v, mp = Math.hypot(pv[0], pv[1]), mq = Math.hypot(qv[0], qv[1]);
      if (mp > 1e-12 && mq > 1e-12) {
        var between = U.deg(Math.acos(U.clamp((pv[0] * qv[0] + pv[1] * qv[1]) / (mp * mq), -1, 1)));
        R.head('Check with the cosine rule: angle between ' + first.n + ' and ' + second.n + ' (tail to tail) = ' + ang(between));
        R.eq('|R|', '√(' + U.sf(mp) + '² + ' + U.sf(mq) + '² + 2(' + U.sf(mp) + ')(' + U.sf(mq) + ') cos ' + ang(between) + ')', Math.sqrt(Math.max(0, mp * mp + mq * mq + 2 * mp * mq * Math.cos(U.rad(between)))), u, 'Same result from the triangle of vectors: the cosine rule with the angle between the two vectors placed tail to tail.');
      }
    } else {
      R.head('Resolve A along x′ (at ' + ang(v.phi) + ') and y′ (at ' + ang(v.phi + 90) + ')');
      var rel = v.tA - v.phi;
      R.eq('A<sub>x′</sub>', U.num(v.A, 4) + ' cos(' + ang(v.tA) + ' − ' + ang(v.phi) + ') = ' + U.num(v.A, 4) + ' cos ' + ang(rel), Rx, u, 'Along the chosen axis x′ the component is A cos(angle between A and x′).');
      R.eq('A<sub>y′</sub>', U.num(v.A, 4) + ' sin ' + ang(rel), Ry, u, 'Perpendicular to x′ the component is A sin(angle between A and x′).');
      R.eq('check', '√(A<sub>x′</sub>² + A<sub>y′</sub>²)', Math.hypot(Rx, Ry), u, 'Perpendicular components must combine back to the original magnitude.');
    }
    if (!resolving && Math.abs(v.phi) > 1e-9) { R.head('Components of R along the rotated axes'); R.eq('R<sub>x′</sub>', 'R · x̂′', Rx, u, 'The component of R along x′: its projection on that axis.'); R.eq('R<sub>y′</sub>', 'R · ŷ′', Ry, u, 'The component of R perpendicular to x′.'); }
    if (nm === 'velocity' && o === 'dv') R.badge('Δv is a vector: an object at constant speed that changes direction has a non-zero Δv', 'info');
    R.render();
    var rows = [['A', A]].concat(resolving ? [] : [['B', B]]).concat([['R', Rv]]);
    tblEl.innerHTML = '<table class="tbl"><tr><th>vector</th><th>x</th><th>y</th><th>magnitude</th><th>direction</th></tr>' +
      rows.map(function (r) { var m = DY.magAng(r[1]); return '<tr><td>' + r[0] + '</td><td>' + U.sf(r[1][0]) + '</td><td>' + U.sf(r[1][1]) + '</td><td>' + U.sf(m.mag) + '</td><td>' + (m.mag > 1e-9 ? U.dp(m.ang, 1) + '°' : '—') + '</td></tr>'; }).join('') + '</table>';
    draw();
  }

  function draw() {
    if (!res) return;
    var c, col = ui.colors(), pts = [[0, 0], res.first.v, res.R];
    if (res.second) { pts.push(DY.add(res.first.v, res.second.v)); pts.push(res.second.v); }
    var xs = pts.map(function (p) { return p[0]; }), ys = pts.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var span = Math.max(x1 - x0, y1 - y0, 1e-6), m = span * 0.12;
    if (frozen) { vp.fit.apply(vp, frozen); span = frozenSpan; }   // keep the scale still while a tip is dragged
    else vp.fit(x0 - m, x1 + m, y0 - m, y1 + m);
    c = vp.begin();
    var O = vp.P(0, 0), P = function (v) { return vp.P(v[0], v[1]); };
    if (SIM.scene.real()) realBack(c, O);
    // axes through origin
    c.strokeStyle = col.grid; c.lineWidth = 1; c.beginPath(); c.moveTo(0, O[1]); c.lineTo(vp.w, O[1]); c.moveTo(O[0], 0); c.lineTo(O[0], vp.h); c.stroke();
    D.label(c, '+x', vp.w - 14, O[1] - 10, col.muted, { size: 11 }); D.label(c, '+y', O[0] + 12, 10, col.muted, { size: 11 });
    var f = P(res.first.v);
    if (res.second) {
      var tip = P(DY.add(res.first.v, res.second.v));
      if (para.get() && op.get() === 'add') {
        var sb = P(res.second.v);
        D.arrow(c, O[0], O[1], sb[0], sb[1], col.s2, { dash: [5, 4], width: 1.4 });
        D.line(c, [sb, tip], col.s1, { dash: [5, 4], width: 1.2 });
      }
      D.arrow(c, O[0], O[1], f[0], f[1], col.s1, { label: res.first.n });
      D.arrow(c, f[0], f[1], tip[0], tip[1], col.s2, { label: res.second.n });
    } else D.arrow(c, O[0], O[1], f[0], f[1], col.s1, { label: 'A' });
    var Rp = P(res.R), rm = DY.magAng(res.R);
    if (res.second && rm.mag > 1e-9) D.arrow(c, O[0], O[1], Rp[0], Rp[1], col.resultant, { width: 3, label: 'R = ' + U.sf(rm.mag).replace(/<[^>]+>/g, '') });
    if (comps.get() && rm.mag > 1e-9) {
      var kx = res.Rx, ky = res.Ry, cx = [res.ex[0] * kx, res.ex[1] * kx], cy = [res.ey[0] * ky, res.ey[1] * ky];
      var pcx = P(cx);
      D.arrow(c, O[0], O[1], pcx[0], pcx[1], col.component, { dash: [5, 4], width: 1.8, label: 'x′: ' + U.sf(kx).replace(/<[^>]+>/g, '') });
      var e2 = P(DY.add(cx, cy));
      D.arrow(c, pcx[0], pcx[1], e2[0], e2[1], col.component, { dash: [5, 4], width: 1.8, label: 'y′: ' + U.sf(ky).replace(/<[^>]+>/g, '') });
      if (Math.abs(prm.values.phi) > 1e-9) {
        var L = span * 0.6, a = P([res.ex[0] * L, res.ex[1] * L]), b = P([-res.ex[0] * L, -res.ex[1] * L]);
        D.line(c, [b, a], col.component, { dash: [2, 4], width: 1 }); D.label(c, 'x′', a[0], a[1] - 10, col.component, { size: 11 });
      }
    }
    if (rm.mag > 1e-9) D.arc(c, O[0], O[1], 26, 0, U.rad(rm.ang), col.muted, U.dp(rm.ang, 1) + '°');
    lastSpan = span;
    if (dragInfo) D.label(c, dragInfo.text, dragInfo.x, dragInfo.y - 24, col.ink, { bold: true, size: 12, bg: true });
    if (ix) ix.paint(c);
  }

  /* ---------- real-life look: the situation behind the vector diagram (soft illustrated style, screen pixels) ---------- */
  function sceneLook() {
    if (look) return look;
    var q = qty.get(), o = op.get();
    return q === 'vel' ? (o === 'add' ? 'river' : 'wall') : q === 'force' ? (o === 'res' ? 'crate' : 'crate') : q === 'disp' ? 'map' : o === 'add' ? 'plane' : 'map';
  }
  function rr(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, w, h, Math.max(0, Math.min(r, w / 2, h / 2))); else c.rect(x, y, w, h); }
  function dirOf(v) { return Math.atan2(v[1], v[0]); }   // math angle of a world vector
  function realBack(c, O) {
    var S = SIM.scene, W = vp.w, H = vp.h, dk = S.dark(), lk = sceneLook(), v = prm.values, hA = U.rad(v.tA), seed = 3;
    function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    c.save();
    if (lk === 'river') {   // river flowing along +x between two grassy banks; the boat heads along A
      c.fillStyle = dk ? '#2b4a6b' : '#a9d3ee'; c.fillRect(0, 0, W, H);
      c.strokeStyle = dk ? 'rgba(200,225,255,.18)' : 'rgba(255,255,255,.6)'; c.lineWidth = 2; c.lineCap = 'round';
      for (var i = 0; i < 26; i++) { var x = rnd() * W, y = rnd() * H, L = 14 + rnd() * 24; c.beginPath(); c.moveTo(x, y); c.lineTo(x + L, y); c.stroke(); }
      c.restore(); S.ground(c, 0, W, Math.min(H - 6, O[1] + 26), { kind: 'grass', depth: H }); c.save();
      c.fillStyle = dk ? '#3d5a3f' : '#a8d59a'; rr(c, -10, -10, W + 20, 26, 10); c.fill();
      boat(c, O[0], O[1], hA, dk);
    } else if (lk === 'plane') {   // sky with clouds, the plane points along its heading A, wind streaks along B
      S.sky(c, 0, 0, W, H, { horizon: H });
      var bA = dirOf(res.B || [1, 0]);
      c.strokeStyle = 'rgba(255,255,255,.55)'; c.lineWidth = 2; c.lineCap = 'round';
      if (v.B > 0) for (var j = 0; j < 14; j++) { var x2 = rnd() * W, y2 = rnd() * H; c.beginPath(); c.moveTo(x2, y2); c.lineTo(x2 + Math.cos(bA) * 30, y2 - Math.sin(bA) * 30); c.stroke(); }
      plane(c, O[0], O[1], hA);
      compass(c, W - 34, H - 40);
    } else if (lk === 'wall') {   // ball heading to a wall on the right and bouncing back
      c.restore(); S.sky(c, 0, 0, W, H * 0.75, { horizon: H * 0.75 }); S.ground(c, 0, W, H * 0.75, { kind: 'floor', depth: H * 0.25 }); S.wall(c, W - 34, 0, 34, H * 0.75, { kind: 'brick' }); c.save();
      S.ball(c, O[0], O[1], 11, { kind: 'football', spin: 0.6 });
    } else if (lk === 'corner') {   // a car turning a corner (seen from above)
      c.fillStyle = dk ? '#2f4a33' : '#bfe3b0'; c.fillRect(0, 0, W, H);
      c.fillStyle = dk ? '#3c4150' : '#d6d8e0'; c.fillRect(0, O[1] - 22, O[0] + 22, 44); c.fillRect(O[0] - 22, 0, 44, O[1] + 22);
      c.strokeStyle = 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.setLineDash([10, 10]); c.beginPath(); c.moveTo(0, O[1]); c.lineTo(O[0], O[1]); c.lineTo(O[0], 0); c.stroke(); c.setLineDash([]);
      topCar(c, O[0] - 40, O[1], 0);
    } else if (lk === 'slope') {   // a crate on a wooden ramp at φ; its weight is resolved along and perpendicular to the ramp
      c.restore(); S.sky(c, 0, 0, W, H, { horizon: H });
      var ph = U.rad(v.phi), ux = Math.cos(ph), uy = -Math.sin(ph), nx = -Math.sin(ph), ny = -Math.cos(ph), bx = O[0] - nx * 22, by = O[1] - ny * 22, Lr = Math.max(W, H) * 1.5;
      S.ramp(c, [[bx - ux * Lr, by - uy * Lr], [bx + ux * Lr, by + uy * Lr], [bx + ux * Lr, H + Lr], [bx - ux * Lr, H + Lr]], { kind: 'wood' });
      S.crate(c, bx, by, 46, 44, ph, {}); c.save();
    } else if (lk === 'map') {   // a walk on a map: footpath along the first vector then the second
      c.fillStyle = dk ? '#2a3a2c' : '#e3f1d6'; c.fillRect(0, 0, W, H);
      c.strokeStyle = dk ? 'rgba(255,255,255,.06)' : 'rgba(90,130,90,.12)'; c.lineWidth = 1;
      for (var gx = O[0] % 40; gx < W; gx += 40) { c.beginPath(); c.moveTo(gx, 0); c.lineTo(gx, H); c.stroke(); }
      for (var gy = O[1] % 40; gy < H; gy += 40) { c.beginPath(); c.moveTo(0, gy); c.lineTo(W, gy); c.stroke(); }
      if (res.second) { var f1 = vp.P(res.first.v[0], res.first.v[1]), t2 = vp.P(res.first.v[0] + res.second.v[0], res.first.v[1] + res.second.v[1]);
        c.strokeStyle = dk ? 'rgba(230,200,150,.45)' : 'rgba(205,165,110,.7)'; c.lineWidth = 9; c.lineCap = 'round'; c.lineJoin = 'round'; c.beginPath(); c.moveTo(O[0], O[1]); c.lineTo(f1[0], f1[1]); c.lineTo(t2[0], t2[1]); c.stroke();
        c.fillStyle = '#ef8f8f'; c.beginPath(); c.moveTo(t2[0], t2[1]); c.lineTo(t2[0], t2[1] - 22); c.lineTo(t2[0] + 14, t2[1] - 17); c.lineTo(t2[0], t2[1] - 12); c.fill(); }
      c.restore(); S.tree(c, 30, H - 10, 50); S.tree(c, W - 40, 70, 40); S.person(c, O[0] - 10, O[1], 34, {}); c.save();
      compass(c, W - 34, H - 40);
    } else {   // forces on a crate on the floor, seen from above: ropes pull along A and B
      c.fillStyle = dk ? '#3a3330' : '#f1e3cc'; c.fillRect(0, 0, W, H);
      c.strokeStyle = dk ? 'rgba(255,255,255,.05)' : 'rgba(150,110,70,.12)'; c.lineWidth = 1; for (var py = 0; py < H; py += 26) { c.beginPath(); c.moveTo(0, py); c.lineTo(W, py); c.stroke(); }
      var ropes = [res.A].concat(op.get() === 'res' ? [] : [res.B]);
      c.restore();
      ropes.forEach(function (rv) { if (Math.hypot(rv[0], rv[1]) > 1e-9) { var a = dirOf(rv); S.rope(c, [[O[0], O[1]], [O[0] + Math.cos(a) * 1500, O[1] - Math.sin(a) * 1500]], { width: 3 }); } });
      S.shadow(c, O[0] + 3, O[1] + 4, 26, 26);
      c.save(); rr(c, O[0] - 22, O[1] - 22, 44, 44, 7); c.fillStyle = '#f3c995'; c.fill(); c.strokeStyle = 'rgba(150,100,60,.35)'; c.lineWidth = 1.2; c.stroke();
      c.strokeStyle = 'rgba(150,100,60,.25)'; c.lineWidth = 4; c.beginPath(); c.moveTo(O[0] - 14, O[1] - 14); c.lineTo(O[0] + 14, O[1] + 14); c.stroke();
    }
    c.restore();
  }
  /** a rowing boat seen from above, nose along math angle a */
  function boat(c, x, y, a, dk) {
    c.save(); c.translate(x, y); c.rotate(-a);
    c.strokeStyle = dk ? 'rgba(220,235,255,.25)' : 'rgba(255,255,255,.75)'; c.lineWidth = 2; c.beginPath(); c.moveTo(-26, -9); c.lineTo(-50, -18); c.moveTo(-26, 9); c.lineTo(-50, 18); c.stroke();   // wake
    c.fillStyle = 'rgba(40,60,100,.15)'; c.beginPath(); if (c.ellipse) c.ellipse(2, 3, 28, 11, 0, 0, 2 * Math.PI); c.fill();
    c.beginPath(); c.moveTo(28, 0); c.quadraticCurveTo(10, -13, -24, -10); c.lineTo(-24, 10); c.quadraticCurveTo(10, 13, 28, 0); c.closePath();
    c.fillStyle = '#f2b98a'; c.fill(); c.strokeStyle = 'rgba(150,100,60,.4)'; c.lineWidth = 1.2; c.stroke();
    c.fillStyle = '#fbe3c8'; c.beginPath(); c.moveTo(20, 0); c.quadraticCurveTo(6, -8, -19, -6); c.lineTo(-19, 6); c.quadraticCurveTo(6, 8, 20, 0); c.fill();
    c.fillStyle = '#c99a6a'; c.fillRect(-4, -7, 4, 14); c.fillRect(-14, -6, 3, 12);
    c.restore();
  }
  /** a small aeroplane seen from above, nose along math angle a */
  function plane(c, x, y, a) {
    c.save(); c.translate(x, y); c.rotate(-a); c.fillStyle = 'rgba(40,60,100,.12)'; c.translate(3, 5);
    var draw = function (fill) { c.fillStyle = fill; c.beginPath(); if (c.ellipse) c.ellipse(0, 0, 26, 5, 0, 0, 2 * Math.PI); else c.rect(-26, -5, 52, 10); c.fill();
      c.beginPath(); c.moveTo(4, -2); c.lineTo(-6, -26); c.lineTo(-12, -26); c.lineTo(-6, -2); c.lineTo(-6, 2); c.lineTo(-12, 26); c.lineTo(-6, 26); c.lineTo(4, 2); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(-18, -1); c.lineTo(-25, -10); c.lineTo(-28, -10); c.lineTo(-24, 0); c.lineTo(-28, 10); c.lineTo(-25, 10); c.lineTo(-18, 1); c.closePath(); c.fill(); };
    draw('rgba(40,60,100,.14)'); c.translate(-3, -5); draw('#f4f5fa');
    c.strokeStyle = 'rgba(80,90,130,.3)'; c.lineWidth = 1; c.beginPath(); if (c.ellipse) c.ellipse(0, 0, 26, 5, 0, 0, 2 * Math.PI); c.stroke();
    c.fillStyle = '#8fb6ee'; c.beginPath(); if (c.ellipse) c.ellipse(15, 0, 5, 2.6, 0, 0, 2 * Math.PI); c.fill();
    c.fillStyle = '#ef8f8f'; c.fillRect(-27, -1, 3, 2);
    c.restore();
  }
  /** a car seen from above, pointing along math angle a */
  function topCar(c, x, y, a) {
    c.save(); c.translate(x, y); c.rotate(-a);
    c.fillStyle = 'rgba(40,40,70,.15)'; rr(c, -18, -9, 40, 22, 7); c.fill();
    c.fillStyle = '#f39a86'; rr(c, -20, -11, 40, 22, 7); c.fill(); c.strokeStyle = 'rgba(150,70,60,.35)'; c.lineWidth = 1; c.stroke();
    c.fillStyle = 'rgba(200,230,250,.95)'; rr(c, 2, -8, 8, 16, 3); c.fill(); rr(c, -14, -8, 6, 16, 3); c.fill();
    c.restore();
  }
  /** a compass rose: north is +y on these diagrams */
  function compass(c, x, y) {
    var dk = SIM.scene.dark();
    c.save(); c.fillStyle = dk ? 'rgba(30,35,55,.6)' : 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(x, y, 18, 0, 2 * Math.PI); c.fill();
    c.fillStyle = '#ef8f8f'; c.beginPath(); c.moveTo(x, y - 14); c.lineTo(x + 5, y); c.lineTo(x - 5, y); c.fill();
    c.fillStyle = '#b7bdd0'; c.beginPath(); c.moveTo(x, y + 14); c.lineTo(x + 5, y); c.lineTo(x - 5, y); c.fill();
    c.fillStyle = dk ? '#e8e8f2' : '#4c4966'; c.font = '700 10px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText('N', x, y - 24);
    c.restore();
  }

  /* ---------- direct manipulation: drag a vector's tip to set its size and direction, tap it to type the size ---------- */
  var frozen = null, frozenSpan = 1, lastSpan = 1, dragInfo = null, ix = null;
  function snapAngle(a) { a = Math.round(a); var near = Math.round(a / 15) * 15; if (Math.abs(a - near) <= 2) a = near; a = ((a + 180) % 360 + 360) % 360 - 180; return a === -180 ? 180 : a; }
  function magStep() { var sp = frozen ? frozenSpan : lastSpan; return sp < 12 ? 0.1 : sp < 60 ? 0.5 : 1; }
  /** which parameter pair the drawn arrows stand for: the first arrow starts at O, the second at the first tip */
  function arrowKeys(which) {
    var o = op.get();
    if (which === 'first') return o === 'dv' ? { m: 'B', t: 'tB', sign: 1, n: 'B' } : { m: 'A', t: 'tA', sign: 1, n: 'A' };
    if (o === 'add') return { m: 'B', t: 'tB', sign: 1, n: 'B' };
    if (o === 'sub') return { m: 'B', t: 'tB', sign: -1, n: 'B' };
    return { m: 'A', t: 'tA', sign: -1, n: 'A' };   // dv: second arrow is −A
  }
  function touched() { if (ui.syncChips) ui.syncChips(); }
  ix = SIM.view.interact(cv, {
    handles: function () {
      if (!res) return [];
      var col = ui.colors(), f = vp.P(res.first.v[0], res.first.v[1]), out = [{ id: 'first', x: f[0], y: f[1], color: col.s1 }];
      if (res.second) { var t = DY.add(res.first.v, res.second.v), tp = vp.P(t[0], t[1]); out.push({ id: 'second', x: tp[0], y: tp[1], color: col.s2 }); }
      return out;
    },
    onDrag: function (hd, x, y) {
      if (!frozen) { frozen = vp.bounds.slice(); frozenSpan = lastSpan; }
      var k = arrowKeys(hd.id), w = vp.toWorld(x, y), base = hd.id === 'first' ? [0, 0] : res.first.v;
      var dx = (w[0] - base[0]) * k.sign, dy = (w[1] - base[1]) * k.sign, st = magStep();
      var mag = U.clamp(Math.round(Math.hypot(dx, dy) / st) * st, 0, 300), th = snapAngle(U.deg(Math.atan2(dy, dx)));
      var o = {}; o[k.m] = Number(mag.toFixed(4)); o[k.t] = th;
      aimMsg = ''; prm.set(o); touched();
      dragInfo = { x: x, y: y, text: '|' + k.n + '| = ' + U.num(mag, st < 1 ? 1 : 0) + ' at ' + th + '°' }; draw();
    },
    onDrop: function () { frozen = null; dragInfo = null; draw(); },
    onTap: function (hd, x, y) {
      var k = arrowKeys(hd.id), u = QTY[qty.get()].u.replace(/<sup>−1<\/sup>/, '⁻¹');
      ui.askNumber({ title: 'Magnitude of ' + k.n, sub: 'Type the size; the direction stays ' + U.num(prm.values[k.t], 1) + '°.', value: prm.values[k.m], min: 0, max: 300, step: 0.1, decimals: 2,
        unit: u, at: { x: x, y: y }, quick: [3, 4, 5, 10], onInput: function (v) { var o = {}; o[k.m] = U.clamp(v, 0, 300); aimMsg = ''; prm.set(o); touched(); } });
    },
    onHover: function () { draw(); }
  });
  ui.stageTip('Drag the tip of A or B to set its size and direction · tap a tip to type its size');

  ui.onTheme(draw);
  vp.onResize = draw;
  update();
  presetCtl.fromQuery();
})();
</script>
