<script>

      c.save(); c.fillStyle = color || '#ffd36b'; c.strokeStyle = 'rgba(190,130,40,.35)'; c.lineWidth = 1;

    /** work in a frame along A→B: callback(c, len) draws with the axis along +x, centred on the midpoint */

        rrect(c, L0, -d / 2, bl * 0.24, d, d * 0.3); c.fillStyle = grad(c, 0, -d / 2, 0, d / 2, [[0, '#ffd59a'], [1, '#f2b46c']]); c.fill();
        rrect(c, L0, -d / 2, bl, d, d * 0.3); c.strokeStyle = 'rgba(60,60,110,.25)'; c.lineWidth = 1; c.stroke();

        c.fillStyle = 'rgba(40,40,70,.7)'; c.font = '700 ' + Math.round(Math.max(9, d * 0.6)) + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

    }
    var BAND = ['#5d5a70', '#b88a6a', '#ef8f8f', '#f6b27a', '#f3dc7c', '#8fd3a0', '#8fb6ee', '#c3a2ea', '#b7b7c4', '#fbfbfb'];
    function bandsOf(R) {
      if (!(R > 0) || !isFinite(R)) return null;
      var e = Math.floor(Math.log10(R) + 1e-9) - 1, m = Math.round(R / Math.pow(10, e));
      if (m >= 100) { m = 10; e++; }
      if (e < -2 || e > 9) return null;
      return [BAND[Math.floor(m / 10)], BAND[m % 10], e === -1 ? '#e7c46a' : e === -2 ? '#cfd3dc' : BAND[e]];
    }
    /** a resistor from A to B: rounded body with colour bands; opt.heat 0…1 adds a warm glow; opt.kind 'th' | 'ldr' for sensors */
    function resistor(c, A, B, R, opt) {
      opt = opt || {};
      along(c, A, B, function (c, len) {
        var bl = Math.min(len * 0.62, opt.body || 64), th = opt.thick || 15, h = opt.heat > 0 ? Math.min(1, opt.heat) : 0;

        var base = opt.kind === 'th' ? '#9fd4c2' : opt.kind === 'ldr' ? '#f3e1a6' : '#f0d9b5';
        rrect(c, -bl / 2, -th / 2, bl, th, th / 2); c.fillStyle = grad(c, 0, -th / 2, 0, th / 2, [[0, S.shade(base, 0.35)], [0.5, base], [1, S.shade(base, -0.12)]]); c.fill();
        if (h > 0.02) { c.globalAlpha = 0.5 * h; c.fillStyle = '#ff9f73'; c.fill(); c.globalAlpha = 1; }
        c.strokeStyle = 'rgba(120,90,60,.3)'; c.lineWidth = 1; c.stroke();

          c.fillStyle = '#e7c46a'; c.fillRect(bl * 0.28, -th / 2 + 1, Math.max(2, bl * 0.06), th - 2);   // tolerance band
        } else if (opt.kind === 'ldr') {   // zig-zag track on a round window

    /** a filament lamp at (x, y), radius r; k = 0…1 brightness */

      c.save();
      rrect(c, x - r * 0.5, y + r * 0.6, r, r * 0.65, 3); c.fillStyle = grad(c, x - r * 0.5, 0, x + r * 0.5, 0, [[0, '#c9ccd8'], [0.5, '#eef0f6'], [1, '#b4b8c8']]); c.fill();
      c.beginPath(); c.arc(x, y, r, 0, 2 * Math.PI);
      c.fillStyle = k > 0.02 ? 'rgba(255,' + Math.round(236 - 20 * k) + ',' + Math.round(190 - 80 * k) + ',' + (0.45 + 0.5 * k) + ')' : (dk() ? 'rgba(200,215,240,.25)' : 'rgba(225,235,250,.75)');
      c.fill(); c.strokeStyle = edge(); c.lineWidth = 1; c.stroke();
      c.strokeStyle = k > 0.02 ? 'rgba(255,170,60,' + (0.6 + 0.4 * k) + ')' : 'rgba(120,110,130,.6)'; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(x - r * 0.35, y + r * 0.6); c.lineTo(x - r * 0.3, y); for (var i = 0; i <= 6; i++) c.lineTo(x - r * 0.3 + i * r * 0.1, y + (i % 2 ? -1 : 1) * r * 0.1); c.lineTo(x + r * 0.35, y + r * 0.6); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(x - r * 0.4, y - r * 0.4, r * 0.18, 0, 2 * Math.PI); c.fill();
      c.restore();
    }
    /** an analogue dial meter: frac 0…1 of full scale (or −1…1 with centreZero); letter 'A' | 'V' | 'G' */
    function meter(c, x, y, r, letter, frac, centreZero) {
      var f = isFinite(frac) ? (centreZero ? 0.5 + 0.5 * U.clamp(frac, -1, 1) : U.clamp(frac, 0, 1.05)) : 0, d = dk();
      c.save();
      rrect(c, x - r * 1.15, y - r * 1.05, r * 2.3, r * 2.1, r * 0.35); c.fillStyle = grad(c, 0, y - r, 0, y + r, [[0, d ? '#4a5272' : '#e9edf8'], [1, d ? '#3a4160' : '#d6dcef']]); c.fill(); c.strokeStyle = edge(); c.lineWidth = 1; c.stroke();

      c.fillStyle = '#6d6a85'; c.beginPath(); c.arc(px, py, 2.5, 0, 2 * Math.PI); c.fill();
      c.fillStyle = d ? '#e8e8f2' : '#4c4966'; c.font = '700 ' + Math.round(Math.max(9, r * 0.5)) + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(letter, x, y + r * 0.78);

    function casing(c, x, y, w, h) {

      c.fillStyle = dk() ? 'rgba(150,170,230,.13)' : 'rgba(180,195,240,.28)'; c.fill(); c.strokeStyle = dk() ? 'rgba(170,185,240,.45)' : 'rgba(120,135,200,.45)'; c.lineWidth = 1.5; c.stroke();

      var L = Math.hypot(B[0] - A[0], B[1] - A[1]), a = Math.atan2(B[1] - A[1], B[0] - A[0]) - (isOpen ? 0.55 : 0);
      c.strokeStyle = '#e9b97a'; c.lineWidth = 4.5; c.beginPath(); c.moveTo(A[0], A[1]); c.lineTo(A[0] + Math.cos(a) * L, A[1] + Math.sin(a) * L); c.stroke();

  })();
  function niceFS(x) { var a = Math.abs(x); if (!(a > 0) || !isFinite(a)) return 1; var e = Math.pow(10, Math.floor(Math.log10(a))), m = a / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e; }   // meter full-scale

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');

    { name: 'Resistance of copper wire: ρ = 1.7 × 10⁻⁸ Ω m, L = 2.0 m, d = 0.50 mm', area: 'd', values: { I: 1, d1: 0.5, L: 2, rho: 1.7, t: 60 }, note: 'A = πd²/4 = 1.96 × 10⁻⁷ m²; R = ρL/A = 0.173 Ω. Forgetting to square d (or using d instead of r) is the classic error.' },

    var v = prm.values, useA = byArea.get() === 'A';
    prm.show('d1', !useA); prm.show('A1', useA); prm.show('k2', second.get());
    var A = useA ? v.A1 * 1e-6 : CI.area(v.d1 * 1e-3), d = useA ? Math.sqrt(4 * A / Math.PI) : v.d1 * 1e-3;
    var n = v.n * 1e28, rho = v.rho * 1e-8, Rw = CI.resistivityR(rho, v.L, A), V = v.I * Rw, Q = CI.charge(v.I, v.t);
    var A2 = A * v.k2 * v.k2;
    M = { A: A, d: d, n: n, rho: rho, R: Rw, V: V, Q: Q, N: CI.carriers(Q), v1: CI.driftSpeed(v.I, n, A), v2: CI.driftSpeed(v.I, n, A2), A2: A2, P: V * v.I, W: V * Q };
    drawScene(); drawPlots(); readout();
  }

  /* ---------- scene ---------- */
  function drawScene() {
    if (!M) return;
    var col = ui.colors(), two = second.get(), k2 = prm.values.k2, I = prm.values.I;
    vp.fit(0, 16, -4.5, 4.5);
    var c = vp.begin();
    var h1 = U.clamp(1.6 * Math.sqrt(M.d / 1e-3), 0.5, 3.4), h2 = two ? U.clamp(h1 * k2, 0.25, 3.8) : h1, xm = two ? 8 : 15.5;
    var real = SIM.scene.real(), rho8 = prm.values.rho;
    if (real) KIT.bench(c, vp.w, vp.h);
    // real look: a metal wire (copper, aluminium-grey or nichrome-silver by resistivity) with plastic insulation at the ends
    var metal = rho8 < 2.2 ? ['#f6c9a3', '#e9a77c', '#c98a62'] : rho8 < 10 ? ['#e8ebf2', '#cfd4df', '#aab1c2'] : ['#dfe1e6', '#c3c6cf', '#9fa3ae'];
    function body(x0, x1, h) {
      if (real) {
        var X0 = vp.X(x0), X1 = vp.X(x1), Yt = vp.Y(h), Yb = vp.Y(-h);
        c.save(); c.fillStyle = KIT.grad(c, 0, Yt, 0, Yb, [[0, metal[0]], [0.35, metal[1]], [1, metal[2]]]); c.fillRect(X0, Yt, X1 - X0, Yb - Yt);
        c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(X0, Yt + (Yb - Yt) * 0.12, X1 - X0, (Yb - Yt) * 0.08);
        c.strokeStyle = 'rgba(120,80,60,.25)'; c.lineWidth = 1; c.strokeRect(X0, Yt, X1 - X0, Yb - Yt); c.restore();
        return;
      }
      c.fillStyle = col.surface; c.strokeStyle = col['object-line']; c.lineWidth = 1.5; c.fillRect(vp.X(x0), vp.Y(h), vp.X(x1) - vp.X(x0), vp.Y(-h) - vp.Y(h)); c.strokeRect(vp.X(x0), vp.Y(h), vp.X(x1) - vp.X(x0), vp.Y(-h) - vp.Y(h)); }
    body(0.5, xm, h1); if (two) body(xm, 15.5, h2);
    if (real) [[0.5, h1, -1], [15.5, h2, 1]].forEach(function (q) {   // insulation sleeves
      var xa = vp.X(q[0]), sw = 0.45 * vp.scale, hh = (vp.Y(-q[1]) - vp.Y(q[1])) / 2 + 4, yc = vp.Y(0);
      KIT.rrect(c, q[2] < 0 ? xa - sw : xa, yc - hh, sw, 2 * hh, 5); c.fillStyle = '#9fb3e6'; c.fill(); c.strokeStyle = KIT.edge(); c.lineWidth = 1; c.stroke();
    });
    // ions (fixed lattice) and electrons drifting
    function particles(x0, x1, h, speedRel, seed) {
      var nx = Math.max(4, Math.round((x1 - x0) * 1.6)), ny = Math.max(1, Math.round(2 * h / 0.7)), span = x1 - x0;
      for (var i = 0; i < nx; i++) for (var j = 0; j < ny; j++) {
        var yy = -h + (j + 0.5) * 2 * h / ny, xx = x0 + (i + 0.5) * span / nx;
        c.fillStyle = real ? 'rgba(140,90,70,.5)' : col.muted; c.beginPath(); c.arc(vp.X(xx), vp.Y(yy), 2.2, 0, 7); c.fill();
        var off = ((i * 0.37 + j * 0.61 + seed) % 1) * span / nx;
        var xe = x0 + ((xx - x0 + off - speedRel * clock.t) % span + span) % span;
        c.fillStyle = col.s2; c.beginPath(); c.arc(vp.X(xe), vp.Y(yy + 0.2), 2.6, 0, 7); c.fill();
      }
    }
    var vmax = Math.max(M.v1, two ? M.v2 : 0, 1e-30), base = I > 0 ? 1.2 : 0;
    particles(0.5, xm, h1, base * M.v1 / vmax, 0.1);
    if (two) particles(xm, 15.5, h2, base * M.v2 / vmax, 0.5);
    if (I > 0) D.arrow(c, vp.X(2), vp.Y(Math.max(h1, h2) + 0.8), vp.X(6), vp.Y(Math.max(h1, h2) + 0.8), col.applied, { label: 'I = ' + U.sf(I) + ' A' });
    D.label(c, 'v = ' + supTxt(U.sf(M.v1)) + ' m s⁻¹', vp.X((0.5 + xm) / 2), vp.Y(-h1 - 0.8), col.s2, { size: 12, bg: true });
    if (two) D.label(c, 'v₂ = ' + supTxt(U.sf(M.v2)) + ' m s⁻¹', vp.X((xm + 15.5) / 2), vp.Y(-Math.max(h2, 0.5) - 1.6), col.s2, { size: 12, bg: true });
    D.label(c, 'electron drift drawn with relative speeds; real drift speeds are tiny', vp.w / 2, vp.h - 10, col.muted, { size: 11 });
    if (I === 0) D.label(c, 'I = 0: random motion only, no net drift', vp.w / 2, 16, col.muted, { size: 12, bold: true });
    D.label(c, 'L = ' + U.num(prm.values.L, 4) + ' m', vp.X(15.5), vp.Y(Math.max(h1, h2) + 0.8), col.ink, { size: 12, bg: true, align: 'right' });
    scene = { h1: h1, h2: h2, xm: xm, two: two, top: Math.max(h1, h2) };
    if (ix) ix.paint(c);
  }

  /** canvas text cannot show <sup>: turn "10<sup>−5</sup>" into "10⁻⁵" */
  function supTxt(t) { var m = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '−': '⁻', '-': '⁻' };
    return String(t).replace(/<sup>(.*?)<\/sup>/g, function (a, b) { return b.split('').map(function (ch) { return m[ch] || ch; }).join(''); }).replace(/<[^>]+>/g, ''); }

  /* ---------- plots ---------- */
  function drawPlots() {
    if (!M) return;
    var col = ui.colors(), v = prm.values, Tm = Math.max(1, v.t * 1.5), Lm = Math.max(0.1, v.L * 1.5);
    pQ.draw({ x: [0, Tm], series: [{ fn: function (t) { return v.I * t; }, color: col.s1 }], cursor: v.t, markers: [{ x: v.t, y: M.Q, label: 'Q = ' + U.sf(M.Q) + ' C' }], title: 'gradient = I' });
    pR.draw({ x: [0, Lm], series: [{ fn: function (L) { return M.rho * L / M.A; }, color: col.s3 }], cursor: v.L, markers: [{ x: v.L, y: M.R, label: 'R = ' + U.sf(M.R) + ' Ω' }], title: 'R ∝ L (gradient ρ/A)' });
  }

  /* U.sf treats |x| < 1e-12 as zero, so tiny SI values (charges, masses in kg) are formatted here */
  function sfT(x) {
    if (!isFinite(x) || x === 0 || Math.abs(x) >= 1e-12) return U.sf(x);
    var e = Math.floor(Math.log10(Math.abs(x))), m = Number((x / Math.pow(10, e)).toPrecision(3));
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return m.toPrecision(3).replace('-', '−') + ' × 10<sup>' + String(e).replace('-', '−') + '</sup>';
  }
  /* ---------- live working ---------- */
  function readout() {
    if (!M) return;
    var s3 = U.sf, v = prm.values, e = CI.E_CHARGE;
    R.clear();
    R.head('Charge (9.1)');
    R.eq('Q', 'It = ' + s3(v.I) + ' × ' + U.num(v.t, 4), M.Q, 'C', 'Current is the rate of flow of charge, so charge = current × time (time in seconds).');
    R.eq('number of electrons', 'Q ÷ e = ' + s3(M.Q) + ' ÷ 1.60 × 10<sup>−19</sup>', M.N, '', 'Each electron carries charge e = 1.60 × 10<sup>−19</sup> C, so the number of electrons is Q ÷ e.');
    var qt = v.Qt * 1e-19, ratio = qt / e, isInt = Math.abs(ratio - Math.round(ratio)) < 1e-6;
    R.eq('test charge ÷ e', sfT(qt) + ' ÷ 1.60 × 10<sup>−19</sup> = ' + U.num(ratio, 4), isInt ? 'possible (whole number)' : 'impossible (not a whole number of e)', '', 'Charge is quantised: any charge must be a whole-number multiple of e.');
    R.head('Drift speed: I = Anvq');
    if (byArea.get() === 'd') R.eq('A', 'πd² ÷ 4 = π × (' + s3(M.d) + ')² ÷ 4', M.A, 'm<sup>2</sup>', 'The wire has a circular cross-section: A = πr² = πd²/4 (convert mm to m first).');
    else R.eq('A', U.num(v.A1, 4) + ' mm² × 10<sup>−6</sup>', M.A, 'm<sup>2</sup>', '1 mm² = 10<sup>−6</sup> m², so convert the area to SI units before using it.');
    R.eq('v', 'I ÷ (nAq) = ' + s3(v.I) + ' ÷ (' + s3(M.n) + ' × ' + s3(M.A) + ' × 1.60 × 10<sup>−19</sup>)', M.v1, 'm s<sup>−1</sup>', 'Rearrange I = Anvq: the average drift speed is the current divided by nAq.');
    if (second.get()) {
      R.eq('A₂', 'A × (d₂/d₁)² = ' + s3(M.A) + ' × ' + U.num(v.k2, 3) + '²', M.A2, 'm<sup>2</sup>', 'Area scales with the square of the diameter, so A₂ = A × (d₂/d₁)².');
      R.eq('v₂', 'same I and n ⇒ v₂ = v × A ÷ A₂', M.v2, 'm s<sup>−1</sup>', 'In series the current is the same and n is the same material, so v ∝ 1/A.');
      R.eq('v₂ ÷ v', 'A ÷ A₂ = 1 ÷ (d₂/d₁)²', M.v2 / M.v1, '', 'v ∝ 1/A and A ∝ d², so the speed ratio is 1 ÷ (d₂/d₁)².');
    }
    R.head('Resistance: R = ρL/A');
    R.eq('R', s3(M.rho) + ' × ' + U.num(v.L, 4) + ' ÷ ' + s3(M.A), M.R, 'Ω', 'Resistance of a uniform wire: R = ρL/A (ρ is a property of the material).');
    R.head('p.d., energy and power');
    R.eq('V', 'IR = ' + s3(v.I) + ' × ' + s3(M.R), M.V, 'V', 'From the definition of resistance, the p.d. across the wire is V = IR.');
    R.eq('W', 'VQ = ' + s3(M.V) + ' × ' + s3(M.Q) + ' (energy transferred in time t)', M.W, 'J', 'p.d. is energy transferred per unit charge, so the energy transferred is W = VQ.');
    R.eq('P = VI', s3(M.V) + ' × ' + s3(v.I), M.P, 'W', 'Power is the rate of energy transfer: P = VI.');
    R.eq('P = I²R', s3(v.I) + '² × ' + s3(M.R), v.I * v.I * M.R, 'W', 'Substituting V = IR into P = VI gives P = I²R — the same power.');
    R.eq('P = V²/R', s3(M.V) + '² ÷ ' + s3(M.R), M.V * M.V / M.R, 'W', 'Substituting I = V/R into P = VI gives P = V²/R — the same power again.');
    R.render();
  }

  /* ---------- direct manipulation: drag the wire's edge (thickness) and end (length), tap to type ---------- */
  var scene = null, dragRef = null;
  function locked(k) { var r = prm.rows[k]; return !!(r && r.range.disabled); }
  function decOf(st) { var t = String(st); return t.indexOf('.') < 0 ? 0 : t.length - t.indexOf('.') - 1; }
  function tidy(v, k) { var st = Number(prm.rows[k].spec.step), s2 = Math.pow(10, Math.floor(Math.log10(Math.abs(v) || 1)) - 1); return Math.max(st, s2); }
  function setVal(k, val, step) {
    var sp = prm.rows[k].spec, o = {};
    val = U.clamp(val, Number(sp.min), Number(sp.max));
    if (step) val = Number((Math.round(val / step) * step).toFixed(decOf(step)));
    o[k] = U.clamp(val, Number(sp.min), Number(sp.max));
    if (o[k] === prm.values[k]) return;
    prm.set(o);
    if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged();
    if (ui.syncChips) ui.syncChips();
  }
  function ask(k, x, y, title, sub, quick) {
    var sp = prm.rows[k].spec;
    ui.askNumber({ title: title, sub: sub, value: prm.values[k], min: Number(sp.min), max: Number(sp.max), step: Number(sp.step), decimals: Math.max(decOf(sp.step), 2),
      unit: sp.unit, at: { x: x, y: y }, quick: quick, onInput: function (val) { setVal(k, val); } });
  }
  function areaKey() { return byArea.get() === 'A' ? 'A1' : 'd1'; }
  if (cv.addEventListener) cv.addEventListener('pointerdown', function () { dragRef = null; });
  var ix = SIM.view.interact(cv, {
    handles: function () {
      if (!scene) return [];
      var col = ui.colors(), hs = [], ak = areaKey(), x1 = (0.5 + scene.xm) / 2;
      if (!locked(ak)) hs.push({ id: 'thk', kind: 'thk', x: vp.X(x1 + 1.5), y: vp.Y(scene.h1), color: col.accent });
      if (scene.two && !locked('k2')) hs.push({ id: 'thk2', kind: 'thk2', x: vp.X((scene.xm + 15.5) / 2 + 1.5), y: vp.Y(scene.h2), color: col.accent });
      if (!locked('L')) hs.push({ id: 'L', kind: 'L', x: dragRef && dragRef.id === 'L' ? dragRef.px : vp.X(15.5), y: vp.Y(0), color: col['object-line'] });
      if (!locked('rho')) hs.push({ id: 'rho', kind: 'rho', x: vp.X(x1 - 1.5), y: vp.Y(0), color: col.muted });
      if (!locked('I')) hs.push({ id: 'I', kind: 'I', x: vp.X(4), y: vp.Y(scene.top + 0.8), r: 26, hidden: true });
      if (!locked('n')) hs.push({ id: 'n', kind: 'n', x: vp.X(x1), y: vp.Y(-scene.h1 - 0.8), r: 26, hidden: true });
      return hs;
    },
    onDrag: function (h, x, y) {
      var w = vp.toWorld(x, y);
      if (h.kind === 'thk') {
        // the drawn half-thickness is 1.6 √(d / mm), clamped to 0.5 … 3.4
        var dmm = Math.pow(U.clamp(Math.abs(w[1]), 0.5, 3.4) / 1.6, 2);
        if (areaKey() === 'A1') { var A = Math.PI * dmm * dmm / 4; setVal('A1', A, tidy(A, 'A1')); } else setVal('d1', dmm, tidy(dmm, 'd1'));
      } else if (h.kind === 'thk2') setVal('k2', U.clamp(Math.abs(w[1]), 0.25, 3.8) / scene.h1, 0.05);
      else if (h.kind === 'L') {
        // stretch: every 3 units dragged right doubles L, left halves it
        if (!dragRef || dragRef.id !== 'L') dragRef = { id: 'L', v0: prm.values.L, x0: w[0] };
        dragRef.px = x;
        var L = dragRef.v0 * Math.pow(2, (w[0] - dragRef.x0) / 3); setVal('L', L, tidy(L, 'L'));
        drawScene();
      }
    },
    onDrop: function () { dragRef = null; drawScene(); },
    onTap: function (h, x, y) {
      if (h.kind === 'thk') { if (areaKey() === 'A1') ask('A1', x, y, 'Cross-sectional area A', '1 mm² = 10⁻⁶ m²', [0.245, 0.5, 1, 2]); else ask('d1', x, y, 'Wire diameter d', 'A = πd²/4 — remember to square d.', [0.25, 0.5, 1, 2]); }
      else if (h.kind === 'thk2') ask('k2', x, y, 'Second section: d₂ ÷ d₁', 'Same current: v ∝ 1/A ∝ 1/d².', [0.5, 1, 2]);
      else if (h.kind === 'L') ask('L', x, y, 'Wire length L', 'R = ρL/A: R ∝ L.', [0.5, 1, 1.5, 2]);
      else if (h.kind === 'rho') ask('rho', x, y, 'Resistivity ρ (× 10⁻⁸ Ω m)', 'Copper 1.7, aluminium 2.8, nichrome 112.', [1.7, 2.8, 112]);
      else if (h.kind === 'I') ask('I', x, y, 'Current I', 'Rate of flow of charge: Q = It.', [0.03, 0.5, 1, 2]);
      else if (h.kind === 'n') ask('n', x, y, 'Charge carriers per m³ n (× 10²⁸)', 'Copper: 8.5 × 10²⁸ m⁻³', [8.5]);
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Drag the wire’s top edge to change its thickness · drag its end to change L · tap the wire for ρ, the current arrow for I');

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  update();
  clock.seek(0);
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
