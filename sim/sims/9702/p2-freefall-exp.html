<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, MO = SIM.motion;
  var course = ui.course('9702'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Experiment: determining the acceleration of free fall', g: g, tags: ['9702 2.1.8 Free-fall experiment', '9702 1.3 Errors'] });

  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 18 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 1, onFrame: function () { drawScene(); } });
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var c1 = ui.canvas(plotWrap), c2 = ui.canvas(plotWrap);
  var p1 = new SIM.plot.Plot(c1, {}), p2 = new SIM.plot.Plot(c2, {});
  var tblCard = pg.card('left', 'Results table');
  var tblEl = ui.h('div', { style: 'overflow-x:auto' }); tblCard.appendChild(tblEl);

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var method = ui.select(paramCard, { label: 'Method', value: 'trapdoor', options: [
    { value: 'trapdoor', label: 'Electromagnet release + trapdoor timer (time t for height h)' },
    { value: 'lightgate', label: 'Card falling through a light gate (speed v after falling h)' }] }, update);
  var prm = ui.params(paramCard, [
    { key: 'h0', label: 'Smallest height', sym: 'h<sub>min</sub>', unit: 'm', min: 0.1, max: 1, step: 0.01, value: 0.2 },
    { key: 'h1', label: 'Largest height', sym: 'h<sub>max</sub>', unit: 'm', min: 0.5, max: 2, step: 0.01, value: 1.4 },
    { key: 'N', label: 'Number of heights', sym: 'N', unit: '', min: 4, max: 8, step: 1, value: 6 },
    { key: 'rep', label: 'Repeat readings at each height', sym: 'n', unit: '', min: 1, max: 5, step: 1, value: 3 },
    { key: 'sig', label: 'Random timing error (spread of one reading)', sym: 'σ<sub>t</sub>', unit: 's', min: 0, max: 0.05, step: 0.001, value: 0.002 },
    { key: 'sigG', label: 'Random error in the light-gate time', sym: 'σ<sub>Δt</sub>', unit: 'ms', min: 0, max: 2, step: 0.01, value: 0.02 },
    { key: 'delay', label: 'Systematic: timer keeps running extra (magnet releases late)', sym: 'δ', unit: 's', min: 0, max: 0.1, step: 0.001, value: 0 },
    { key: 'hErr', label: 'Systematic: recorded h − true fall distance', sym: 'e', unit: 'm', min: -0.05, max: 0.05, step: 0.001, value: 0 },
    { key: 'L', label: 'Length of the card', sym: 'L', unit: 'm', min: 0.01, max: 0.1, step: 0.001, value: 0.05 }
  ], update);
  var btnRow = ui.h('div', { class: 'row' }); paramCard.appendChild(btnRow);
  var seed = 13;
  btnRow.appendChild(ui.h('button', { class: 'btn', text: 'Take a new set of readings', onclick: function () { seed = (seed * 16807) % 2147483647; update(); } }));

  ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Trapdoor method, small random error only', m: 'trapdoor', v: { sig: 0.002, delay: 0, hErr: 0, rep: 3 }, note: 'Plot h against t²: a straight line through the origin with gradient g/2.' },
    { name: 'Trapdoor: electromagnet releases 0.02 s late (systematic)', m: 'trapdoor', v: { sig: 0.001, delay: 0.02, hErr: 0, rep: 3 }, note: 'Every time is 0.02 s too long. On the t–√h graph the intercept is 0.02 s and the gradient still gives g.' },
    { name: 'Trapdoor: h measured to the top of the ball (2 cm too large)', m: 'trapdoor', v: { sig: 0.001, delay: 0, hErr: 0.02, rep: 3 }, note: 'h = ½gt² + 0.02: the h–t² line has intercept 0.02 m, but its gradient is still g/2.' },
    { name: 'Hand-held stopwatch: large random error', m: 'trapdoor', v: { sig: 0.05, delay: 0, hErr: 0, rep: 3 }, note: 'Reaction time makes the points scatter: repeat and average, use larger heights.' },
    { name: 'Light gate and card: v² against h', m: 'lightgate', v: { sigG: 0.02, hErr: 0, L: 0.05, rep: 3 }, note: 'v = L ÷ Δt, v² = 2gh: gradient 2g. The intercept is about gL because h was measured to the card’s lower edge.' },
    { name: 'Light gate with a long card (10 cm)', m: 'lightgate', v: { sigG: 0.02, hErr: 0, L: 0.1, rep: 3 }, note: 'L ÷ Δt is the average speed while the card passes, so a longer card shifts the line up (intercept ≈ gL).' }
  ], function (p) { clock.pause(); method.set(p.m, true); prm.set(Object.assign({ h0: 0.2, h1: 1.4, N: 6 }, p.v)); clock.seek(0); });

  ui.notes(noteCard, [
    'Free fall from rest: h = ½gt². Plotting h against t² gives a straight line of gradient <b>g/2</b>, so g = 2 × gradient (not the gradient itself).',
    'A <b>systematic</b> error in h (e.g. measured to the wrong part of the ball) shifts the line: it gives an <b>intercept</b>, not a wrong gradient.',
    'A constant timing delay δ: t = √(2/g)·√h + δ. Plot t against √h: the intercept is δ, the gradient is √(2/g).',
    'Repeating and averaging reduces <b>random</b> error; it does not remove systematic error.',
    'Use a small dense ball so air resistance is negligible (3.2: air resistance reduces the acceleration).',
    'Light gate: v = L ÷ Δt is an average speed over the length of the card.'
  ]);

  var res = null, hs = [];
  function update() {
    var v = prm.values, lg = method.get() === 'lightgate';
    prm.show('sig', !lg); prm.show('delay', !lg); prm.show('sigG', lg); prm.show('L', lg);
    var N = Math.round(v.N), lo = Math.min(v.h0, v.h1), hi = Math.max(v.h0, v.h1);
    hs = []; for (var i = 0; i < N; i++) hs.push(Math.round((lo + (hi - lo) * i / (N - 1)) * 1000) / 1000);
    res = MO.freefallExp({ method: method.get(), hs: hs, g: g, delay: v.delay, hErr: v.hErr, sigma: lg ? v.sigG / 1000 : v.sig, repeats: Math.round(v.rep), L: v.L, seed: seed });
    clock.setDuration(Math.sqrt(2 * hi / g) + 0.3);
    drawScene(); drawPlots(); readout();
  }

  function drawScene() {
    var c, col = ui.colors(), v = prm.values, hi = Math.max(v.h0, v.h1), lg = method.get() === 'lightgate';
    // while a height is dragged the frame stays put, so the handle stays under the pointer
    var top = fitTop != null ? fitTop : hi + 0.35;
    vp.fit(-1.2, 1.6, -0.25, top); c = vp.begin();
    var t = clock.t, tf = Math.sqrt(2 * hi / g), drop = 0.5 * g * Math.min(t, tf) * Math.min(t, tf), yb = hi - drop, real = SIM.scene.real();
    if (real) {
      labBackdrop(c, hi, lg);
      D.label(c, lg ? 'release' : 'electromagnet', vp.X(0.25), vp.Y(hi + 0.13), col.muted, { align: 'left', size: 11 });
    } else {
    // stand
    D.line(c, [vp.P(-0.9, -0.15), vp.P(-0.9, hi + 0.25)], col['object-line'], { width: 4 });
    D.ground(c, vp.X(-1.2), vp.Y(-0.15), vp.X(1.4), vp.Y(-0.15));
    // electromagnet at top
    c.fillStyle = col.surface; c.strokeStyle = col['object-line']; c.lineWidth = 1.5;
    c.fillRect(vp.X(-0.2), vp.Y(hi + 0.2), vp.X(0.2) - vp.X(-0.2), vp.Y(hi + 0.05) - vp.Y(hi + 0.2)); c.strokeRect(vp.X(-0.2), vp.Y(hi + 0.2), vp.X(0.2) - vp.X(-0.2), vp.Y(hi + 0.05) - vp.Y(hi + 0.2));
    D.label(c, lg ? 'release' : 'electromagnet', vp.X(0.25), vp.Y(hi + 0.13), col.muted, { align: 'left', size: 11 });
    D.line(c, [vp.P(-0.9, hi + 0.13), vp.P(-0.2, hi + 0.13)], col['object-line'], { width: 2 });
    }
    if (lg && real) {
      realGate(c, hi, yb, Math.max(v.L, 0.02), t >= tf);
      D.label(c, 'card L', vp.X(0.1), vp.Y(yb + Math.max(v.L, 0.02) / 2), col.s1, { align: 'left', size: 11 });
      D.label(c, 'light gate → timer (Δt)', vp.X(0.45), vp.Y(0), col.muted, { align: 'left', size: 11 });
    } else if (real) {
      var rr0 = Math.max(5, vp.scale * 0.04), open = t >= tf, yReal = hi - 0.5 * g * t * t;
      trapdoor(c, open ? Math.min(1, (t - tf) / 0.12) : 0);
      var ybs = open ? Math.min(vp.Y(-0.15) - rr0, vp.Y(yReal) - rr0) : vp.Y(yb) - rr0;
      SIM.scene.shadow(c, vp.X(0), vp.Y(-0.15), rr0 * 1.1, rr0 * 0.3);
      SIM.scene.ball(c, vp.X(0), ybs, rr0, { kind: 'steel' });
      timerBox(c, hi, Math.min(t, tf).toFixed(3) + ' s', open);
      D.label(c, 'trapdoor → stops timer', vp.X(0.35), vp.Y(0) + 3, col.muted, { align: 'left', size: 11 });
    } else if (lg) {
      // light gate at y = 0, card
      c.fillStyle = col.s1; c.globalAlpha = 0.7;
      var ch = Math.max(v.L, 0.02); c.fillRect(vp.X(-0.06), vp.Y(yb + ch), vp.X(0.06) - vp.X(-0.06), vp.Y(yb) - vp.Y(yb + ch)); c.globalAlpha = 1;
      D.label(c, 'card L', vp.X(0.1), vp.Y(yb + ch / 2), col.s1, { align: 'left', size: 11 });
      c.fillStyle = col.surface; c.fillRect(vp.X(-0.4), vp.Y(0.04), vp.X(-0.15) - vp.X(-0.4), vp.Y(-0.04) - vp.Y(0.04)); c.fillRect(vp.X(0.15), vp.Y(0.04), vp.X(0.4) - vp.X(0.15), vp.Y(-0.04) - vp.Y(0.04));
      D.line(c, [vp.P(-0.15, 0), vp.P(0.15, 0)], col.warn, { dash: [3, 3] });
      D.label(c, 'light gate → timer (Δt)', vp.X(0.45), vp.Y(0), col.muted, { align: 'left', size: 11 });
    } else {
      var r = Math.max(5, vp.scale * 0.04);
      D.particle(c, vp.X(0), vp.Y(yb) - r, r, {});
      c.fillStyle = col.surface; c.fillRect(vp.X(-0.3), vp.Y(0), vp.X(0.3) - vp.X(-0.3), 6);
      D.label(c, 'trapdoor → stops timer', vp.X(0.35), vp.Y(0) + 3, col.muted, { align: 'left', size: 11 });
    }
    // ruler with h
    D.arrow(c, vp.X(0.8), vp.Y(hi), vp.X(0.8), vp.Y(0), col.component, { width: 1.4 });
    D.arrow(c, vp.X(0.8), vp.Y(0), vp.X(0.8), vp.Y(hi), col.component, { width: 1.4 });
    D.label(c, 'h = ' + U.num(hi, 3) + ' m', vp.X(0.85), vp.Y(hi / 2), col.component, { align: 'left', size: 12 });
    D.label(c, 't = ' + Math.min(t, tf).toFixed(3) + ' s (true)', vp.X(0.85), vp.Y(hi / 2) + 18, col.muted, { align: 'left', size: 11 });
    // the heights used in the experiment, as ticks on the ruler
    hs.forEach(function (h) { D.line(c, [[vp.X(0.8) - 7, vp.Y(h)], [vp.X(0.8) + 7, vp.Y(h)]], col.component, { width: 1.4 }); });
    if (hs.length) D.label(c, 'h min = ' + U.num(Math.min(v.h0, v.h1), 3) + ' m', vp.X(0.8) - 10, vp.Y(Math.min(v.h0, v.h1)), col.component, { align: 'right', size: 11 });
    if (ix) ix.paint(c);
  }


  /* ---------- real-life lab props (soft pastel style; drawn only when SIM.scene.real()) ---------- */
  function rrect(c, x, y, w, h, r) {
    if (w < 0) { x += w; w = -w; } if (h < 0) { y += h; h = -h; }
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath(); c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r); c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r); c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function soft(c, fill, x, y, w, h, r) { c.fillStyle = fill; rrect(c, x, y, w, h, r); c.fill(); c.strokeStyle = SIM.scene.dark() ? 'rgba(255,255,255,.14)' : 'rgba(60,70,110,.18)'; c.lineWidth = 1; c.stroke(); }
  function labBackdrop(c, hi, lg) {
    var sh = SIM.scene.shade, dk = SIM.scene.dark(), W = vp.w, H = vp.h, yF = vp.Y(-0.15);
    c.save();
    c.fillStyle = dk ? '#272b44' : '#eef0f8'; c.fillRect(0, 0, W, H);   // lab wall
    c.fillStyle = dk ? 'rgba(255,255,255,.03)' : 'rgba(120,130,190,.06)'; for (var i = 0; i < W; i += 46) c.fillRect(i, 0, 23, yF);
    c.restore();
    SIM.scene.ground(c, 0, W, yF, { kind: 'floor', depth: Math.max(8, H - yF) });
    // retort stand: heavy base, rod, boss and clamp arm
    var metal = dk ? '#7d86a6' : '#c3c9de', xr = vp.X(-0.9);
    c.save();
    soft(c, dk ? '#4a5170' : '#a9b2cf', vp.X(-1.12), yF - 9, vp.X(-0.62) - vp.X(-1.12), 10, 4);
    soft(c, metal, xr - 3, vp.Y(hi + 0.27), 6, yF - 8 - vp.Y(hi + 0.27), 3);
    var ya = vp.Y(hi + 0.13);
    soft(c, metal, xr, ya - 3, vp.X(-0.2) - xr, 6, 3);
    soft(c, dk ? '#5e6788' : '#9aa3c2', xr - 7, ya - 7, 14, 14, 4);
    // electromagnet: iron core with a pastel copper coil
    var x0 = vp.X(-0.2), x1 = vp.X(0.2), yt = vp.Y(hi + 0.2), yb = vp.Y(hi + 0.05), cw = x1 - x0, ch = yb - yt;
    soft(c, dk ? '#6a7090' : '#bfc5d8', x0 + cw * 0.3, yt - 2, cw * 0.4, ch + 6, 3);
    soft(c, dk ? '#a9764e' : '#f0b98a', x0, yt + ch * 0.1, cw, ch * 0.8, 6);
    c.strokeStyle = dk ? 'rgba(255,230,200,.25)' : 'rgba(255,255,255,.55)'; c.lineWidth = 1;
    for (var k = 1; k < 7; k++) { var xx = x0 + cw * k / 7; c.beginPath(); c.moveTo(xx, yt + ch * 0.16); c.lineTo(xx, yt + ch * 0.84); c.stroke(); }
    // wires from the coil to the timer (soft curves)
    var tb = timerRect(hi);
    c.strokeStyle = dk ? '#c98a8a' : '#e7a0a0'; c.lineWidth = 1.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x1, yt + ch * 0.4); c.bezierCurveTo(x1 + 30, yt - 20, tb.x - 30, tb.y + tb.h * 0.3, tb.x, tb.y + tb.h * 0.35); c.stroke();
    c.strokeStyle = dk ? '#8aa3c9' : '#9fb7e0';
    c.beginPath(); c.moveTo(x1, yt + ch * 0.6); c.bezierCurveTo(x1 + 40, yt + 10, tb.x - 40, tb.y + tb.h * 0.8, tb.x, tb.y + tb.h * 0.65); c.stroke();
    // lead from the trapdoor / light gate back to the timer, along the floor and up the right side
    var xe = Math.min(vp.w - 6, vp.X(1.52)), ys = vp.Y(0) + 4;
    c.strokeStyle = dk ? '#9a9fb8' : '#b7bdd3'; c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(vp.X(lg ? 0.4 : 0.36), ys); c.lineTo(xe - 6, ys); c.quadraticCurveTo(xe, ys, xe, ys - 6); c.lineTo(xe, tb.y + tb.h + 4); c.quadraticCurveTo(xe, tb.y + tb.h, xe - 6, tb.y + tb.h); c.lineTo(tb.x + tb.w * 0.8, tb.y + tb.h); c.stroke();
    c.restore();
    if (lg) timerBox(c, hi, 'Δt', false);
  }
  function timerRect(hi) { var w = 78, h = 38, cx = Math.min(vp.w - w / 2 - 14, vp.X(1.2)); return { x: cx - w / 2, y: Math.max(6, vp.Y(hi + 0.2) - h / 2), w: w, h: h }; }
  /** digital timer: shows the (true) running time, or just "Δt" for the light gate */
  function timerBox(c, hi, text, stopped) {
    var r = timerRect(hi), dk = SIM.scene.dark();
    c.save();
    soft(c, dk ? '#3c4262' : '#d9dcec', r.x, r.y, r.w, r.h, 8);
    soft(c, dk ? '#1f3b33' : '#d8f0e2', r.x + 6, r.y + 6, r.w - 12, r.h - 16, 4);
    c.fillStyle = dk ? '#9be3c0' : '#2f6b52'; c.font = '600 13px ui-monospace, Menlo, monospace'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(text, r.x + r.w / 2, r.y + 6 + (r.h - 16) / 2);
    c.fillStyle = stopped ? (dk ? '#e58d8d' : '#e7a0a0') : (dk ? '#7fd1a5' : '#9ad7b4'); c.beginPath(); c.arc(r.x + r.w - 10, r.y + r.h - 5, 2.5, 0, 2 * Math.PI); c.fill();
    c.restore();
  }
  /** trapdoor: two brackets and a flap hinged at its right end; k 0 → 1 swings it down */
  function trapdoor(c, k) {
    var dk = SIM.scene.dark(), y0 = vp.Y(0), xl = vp.X(-0.3), xr = vp.X(0.3), L = xr - xl, wood = dk ? '#8a7258' : '#e9c99e';
    c.save();
    soft(c, dk ? '#5b6282' : '#b9c0d8', vp.X(-0.42), y0, vp.X(-0.3) - vp.X(-0.42), vp.Y(-0.15) - y0, 3);
    soft(c, dk ? '#5b6282' : '#b9c0d8', vp.X(0.3), y0, vp.X(0.42) - vp.X(0.3), vp.Y(-0.15) - y0, 3);
    c.translate(xr, y0 + 3); c.rotate(-1.25 * k);
    soft(c, wood, -L, -3, L, 6, 3);
    c.fillStyle = dk ? '#c9cfe0' : '#8f97b3'; c.beginPath(); c.arc(0, 0, 3, 0, 2 * Math.PI); c.fill();
    c.restore();
  }
  /** light gate (two rounded arms with a soft red beam) on a short stand, and the falling card */
  function realGate(c, hi, yb, ch, passed) {
    var dk = SIM.scene.dark(), y0 = vp.Y(0), body = dk ? '#4f5675' : '#c7cce0';
    c.save();
    soft(c, dk ? '#f2f2f7' : '#ffffff', vp.X(-0.06), vp.Y(yb + ch), vp.X(0.06) - vp.X(-0.06), vp.Y(yb) - vp.Y(yb + ch), 2);   // card
    c.fillStyle = dk ? 'rgba(120,140,220,.5)' : 'rgba(140,160,230,.45)'; c.fillRect(vp.X(-0.06) + 2, vp.Y(yb + ch) + 2, 3, Math.max(0, vp.Y(yb) - vp.Y(yb + ch) - 4));
    soft(c, dk ? '#5b6282' : '#b9c0d8', vp.X(0.24), y0 + 8, 6, vp.Y(-0.15) - y0 - 8, 3);   // stand
    soft(c, body, vp.X(-0.42), y0 - 9, vp.X(-0.15) - vp.X(-0.42), 18, 7);
    soft(c, body, vp.X(0.15), y0 - 9, vp.X(0.42) - vp.X(0.15), 18, 7);
    c.globalAlpha = passed ? 0.35 : 0.8; c.strokeStyle = '#f08a8a'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath(); c.moveTo(vp.X(-0.15), y0); c.lineTo(vp.X(0.15), y0); c.stroke();
    c.globalAlpha = 0.25; c.lineWidth = 7; c.stroke(); c.globalAlpha = 1;
    c.fillStyle = '#f5a3a3'; c.beginPath(); c.arc(vp.X(-0.15) - 3, y0, 3, 0, 2 * Math.PI); c.fill();
    c.restore();
  }

  /* ---------- direct manipulation: drag the release point (h_max) and the lowest ruler tick (h_min), tap to type ---------- */
  var fitTop = null, ix = null;
  function locked(k) { var r = prm.rows[k]; return !!(r && r.range && r.range.disabled); }
  function spec(k) { return prm.rows[k].spec; }
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function setVal(k, val, step) {
    if (locked(k) || !isFinite(val)) return;
    var sp = spec(k), o = {};
    if (step) val = Math.round(val / step) * step;
    o[k] = Number(U.clamp(val, Number(sp.min), Number(sp.max)).toFixed(4));
    if (o[k] !== prm.values[k]) { prm.set(o); touched(); }
  }
  function ask(k, x, y, title, sub, quick, step, dec) {
    if (locked(k)) return;
    var sp = spec(k);
    ui.askNumber({ title: title, sub: sub, value: prm.values[k], min: Number(sp.min), max: Number(sp.max), step: step, decimals: dec, unit: sp.unit, at: { x: x, y: y }, quick: quick,
      onInput: function (val) { setVal(k, val); } });
  }
  // the scene shows max(h0, h1) as the drop height and min(h0, h1) as the lowest tick
  function hiKey() { return prm.values.h1 >= prm.values.h0 ? 'h1' : 'h0'; }
  function loKey() { return hiKey() === 'h1' ? 'h0' : 'h1'; }
  if (cv.addEventListener) ix = SIM.view.interact(cv, {
    handles: function () {
      if (!res) return [];
      var v = prm.values, col = ui.colors(), lg = method.get() === 'lightgate', hi = Math.max(v.h0, v.h1), lo = Math.min(v.h0, v.h1), hsn = [];
      if (!locked(hiKey())) hsn.push({ id: 'hi', x: vp.X(0), y: vp.Y(hi + 0.13), color: col.component });
      if (!locked(loKey())) hsn.push({ id: 'lo', x: vp.X(0.8), y: vp.Y(lo), r: 16, color: col.component });
      var gk = lg ? 'sigG' : 'sig';
      if (!locked(gk)) hsn.push({ id: 'gate', x: vp.X(lg ? -0.27 : -0.15), y: vp.Y(0) + (lg ? 0 : 3), r: 16, color: col.muted });
      if (lg && !locked('L')) hsn.push({ id: 'card', x: vp.X(0), y: vp.Y(hi - 0.5 * g * Math.pow(Math.min(clock.t, Math.sqrt(2 * hi / g)), 2) + Math.max(v.L, 0.02) / 2), r: 16, color: col.s1 });
      return hsn;
    },
    onDrag: function (h, x, y) {
      if (h.id !== 'hi' && h.id !== 'lo') return;
      if (fitTop == null) fitTop = Math.max(prm.values.h0, prm.values.h1) + 0.35;
      clock.pause();
      var wy = vp.toWorld(x, y)[1];
      if (h.id === 'hi') setVal(hiKey(), wy - 0.13, 0.01); else setVal(loKey(), wy, 0.01);
      clock.seek(0);
    },
    onDrop: function () { fitTop = null; drawScene(); },
    onTap: function (h, x, y) {
      var lg = method.get() === 'lightgate';
      if (h.id === 'hi') ask(hiKey(), x, y, 'Largest drop height h<sub>max</sub>', 'Distance fallen from the release point to the ' + (lg ? 'light gate' : 'trapdoor') + '.', [1, 1.4, 2], 0.01, 3);
      else if (h.id === 'lo') ask(loKey(), x, y, 'Smallest drop height h<sub>min</sub>', 'The other heights are spread evenly up to h<sub>max</sub>.', [0.1, 0.2, 0.5], 0.01, 3);
      else if (h.id === 'gate') { if (lg) ask('sigG', x, y, 'Random error in the light-gate time σ<sub>Δt</sub>', 'Spread of one Δt reading, in milliseconds.', [0, 0.02, 0.5, 2], 0.01, 2); else ask('sig', x, y, 'Random timing error σ<sub>t</sub>', 'Spread of one time reading. A hand-held stopwatch is about 0.05 s.', [0, 0.002, 0.01, 0.05], 0.001, 3); }
      else if (h.id === 'card') ask('L', x, y, 'Length of the card L', 'v = L ÷ Δt is the average speed while the card passes the gate.', [0.02, 0.05, 0.1], 0.001, 3);
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Drag the release point to set the largest height · drag the lowest ruler tick to set the smallest · tap the ' + 'trapdoor, light gate or card to type its value');

  function drawPlots() {
    if (!res || res.invalid) return;
    var col = ui.colors(), lg = method.get() === 'lightgate', rows = res.rows;
    if (lg) {
      c2.style.display = 'none';
      var f = res.fitV2, xmax = Math.max.apply(null, rows.map(function (r) { return r.h; })) * 1.1;
      p1.draw({ x: [0, xmax], xLabel: 'h / m', yLabel: 'v² / m² s⁻²', series: f ? [{ fn: function (x) { return f.m * x + f.c; }, color: col.s1 }, { fn: function (x) { return 2 * g * x; }, color: col.component, dash: [4, 4], width: 1.2 }] : [],
        markers: rows.map(function (r) { return { x: r.h, y: r.v2, color: col.s2 }; }), title: 'best fit (solid), ideal 2gh (dashed)' });
    } else {
      c2.style.display = '';
      var fh = res.fitH, ft = res.fitT;
      var t2max = Math.max.apply(null, rows.map(function (r) { return r.t2; })) * 1.1, smax = Math.max.apply(null, rows.map(function (r) { return r.sqrtH; })) * 1.1;
      p1.draw({ x: [0, t2max], xLabel: 't² / s²', yLabel: 'h / m', series: fh ? [{ fn: function (x) { return fh.m * x + fh.c; }, color: col.s1 }, { fn: function (x) { return g / 2 * x; }, color: col.component, dash: [4, 4], width: 1.2 }] : [],
        markers: rows.map(function (r) { return { x: r.t2, y: r.h, color: col.s2 }; }), title: 'best fit (solid), ideal ½gt² (dashed)' });
      p2.draw({ x: [0, smax], xLabel: '√h / m^½', yLabel: 't / s', series: ft ? [{ fn: function (x) { return ft.m * x + ft.c; }, color: col.s3 }, { fn: function (x) { return Math.sqrt(2 / g) * x; }, color: col.component, dash: [4, 4], width: 1.2 }] : [],
        markers: rows.map(function (r) { return { x: r.sqrtH, y: r.t, color: col.s2 }; }), title: 'best fit (solid), ideal √(2/g)·√h (dashed)' });
    }
  }

  function readout() {
    var v = prm.values, lg = method.get() === 'lightgate';
    R.clear();
    if (res.invalid) { R.badge(res.invalid, 'warn').render(); tblEl.innerHTML = ''; return; }
    if (res.warn) R.badge(res.warn, 'warn');
    var pct = function (x) { return U.sf(100 * (x - g) / g, 2) + '%'; };
    if (lg) {
      var f = res.fitV2;
      R.head('Theory: v = L ÷ Δt and v² = 2gh, so the gradient of v² against h is 2g');
      R.eq('gradient', 'best-fit line', f.m, 'm s<sup>−2</sup>', 'Draw the line of best fit through the points and take Δ(v²) ÷ Δh from a large triangle, not from single data points.');
      R.eq('g', 'gradient ÷ 2 = ' + U.sf(f.m, 4) + ' ÷ 2', res.gFromV2, 'm s<sup>−2</sup>', 'From rest, v² = 2gh: compare with y = mx + c, so the gradient is 2g and g = gradient ÷ 2.');
      R.eq('difference from 9.81', '', pct(res.gFromV2), '', 'Percentage difference = (experimental − accepted) ÷ accepted × 100%: a check on accuracy.');
      R.eq('intercept', 'v² when h = 0', f.c, 'm<sup>2</sup> s<sup>−2</sup>', 'A non-zero intercept shows a systematic error: it shifts the line but does not change its gradient.');
      R.eq('compare gL', g + ' × ' + U.num(v.L, 3) + ' (card average-speed effect)', g * v.L, 'm<sup>2</sup> s<sup>−2</sup>', 'L ÷ Δt is the average speed while the card passes, i.e. roughly the speed half a card length lower, so v² is raised by about 2g × L/2 = gL.');
      if (Math.abs(v.hErr) > 1e-9) R.eq('shift from h error', '−2g × e = −2 × ' + g + ' × ' + U.num(v.hErr, 3), -2 * g * v.hErr, 'm<sup>2</sup> s<sup>−2</sup>', 'Every recorded h is too large by e, so the true fall is h − e and v² = 2g(h − e): the line moves down by 2ge.');
    } else {
      var fh = res.fitH, ft = res.fitT;
      R.head('Graph 1: h = ½g t² + c (gradient g/2)');
      R.eq('gradient', 'best-fit line of h against t²', fh.m, 'm s<sup>−2</sup>', 'Plot h on the y-axis and t² on the x-axis; the gradient of the best-fit line is Δh ÷ Δ(t²).');
      R.eq('g', '2 × gradient = 2 × ' + U.sf(fh.m, 4), res.gFromH, 'm s<sup>−2</sup>', 'From rest, h = ½gt²: compare with y = mx, so the gradient is g/2 and g = 2 × gradient.');
      R.eq('difference from 9.81', '', pct(res.gFromH), '', 'Percentage difference = (experimental − accepted) ÷ accepted × 100%: a check on accuracy.');
      R.eq('intercept', 'h when t = 0 (expected: the h error e = ' + U.num(v.hErr, 3) + ' m)', fh.c, 'm', 'A systematic error in h (the same for every reading) moves the whole line up or down: it appears as an intercept.');
      R.head('Graph 2: t = √(2/g)·√h + δ');
      R.eq('gradient', 'best-fit line of t against √h', ft.m, 's m<sup>−½</sup>', 'Rearranging h = ½gt² gives t = √(2/g) × √h, so t against √h is a straight line of gradient √(2/g).');
      R.eq('g', '2 ÷ gradient² = 2 ÷ ' + U.sf(ft.m, 4) + '²', res.gFromT, 'm s<sup>−2</sup>', 'Gradient = √(2/g), so gradient² = 2/g and g = 2 ÷ gradient².');
      R.eq('intercept', 't when h = 0 (expected: delay δ = ' + U.num(v.delay, 3) + ' s)', ft.c, 's', 'A constant delay adds the same δ to every time, so this line is shifted up by δ while its gradient is unchanged.');
      if (v.delay > 0 && Math.abs(v.hErr) < 1e-9) R.badge('A timing delay makes the h–t² graph slightly curved and its gradient wrong; the t–√h graph is straight and its intercept shows the delay', 'warn');
      if (Math.abs(v.hErr) > 1e-9 && v.delay === 0) R.badge('An error in h gives an intercept on the h–t² graph; the gradient (and g) is unaffected', 'ok');
    }
    if (Math.round(v.rep) === 1) R.badge('Single readings: no way to judge the random error. Repeat and average.', 'info');
    R.render();
    var head = lg ? '<th>h / m</th>' + res.rows[0].reps.map(function (x, i) { return '<th>Δt' + (i + 1) + ' / ms</th>'; }).join('') + '<th>mean Δt / ms</th><th>v / m s⁻¹</th><th>v² / m² s⁻²</th>'
      : '<th>h / m</th>' + res.rows[0].reps.map(function (x, i) { return '<th>t' + (i + 1) + ' / s</th>'; }).join('') + '<th>mean t / s</th><th>t² / s²</th>';
    tblEl.innerHTML = '<table class="tbl"><tr>' + head + '</tr>' + res.rows.map(function (r) {
      return '<tr><td>' + r.h.toFixed(3) + '</td>' + r.reps.map(function (x) { return '<td>' + (lg ? (1000 * x).toFixed(2) : x.toFixed(3)) + '</td>'; }).join('') +
        (lg ? '<td>' + (1000 * r.t).toFixed(2) + '</td><td>' + U.sf(r.v) + '</td><td>' + U.sf(r.v2) + '</td>' : '<td>' + r.t.toFixed(3) + '</td><td>' + U.sf(r.t2) + '</td>') + '</tr>';
    }).join('') + '</table>';
  }

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
