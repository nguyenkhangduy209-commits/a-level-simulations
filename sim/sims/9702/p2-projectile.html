<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projectile motion</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/phys-projectile.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, PJ = SIM.proj;
  var pg = ui.page({ title: 'Projectile motion: independent horizontal and vertical components', g: 9.81,
    tags: ['9702 2.1.9 Projectiles', '9702 2.1 suvat & graphs', '9702 3.2.2 air resistance (qualitative)'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 28 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 2, onFrame: function () { drawScene(); drawPlots(); readout(); } });
  ui.legend(sceneCard, [
    { color: 'var(--c-velocity)', label: 'velocity v' }, { color: 'var(--c-s1)', label: 'horizontal component (constant)' },
    { color: 'var(--c-s2)', label: 'vertical component (changes by g each second)' }, { color: 'var(--c-component)', label: 'predicted path / strobe positions' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var pX = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'x / m' });
  var pY = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'y / m' });
  var pVx = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'vₓ / m s⁻¹' });
  var pVy = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'v_y / m s⁻¹ (up +), area = Δy' });

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var launchMode = ui.select(paramCard, { label: 'Launch velocity given as', value: 'polar', options: [
    { value: 'polar', label: 'speed u and angle θ' }, { value: 'comp', label: 'horizontal and vertical components' }] }, function (v) { switchMode(v); });
  var prm = ui.params(paramCard, [
    { key: 'ux', label: 'Horizontal component of launch velocity', sym: 'u<sub>x</sub>', unit: 'm s<sup>−1</sup>', min: 0, max: 50, step: 0.1, value: 17.3, hidden: true },
    { key: 'uy', label: 'Vertical component of launch velocity (up +)', sym: 'u<sub>y</sub>', unit: 'm s<sup>−1</sup>', min: -50, max: 50, step: 0.1, value: 10, hidden: true },
    { key: 'u', label: 'Launch speed', sym: 'u', unit: 'm s<sup>−1</sup>', min: 0, max: 50, step: 0.1, value: 20 },
    { key: 'theta', label: 'Launch angle above horizontal', sym: 'θ', unit: '°', min: -90, max: 90, step: 0.5, value: 30 },
    { key: 'h0', label: 'Launch height', sym: 'h', unit: 'm', min: 0, max: 200, step: 0.1, value: 0 },
    { key: 'yL', label: 'Landing level (height of ground/target)', sym: 'y<sub>L</sub>', unit: 'm', min: -50, max: 100, step: 0.1, value: 0 },
    { key: 'g', label: 'Acceleration of free fall', sym: 'g', unit: 'm s<sup>−2</sup>', min: 1, max: 20, step: 0.01, value: 9.81 },
    { key: 'dt', label: 'Strobe interval', sym: 'Δt', unit: 's', min: 0.05, max: 1, step: 0.05, value: 0.2 },
    { key: 'wx', label: 'Wall distance', sym: 'X', unit: 'm', min: 1, max: 150, step: 0.5, value: 20, hidden: true },
    { key: 'wh', label: 'Wall height (above launch ground)', sym: 'H<sub>w</sub>', unit: 'm', min: 0, max: 60, step: 0.1, value: 4, hidden: true }
  ], update);
  var showComp = ui.toggle(paramCard, { label: 'Show velocity components', value: true }, update);
  var showDrop = ui.toggle(paramCard, { label: 'Also drop a ball from the launch point at t = 0' }, update);
  var showShadow = ui.toggle(paramCard, { label: 'Show “shadows” on the axes (horizontal and vertical motion separately)' }, update);
  var showWall = ui.toggle(paramCard, { label: 'Add a wall (does it clear?)' }, update);
  var drag = ui.select(paramCard, { label: 'Air resistance (qualitative only)', value: '0', options: [
    { value: '0', label: 'None (all calculations)' }, { value: '0.005', label: 'Ghost path: low drag' }, { value: '0.02', label: 'Ghost path: medium drag' }, { value: '0.05', label: 'Ghost path: high drag' }] }, update);

  ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Level ground: u = 20 m s⁻¹ at 30°', values: { u: 20, theta: 30, h0: 0, yL: 0, g: 9.81 }, note: 'Time of flight, maximum height and range from components.' },
    { name: 'Horizontal throw from a 20 m cliff at 15 m s⁻¹', values: { u: 15, theta: 0, h0: 20, yL: 0, g: 9.81 }, note: 'Vertical motion starts from rest: 20 = ½gt². Horizontal speed stays 15 m s⁻¹.' },
    { name: 'Dropped vs thrown horizontally: which lands first?', values: { u: 12, theta: 0, h0: 30, yL: 0, g: 9.81 }, drop: true, note: 'Both land together: vertical motion does not depend on horizontal speed.' },
    { name: 'Ball thrown from 1.5 m at 25 m s⁻¹, 40°', values: { u: 25, theta: 40, h0: 1.5, yL: 0, g: 9.81 }, note: 'Launch height ≠ landing height, so R = u²sin2θ/g does NOT apply. Solve the quadratic in t.' },
    { name: 'Vertical throw: u = 20 m s⁻¹ straight up', values: { u: 20, theta: 90, h0: 0, yL: 0, g: 9.81 }, note: 'At the top v = 0 and a = g (not zero).' },
    { name: 'Complementary angles 30° / 60° give the same range', values: { u: 20, theta: 60, h0: 0, yL: 0, g: 9.81 }, note: 'Compare with the 30° preset: same range, different height and time.' },
    { name: 'Maximum range at 45° (level ground)', values: { u: 20, theta: 45, h0: 0, yL: 0, g: 9.81 }, note: 'Only on level ground and without air resistance.' },
    { name: 'Does the ball clear a 4 m wall 20 m away?', values: { u: 20, theta: 30, h0: 0, yL: 0, g: 9.81, wx: 20, wh: 4 }, wall: true, note: 'Time to reach the wall from the horizontal component, then height from the vertical one.' },
    { name: 'Thrown downwards at 20° below horizontal from 30 m', values: { u: 10, theta: -20, h0: 30, yL: 0, g: 9.81 }, note: 'u_y is negative (downwards) from the start; there is no maximum height above the launch point.' },
    { name: 'Landing on a roof 5 m above the launch point', values: { u: 20, theta: 50, h0: 0, yL: 5, g: 9.81 }, note: 'Two times at y = 5 m: the projectile lands on the way down (larger root).' },
    { name: 'Same throw on the Moon (g = 1.62 m s⁻²)', values: { u: 20, theta: 30, h0: 0, yL: 0, g: 1.62 }, note: 'Horizontal motion unchanged; the vertical motion is slower, so flight time and range are larger.' },
    { name: 'With air resistance (qualitative comparison)', values: { u: 25, theta: 45, h0: 0, yL: 0, g: 9.81 }, drag: '0.02', note: 'Ghost path: lower maximum height, shorter range, steeper descent, horizontal speed decreases. No calculation needed at AS.' }
  ], function (p) {
    showDrop.set(!!p.drop, true); showWall.set(!!p.wall, true); drag.set(p.drag || '0', true);
    clock.pause(); prm.set(p.values, true); syncComponents(); update(); clock.seek(0);
  });

  ui.notes(noteCard, [
    'Resolve the launch velocity first: u<sub>x</sub> = u cos θ, u<sub>y</sub> = u sin θ. Treat the two directions <b>separately</b>; the only shared quantity is time t.',
    'Horizontal: no force, so a<sub>x</sub> = 0 and x = u<sub>x</sub>t. Vertical: a = −g throughout, including at the highest point.',
    'At the highest point only the <b>vertical</b> velocity is zero; the speed there is u cos θ, not 0.',
    'R = u² sin 2θ / g and T = 2u sin θ / g only apply when the projectile lands at its launch height.',
    'The final speed needs both components: v = √(v<sub>x</sub>² + v<sub>y</sub>²); give the direction as an angle below the horizontal.',
    'Air resistance is <b>qualitative only</b> at AS (3.2.2): it lowers the maximum height, shortens the range and makes the descent steeper. All calculations assume none.'
  ]);

  /* ---------- model ---------- */
  function isComp() { return launchMode.get() === 'comp'; }
  function params() {
    var v = prm.values;
    if (isComp()) return { u: Math.hypot(v.ux, v.uy), theta: U.deg(Math.atan2(v.uy, v.ux)), h0: v.h0, yL: v.yL, g: v.g };
    return { u: v.u, theta: v.theta, h0: v.h0, yL: v.yL, g: v.g };
  }
  /** after u, θ change (preset), refresh the component sliders so both modes describe the same launch */
  function syncComponents() {
    var v = prm.values;
    prm.set({ ux: Math.max(0, Number((v.u * Math.cos(U.rad(v.theta))).toFixed(3))), uy: Number((v.u * Math.sin(U.rad(v.theta))).toFixed(3)) }, true);
  }
  function switchMode(mode) {
    var v = prm.values;
    if (mode === 'comp') syncComponents();
    else prm.set({ u: Math.min(50, Number(Math.hypot(v.ux, v.uy).toFixed(3))), theta: Number(U.deg(Math.atan2(v.uy, v.ux)).toFixed(2)) }, true);
    prm.show('ux', mode === 'comp'); prm.show('uy', mode === 'comp');
    prm.show('u', mode !== 'comp'); prm.show('theta', mode !== 'comp');
    update();
  }
  var sol = null, tEnd = 2, ghost = null, view = null;
  function update() {
    var p = params();
    prm.show('wx', showWall.get()); prm.show('wh', showWall.get());
    sol = PJ.solve(p);
    tEnd = sol.land ? sol.land.t : Math.max(0.5, (sol.apex ? sol.apex.t * 2 : 2));
    clock.setDuration(tEnd);
    var k = Number(drag.get());
    ghost = k > 0 ? PJ.dragPath(p, k, 1e-3) : null;
    // view box covering the whole flight (kept fixed while the launch arrow is dragged, so the launch point stays under the finger)
    if (!(view && ix && ix.isDragging())) fitView(p);
    ui.writeHash(prm.values);
    drawScene(); drawPlots(); readout();
  }
  function fitView(p) {
    var xs = [0], ys = [0, p.h0, p.yL];
    for (var i = 0; i <= 120; i++) { var s = sol.stateAt(tEnd * i / 120); xs.push(s.x); ys.push(s.y); }
    if (showWall.get()) { xs.push(prm.values.wx + 1); ys.push(prm.values.wh); }
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var w = Math.max(x1 - x0, (y1 - y0) * 0.6, 5), hgt = Math.max(y1 - y0, 2);
    view = [x0 - w * 0.06, x0 + w * 1.06, y0 - hgt * 0.08, y1 + hgt * 0.14];
    // canvas shape follows the trajectory (true scale keeps angles honest), between 4:3 and 3:1
    var ar = U.clamp((view[1] - view[0]) / (view[3] - view[2]), 4 / 3, 3);
    if (cv.style.aspectRatio !== String(ar)) { cv.style.aspectRatio = String(ar); vp.resize(); }
  }

  /* ---------- scene ---------- */
  function drawScene() {
    if (!sol) return;
    var col = ui.colors(), p = params(), c;
    vp.fit(view[0], view[1], view[2], view[3]); c = vp.begin();
    var t = clock.t, st = sol.stateAt(t);
    // ground at y = 0 with a cliff under the launch point when h0 > 0
    var gx0 = view[0], gx1 = view[1], REAL = SIM.scene.real(), SC = SIM.scene;
    if (REAL) realBackdrop(c, p, t);
    else if (p.h0 > 0) {
      c.save(); c.fillStyle = col.surface; c.fillRect(vp.X(gx0), vp.Y(p.h0), vp.X(0) - vp.X(gx0), vp.Y(Math.min(0, p.yL)) - vp.Y(p.h0)); c.restore();
      D.line(c, [vp.P(gx0, p.h0), vp.P(0, p.h0), vp.P(0, Math.min(0, p.yL))], col['object-line'], { width: 1.6 });
      D.label(c, 'h = ' + U.sf(p.h0) + ' m', vp.X(0) - 6, vp.Y(p.h0 / 2), col.muted, { align: 'right', size: 12, bg: true });
    }
    if (REAL) { if (p.h0 > 0) D.label(c, 'h = ' + U.sf(p.h0) + ' m', vp.X(0) - 6, vp.Y(p.h0 / 2), col.muted, { align: 'right', size: 12, bg: true }); }
    else D.ground(c, vp.X(p.h0 > 0 ? 0 : gx0), vp.Y(0), vp.X(gx1), vp.Y(0));
    if (Math.abs(p.yL) > 1e-9) {
      D.line(c, [vp.P(gx0, p.yL), vp.P(gx1, p.yL)], col.accent, { dash: [6, 5], width: 1.2 });
      D.label(c, 'landing level y = ' + U.sf(p.yL) + ' m', vp.X(gx1) - 4, vp.Y(p.yL) - 9, col.accent, { align: 'right', size: 11 });
    }
    if (showWall.get()) {
      var wx = prm.values.wx, wh = prm.values.wh;
      c.save(); c.fillStyle = col.object; c.strokeStyle = col['object-line']; c.lineWidth = 1.4;
      var wpx = Math.max(4, vp.scale * 0.4);
      if (REAL) { c.restore(); SC.wall(c, vp.X(wx) - Math.max(8, wpx) / 2, vp.Y(wh), Math.max(8, wpx), vp.Y(0) - vp.Y(wh), { kind: 'brick' }); c.save(); }
      else c.fillRect(vp.X(wx) - wpx / 2, vp.Y(wh), wpx, vp.Y(0) - vp.Y(wh)); if (!REAL) c.strokeRect(vp.X(wx) - wpx / 2, vp.Y(wh), wpx, vp.Y(0) - vp.Y(wh)); c.restore();
    }
    // predicted path (dashed) and travelled path (solid)
    var pred = [], done = [];
    for (var i = 0; i <= 200; i++) { var tt = tEnd * i / 200, s = sol.stateAt(tt); pred.push(vp.P(s.x, s.y)); if (tt <= t) done.push(vp.P(s.x, s.y)); }
    done.push(vp.P(st.x, st.y));
    D.line(c, pred, col.component, { dash: [5, 5], width: 1.2 });
    D.line(c, done, col.velocity, { width: 2.2 });
    if (ghost) {
      D.line(c, ghost.map(function (q) { return vp.P(q[1], q[2]); }), col.warn, { dash: [2, 4], width: 2 });
      var gl = ghost[ghost.length - 1];
      D.label(c, 'with air resistance (qualitative)', vp.X(gl[1]), vp.Y(gl[2]) - 14, col.warn, { size: 11, bg: true });
      var gi = 0; while (gi < ghost.length - 1 && ghost[gi][0] < t) gi++;
      D.particle(c, vp.X(ghost[gi][1]), vp.Y(ghost[gi][2]), 5, { fill: col.warn, stroke: col.warn });
    }
    // strobe dots at equal time intervals (equal horizontal spacing!)
    var dts = prm.values.dt;
    for (var k2 = 0; k2 * dts <= t + 1e-9; k2++) {
      var sk = sol.stateAt(k2 * dts);
      c.save(); c.fillStyle = col.component; c.globalAlpha = 0.75; c.beginPath(); c.arc(vp.X(sk.x), vp.Y(sk.y), 3.2, 0, 7); c.fill(); c.restore();
      if (showShadow.get()) {
        c.save(); c.globalAlpha = 0.6; c.fillStyle = col.s1; c.fillRect(vp.X(sk.x) - 1.5, vp.Y(Math.min(0, view[2] + 0.001)) - 10, 3, 8);
        c.fillStyle = col.s2; c.fillRect(vp.X(view[0]) + 4, vp.Y(sk.y) - 1.5, 8, 3); c.restore();
      }
    }
    // apex marker
    if (sol.apex && sol.apex.t <= tEnd) {
      var ax = vp.X(sol.apex.x), ay = vp.Y(sol.apex.H);
      D.line(c, [[ax, ay], [ax, vp.Y(Math.min(0, p.yL))]], col.muted, { dash: [3, 4], width: 1 });
      D.label(c, 'max height ' + U.sf(sol.apex.H) + ' m', ax, ay - 12, col.muted, { size: 11, bg: true });
    }
    if (showDrop.get()) {
      var yd = Math.max(p.yL, p.h0 - 0.5 * p.g * t * t);
      D.particle(c, vp.X(0) - 14, vp.Y(yd), 7, { fill: col.s4 });
      D.line(c, [[vp.X(0) - 14, vp.Y(yd)], [vp.X(st.x), vp.Y(st.y)]], col.s4, { dash: [2, 4], width: 1 });
    }
    // projectile + velocity vector and components
    var px = vp.X(st.x), py = vp.Y(st.y);
    if (REAL) {
      var landed = sol.land && t >= sol.land.t - 1e-6;
      if (!landed && st.speed > 1e-9) SC.motionLines(c, px, py, st.vx, -st.vy, Math.min(45, st.speed * 2), null, 8);
      // the football spins as it flies (turned by the distance from the launch point, so scrubbing is exact)
      SC.ball(c, px, py, 8, { kind: 'football', spin: (st.x >= 0 ? 1 : -1) * Math.hypot(st.x, st.y - p.h0) * vp.scale / 8 });
      if (landed) { if (splashy(p)) SC.impact(c, px, py + 6, 18, 0.35); else SC.dust(c, px, py + 8, 0.35); }
    } else D.particle(c, px, py, 8, { fill: col.velocity, stroke: col['object-line'] });
    var vs = Math.max(Math.abs(sol.ux), Math.abs(sol.uy), Math.abs(sol.uy - p.g * tEnd), 1e-9), kpx = Math.min(90, vp.h * 0.22) / vs;
    if (showComp.get()) {
      if (Math.abs(st.vx) > 1e-9) D.arrow(c, px, py, px + st.vx * kpx, py, col.s1, { label: 'vₓ = ' + U.sf(st.vx), width: 2, ly: 13 });
      if (Math.abs(st.vy) > 1e-9) D.arrow(c, px, py, px, py - st.vy * kpx, col.s2, { label: 'v_y = ' + U.sf(st.vy), width: 2 });
      D.line(c, [[px + st.vx * kpx, py], [px + st.vx * kpx, py - st.vy * kpx], [px, py - st.vy * kpx]], col.component, { dash: [3, 3], width: 1 });
    }
    if (st.speed > 1e-9) D.arrow(c, px, py, px + st.vx * kpx, py - st.vy * kpx, col.velocity, { label: 'v = ' + U.sf(st.speed) + ' m/s', width: 2.6, ly: -13 });
    D.arrow(c, px + 18, py + 12, px + 18, py + 40, col.accel, { label: 'g', width: 1.6, head: 7 });
    if (p.theta !== 0 && t < 1e-9 && p.u > 0) D.arc(c, vp.X(0), vp.Y(p.h0), 30, 0, U.rad(p.theta), col.muted, 'θ');
    if (!sol.land) D.label(c, 'Never reaches the landing level: ' + sol.reason, vp.w / 2, 16, col.warn, { bold: true, size: 12 });
    // launch-velocity arrow u at the launch point (fixed scale UPX px per m/s): drag its tip, tap to type
    var lo = launchPt(), lt = launchTip();
    if (p.u > 1e-9) D.arrow(c, lo.x, lo.y, lt.x, lt.y, col.accent, { width: 2, dash: [6, 4], label: launchDragging ? null : 'u', ly: -12 });
    if (launchDragging) D.label(c, 'u = ' + U.num(p.u, 1) + ' m s⁻¹ at ' + U.num(p.theta, 1) + '°', lt.x, lt.y - 22, col.accent, { bold: true, size: 12, bg: true });
    if (ix) ix.paint(c);
  }

  /* ---------- real-life look: sky, grass or sea, a cliff under a raised launch point, a roof for a raised landing level, a kicker ---------- */
  /** lands in the sea: launched from a cliff at least 8 m above the landing level, landing level not raised */
  function splashy(p) { return p.yL <= 0 && p.h0 - p.yL >= 8; }
  function realBackdrop(c, p, t) {
    var SC = SIM.scene, W = vp.w, H = vp.h, x0 = vp.X(0), base = Math.min(0, p.yL), yb = vp.Y(base);
    SC.sky(c, 0, 0, W, H, { horizon: H });
    if (p.h0 > base + 1e-9) {
      // launch point on the edge of a cliff (or a raised bank); the ground or sea to the right is at the landing level
      var yRight = vp.Y(p.yL > 0 ? 0 : p.yL);
      if (splashy(p)) SC.water(c, x0, yRight, W - x0, H - yRight + 2, t);
      else SC.ground(c, x0, W, yRight, { kind: 'grass', depth: H - yRight + 2 });
      SC.cliff(c, x0, vp.Y(p.h0), H + 2, 'left', -4);
    } else SC.ground(c, 0, W, vp.Y(0), { kind: 'grass', depth: H - vp.Y(0) + 2 });
    if (p.yL > 1e-9 && sol.land) {
      // a building whose flat roof is the landing level: its edge is between where the ball rises past y_L and where it lands
      var ux = sol.ux, uy = sol.uy, disc = uy * uy - 2 * p.g * (p.yL - p.h0);
      var t1 = disc >= 0 ? (uy - Math.sqrt(disc)) / p.g : 0, xa = Math.max(0, ux * t1), xe = xa + 0.6 * (sol.land.x - xa);
      var bx = vp.X(xe), by = vp.Y(p.yL), dk = SC.dark(), col0 = dk ? '#5d5a72' : '#efe2d0';
      c.save(); c.fillStyle = col0; c.strokeStyle = 'rgba(80,70,60,.25)'; c.lineWidth = 1;
      c.beginPath(); if (c.roundRect) c.roundRect(bx, by, W - bx + 4, vp.Y(0) - by, [5, 0, 0, 0]); else c.rect(bx, by, W - bx + 4, vp.Y(0) - by); c.fill(); c.stroke();
      c.fillStyle = SC.shade(col0, dk ? 0.12 : -0.14); c.fillRect(bx - 2, by - 3, W - bx + 6, 5);   // roof edge
      c.fillStyle = dk ? 'rgba(255,240,190,.25)' : 'rgba(150,190,225,.55)';
      for (var wy = by + 12; wy < vp.Y(0) - 16; wy += 24) for (var wx = bx + 12; wx < W - 10; wx += 22) { c.beginPath(); if (c.roundRect) c.roundRect(wx, wy, 10, 13, 3); else c.rect(wx, wy, 10, 13); c.fill(); }
      c.restore();
    }
    // the kicker stands just behind the launch point, only around the moment of the kick
    if (t < 0.3) SC.person(c, x0 - 16, vp.Y(p.h0), Math.max(26, Math.min(44, vp.h * 0.14)), { pose: 'stand', color: '#8fb3e0' });
  }

  /* ---------- plots ---------- */
  function drawPlots() {
    if (!sol) return;
    var col = ui.colors(), T = tEnd, t = clock.t;
    var mk = sol.apex && sol.apex.t <= T ? [{ x: sol.apex.t, y: 0, label: 'top: v_y = 0' }] : [];
    pX.draw({ x: [0, T], series: [{ fn: function (tt) { return sol.stateAt(tt).x; }, color: col.s1 }], cursor: t });
    pY.draw({ x: [0, T], series: [{ fn: function (tt) { return sol.stateAt(tt).y; }, color: col.s2 }], cursor: t,
      hlines: Math.abs(sol.yL) > 1e-9 ? [{ y: sol.yL, label: 'landing level' }] : [] });
    pVx.draw({ x: [0, T], y: [Math.min(0, sol.ux) - 1, Math.max(0, sol.ux) * 1.2 + 1], series: [{ fn: function () { return sol.ux; }, color: col.s1 }], cursor: t });
    pVy.draw({ x: [0, T], series: [{ fn: function (tt) { return sol.stateAt(tt).vy; }, color: col.s2, shade: true }], cursor: t, markers: mk, title: 'gradient = −g' });
  }

  /* ---------- live working ---------- */
  function readout() {
    if (!sol) return;
    var p = params(), s3 = U.sf, t = clock.t, st = sol.stateAt(t);
    R.clear();
    if (isComp()) {
      R.head('1. Launch velocity from its components');
      R.eq('u<sub>x</sub>', 'given (horizontal, constant throughout)', sol.ux, 'm s<sup>−1</sup>', 'No horizontal force acts (air resistance ignored), so the horizontal component never changes.');
      R.eq('u<sub>y</sub>', 'given (vertical, up +)', sol.uy, 'm s<sup>−1</sup>', 'The vertical component is the starting value for the vertical motion, where a = −g.');
      R.eq('u', '√(u<sub>x</sub>² + u<sub>y</sub>²) = √(' + s3(sol.ux) + '² + ' + s3(sol.uy) + '²)', p.u, 'm s<sup>−1</sup>', 'The two components are at right angles, so combine them with Pythagoras.');
      R.eq('θ', 'tan⁻¹(u<sub>y</sub> ÷ u<sub>x</sub>) above horizontal', Math.abs(sol.ux) < 1e-12 ? (sol.uy >= 0 ? '90.0°' : '−90.0°') : U.dp(p.theta, 1) + '°', '', 'The angle above the horizontal from the right-angled triangle of components: tan θ = u_y ÷ u_x.');
    } else {
      R.head('1. Resolve the launch velocity');
      R.eq('u<sub>x</sub>', 'u cos θ = ' + U.num(p.u, 3) + ' × cos ' + U.num(p.theta, 2) + '°', sol.ux, 'm s<sup>−1</sup>', 'Resolve the launch velocity: the horizontal component is the adjacent side, u cos θ.');
      R.eq('u<sub>y</sub>', 'u sin θ = ' + U.num(p.u, 3) + ' × sin ' + U.num(p.theta, 2) + '°', sol.uy, 'm s<sup>−1</sup>', 'The vertical component is the opposite side, u sin θ (negative if thrown downwards).');
    }
    R.head('2. Vertical motion (a = −g, up +)');
    if (sol.apex) {
      R.eq('t<sub>top</sub>', 'v<sub>y</sub> = 0 ⇒ t = u<sub>y</sub> ÷ g = ' + s3(sol.uy) + ' ÷ ' + U.num(p.g, 3), sol.apex.t, 's', 'At the highest point only the vertical velocity is zero: v_y = u_y − gt = 0.');
      R.eq('H<sub>max</sub>', 'h + u<sub>y</sub>² ÷ 2g = ' + s3(p.h0) + ' + ' + s3(sol.uy) + '² ÷ ' + s3(2 * p.g), sol.apex.H, 'm', 'v_y² = u_y² − 2gs with v_y = 0 gives the rise above the launch point; add the launch height.');
    } else R.eq('max height', 'u<sub>y</sub> ≤ 0, so the launch point is the highest point', p.h0, 'm', 'It starts moving horizontally or downwards, so it never rises above the launch point.');
    if (sol.land) {
      var dy = p.yL - p.h0;
      R.eq('time of flight', 'solve ' + s3(dy) + ' = ' + s3(sol.uy) + 't − ½(' + U.num(p.g, 3) + ')t²', sol.land.t, 's', 'Vertical motion only: s = ut + ½at² with s = landing level − launch height and a = −g. Take the positive root.');
      if (sol.levelTime !== null) R.eq('check', 'level ground: T = 2u sin θ ÷ g', sol.levelTime, 's', 'Only when it lands at its launch height: put s = 0 in the vertical equation.');
      R.head('3. Horizontal motion (a = 0)');
      R.eq('range', 'x = u<sub>x</sub>t = ' + s3(sol.ux) + ' × ' + s3(sol.land.t), sol.land.x, 'm', 'Horizontal motion has no acceleration, so distance = constant horizontal speed × time of flight.');
      if (sol.levelRange !== null) R.eq('check', 'level ground: R = u² sin 2θ ÷ g', sol.levelRange, 'm', 'Only for landing at the launch height: R = u_x × T with T = 2u sin θ ÷ g.');
      R.head('4. Velocity on landing');
      R.eq('v<sub>y</sub>', 'u<sub>y</sub> − gt = ' + s3(sol.uy) + ' − ' + U.num(p.g, 3) + ' × ' + s3(sol.land.t), sol.land.vy, 'm s<sup>−1</sup>', 'Vertical velocity on landing from v = u + at with a = −g.');
      R.eq('speed', '√(v<sub>x</sub>² + v<sub>y</sub>²) = √(' + s3(sol.ux) + '² + ' + s3(sol.land.vy) + '²)', sol.land.speed, 'm s<sup>−1</sup>', 'The landing velocity has both components at right angles: combine them with Pythagoras.');
      R.eq('direction', 'tan⁻¹(|v<sub>y</sub>| ÷ v<sub>x</sub>) below horizontal', Math.abs(sol.ux) < 1e-9 ? 'vertical' : U.dp(sol.land.angleBelow, 1) + '°', '', 'The angle below the horizontal from the velocity triangle: tan φ = |v_y| ÷ v_x.');
      R.eq('energy check', '√(u² + 2g(h − y<sub>L</sub>)) (topic 5)', sol.impactSpeedEnergy, 'm s<sup>−1</sup>', 'Conservation of energy, ½mv² = ½mu² + mgΔh, gives the same speed without using the components.');
    } else R.badge('No landing: ' + sol.reason, 'warn');
    if (showWall.get()) {
      var w = PJ.heightAt(sol, prm.values.wx);
      R.head('Wall at X = ' + s3(prm.values.wx) + ' m');
      if (!isFinite(w.t) || (sol.land && w.t > sol.land.t)) R.badge('Lands before reaching the wall', 'info');
      else {
        R.eq('t at wall', 'X ÷ u<sub>x</sub> = ' + s3(prm.values.wx) + ' ÷ ' + s3(sol.ux), w.t, 's', 'Horizontal motion: the time to cover the horizontal distance X at constant speed u_x.');
        R.eq('y at wall', 'h + u<sub>y</sub>t − ½gt²', w.y, 'm', 'Put that time into the vertical equation to find the height when the ball reaches the wall.');
        R.badge(w.y > prm.values.wh ? 'Clears the wall by ' + s3(w.y - prm.values.wh) + ' m' : 'Hits the wall (' + s3(prm.values.wh - w.y) + ' m too low)', w.y > prm.values.wh ? 'ok' : 'warn');
      }
    }
    R.head('At t = ' + t.toFixed(2) + ' s');
    R.eq('x, y', 'position', s3(st.x) + ', ' + s3(st.y), 'm', 'Horizontal: x = u_x t. Vertical: y = h + u_y t − ½gt².');
    R.eq('v<sub>x</sub>, v<sub>y</sub>', 'components', s3(st.vx) + ', ' + s3(st.vy), 'm s<sup>−1</sup>', 'v_x stays equal to u_x; v_y = u_y − gt.');
    R.eq('speed', 'direction ' + U.dp(st.dir, 1) + '° to horizontal', st.speed, 'm s<sup>−1</sup>', 'Speed from Pythagoras; the direction is tan⁻¹(v_y ÷ v_x).');
    R.render();
  }

  /* ---------- direct manipulation: drag the launch arrow's tip (direction = θ, length = u), tap to type ---------- */
  var UPX = 4, launchDragging = false, ix = null;   // UPX: px of arrow per 1 m s⁻¹
  function launchPt() { return { x: vp.X(0), y: vp.Y(params().h0) }; }
  function launchTip() { var p = params(), o = launchPt(), a = U.rad(p.theta); return { x: o.x + Math.cos(a) * p.u * UPX, y: o.y - Math.sin(a) * p.u * UPX }; }
  /** a canvas edit counts as an input change: replay the motion once input settles, refresh the chips */
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function snapAngle(a) { a = Math.round(a); var near = Math.round(a / 15) * 15; return Math.abs(a - near) <= 2 ? near : a; }
  function setFromDrag(x, y) {
    var o = launchPt(), dx = (x - o.x) / UPX, dy = (o.y - y) / UPX;
    if (isComp()) { prm.set({ ux: U.clamp(Math.round(dx * 2) / 2, 0, 50), uy: U.clamp(Math.round(dy * 2) / 2, -50, 50) }); return; }
    var a = SIM.view.screenAngle(o.x, o.y, x, y); if (a > 180) a -= 360;
    prm.set({ u: U.clamp(Math.round(Math.hypot(dx, dy) * 2) / 2, 0, 50), theta: U.clamp(snapAngle(a), -90, 90) });
  }
  ix = SIM.view.interact(cv, {
    handles: function () {
      if (!sol || !view) return [];
      var o = launchPt(), t = launchTip(), col = ui.colors();
      return [{ id: 'tip', x: t.x, y: t.y, color: col.accent }, { id: 'h0', x: o.x, y: o.y, r: 14, color: col.muted }];
    },
    onDrag: function (hd, x, y) { if (hd.id !== 'tip') return; launchDragging = true; clock.pause(); setFromDrag(x, y); touched(); clock.seek(0); },
    onDrop: function (hd) { if (hd.id !== 'tip') return; launchDragging = false; if (isComp()) update(); else { syncComponents(); update(); } },
    onTap: function (hd, x, y) {
      var v = prm.values;
      if (hd.id === 'h0') {
        ui.askNumber({ title: 'Launch height h', sub: 'Height of the launch point above the ground, in metres.', value: v.h0, min: 0, max: 200, step: 0.5, decimals: 2, unit: 'm',
          at: { x: x, y: y }, quick: [0, 1.5, 10, 20], onInput: function (val) { prm.set({ h0: U.clamp(val, 0, 200) }); touched(); } });
      } else if (isComp()) {
        ui.askNumber({ title: 'Horizontal component uₓ', sub: 'Type the horizontal component of the launch velocity.', value: v.ux, min: 0, max: 50, step: 0.5, decimals: 2, unit: 'm s⁻¹',
          at: { x: x, y: y }, quick: [5, 10, 15, 20], onInput: function (val) { prm.set({ ux: U.clamp(val, 0, 50) }); touched(); } });
      } else {
        ui.askNumber({ title: 'Launch speed u', sub: 'Type the launch speed (direction stays ' + U.num(v.theta, 1) + '°).', value: v.u, min: 0, max: 50, step: 0.5, decimals: 2, unit: 'm s⁻¹',
          at: { x: x, y: y }, quick: [10, 15, 20, 25], onInput: function (val) { prm.set({ u: U.clamp(val, 0, 50) }); syncComponents(); touched(); } });
      }
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Drag the dashed u arrow to set launch angle and speed · tap its tip to type u · tap the launch point to type h');

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  var hsh = ui.readHash(), init = {};
  ['u', 'theta', 'h0', 'yL', 'g', 'dt', 'wx', 'wh'].forEach(function (k) { if (typeof hsh[k] === 'number') init[k] = hsh[k]; });
  prm.set(init, true);
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
