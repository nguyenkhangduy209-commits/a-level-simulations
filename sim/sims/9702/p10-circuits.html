    /** a resistor from A to B: rounded body with colour bands; opt.heat 0…1 adds a warm glow; opt.kind 'th' | 'ldr' for sensors */

  /* ---------- layouts (world box 0…16 × 0…9). Each element: [pa, pb] = drawn end at node a, at node b. ---------- */

    parallel: { el: { E1: [[7, 1], [9, 1]], R1: [[5, 7.2], [5, 3.8]], R2: [[9, 7.2], [9, 3.8]], R3: [[13, 7.2], [13, 3.8]] },
      wires: [[[7, 1], [2, 1], [2, 8], [13, 8], [13, 7.2]], [[5, 8], [5, 7.2]], [[9, 8], [9, 7.2]], [[9, 1], [15, 1], [15, 3], [5, 3], [5, 3.8]], [[9, 3], [9, 3.8]], [[13, 3], [13, 3.8]]],
      nodes: { 0: [15, 2], 1: [2, 5.5] } },
    mixed: { el: { E1: [[7, 1], [9, 1]], R1: [[3, 8], [6.5, 8]], R2: [[9, 7.2], [9, 3.8]], R3: [[13, 7.2], [13, 3.8]] },
      wires: [[[7, 1], [2, 1], [2, 8], [3, 8]], [[6.5, 8], [13, 8], [13, 7.2]], [[9, 8], [9, 7.2]], [[9, 1], [15, 1], [15, 3], [9, 3], [9, 3.8]], [[13, 3], [13, 3.8]]],
      nodes: { 0: [15, 2], 1: [2, 5], 2: [7.6, 8] } },
    branches: { el: { E1: [[7, 1], [9, 1]], R1: [[4, 7.5], [7, 7.5]], R2: [[9, 7.5], [12, 7.5]], R3: [[4, 4.5], [7, 4.5]], R4: [[9, 4.5], [12, 4.5]] },
      wires: [[[7, 1], [2, 1], [2, 7.5], [4, 7.5]], [[2, 4.5], [4, 4.5]], [[7, 7.5], [9, 7.5]], [[7, 4.5], [9, 4.5]], [[12, 7.5], [14, 7.5], [14, 1], [9, 1]], [[12, 4.5], [14, 4.5]]],
      nodes: { 0: [14, 3], 1: [2, 6], 2: [8, 7.5], 3: [8, 4.5] } },

      wires: [[[3, 7.4], [3, 8], [13, 8], [13, 6.6]], [[8, 8], [8, 7.4]], [[3, 4.2], [3, 5.0]], [[8, 4.2], [8, 5.0]], [[3, 2.8], [3, 2], [13, 2], [13, 3.6]], [[8, 2.8], [8, 2]]],

  /* ---------- model ---------- */

  function params() {
    var v = prm.values;

  }
  function update() {
    var t = tpl.get();

    meter.el.style.display = t === 'series' ? '' : 'none'; prm.show('Rv', t === 'series' && meter.get());

  }

  /* ---------- drawing ---------- */

  function drawScene() {
    if (!M) return;
    var col = ui.colors(), c, L = col['object-line'], lay = LAYOUT[M.t], sol = M.sol, p = M.p;
    vp.fit(0.6, 16, 0.2, 9.2);
    c = vp.begin();
    function P(q) { return vp.P(q[0], q[1]); }
    function wire(pts) { D.line(c, pts.map(P), L, { width: 2 }); }
    var real = SIM.scene.real(), u = vp.scale, pmax = 0, imax = 0;
    if (real) {
      KIT.bench(c, vp.w, vp.h);
      lay.wires.forEach(function (w) { KIT.wire(c, w.map(P)); });
      if (p.meter && lay.meterWires) lay.meterWires.forEach(function (w) { KIT.wire(c, w.map(P), '#f2a7a7'); });
      if (!sol.error) M.net.elements.forEach(function (e) { if (e.type !== 'E' && e.id !== 'V') pmax = Math.max(pmax, sol.P[e.id] || 0); imax = Math.max(imax, Math.abs(sol.I[e.id] || 0)); });
    } else {
      lay.wires.forEach(wire);
      if (p.meter && lay.meterWires) lay.meterWires.forEach(wire);
    }
    M.net.elements.forEach(function (e) {
      var ends = lay.el[e.id]; if (!ends) return;
      var pa = ends[0], pb = ends[1];
      if (e.id === 'E2' && e.a === 0) { pa = ends[1]; pb = ends[0]; } // reversed cell 2: + end at the bottom

          c.beginPath(); c.moveTo(mx - ux * g + nx * 0.55 * u, my - uy * g + ny * 0.55 * u); c.lineTo(mx - ux * g - nx * 0.55 * u, my - uy * g - ny * 0.55 * u); c.stroke(); // long plate (+) on the a side
          c.lineWidth = 3.5; c.beginPath(); c.moveTo(mx + ux * g + nx * 0.28 * u, my + uy * g + ny * 0.28 * u); c.lineTo(mx + ux * g - nx * 0.28 * u, my + uy * g - ny * 0.28 * u); c.stroke();
          if (e.r > 0) { c.save(); c.setLineDash([4, 3]); c.lineWidth = 1.2; c.strokeStyle = col.muted; var bw = 0.9 * u; c.strokeRect(mx - bw, my - bw, 2 * bw, 2 * bw); c.restore(); }
          labelTxt = U.sf(e.E) + ' V' + (e.r > 0 ? ', r = ' + U.sf(e.r) + ' Ω' : '');
        } else if (e.id === 'V') {

          c.beginPath(); c.arc(mx, my, 0.55 * u, 0, 7); c.fill(); c.stroke(); D.label(c, 'V', mx, my, col.ink, { bold: true });

        } else if (e.R > 1e-9) {
          var hl = Math.min(len * 0.38, 1.1 * u), hw = 0.32 * u;
          D.line(c, [A, [mx - ux * hl, my - uy * hl]], L, { width: 2 }); D.line(c, [[mx + ux * hl, my + uy * hl], B], L, { width: 2 });
          c.beginPath(); c.moveTo(mx - ux * hl + nx * hw, my - uy * hl + ny * hw); c.lineTo(mx + ux * hl + nx * hw, my + uy * hl + ny * hw);

    });
    if (ix) ix.paint(c);

  }

  /** real-life look for one element between screen points A and B; returns the same label text as the diagram */
  function realEl(c, e, A, B, u, sol, pmax, imax) {
    var mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, I = sol.error ? 0 : (sol.I[e.id] || 0), txt;
    if (e.type === 'E') {
      if (e.r > 0) { var bw = 0.9 * u; KIT.casing(c, mx - bw, my - bw, 2 * bw, 2 * bw); }
      KIT.cell(c, A, B, { size: Math.max(11, 0.42 * u) });
      txt = U.sf(e.E) + ' V' + (e.r > 0 ? ', r = ' + U.sf(e.r) + ' Ω' : '');
    } else if (e.id === 'V') {
      KIT.wire(c, [A, B], '#f2a7a7');
      KIT.meter(c, mx, my, Math.max(12, 0.5 * u), 'V', sol.error ? 0 : sol.Vab.V / niceFS(Math.max(M.p.E, 1e-9)));
      txt = U.sf(sol.error ? NaN : sol.Vab.V) + ' V';
    } else if (e.R > 1e-9) {
      KIT.resistor(c, A, B, e.R, { heat: pmax > 0 ? (sol.P[e.id] || 0) / pmax * 0.8 : 0, body: 2.2 * u, thick: Math.max(11, 0.45 * u) });

      var fwd = I * (e.type === 'E' ? -1 : 1) > 0;   // + I: a→b in a resistor, b→a (out of +) in a cell
      KIT.charges(c, fwd ? [A, B] : [B, A], KIT.t() * 80 * Math.abs(I) / imax, null, 16);

  }

  /* ---------- live working ---------- */
  function readout() {
    if (!M) return;
    var s3 = U.sf, p = M.p, sol = M.sol, t = M.t;
    R.clear();
    if (sol.error) { R.badge(sol.error, 'warn').render(); return; }
    var IE = sol.I.E1;
    if (t !== 'twocells') {
      R.head('Combined external resistance');
      var Rx = M.net.Rext, fm = '';
      if (t === 'series') fm = p.meter ? 'R₁ + (R₂ ∥ R<sub>V</sub>) + R₃ = ' + s3(p.R1) + ' + (1/' + s3(p.R2) + ' + 1/' + s3(p.Rv) + ')<sup>−1</sup> + ' + s3(p.R3) : 'R₁ + R₂ + R₃ = ' + s3(p.R1) + ' + ' + s3(p.R2) + ' + ' + s3(p.R3);
      if (t === 'parallel') fm = '(1/R₁ + 1/R₂ + 1/R₃)<sup>−1</sup> = (1/' + s3(p.R1) + ' + 1/' + s3(p.R2) + ' + 1/' + s3(p.R3) + ')<sup>−1</sup>';
      if (t === 'mixed') fm = 'R₁ + (1/R₂ + 1/R₃)<sup>−1</sup> = ' + s3(p.R1) + ' + (1/' + s3(p.R2) + ' + 1/' + s3(p.R3) + ')<sup>−1</sup>';
      if (t === 'branches') fm = '(1/(R₁ + R₂) + 1/(R₃ + R₄))<sup>−1</sup> = (1/' + s3(p.R1 + p.R2) + ' + 1/' + s3(p.R3 + p.R4) + ')<sup>−1</sup>';

  /* ---------- direct manipulation: tap a component (or its label) to type its value ---------- */
  var KEY = { E1: 'E', E2: 'E2', R1: 'R1', R2: 'R2', R3: 'R3', R4: 'R4', V: 'Rv' }, RK = { E1: 'r', E2: 'r2' };

      unit: sp.unit, at: { x: x, y: y }, quick: quick, onInput: function (val) { setVal(k, val); } });

    handles: function () {
      if (!M) return [];
      var col = ui.colors(), lay = LAYOUT[M.t], u = vp.scale, hs = [];
      M.net.elements.forEach(function (e) {
        var ends = lay.el[e.id], k = KEY[e.id]; if (!ends || !k) return;

        if (!locked(k)) hs.push({ id: e.id, kind: 'el', el: e.id, key: k, x: mx, y: my, color: e.type === 'E' ? col.accent : col['object-line'] });
        // the label beside it: a cell's label edits its internal resistance, anything else edits the same value
        var lk = RK[e.id] || k, lx = e.id === 'V' ? mx + 0.8 * u + 24 : vert ? mx + 1.1 * u + 30 : mx, ly = e.id === 'V' ? my : vert ? my : my + (e.type === 'E' ? 1.15 : -0.85) * u;
        if (!locked(lk)) hs.push({ id: e.id + 'lab', kind: 'lab', el: e.id, key: lk, x: lx, y: ly, r: 20, hidden: true });
      });
      return hs;
    },
    onTap: function (h, x, y) {
      var k = h.key, n = NAMES[h.el];

      else if (k === 'r' || k === 'r2') ask(k, x, y, 'Internal resistance of ' + n, '0 makes it an ideal cell.', [0, 0.5, 1, 2]);
      else if (k === 'Rv') ask(k, x, y, 'Voltmeter resistance R<sub>V</sub>', 'An ideal voltmeter has infinite resistance.', [1000, 2000, 10000, 100000]);
      else ask(k, x, y, 'Resistance ' + n, '0 Ω is drawn as a plain wire.', [0, 2, 4, 6, 10]);

    onHover: function () { drawScene(); }

  ui.stageTip('Tap a resistor or cell to type its value · tap a cell’s label to type its internal resistance');

  ui.onTheme(drawScene);

  presetCtl.fromQuery();
})();
