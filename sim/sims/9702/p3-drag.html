<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag and terminal velocity</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/phys-dynamics.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, DY = SIM.dynamics;
  var course = ui.course('9702'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Drag, air resistance and terminal velocity', g: g, tags: ['9702 3.2 Non-uniform motion (qualitative)', '9702 3.1 F = ma, weight'] });

  var sceneCard = pg.card('left');
  var banner = ui.h('div', { class: 'badge warn', html: 'Drag law D = kv or kv²: <b>illustrative model, qualitative only</b>. The shapes of the graphs are what matter; do not copy the model numbers.' });
  sceneCard.appendChild(banner);
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 16 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 20, onFrame: function () { drawScene(); drawPlots(); readout(); } });
  ui.legend(sceneCard, [{ color: 'var(--c-weight)', label: 'weight W = mg' }, { color: 'var(--c-normal)', label: 'upthrust U' }, { color: 'var(--c-friction)', label: 'drag D (opposes motion)' },
    { color: 'var(--c-resultant)', label: 'resultant force' }, { color: 'var(--c-velocity)', label: 'velocity' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var pV = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'v / m s⁻¹ (down +)' }), pA = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'a / m s⁻² (down +)' }),
    pF = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'force / N' });

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var model = ui.select(paramCard, { label: 'Illustrative drag model', value: '2', options: [{ value: '2', label: 'D = k v² (fast motion in air)' }, { value: '1', label: 'D = k v (slow motion in a liquid)' }] }, update);
  var prm = ui.params(paramCard, [
    { key: 'm', label: 'Mass', sym: 'm', unit: 'kg', min: 0.01, max: 150, step: 0.01, value: 0.1 },
    { key: 'U', label: 'Upthrust', sym: 'U', unit: 'N', min: 0, max: 1000, step: 0.01, value: 0 },
    { key: 'k', label: 'Drag constant of the model', sym: 'k', unit: '', min: 0.0001, max: 50, step: 0.0001, value: 0.002 },
    { key: 'v0', label: 'Initial velocity (down +)', sym: 'u', unit: 'm s<sup>−1</sup>', min: -20, max: 60, step: 0.1, value: 0 },
    { key: 'T', label: 'Time shown', sym: 't<sub>max</sub>', unit: 's', min: 1, max: 120, step: 0.5, value: 12 },
    { key: 'to', label: 'Parachute opens at', sym: 't<sub>open</sub>', unit: 's', min: 0.5, max: 100, step: 0.5, value: 20 },
    { key: 'ko', label: 'Drag constant with parachute open', sym: 'k<sub>open</sub>', unit: '', min: 0.01, max: 100, step: 0.01, value: 20 },
    { key: 'Dg', label: 'Drag at an instant (given in the question)', sym: 'D', unit: 'N', min: 0, max: 5000, step: 0.1, value: 1800 },
    { key: 'ag', label: 'Acceleration at an instant (down +, given)', sym: 'a', unit: 'm s<sup>−2</sup>', min: -30, max: 9.81, step: 0.01, value: 1.9 }
  ], update);
  var chute = ui.toggle(paramCard, { label: 'Parachute opens (drag constant increases suddenly)' }, update);
  var inst = ui.select(paramCard, { label: 'Calculation at one instant (exact: F = ma)', value: 'none', options: [{ value: 'none', label: '(none)' },
    { value: 'a', label: 'Given the drag D: find the acceleration' }, { value: 'D', label: 'Given the acceleration: find the drag' }] }, update);

  ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Sphere dropped from rest in air: speeds up to terminal velocity', v: { m: 0.1, U: 0, k: 0.002, v0: 0, T: 12 }, n: '2', chute: false, inst: 'none', note: 'At first D = 0 so a = g. As v rises, D rises, the resultant force falls and a falls to zero: terminal velocity when D = W.' },
    { name: 'Skydiver opens her parachute (9702/22 M/J 24 Q2)', v: { m: 68, U: 0, k: 0.43858, v0: 0, T: 40, to: 20, ko: 20.5319, Dg: 1800 }, n: '2', chute: true, inst: 'a', note: 'Model tuned to the paper’s terminal velocities 39 and 5.7 m s<sup>−1</sup>. With D = 1800 N: a = (667 − 1800) ÷ 68 = −16.7 m s<sup>−2</sup>, i.e. 17 m s<sup>−2</sup> upwards (decelerating). A real parachute opens gradually, so the model’s sudden jump is exaggerated.' },
    { name: 'Diver under water: m 78 kg, upthrust 740 N, drag 950 N', v: { m: 78, U: 740, k: 14.84375, v0: 8, T: 3, Dg: 950 }, n: '2', chute: false, inst: 'a', note: 'a = (765 − 740 − 950) ÷ 78 = −11.9 m s<sup>−2</sup>: 11.9 m s<sup>−2</sup> upwards while still moving down.' },
    { name: 'Resistive force on a 4.0 kg sphere when a = 1.9 m s⁻² (9702/22 O/N 23 Q2)', v: { m: 4, U: 0, k: 0.05, v0: 0, T: 15, ag: 1.9 }, n: '2', chute: false, inst: 'D', note: 'Resultant = ma = 7.6 N; resistive force = mg − ma = 39.24 − 7.6 = 31.6 N.' },
    { name: 'Ball bearing in oil (slow: drag ∝ v, with upthrust)', v: { m: 0.05, U: 0.06, k: 0.5, v0: 0, T: 1 }, n: '1', chute: false, inst: 'none', note: 'At terminal velocity W = U + D. Reaches terminal velocity very quickly.' },
    { name: 'Thrown down faster than terminal velocity: slows down', v: { m: 0.1, U: 0, k: 0.002, v0: 40, T: 10 }, n: '2', chute: false, inst: 'none', note: 'D > W, so the resultant force is upwards and the object decelerates towards the same terminal velocity.' },
    { name: 'Thrown upwards: drag and weight both act downwards on the way up', v: { m: 0.1, U: 0, k: 0.002, v0: -20, T: 8 }, n: '2', chute: false, inst: 'none', note: 'Going up (v < 0 here), a > g in size. After the top, drag reverses and a < g.' },
    { name: 'Upthrust bigger than weight: it does not sink', v: { m: 0.1, U: 1.5, k: 0.002, v0: 0, T: 5 }, n: '2', chute: false, inst: 'none', note: 'U > W: the resultant force is upwards, so the object rises (like a balloon).' }
  ], function (p) { clock.pause(); model.set(p.n, true); chute.set(!!p.chute, true); inst.set(p.inst, true); prm.set(p.v); clock.seek(0); });

  ui.notes(noteCard, [
    'Drag (air resistance) always acts <b>opposite to the velocity</b> and increases as speed increases. It is zero when the object is at rest.',
    'Terminal velocity: the resultant force is zero (D + U = W), so the acceleration is zero and the velocity is constant. It is <b>not</b> zero velocity.',
    'Just after release from rest D = 0, so the initial acceleration is g (or (W − U) ÷ m with upthrust).',
    'On a v–t graph: gradient decreasing to zero. When a parachute opens, D suddenly exceeds W: the skydiver decelerates (resultant force upwards) while still moving down.',
    'In an exam calculation use F = ma with the forces given at that instant: a = (W − U − D) ÷ m. The drag law here is only a model.',
    'With air resistance a projectile reaches a lower height and a shorter range than without it (3.2.2).'
  ]);

  /* ---------- model ---------- */
  var tr = null, vt = null, vt2 = null;
  function update() {
    var v = prm.values, n = Number(model.get());
    prm.show('to', chute.get()); prm.show('ko', chute.get());
    prm.show('Dg', inst.get() === 'a'); prm.show('ag', inst.get() === 'D');
    var unit = n === 1 ? 'kg s<sup>−1</sup>' : 'kg m<sup>−1</sup>';
    prm.label('k', 'Drag constant of the model <span class="sym">k</span> <span class="unit">(' + unit + ')</span>');
    prm.label('ko', 'Drag constant with parachute open <span class="sym">k<sub>open</sub></span> <span class="unit">(' + unit + ')</span>');
    tr = DY.fall({ m: v.m, g: g, U: v.U, k: v.k, n: n, v0: v.v0, open: chute.get() ? { t: v.to, k: v.ko } : null, T: v.T, steps: 1200 });
    vt = DY.terminal(v.m, g, v.U, v.k, n); vt2 = chute.get() ? DY.terminal(v.m, g, v.U, v.ko, n) : null;
    clock.setDuration(v.T);
    drawScene(); drawPlots(); readout();
  }

  /* ---------- scene ---------- */
  function drawScene() {
    if (!tr) return;
    var c, col = ui.colors(), v = prm.values, s = tr.stateAt(clock.t), open = chute.get() && clock.t >= v.to;
    vp.fit(-5, 5, -3, 3); c = vp.begin();
    var cx = vp.X(-1.5), cy = vp.Y(0), real = SIM.scene.real();
    if (real) realFall(c, s, cx, cy, open);
    else {
    // streaks to suggest motion relative to the air
    var sp = Math.abs(s.v), off = (clock.t * 60 * Math.min(1, sp / 20)) % 40;
    c.strokeStyle = col.grid; c.lineWidth = 1;
    for (var i = -1; i < 8; i++) { var yy = vp.Y(3) + i * 40 + (s.v >= 0 ? -off : off); c.beginPath(); c.moveTo(cx - 70, yy); c.lineTo(cx - 70, yy + 18); c.moveTo(cx + 70, yy + 20); c.lineTo(cx + 70, yy + 38); c.stroke(); }
    if (open) { c.strokeStyle = col['object-line']; c.fillStyle = col.surface; c.beginPath(); c.arc(cx, cy - 60, 46, Math.PI, 0); c.fill(); c.stroke(); D.line(c, [[cx - 46, cy - 60], [cx, cy - 12]], col['object-line']); D.line(c, [[cx + 46, cy - 60], [cx, cy - 12]], col['object-line']); }
    D.particle(c, cx, cy, 12, {});
    }
    var mx = Math.max(s.W, s.U, Math.abs(s.D), 1e-9), k = 90 / mx;
    D.arrowPolar(c, cx, cy + 12, -Math.PI / 2, s.W * k, col.weight, { label: 'W = ' + U.sf(s.W).replace(/<[^>]+>/g, '') + ' N' });
    if (s.U > 1e-12) D.arrowPolar(c, cx + 18, cy, Math.PI / 2, s.U * k, col.normal, { label: 'U' });
    if (Math.abs(s.D) > 1e-9 * mx) D.arrowPolar(c, cx - 18, cy, s.D > 0 ? Math.PI / 2 : -Math.PI / 2, Math.abs(s.D) * k, col.friction, { label: 'D' });
    var Fres = s.W - s.U - s.D;
    if (Math.abs(Fres) > 1e-6 * mx) D.arrowPolar(c, vp.X(1.2), cy, Fres > 0 ? -Math.PI / 2 : Math.PI / 2, Math.abs(Fres) * k, col.resultant, { width: 3, label: 'resultant' });
    else D.label(c, 'resultant ≈ 0', vp.X(1.2), cy, col.resultant, { bold: true });
    if (Math.abs(s.v) > 1e-6) D.arrowPolar(c, vp.X(3), cy, s.v > 0 ? -Math.PI / 2 : Math.PI / 2, 20 + Math.min(80, Math.abs(s.v) * 2), col.velocity, { label: 'v' });
    D.label(c, stageText(s), vp.w / 2, vp.h - 12, col.ink, real ? { size: 12, bg: true } : { size: 12 });
    scene = { cx: cx, cy: cy, k: k, s: s, open: open };
    if (ix) ix.paint(c);
  }


  /* ---------- real-life look (soft pastel): sky with clouds or water with bubbles, and the falling object ---------- */
  function wrap(a, m) { return ((a % m) + m) % m; }
  function cloud(c, x, y, w, dk) {
    c.save(); c.fillStyle = dk ? 'rgba(200,205,235,.18)' : 'rgba(255,255,255,.85)';
    [[0, 0, 0.32], [0.3, -0.12, 0.26], [-0.3, 0.02, 0.24], [0.55, 0.06, 0.18], [-0.55, 0.08, 0.16]].forEach(function (b) { c.beginPath(); c.arc(x + b[0] * w, y + b[1] * w, b[2] * w, 0, 2 * Math.PI); c.fill(); });
    c.restore();
  }
  function realFall(c, s, cx, cy, open) {
    var v = prm.values, W = v.m * g, dk = SIM.scene.dark(), n = Number(model.get()), Wd = vp.w, H = vp.h, sh = SIM.scene.shade;
    var liquid = n === 1 || (v.U >= 0.3 * W && v.U < W), balloon = !liquid && v.U >= W;
    var ref = vt !== null && vt > 0 ? vt : 10, kpx = 140 / Math.max(2, ref), dy = (s.x || 0) * kpx;   // background moves up as the object moves down
    if (liquid) {
      c.save();
      var gr = c.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, dk ? '#22385a' : '#cfe8f6'); gr.addColorStop(1, dk ? '#172640' : '#a9d3ec');
      c.fillStyle = gr; c.fillRect(0, 0, Wd, H);
      c.fillStyle = dk ? 'rgba(200,230,255,.05)' : 'rgba(255,255,255,.18)';   // soft light shafts
      for (var r = 0; r < 4; r++) { var x0 = Wd * (0.1 + r * 0.25); c.beginPath(); c.moveTo(x0, 0); c.lineTo(x0 + 40, 0); c.lineTo(x0 - 30, H); c.lineTo(x0 - 60, H); c.closePath(); c.fill(); }
      c.strokeStyle = dk ? 'rgba(210,235,255,.35)' : 'rgba(255,255,255,.85)'; c.lineWidth = 1.2;
      for (var b = 0; b < 26; b++) {
        var bx = wrap(b * 97.3, Wd), by = wrap(b * 53.1 - dy - clock.t * 25, H + 20) - 10, br = 2 + (b % 4);
        c.beginPath(); c.arc(bx, by, br, 0, 2 * Math.PI); c.stroke();
      }
      c.restore();
    } else {
      SIM.scene.sky(c, 0, 0, Wd, H, { horizon: H });
      for (var k = 0; k < 6; k++) cloud(c, wrap(k * 173 + 40, Wd + 120) - 60, wrap(k * 131 - dy, H + 120) - 60, 50 + (k % 3) * 18, dk);
    }
    if (balloon) {
      c.save(); c.strokeStyle = dk ? 'rgba(255,255,255,.4)' : 'rgba(90,90,120,.4)'; c.lineWidth = 1; c.beginPath(); c.moveTo(cx, cy + 16); c.quadraticCurveTo(cx + 6, cy + 30, cx, cy + 44); c.stroke();
      c.fillStyle = dk ? '#c77d95' : '#f5a9bf'; c.beginPath(); if (c.ellipse) c.ellipse(cx, cy, 13, 16, 0, 0, 2 * Math.PI); else c.arc(cx, cy, 14, 0, 2 * Math.PI); c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)'; c.beginPath(); c.arc(cx - 5, cy - 6, 3.5, 0, 2 * Math.PI); c.fill(); c.restore();
      return;
    }
    var big = v.m >= 20;
    if (!liquid && (chute.get() || big)) {
      if (open) {   // canopy unfolds over ~0.6 s after it opens (visual only)
        var kk = U.clamp((clock.t - v.to) / 0.6, 0.15, 1), cw = 50 * kk, top = cy - 70;
        c.save(); c.strokeStyle = dk ? 'rgba(230,230,250,.45)' : 'rgba(90,95,130,.35)'; c.lineWidth = 1;
        [-1, -0.45, 0.45, 1].forEach(function (f) { c.beginPath(); c.moveTo(cx + f * cw, top); c.lineTo(cx + f * 4, cy - 12); c.stroke(); });
        var cols = dk ? ['#c77d95', '#d9b36c', '#7fa6d9'] : ['#f5a9bf', '#f9d98f', '#a9c8f2'];
        for (var p = 0; p < 6; p++) {
          var a0 = Math.PI + p * Math.PI / 6, a1 = a0 + Math.PI / 6;
          c.fillStyle = cols[p % 3]; c.beginPath(); c.moveTo(cx, top); c.arc(cx, top, cw, a0, a1); c.closePath(); c.fill();
        }
        c.strokeStyle = dk ? 'rgba(255,255,255,.25)' : 'rgba(90,95,130,.25)'; c.beginPath(); c.arc(cx, top, cw, Math.PI, 2 * Math.PI); c.stroke();
        c.restore();
        SIM.scene.person(c, cx, cy + 20, 40, { color: '#f4a6b8' });
      } else {   // belly-to-earth free fall: body horizontal
        c.save(); c.translate(cx, cy); c.rotate(-Math.PI / 2); SIM.scene.person(c, 0, 20, 40, { color: '#f4a6b8' }); c.restore();
      }
      return;
    }
    if (liquid && big) { c.save(); c.translate(cx, cy); c.rotate(Math.PI); SIM.scene.person(c, 0, 20, 40, { color: '#8fd3c8' }); c.restore(); return; }   // diver, head first
    SIM.scene.ball(c, cx, cy, 12, { kind: 'steel', spin: (s.x || 0) * 0.5 });
  }

  /* ---------- direct manipulation: tap the object / forces to type, drag the velocity arrow to set u ---------- */
  var scene = null, ix = null;
  function locked(key) { var r = prm.rows[key]; return !!(r && r.range && r.range.disabled); }
  function spec(key) { return prm.rows[key].spec; }
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function setVal(key, val, step) {
    if (locked(key) || !isFinite(val)) return;
    var sp = spec(key), o = {};
    if (step) val = Math.round(val / step) * step;
    o[key] = Number(U.clamp(val, Number(sp.min), Number(sp.max)).toFixed(4));
    if (o[key] !== prm.values[key]) { prm.set(o); touched(); }
  }
  function ask(key, x, y, title, sub, quick, step, dec) {
    if (locked(key)) return;
    var sp = spec(key);
    ui.askNumber({ title: title, sub: sub, value: prm.values[key], min: Number(sp.min), max: Number(sp.max), step: step, decimals: dec === undefined ? 3 : dec, unit: sp.unit, at: { x: x, y: y }, quick: quick,
      onInput: function (val) { setVal(key, val); } });
  }
  /** screen tip of the velocity arrow for velocity v (down +), matching drawScene */
  function vTip(v) { var len = Math.abs(v) > 1e-6 ? 20 + Math.min(80, Math.abs(v) * 2) : 20; return { x: vp.X(3), y: scene.cy + (v >= 0 ? len : -len) }; }
  if (cv.addEventListener) ix = SIM.view.interact(cv, {
    handles: function () {
      if (!scene) return [];
      var col = ui.colors(), s = scene.s, hs = [], instMode = inst.get();
      if (!locked('m')) hs.push({ id: 'm', x: scene.cx, y: scene.cy, r: 16, color: col.weight });
      if (!locked('U')) hs.push({ id: 'U', x: scene.cx + 18, y: scene.cy - Math.max(s.U * scene.k, 24), r: 14, color: col.normal });
      var dk = instMode === 'a' ? 'Dg' : (scene.open ? 'ko' : 'k');
      if (!locked(dk)) hs.push({ id: 'D', key: dk, x: scene.cx - 18, y: scene.cy + (s.D >= 0 ? -1 : 1) * Math.max(Math.abs(s.D) * scene.k, 24), r: 14, color: col.friction });
      if (instMode === 'D' && !locked('ag')) hs.push({ id: 'ag', x: vp.X(1.2), y: scene.cy, r: 16, color: col.resultant });
      if (!locked('v0')) { var t = vTip(s.v); hs.push({ id: 'v0', x: t.x, y: t.y, color: col.velocity }); }
      return hs;
    },
    onDrag: function (h, x, y) {
      if (h.id !== 'v0') return;
      // length of the arrow = 20 + 2|u| px, pointing down for u > 0 (down +)
      var d = y - scene.cy, len = Math.abs(d), u = len <= 20 ? 0 : U.sgn(d) * (len - 20) / 2;
      clock.pause(); setVal('v0', u, 0.5); clock.seek(0);
    },
    onTap: function (h, x, y) {
      if (h.id === 'm') ask('m', x, y, 'Mass of the falling object m', 'Weight W = mg changes with it.', [0.1, 4, 68, 78], 0.01, 3);
      else if (h.id === 'U') ask('U', x, y, 'Upthrust U', 'Upward force from the fluid (0 in air for a dense object).', [0, 0.06, 740], 0.01, 3);
      else if (h.id === 'D') {
        if (h.key === 'Dg') ask('Dg', x, y, 'Drag D at the instant in the question', 'Used for a = (W − U − D) ÷ m.', [0, 950, 1800], 0.1, 2);
        else if (h.key === 'ko') ask('ko', x, y, 'Drag constant with the parachute open k<sub>open</sub>', 'Illustrative model only.', [5, 20], 0.01, 3);
        else ask('k', x, y, 'Drag constant of the model k', 'Illustrative model only: larger k gives a smaller terminal velocity.', [0.002, 0.05, 0.5], 0.0001, 4);
      } else if (h.id === 'ag') ask('ag', x, y, 'Acceleration at the instant (down +)', 'Used for D = W − U − ma.', [0, 1.9, -11.9], 0.01, 2);
      else if (h.id === 'v0') ask('v0', x, y, 'Initial velocity u (down +)', 'Negative = thrown upwards.', [-20, 0, 40], 0.1, 2);
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Tap the object to type its mass · tap the D or U arrow to type it · drag the velocity arrow up or down to set the initial velocity');
  function stageText(s) {
    var mx = Math.max(s.W, s.U, 1e-12), Fres = s.W - s.U - s.D;
    if (Math.abs(Fres) < 2e-3 * mx) return 'Resultant force ≈ 0: (nearly) terminal velocity, a ≈ 0';
    if (s.v > 1e-9 && Fres > 0) return 'Moving down and speeding up: D < W − U, acceleration decreasing';
    if (s.v > 1e-9 && Fres < 0) return 'Moving down but slowing: D > W − U, resultant force upwards';
    if (s.v < -1e-9 && Fres > 0) return 'Moving up and slowing: weight and drag both act downwards';
    if (s.v < -1e-9) return 'Moving up and speeding up: upthrust larger than weight + drag';
    return 'At rest for an instant: no drag';
  }

  /* ---------- plots ---------- */
  function drawPlots() {
    if (!tr) return;
    var col = ui.colors(), v = prm.values, T = v.T, br = chute.get() ? [v.to] : [], hl = [], vl = chute.get() && v.to < T ? [{ x: v.to, label: 'opens' }] : [];
    if (vt !== null) hl.push({ y: vt, label: 'terminal (model)', color: col.muted });
    if (vt2 !== null) hl.push({ y: vt2, label: 'terminal, open (model)', color: col.muted });
    var vs = function (t) { return tr.stateAt(t).v; };
    pV.draw({ x: [0, T], series: [{ fn: vs, color: col.velocity, breaks: br }], cursor: clock.t, hlines: hl, vlines: vl, title: 'illustrative model' });
    pA.draw({ x: [0, T], series: [{ fn: function (t) { return tr.stateAt(t).a; }, color: col.accel, breaks: br }], cursor: clock.t, vlines: vl, hlines: [{ y: g, label: 'g' }], title: 'illustrative model' });
    pF.draw({ x: [0, T], series: [{ fn: function (t) { return tr.stateAt(t).D; }, color: col.friction, breaks: br }, { fn: function () { return v.m * g - v.U; }, color: col.weight, dash: [5, 4] }],
      cursor: clock.t, vlines: vl, title: 'drag D (solid) vs W − U (dashed)' });
  }

  /* ---------- live working ---------- */
  function readout() {
    if (!tr) return;
    var v = prm.values, s = tr.stateAt(clock.t), n = Number(model.get()), ma = 'm s<sup>−2</sup>';
    R.clear();
    R.badge('Down is positive', 'info');
    R.head('Forces (exact, Newton’s second law)');
    R.eq('W', 'mg = ' + U.num(v.m, 4) + ' × ' + g, v.m * g, 'N', 'Weight = mass × acceleration of free fall, acting vertically downwards.');
    R.eq('a just after release', '(W − U) ÷ m = (' + U.sf(v.m * g) + ' − ' + U.num(v.U, 4) + ') ÷ ' + U.num(v.m, 4) + (v.v0 !== 0 ? ' (only if released from rest)' : ''), (v.m * g - v.U) / v.m, ma, 'At the moment of release from rest v = 0, so there is no drag yet: resultant force = W − U and a = F ÷ m.');
    if (v.m * g > v.U) R.eq('drag at terminal velocity', 'resultant = 0 ⇒ D = W − U', v.m * g - v.U, 'N', 'At terminal velocity the acceleration is zero, so the resultant force is zero: the upward forces D + U balance W.');
    else R.badge('Upthrust ≥ weight: the object does not sink, so there is no downward terminal velocity', 'warn');
    if (inst.get() === 'a') {
      var a = DY.accelAt(v.m, g, v.U, v.Dg);
      R.head('At the instant described in the question');
      R.eq('resultant', 'W − U − D = ' + U.sf(v.m * g) + ' − ' + U.num(v.U, 4) + ' − ' + U.num(v.Dg, 4), v.m * g - v.U - v.Dg, 'N', 'Take down as positive: weight acts down; upthrust and drag (on a body moving down) act up, so they are subtracted.');
      R.eq('a', 'resultant ÷ m', a, ma, 'Newton’s second law: a = F ÷ m. A negative value means the acceleration is upwards (the body is slowing down while moving down).');
      R.badge(Math.abs(a) < 1e-9 ? 'a = 0: terminal velocity' : 'Acceleration ' + U.sf(Math.abs(a)) + ' m s⁻² ' + (a > 0 ? 'downwards' : 'upwards'), 'ok');
    } else if (inst.get() === 'D') {
      R.head('At the instant described in the question');
      R.eq('resultant', 'ma = ' + U.num(v.m, 4) + ' × ' + U.num(v.ag, 4), v.m * v.ag, 'N', 'Newton’s second law: the resultant force needed for the given acceleration is F = ma.');
      R.eq('D', 'W − U − ma = ' + U.sf(v.m * g) + ' − ' + U.num(v.U, 4) + ' − ' + U.sf(v.m * v.ag), DY.dragFromAccel(v.m, g, v.U, v.ag), 'N', 'Resultant = W − U − D = ma, so the drag is whatever force is left over: D = W − U − ma.');
      if (DY.dragFromAccel(v.m, g, v.U, v.ag) < 0) R.badge('Negative drag is impossible for an object moving down: check the data', 'warn');
    }
    R.head('Illustrative model, qualitative only (t = ' + clock.t.toFixed(2) + ' s)');
    R.eq('v', 'model', s.v, 'm s<sup>−1</sup>', 'Velocity from the illustrative model at this instant (down +). Only the shape of the v–t graph matters.');
    R.eq('D', n === 1 ? 'k v (model)' : 'k v² (model)', s.D, 'N', 'Drag increases with speed and acts opposite to the velocity. The formula is only a model for this simulation, not a syllabus equation.');
    R.eq('a', '(W − U − D) ÷ m', s.a, ma, 'Newton’s second law with the forces at this instant: as D grows the resultant force, and so a, gets smaller.');
    if (vt !== null) R.eq('terminal velocity', (n === 1 ? '(W − U) ÷ k' : '√((W − U) ÷ k)') + ' (model only)', vt, 'm s<sup>−1</sup>', 'Terminal velocity is reached when D = W − U (zero resultant force). Here the model’s D formula is solved for v.');
    if (vt2 !== null) R.eq('with parachute', 'same with k<sub>open</sub> (model only)', vt2, 'm s<sup>−1</sup>', 'A larger area gives more drag at the same speed, so the forces balance at a much lower terminal velocity.');
    R.badge(stageText(s), 'info');
    R.render();
  }

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
