<script>
(function () {

    function reduced() { return !!(SIM.anim && SIM.anim.reducedMotion && SIM.anim.reducedMotion()); }

    /** charge dots moving along a polyline; phase in px (dots move from the first point towards the last as phase grows) */

    /** work in a frame along A→B: callback(c, len) draws with the axis along +x, centred on the midpoint */

        wire(c, [[-len / 2, 0], [L0, 0]]); wire(c, [[bl / 2, 0], [len / 2, 0]]);

        rrect(c, L0, -d / 2, bl, d, d * 0.3); c.fillStyle = grad(c, 0, -d / 2, 0, d / 2, [[0, '#a8b8ea'], [0.45, '#8fa2df'], [1, '#7486c4']]); c.fill();
        rrect(c, L0, -d / 2, bl * 0.24, d, d * 0.3); c.fillStyle = grad(c, 0, -d / 2, 0, d / 2, [[0, '#ffd59a'], [1, '#f2b46c']]); c.fill();

        c.fillStyle = 'rgba(40,40,70,.7)'; c.font = '700 ' + Math.round(Math.max(9, d * 0.6)) + 'px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle';

    }
    var BAND = ['#5d5a70', '#b88a6a', '#ef8f8f', '#f6b27a', '#f3dc7c', '#8fd3a0', '#8fb6ee', '#c3a2ea', '#b7b7c4', '#fbfbfb'];
    function bandsOf(R) {
      if (!(R > 0) || !isFinite(R)) return null;

    }
    /** a resistor from A to B: rounded body with colour bands; opt.heat 0…1 adds a warm glow; opt.kind 'th' | 'ldr' for sensors */
    function resistor(c, A, B, R, opt) {
      opt = opt || {};
      along(c, A, B, function (c, len) {
        var bl = Math.min(len * 0.62, opt.body || 64), th = opt.thick || 15, h = opt.heat > 0 ? Math.min(1, opt.heat) : 0;

        var base = opt.kind === 'th' ? '#9fd4c2' : opt.kind === 'ldr' ? '#f3e1a6' : '#f0d9b5';
        rrect(c, -bl / 2, -th / 2, bl, th, th / 2); c.fillStyle = grad(c, 0, -th / 2, 0, th / 2, [[0, S.shade(base, 0.35)], [0.5, base], [1, S.shade(base, -0.12)]]); c.fill();
        if (h > 0.02) { c.globalAlpha = 0.5 * h; c.fillStyle = '#ff9f73'; c.fill(); c.globalAlpha = 1; }
        c.strokeStyle = 'rgba(120,90,60,.3)'; c.lineWidth = 1; c.stroke();

          c.fillStyle = '#e7c46a'; c.fillRect(bl * 0.28, -th / 2 + 1, Math.max(2, bl * 0.06), th - 2);   // tolerance band
        } else if (opt.kind === 'ldr') {   // zig-zag track on a round window

    /** a filament lamp at (x, y), radius r; k = 0…1 brightness */
    function bulb(c, x, y, r, k) {
      k = U.clamp(k || 0, 0, 1);

      c.save();
      rrect(c, x - r * 0.5, y + r * 0.6, r, r * 0.65, 3); c.fillStyle = grad(c, x - r * 0.5, 0, x + r * 0.5, 0, [[0, '#c9ccd8'], [0.5, '#eef0f6'], [1, '#b4b8c8']]); c.fill();
      c.beginPath(); c.arc(x, y, r, 0, 2 * Math.PI);
      c.fillStyle = k > 0.02 ? 'rgba(255,' + Math.round(236 - 20 * k) + ',' + Math.round(190 - 80 * k) + ',' + (0.45 + 0.5 * k) + ')' : (dk() ? 'rgba(200,215,240,.25)' : 'rgba(225,235,250,.75)');
      c.fill(); c.strokeStyle = edge(); c.lineWidth = 1; c.stroke();
      c.strokeStyle = k > 0.02 ? 'rgba(255,170,60,' + (0.6 + 0.4 * k) + ')' : 'rgba(120,110,130,.6)'; c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(x - r * 0.35, y + r * 0.6); c.lineTo(x - r * 0.3, y); for (var i = 0; i <= 6; i++) c.lineTo(x - r * 0.3 + i * r * 0.1, y + (i % 2 ? -1 : 1) * r * 0.1); c.lineTo(x + r * 0.35, y + r * 0.6); c.stroke();
      c.fillStyle = 'rgba(255,255,255,.55)'; c.beginPath(); c.arc(x - r * 0.4, y - r * 0.4, r * 0.18, 0, 2 * Math.PI); c.fill();

    }
    /** an analogue dial meter: frac 0…1 of full scale (or −1…1 with centreZero); letter 'A' | 'V' | 'G' */
    function meter(c, x, y, r, letter, frac, centreZero) {
      var f = isFinite(frac) ? (centreZero ? 0.5 + 0.5 * U.clamp(frac, -1, 1) : U.clamp(frac, 0, 1.05)) : 0, d = dk();
      c.save();
      rrect(c, x - r * 1.15, y - r * 1.05, r * 2.3, r * 2.1, r * 0.35); c.fillStyle = grad(c, 0, y - r, 0, y + r, [[0, d ? '#4a5272' : '#e9edf8'], [1, d ? '#3a4160' : '#d6dcef']]); c.fill(); c.strokeStyle = edge(); c.lineWidth = 1; c.stroke();

      c.fillStyle = '#ef8f8f'; c.beginPath(); c.arc(A[0] + Math.cos(a) * L * 0.85, A[1] + Math.sin(a) * L * 0.85 - 5, 4, 0, 2 * Math.PI); c.fill();

    return { t: function () { return T; }, loop: loop, bench: bench, wire: wire, charges: charges, cell: cell, resistor: resistor, bulb: bulb, meter: meter, casing: casing, knife: knife, glow: glow, rrect: rrect, grad: grad, along: along, edge: edge };
  })();
  function niceFS(x) { var a = Math.abs(x); if (!(a > 0) || !isFinite(a)) return 1; var e = Math.pow(10, Math.floor(Math.log10(a))), m = a / e; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * e; }   // meter full-scale

  /* ---------- layout ---------- */

    { color: 'var(--c-s2)', label: 'tangent: gradient dI/dV (NOT 1/R)' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);

  var presetCard = pg.card('right', 'Exam setups');

    { name: 'Metallic conductor at constant temperature (6.0 Ω): Ohm’s law', comp: 'metal', values: { V: 6, R: 6 }, note: 'Straight line through the origin: I ∝ V, R constant.' },
    { name: 'Filament lamp: resistance at 6.0 V is V/I, not 1/gradient', comp: 'lamp', values: { V: 6 }, note: 'R = V/I = 6.0 ÷ 1.6 = 3.75 Ω. The tangent gives 9.4 Ω — wrong quantity.' },

    'Resistance is defined as <b>R = V/I</b> at a point: divide the coordinates. It is <b>not</b> the gradient of the I–V graph (or its reciprocal), unless the graph is a straight line through the origin.',

    'Diode: almost no current in reverse bias; in forward bias, very little until about 0.6 V, then a steep rise.',

  /* ---------- model ---------- */

  /* ---------- scene: measuring circuit ---------- */

    var col = ui.colors(), c, cn = comp.get();

  /** real-life look: the measuring circuit built on a bench with dial meters and a real-looking component */
  function realIV(c, col, cn) {
    var P = function (x, y) { return vp.P(x, y); }, s = vp.scale, cx = vp.X(8), cy = vp.Y(6.5), m = RANGE[cn], f = M.f;
    KIT.bench(c, vp.w, vp.h);
    KIT.wire(c, [P(9, 1.5), P(13, 1.5), P(13, 6.5), P(10.6, 6.5)]); KIT.wire(c, [P(5.4, 6.5), P(3, 6.5), P(3, 1.5), P(7, 1.5)]);
    KIT.wire(c, [P(5.4, 6.5), P(5.4, 8.3), P(7.4, 8.3)], '#f2a7a7'); KIT.wire(c, [P(8.6, 8.3), P(10.6, 8.3), P(10.6, 6.5)], '#b9bccd');

    D.arrow(c, vp.X(6.9), vp.Y(0.6), vp.X(9.1), vp.Y(2.4), '#c9a27a', { head: 7, width: 1.6 });

        c.translate(tx, ty0); c.rotate(-0.55); KIT.rrect(c, -0.55 * s, -0.2 * s, 0.85 * s, 0.4 * s, 0.15 * s); c.fillStyle = '#9fb3e6'; c.fill(); c.strokeStyle = KIT.edge(); c.lineWidth = 1; c.stroke();

  /* ---------- plots ---------- */
  function drawPlots() {

    pIV.draw({ x: [-m, m], y: yr, yLabel: 'I / ' + M.uI, series: series, markers: [{ x: V, y: I * k, label: '(' + U.sf(V) + ', ' + U.sf(I * k) + ')', color: col.accent }], title: cn === 'diode' ? 'current axis clipped at 60 mA' : '' });

    } else if (cn === 'ldr') {

    } else {
      var Rf = function (x) { var i = f(x); return Math.abs(i) > 1e-6 ? x / i : NaN; };

        title: cn === 'lamp' ? 'R rises with |V| (hotter filament)' : cn === 'diode' ? 'forward bias only (axis clipped)' : 'constant R' });
    }
  }

  /* ---------- live working ---------- */
  function readout() {
    if (!M) return;
    var s3 = U.sf, cn = comp.get(), V = M.V, I = M.I, v = prm.values;
    R.clear();
    if (cn !== 'metal') R.badge('Illustrative model: read values as you would from a given exam graph', 'info');
    R.head('Reading the point on the I–V graph');
    R.eq('V', 'p.d. across the component', V, 'V', 'The voltmeter is connected in parallel across the component, so it reads the p.d. across it.');
    R.eq('I', 'current through it (from the curve)', I * M.kI, M.uI, 'The ammeter is in series with the component, so it reads the current through it; on a graph, read I at this V.');
    R.head('Resistance at this point: R = V/I');
    if (Math.abs(V) < 1e-12) R.eq('R', 'V = 0 and I = 0: V/I cannot be evaluated here', '—', '', 'Resistance is defined as R = V/I, which has no value at the origin.');
    else if (Math.abs(I) < 1e-6) R.eq('R', s3(V) + ' V ÷ ' + s3(I) + ' A', 'very large (almost no current)', '', 'R = V/I with a tiny current gives a huge resistance.');
    else R.eq('R', s3(V) + ' ÷ ' + s3(I), V / I, 'Ω', 'Resistance is defined as R = V/I at this point: divide the coordinates, do not use the gradient.');

    }

  /* ---------- direct manipulation: slide the supply knob or the point on the I–V graph, tap meters / component to type ---------- */
  var KNOB = { x0: 4.6, x1: 11.4, xc: 8, y: 3.4 };
  function knobX() { var m = RANGE[comp.get()]; return KNOB.xc + (KNOB.x1 - KNOB.xc) * U.clamp(prm.values.V / m, -1, 1); }
  function locked(k) { var r = prm.rows[k]; return !!(r && r.range.disabled); }
  function decOf(st) { var t = String(st); return t.indexOf('.') < 0 ? 0 : t.length - t.indexOf('.') - 1; }
  function vStep() { return RANGE[comp.get()] <= 1 ? 0.005 : 0.05; }
  function setVal(k, val, step) {

    if (step) val = Number((Math.round(val / step) * step).toFixed(decOf(step)));

    prm.set(o);
    if (ui.syncChips) ui.syncChips();
  }

      unit: sp.unit, at: { canvas: canvas, x: x, y: y }, quick: quick, onInput: function (val) { setVal(k, val); } });
  }
  function askV(x, y, canvas) { var m = RANGE[comp.get()]; ask('V', x, y, 'p.d. across the component V', 'Negative values reverse the supply.', m <= 1 ? [-0.5, 0, 0.6, 0.7] : [-m / 2, 0, m / 2, m], canvas); }
  var COMPKEY = { metal: ['R', 'Resistance R', 'Constant at constant temperature (ohmic).', [2, 6, 10, 50]], thermistor: ['T', 'Temperature of the thermistor T', 'NTC: higher temperature ⇒ lower resistance.', [0, 25, 50, 80]],
    ldr: ['Lx', 'Light intensity on the LDR', 'Brighter light ⇒ lower resistance.', [2, 20, 50, 90]] };
  var ix = SIM.view.interact(cv, {
    handles: function () {
      if (!M) return [];
      var col = ui.colors(), hs = [], ck = COMPKEY[comp.get()];
      if (!locked('V')) {
        hs.push({ id: 'knob', kind: 'knob', x: vp.X(knobX()), y: vp.Y(KNOB.y), color: col.accent });
        hs.push({ id: 'vm', kind: 'vm', x: vp.X(8), y: vp.Y(8.3), color: col.applied });
      }
      if (ck && !locked(ck[0])) hs.push({ id: 'comp', kind: 'comp', x: vp.X(8), y: vp.Y(6.5), r: 28, color: col['object-line'] });
      return hs;
    },
    onDrag: function (h, x) {
      if (h.kind !== 'knob') return;
      var m = RANGE[comp.get()], wx = vp.toWorld(x, 0)[0];
      setVal('V', (wx - KNOB.xc) / (KNOB.x1 - KNOB.xc) * m, vStep());
    },
    onTap: function (h, x, y) {
      if (h.kind === 'knob' || h.kind === 'vm') askV(x, y);
      else if (h.kind === 'comp') { var ck = COMPKEY[comp.get()]; if (ck) ask(ck[0], x, y, ck[1], ck[2], ck[3]); }
    },
    onHover: function () { drawScene(); }
  });
  // the same point can be slid along the characteristic on the I–V graph
  // pointer px → plot px (the plot's drawing size can lag its on-screen size until its next resize)
  function plotK() { var r = pIV.canvas.getBoundingClientRect ? pIV.canvas.getBoundingClientRect() : null; return r && r.width > 0 && pIV.w > 0 ? r.width / pIV.w : 1; }
  function plotPt() { var b = pIV.box; return [pIV.px(M.V), U.clamp(pIV.py(M.I * M.kI), b.T, b.T + b.H)]; }
  var ixP = SIM.view.interact(pIV.canvas, {
    handles: function () {
      if (!M || locked('V') || !pIV.px || !pIV.box) return [];
      var p = plotPt(), k = plotK();
      return [{ id: 'pt', x: p[0] * k, y: p[1] * k }];
    },
    onDrag: function (h, x) { var b = pIV.box, m = RANGE[comp.get()]; setVal('V', -m + (x / plotK() - b.L) / b.W * 2 * m, vStep()); },
    onTap: function (h, x, y) { askV(x, y, pIV.canvas); },
    onHover: function () { drawPlots(); }
  });
  /** grab ring on the plot point, drawn in the plot's own coordinates */
  function paintPlotHandle() {
    if (!M || locked('V') || !pIV.px || !pIV.box) return;
    var c = pIV.ctx, p = plotPt(), on = ixP && ixP.isDragging();
    c.save(); c.strokeStyle = ui.colors().accent; c.lineWidth = on ? 2.5 : 1.5; c.globalAlpha = on ? 0.95 : 0.6; if (!on) c.setLineDash([3, 3]);
    c.beginPath(); c.arc(p[0], p[1], on ? 14 : 10, 0, Math.PI * 2); c.stroke(); c.restore();
  }
  function tip() { ui.stageTip('Slide the supply knob to change V · tap the voltmeter to type V' + (COMPKEY[comp.get()] ? ' · tap the component to change it' : '') + ' · or drag the point on the I–V graph'); }

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  setRange();
  update();
  presetCtl.fromQuery();
})();
</script>
