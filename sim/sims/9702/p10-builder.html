<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit builder</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../engine/phys-circuits.js"></script>
<script src="../../engine/phys-circuit-builder.js"></script>
<style>
  .cb-hint { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
  .cb-pal { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cb-tool { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 58px; min-height: 54px; padding: 4px 6px;
    border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: 600 11px var(--sans); cursor: pointer; touch-action: manipulation; }
  .cb-tool svg { width: 40px; height: 28px; overflow: visible; }
  .cb-tool:hover { border-color: var(--accent); }
  .cb-tool.on { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--glow); }
  .cb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .cb-tbl { overflow-x: auto; }
  .cb-tbl td.txt { white-space: nowrap; }
  .cb-tbl tr.sel td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .cb-tbl tr.bad td:first-child { color: var(--warn); }

  /* Tinkercad workbench controls & floating inspector */
  .tk-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: 700 12px var(--sans); cursor: pointer; transition: .12s; }
  .tk-btn:hover { border-color: var(--accent); }
  .tk-btn.sim-on { background: linear-gradient(135deg, #22c55e, #10b981); color: #052e16; border-color: transparent; box-shadow: 0 4px 16px rgba(34,197,94,.28); }
  .tk-btn.sim-off { background: color-mix(in srgb, var(--panel2) 90%, transparent); color: var(--ink); }
  .tk-btn.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--panel2)); color: var(--accent); }
  .tk-swatches { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel2); }
  .tk-swatch { width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; transition: transform .12s; }
  .tk-swatch:hover { transform: scale(1.15); }
  .tk-swatch.on { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
  .tk-dmm-modes { display: inline-flex; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); background: var(--panel2); }
  .tk-dmm-modes button { border: 0; background: transparent; color: var(--muted); font: 800 11.5px var(--sans); padding: 5px 10px; cursor: pointer; }
  .tk-dmm-modes button.on { background: #eab308; color: #1a1204; }

  .tk-inspector {
    position: absolute; top: 64px; right: 14px; z-index: 16; width: 256px; max-width: calc(100% - 28px);
    padding: 12px 13px; border-radius: 16px; border: 1.5px solid color-mix(in srgb, var(--accent) 40%, var(--line));
    background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 14px 36px rgba(0,0,0,.38); color: var(--ink); font-family: var(--sans);
  }
  .tk-inspector[hidden] { display: none; }
  .tk-ins-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
  .tk-ins-title { font: 800 13.5px var(--sans); }
  .tk-ins-sub { font-size: 11px; color: var(--muted); }
  .tk-ins-row { display: flex; gap: 6px; align-items: center; margin-top: 8px; }
  .tk-ins-row input, .tk-ins-row select {
    padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: 700 13px var(--sans);
  }
  .tk-bands { display: flex; align-items: center; gap: 5px; margin-top: 8px; padding: 6px 9px; border-radius: 10px; background: color-mix(in srgb, var(--panel2) 80%, transparent); border: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  .tk-band-dot { width: 10px; height: 18px; border-radius: 3px; border: 1px solid rgba(255,255,255,.22); flex-shrink: 0; }
  .tk-ins-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tk-ins-actions button { flex: 1 1 auto; min-height: 30px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2); color: var(--ink); font: 700 11.5px var(--sans); cursor: pointer; padding: 4px 8px; }
  .tk-ins-actions button:hover { border-color: var(--accent); }
  .tk-ins-actions button.is-x { background: linear-gradient(135deg, #facc15, #2dd4bf); color: #05110f; border-color: transparent; font-weight: 800; }
  .tk-ins-actions button.danger:hover { border-color: var(--warn); color: var(--warn); }
</style>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, CB = SIM.cbuild, TY = CB.TYPES, W = CB.W, H = CB.H, s3 = U.sf;
  var pg = ui.page({ title: 'Circuit builder: build it, solve it, explain it',
    tags: ['9702 9 Electricity', '9702 10.1 symbols, e.m.f. and internal resistance', '9702 10.2 Kirchhoff’s laws', '9702 10.3 potential dividers'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var narrow = (typeof innerWidth === 'number' ? innerWidth : 1200) < 720;
  var cv = ui.canvas(sceneCard, narrow ? 'tall-canvas' : 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 6 });
  ui.legend(sceneCard, [{ color: 'var(--c-applied)', label: 'conventional current (brighter wire = larger current)' }, { color: 'var(--c-s1)', label: 'p.d. across a part' },
    { color: 'var(--accent)', label: 'selected part' }, { color: 'var(--warn)', label: 'something to fix' }]);
  sceneCard.appendChild(ui.h('p', { class: 'cb-hint', html: '<b>Free draw:</b> drag anywhere to draw wires or place a part at any angle (snaps gently to nearby ends & wires). <b>Change a part:</b> tap it, or drag its ends to move.' }));
  var pal = ui.h('div', { class: 'cb-pal', role: 'toolbar', 'aria-label': 'Circuit parts' });
  sceneCard.appendChild(pal);
  var viewRow = ui.h('div', { class: 'cb-row' }); sceneCard.appendChild(viewRow);
  var simRunning = true, showBreadboard = true, dmmOn = false, dmmMode = 'V', wireCol = '#ef4444';
  var WIRE_COLORS = [
    { name: 'Red', hex: '#ef4444' },
    { name: 'Black', hex: '#475569' },
    { name: 'Green', hex: '#22c55e' },
    { name: 'Yellow', hex: '#eab308' },
    { name: 'Blue', hex: '#3b82f6' },
    { name: 'Orange', hex: '#f97316' },
    { name: 'Purple', hex: '#a855f7' }
  ];
  var simBtn = ui.h('button', { type: 'button', class: 'tk-btn sim-on', text: '⏹ Stop Simulation',
    title: 'Toggle live Tinkercad circuit simulation & current flow animation',
    onclick: function () {
      simRunning = !simRunning;
      simBtn.className = 'tk-btn ' + (simRunning ? 'sim-on' : 'sim-off');
      simBtn.textContent = simRunning ? '⏹ Stop Simulation' : '▶ Start Simulation';
      if (simRunning) startAnim();
      drawScene();
    }
  });
  var bbBtn = ui.h('button', { type: 'button', class: 'tk-btn on', text: '🟩 Breadboard',
    title: 'Show solderless breadboard rails & green node connectivity on hover',
    onclick: function () { showBreadboard = !showBreadboard; bbBtn.classList.toggle('on', showBreadboard); drawScene(); }
  });
  var dmmBtn = ui.h('button', { type: 'button', class: 'tk-btn', text: '📟 Multimeter Probe',
    title: 'Place draggable Digital Multimeter with + / − probes on the circuit',
    onclick: function () { dmmOn = !dmmOn; dmmBtn.classList.toggle('on', dmmOn); dmmModeWrap.hidden = !dmmOn; drawScene(); }
  });
  var dmmModeWrap = ui.h('div', { class: 'tk-dmm-modes', hidden: true });
  ['V', 'A', 'Ω'].forEach(function (md) {
    var b = ui.h('button', { type: 'button', text: md, class: md === dmmMode ? 'on' : '',
      onclick: function () {
        dmmMode = md;
        Array.prototype.forEach.call(dmmModeWrap.children, function (c, idx) { c.classList.toggle('on', ['V', 'A', 'Ω'][idx] === dmmMode); });
        drawScene();
      }
    });
    dmmModeWrap.appendChild(b);
  });
  var swWrap = ui.h('div', { class: 'tk-swatches', title: 'Wire color' });
  swWrap.appendChild(ui.h('span', { text: 'Wire:', style: 'font:700 11px var(--sans);color:var(--muted);margin-right:2px' }));
  WIRE_COLORS.forEach(function (wc) {
    var sw = ui.h('button', { type: 'button', class: 'tk-swatch' + (wc.hex === wireCol ? ' on' : ''), title: wc.name + ' wire',
      style: 'background:' + wc.hex,
      onclick: function () {
        wireCol = wc.hex;
        Array.prototype.forEach.call(swWrap.querySelectorAll('.tk-swatch'), function (el) { el.classList.remove('on'); });
        sw.classList.add('on');
        if (sel && sel.t === 'wire') { pushUndo(); sel.col = wireCol; update(); }
        renderInspector();
      }
    });
    swWrap.appendChild(sw);
  });
  viewRow.appendChild(simBtn);
  viewRow.appendChild(bbBtn);
  viewRow.appendChild(dmmBtn);
  viewRow.appendChild(dmmModeWrap);
  viewRow.appendChild(swWrap);
  var showIV = ui.toggle(viewRow, { label: 'Show I and V beside each part', value: true }, function () { drawScene(); });
  var freeMode = ui.toggle(viewRow, { label: 'Free draw (anywhere, not locked to grid)', value: true }, function () { drawScene(); });

  /* Floating Tinkercad Component Inspector Card inside the stage */
  var stageHost = cv.parentElement || sceneCard;
  var inspector = ui.h('div', { class: 'tk-inspector', id: 'cbInspector', hidden: true });
  stageHost.appendChild(inspector);

  var presetCard = pg.card('right', 'Ready-made circuits');
  var envCard = pg.card('right', 'Thermistor and LDR');
  var tableCard = pg.card('right', 'Every component');
  var outCard = pg.card('right', 'How to calculate it');
  var noteCard = pg.card('right', 'Tips and common mistakes');

  var envNote = ui.h('p', { class: 'cb-hint', style: 'margin-top:0' }); envCard.appendChild(envNote);
  var prm = ui.params(envCard, [
    { key: 'T', label: 'Temperature of the thermistor', sym: 'T', unit: '°C', min: -10, max: 100, step: 0.5, value: 25 },
    { key: 'L', label: 'Light intensity on the LDR (arbitrary units)', sym: 'light', unit: 'a.u.', min: 0, max: 100, step: 0.5, value: 20 }
  ], function () { update(); });
  var tbl = ui.h('div', { class: 'cb-tbl' }); tableCard.appendChild(tbl);
  var methodSel = ui.select(outCard, { label: 'Method', value: 'auto', options: [{ value: 'auto', label: 'Simplest (series and parallel where possible)' }, { value: 'kirchhoff', label: 'Kirchhoff’s laws' }] }, function () { readout(); drawScene(); });
  ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);
  // circuit explanations for lines whose symbol would otherwise pick up a mechanics hint (R = normal reaction, PE = potential energy)
  var rawEq = R.eq;
  R.eq = function (lhs, work, value, unit, why) {
    var k = String(lhs).replace(/<[^>]+>/g, '');
    if (!why && k === 'R') why = 'Everything outside the cell, combined into one resistance (series: add; parallel: add the reciprocals).';
    if (!why && /^PE/.test(k)) why = 'Power supplied by the cell = e.m.f. × current: the energy it gives each coulomb times the coulombs per second.';
    return rawEq.call(R, lhs, work, value, unit, why);
  };

  ui.notes(noteCard, [
    '<b>Ammeters go in series</b> (an ideal ammeter has zero resistance). <b>Voltmeters go in parallel</b>, across the part (an ideal voltmeter has infinite resistance).',
    'Series: the same current through each part, and the p.d.s add up to the e.m.f. Parallel: the same p.d. across each branch, and the branch currents add up.',
    'Kirchhoff’s first law: Σ current into a junction = Σ current out (charge is conserved). Second law: round any closed loop, ΣE = ΣIR (energy is conserved).',
    'Terminal p.d. = E − Ir. The “lost volts” Ir get bigger as the current gets bigger.',
    'A wire straight across a part short-circuits it: all the current takes the wire. A wire across a cell gives the largest current the cell can drive, I = E/r.',
    'Conventional current leaves the + terminal of a cell (the long plate) and returns to the − terminal (the short, thick plate).',
    'Tap a switch to open or close it. Tap a cell or diode, then “Reverse”, to turn it round.'
  ]);

  /* ---------- the circuit ---------- */
  var P = CB.make, parts = [], res = null, sel = null, undo = [];
  var RECT = [[1, 1], [7, 1], [7, 4], [1, 4], [1, 1]];
  var PRESETS = [
    { name: 'Series circuit: 6.0 V cell, 10 Ω and 20 Ω', note: 'One loop, so the same current everywhere: I = 6.0/(10 + 20) = 0.20 A. The p.d.s 2.0 V + 4.0 V add up to the e.m.f.',
      parts: function () { return CB.build([P('cell', 3, 1, 'h', { E: 6 }, true), P('amm', 5, 1, 'h'), P('res', 7, 2, 'v', { R: 10 }), P('res', 4, 4, 'h', { R: 20 })], [RECT]); } },
    { name: 'Parallel circuit: 6.0 V across 6.0 Ω and 3.0 Ω', note: 'Each branch has the full 6.0 V: 1.0 A + 2.0 A = 3.0 A from the cell. 1/R = 1/6 + 1/3 ⇒ R = 2.0 Ω, less than either resistor.',
      parts: function () { return CB.build([P('cell', 1, 2, 'v', { E: 6 }), P('amm', 2, 1, 'h'), P('res', 4, 2, 'v', { R: 6 }), P('res', 7, 2, 'v', { R: 3 }), P('amm', 7, 3, 'v')], [RECT, [[4, 1], [4, 4]]]); } },
    { name: 'Potential divider: 9.0 V across 1.0 kΩ and 2.0 kΩ', note: 'V_out = 9.0 × 2.0/(1.0 + 2.0) = 6.0 V across the 2.0 kΩ resistor. Give the voltmeter a resistance (e.g. 2 kΩ) and the reading drops.',
      parts: function () { return CB.build([P('cell', 1, 2, 'v', { E: 9 }), P('res', 5, 1, 'v', { R: 1000 }), P('res', 5, 3, 'v', { R: 2000 }), P('volt', 7, 3, 'v')], [[[1, 0], [5, 0], [5, 5], [1, 5], [1, 0]], [[5, 3], [7, 3]], [[5, 4], [7, 4]]]); } },
    { name: 'Thermistor in a potential divider (heat it: V_out falls)', note: 'Warmer ⇒ the thermistor’s resistance falls ⇒ it gets a smaller share of the 6.0 V. Use the temperature chip under the diagram.', env: { T: 25 },
      parts: function () { return CB.build([P('cell', 1, 2, 'v', { E: 6 }), P('res', 5, 1, 'v', { R: 10000 }), P('therm', 5, 3, 'v'), P('volt', 7, 3, 'v')], [[[1, 0], [5, 0], [5, 5], [1, 5], [1, 0]], [[5, 3], [7, 3]], [[5, 4], [7, 4]]]); } },
    { name: 'Cell with internal resistance: E = 6.0 V, r = 2.0 Ω, voltmeter across the cell', note: 'I = 6.0/(10 + 2.0) = 0.50 A; terminal p.d. = E − Ir = 6.0 − 1.0 = 5.0 V. Make the variable resistor smaller: more current, more lost volts.',
      parts: function () { return CB.build([P('cell', 3, 2, 'h', { E: 6, r: 2 }, true), P('amm', 7, 3, 'v'), P('var', 4, 5, 'h', { R: 10 }), P('volt', 3, 0, 'h')], [[[1, 2], [7, 2], [7, 5], [1, 5], [1, 2]], [[3, 2], [3, 0]], [[4, 0], [4, 2]]]); } },
    { name: 'Ammeter in series, voltmeter in parallel (real meters)', note: 'A 1.0 Ω ammeter adds a little resistance; a 1.0 kΩ voltmeter draws a little current. Make them ideal (select one, then “Make it ideal”) to compare.',
      parts: function () { return CB.build([P('cell', 3, 1, 'h', { E: 6 }, true), P('amm', 5, 1, 'h', { R: 1 }), P('res', 4, 4, 'h', { R: 10 }), P('volt', 4, 5, 'h', { R: 1000 })], [RECT, [[4, 4], [4, 5]], [[5, 4], [5, 5]]]); } },
    { name: 'What if the ammeter and voltmeter are swapped?', note: 'The voltmeter (very high resistance) is in series, so almost no current flows and it reads the e.m.f. The ammeter (zero resistance) short-circuits the resistor.',
      parts: function () { return CB.build([P('cell', 3, 1, 'h', { E: 6 }, true), P('volt', 5, 1, 'h'), P('res', 4, 4, 'h', { R: 10 }), P('amm', 4, 5, 'h')], [RECT, [[4, 4], [4, 5]], [[5, 4], [5, 5]]]); } },
    { name: 'Two cells (Kirchhoff): 12 V with 2.0 Ω, 6.0 V with 3.0 Ω, 6.0 Ω across', note: 'The top junction is at 8.0 V: 2.0 A from the 12 V cell, 0.67 A INTO the 6.0 V cell (it is being charged), 1.33 A through 6.0 Ω.',
      parts: function () { return CB.build([P('cell', 1, 3, 'v', { E: 12 }), P('res', 1, 1, 'v', { R: 2 }), P('cell', 4, 3, 'v', { E: 6 }), P('res', 4, 1, 'v', { R: 3 }), P('res', 7, 2, 'v', { R: 6 })], [[[1, 0], [7, 0], [7, 5], [1, 5], [1, 0]], [[4, 0], [4, 5]]]); } },
    { name: 'Bridge circuit: not series, not parallel', note: 'R₅ joins the two midpoints, so the circuit does not reduce to series and parallel parts: use Kirchhoff’s laws. Make R₁/R₂ = R₃/R₄ (e.g. R₄ = 60 Ω) and no current flows through R₅ (a balanced bridge).',
      parts: function () { return CB.build([P('res', 2, 1, 'h', { R: 10 }), P('res', 5, 1, 'h', { R: 20 }), P('res', 2, 3, 'h', { R: 30 }), P('res', 5, 3, 'h', { R: 10 }), P('res', 4, 1, 'v', { R: 10 }), P('cell', 4, 5, 'h', { E: 6 }, true)],
        [[[1, 1], [7, 1]], [[1, 3], [7, 3]], [[1, 1], [1, 5], [7, 5], [7, 1]], [[4, 1], [4, 3]]]); } },
    { name: 'An open switch: no current, but the voltmeter across it reads 6.0 V', note: 'No complete loop, so no current and no p.d. across the lamp. The whole e.m.f. appears across the gap in the switch. Tap the switch to close it.',
      parts: function () { return CB.build([P('cell', 3, 1, 'h', { E: 6 }, true), P('lamp', 7, 2, 'v', { R: 12 }), P('switch', 4, 4, 'h', { on: 0 }), P('volt', 4, 5, 'h')], [RECT, [[4, 4], [4, 5]], [[5, 4], [5, 5]]]); } },
    { name: 'Diode with a 0.7 V forward drop, in series with 100 Ω', note: 'I = (6.0 − 0.7)/100 = 0.053 A. Select the diode and press “Reverse”: it is reverse-biased and the current stops.',
      parts: function () { return CB.build([P('cell', 3, 1, 'h', { E: 6 }, true), P('diode', 5, 1, 'h'), P('res', 7, 2, 'v', { R: 100 })], [RECT]); } }
  ];
  var presetCtl = ui.presets(presetCard, PRESETS, function (p) {
    pushUndo(); parts = p.parts(); sel = null;
    if (p.env) prm.set(p.env, true);
    update();
  });

  function env() { return { T: prm.values.T, L: prm.values.L }; }
  function nm(i) { return res && res.names[i] ? res.names[i] : CB.names(parts)[i]; }
  function pushUndo() { undo.push(CB.encode(parts)); if (undo.length > 60) undo.shift(); }
  function update() {
    res = CB.analyse(parts, env());
    if (sel && parts.indexOf(sel) < 0) sel = null;
    if (unknownPartIdx >= parts.length) unknownPartIdx = -1;
    var hasT = parts.some(function (p) { return p.t === 'therm'; }), hasL = parts.some(function (p) { return p.t === 'ldr'; });
    prm.show('T', hasT); prm.show('L', hasL);
    envNote.innerHTML = hasT || hasL ? 'Resistance from an illustrative model: it falls as the temperature / light intensity rises.' : 'Add a thermistor or LDR to the circuit to control it from here.';
    drawScene(); table(); readout(); syncActions(); renderInspector();
    if (simRunning && res && !res.fatal && res.anyCurrent) startAnim();
    ui.writeHash({ c: CB.encode(parts), T: prm.values.T, L: prm.values.L });
  }

  /* ---------- formatting ---------- */
  function plain(x) { return String(s3(x)).replace(/<[^>]+>/g, ''); }
  /** canvas text: 3 s.f. with a k / m / μ prefix, so no powers of ten are needed */
  function eng(v, u) {
    if (!isFinite(v)) return '∞ ' + u;
    var a = Math.abs(v);
    if (a < 1e-12) return '0 ' + u;
    if (a >= 9.995e5) return plain(v / 1e6) + ' M' + u;
    if (a >= 9995) return plain(v / 1e3) + ' k' + u;
    if (a >= 0.00995) return plain(v) + ' ' + u;
    if (a >= 9.995e-6) return plain(v * 1e3) + ' m' + u;
    return plain(v * 1e6) + ' μ' + u;
  }
  function note(t) { R.html('<div class="eq"><div class="note" style="margin:0">' + t + '</div></div>'); }

  /* ---------- palette ---------- */
  var ICON = {
    wire: '<path d="M2 12H38"/>',
    cell: '<path d="M0 12H17M23 12H40M17 3V21"/><path d="M23 7.5V16.5" stroke-width="4"/>',
    battery: '<path d="M0 12H11M29 12H40M11 4V20M25 4V20"/><path d="M15 8V16M29 8V16" stroke-width="4"/><path d="M15 12H25" stroke-dasharray="2 2"/>',
    res: '<path d="M0 12H10M30 12H40"/><rect x="10" y="7" width="20" height="10"/>',
    var: '<path d="M0 12H10M30 12H40"/><rect x="10" y="7" width="20" height="10"/><path d="M8 21L32 3M32 3L25 4M32 3L30 9"/>',
    lamp: '<path d="M0 12H12M28 12H40"/><circle cx="20" cy="12" r="8"/><path d="M14.3 6.3L25.7 17.7M25.7 6.3L14.3 17.7"/>',
    switch: '<path d="M0 12H11M29 12H40M12 12L27 4"/><circle cx="12" cy="12" r="1.8"/><circle cx="28" cy="12" r="1.8"/>',
    amm: '<path d="M0 12H11M29 12H40"/><circle cx="20" cy="12" r="9"/><text x="20" y="16.5" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">A</text>',
    volt: '<path d="M0 12H11M29 12H40"/><circle cx="20" cy="12" r="9"/><text x="20" y="16.5" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor" stroke="none">V</text>',

    R.head('Label the currents');
    note(single ? 'There is only one loop, so one current I flows all the way round.' :
      'Each branch (a path between two junctions) gets its own current. The junctions J₁, J₂ … are marked on the diagram. Each current is taken in the direction of the arrows; a current that came out negative would simply flow the other way.');
    Bs.forEach(function (b, bi) { note('<b>' + In(bi) + '</b> flows through ' + andList(names(b.parts)) + '.'); });
    if (K.junctions.length) {
      R.head('Kirchhoff’s first law at the junctions');
      note('Σ current into a junction = Σ current out of it (charge is conserved).');
      K.junctions.forEach(function (j, ji) {
        var lhs = j.ins.length ? j.ins.map(In).join(' + ') : '0';
        var rhs = j.outs.length ? j.outs.map(In).join(' + ') : '0', num = j.outs.length ? j.outs.map(function (b) { return s3(Bs[b].I); }).join(' + ') : '0';
        var vin = j.ins.reduce(function (s, b) { return s + Bs[b].I; }, 0), vout = j.outs.reduce(function (s, b) { return s + Bs[b].I; }, 0);
        R.eq(lhs, 'currents at junction J' + CB.sub(ji + 1) + ' = ' + rhs + ' = ' + num, vout, 'A');
        if (j.ins.length > 1) note('current in: ' + j.ins.map(function (b) { return s3(Bs[b].I); }).join(' + ') + ' = ' + s3(vin) + ' A ✓');
        else if (j.ins.length === 1) note(In(j.ins[0]) + ' = ' + s3(vin) + ' A ✓');
      });
    }
    K.loops.forEach(function (L, li) {
      R.head('Kirchhoff’s second law, loop ' + (li + 1) + ': ' + names(L.seq).join(' → '));
      if (li === 0) note('Go round the loop in one direction. An e.m.f. counts + when you pass from its − to its + terminal. An IR term counts + when you go the same way as the current, − against it.');
      else note('Loop ' + (li + 1) + ' goes through ' + andList(names(L.seq)) + '.');
      var eS = signed(L.emf.map(function (t) { return [t.sign, nm(t.i)]; })), eN = signed(L.emf.map(function (t) { return [t.sign, s3(t.E)]; }));
      var dS = signed(L.drops.map(function (t) { return [t.sign, t.Vf !== undefined ? 'V<sub>' + nm(t.i) + '</sub>' : In(t.b) + (t.internal ? CB.rName(nm(t.i)) : rsym(t.i))]; }));
      var dN = signed(L.drops.map(function (t) { return [t.sign, t.Vf !== undefined ? s3(t.Vf) : s3(t.I) + ' × ' + s3(t.R)]; }));
      R.eq('ΣE', eS ? eS + ' = ' + eN : '0', L.sumE, 'V');
      R.eq('ΣIR', dS ? dS + ' = ' + dN : '0', L.sumIR, 'V');
      note(Math.abs(L.sumE - L.sumIR) <= 1e-6 * Math.max(1, Math.abs(L.sumE)) ? 'ΣE = ΣIR ✓ — energy is conserved round the loop.' : 'These do not match: check the signs.');
    });
    if (single && K.loops.length) {
      var L0 = K.loops[0], sR = 0, sV = 0;
      L0.drops.forEach(function (t) { if (t.Vf !== undefined) sV += t.sign * t.Vf; else sR += t.R; });
      if (sR > 0) {
        R.head('Solve for I');
        R.eq('I', (sV ? '(ΣE − V<sub>diode</sub>) ÷ ΣR = (' + s3(L0.sumE) + ' − ' + s3(sV) + ') ÷ ' + s3(sR) : 'ΣE ÷ ΣR = ' + s3(L0.sumE) + ' ÷ ' + s3(sR)), Bs[0].I, 'A');
      }
    } else if (!single) {
      R.head('Solve the equations together');
      note('There are ' + Bs.length + ' unknown currents. The junction equations (one of them always repeats the others) and the ' + K.loops.length + ' loop equations, solved as simultaneous equations, give:');
      Bs.forEach(function (b, bi) { R.eq(In(bi), '', b.I, 'A'); });
      parts.forEach(function (p, i) { if (CB.isSource(p) && res.parts[i].Iout < -1e-12) note(nm(i) + ' is being charged: the current goes INTO its + terminal.'); });
    }
    powerStep(res.method.live.map(function (e) { return e.i; }), false);
  }
  function acrossName(i) {
    var e1 = CB.ends(parts[i]), a = res.netOf[CB.dkey(e1[0][0], e1[0][1])], b = res.netOf[CB.dkey(e1[1][0], e1[1][1])], best = null;
    parts.forEach(function (q, j) {
      if (j === i || q.t === 'wire' || q.t === 'volt' || res.parts[j].link) return;
      var e2 = CB.ends(q), a2 = res.netOf[CB.dkey(e2[0][0], e2[0][1])], b2 = res.netOf[CB.dkey(e2[1][0], e2[1][1])];
      if ((a2 === a && b2 === b) || (a2 === b && b2 === a)) if (best === null || CB.isSource(q)) best = j;
    });
    if (best === null) return 'between its two ends';
    return CB.isSource(parts[best]) ? 'across the terminals of ' + nm(best) + ' (its terminal p.d.)' : 'across ' + nm(best);
  }
  function meterStep() {
    var ms = []; parts.forEach(function (p, i) { if (p.t === 'amm' || p.t === 'volt') ms.push(i); });
    if (!ms.length) return;
    R.head('Meter readings');
    ms.forEach(function (i) {
      var p = parts[i], r = res.parts[i];
      if (p.t === 'amm') R.eq(nm(i), (p.v.R > 0 ? 'the current through it (it has resistance ' + s3(p.v.R) + ' Ω, so it also takes a p.d. of ' + s3(Math.abs(r.V)) + ' V)' : 'the current through it'), r.reading, 'A');
      else R.eq(nm(i), 'the p.d. ' + acrossName(i) + (p.v.R > 0 ? '; it has resistance ' + s3(p.v.R) + ' Ω, so it takes ' + s3(Math.abs(r.I)) + ' A itself' : ''), r.reading, 'V');
    });
  }

  ui.onTheme(drawScene);
  if (SIM.scene && SIM.scene.onChange) SIM.scene.onChange(drawScene);
  vp.onResize = drawScene;
  ui.stageTip('Tap a part to inspect & customize · drag ends to rewire · try Real life Breadboard & Multimeter Probe');

  // Register interactive Solve-for-x calculator for any unknown resistor or cell in the Tinkercad workbench
  if (ui.registerXCalculator) {
    ui.registerXCalculator(function (mark) {
      var idx = unknownPartIdx >= 0 ? unknownPartIdx : (mark && /^part_(\d+)$/.test(mark.key) ? Number(RegExp.$1) : -1);
      var target = parts[idx];
      if (!target || (target.t !== 'res' && target.t !== 'var' && target.t !== 'lamp' && target.t !== 'cell' && target.t !== 'battery')) return;
      var paramKey = (target.t === 'cell' || target.t === 'battery') ? 'E' : 'R';
      var curI = Math.abs(res && res.parts && res.parts[idx] ? res.parts[idx].I : 0.25);
      ui.askNumber({
        title: 'Calculate unknown ' + (nm(idx) || TY[target.t].label) + ' = x',
        sub: 'Enter the target current I (A) through ' + (nm(idx) || 'this part') + ' required by the question:',
        value: Number((curI * 0.8 || 0.2).toPrecision(3)),
        min: 0.0001, max: 100, step: 0.01, decimals: 4, unit: 'A',
        quick: [0.1, 0.2, 0.5, 1.0],
        onInput: function (targetI) {
          if (!(targetI > 0)) return;
          // Numerical bisection solve for parameter in [0.01, 50000]
          var lo = 0.01, hi = paramKey === 'E' ? 500 : 100000, best = target.v[paramKey];
          function evalAt(val) {
            var copy = JSON.parse(JSON.stringify(parts));
            copy[idx].v[paramKey] = val;
            var r = CB.analyse(copy, env());
            return r && !r.fatal && r.parts[idx] ? Math.abs(r.parts[idx].I) : NaN;
          }
          var fLo = evalAt(lo), fHi = evalAt(hi);
          if (isFinite(fLo) && isFinite(fHi)) {
            var inc = fHi > fLo;
            for (var it = 0; it < 44; it++) {
              var midV = 0.5 * (lo + hi), fM = evalAt(midV);
              if (!isFinite(fM)) break;
              if ((inc && fM < targetI) || (!inc && fM > targetI)) lo = midV; else hi = midV;
            }
            best = Number((0.5 * (lo + hi)).toPrecision(4));
          }
          pushUndo();
          target.v[paramKey] = best;
          unknownPartIdx = -1;
          if (ui.clearMarkedX) ui.clearMarkedX();
          update();
          R.badge('Solved unknown x: ' + (nm(idx) || TY[target.t].label) + ' = ' + eng(best, paramKey === 'E' ? 'V' : 'Ω') + ' gives I = ' + eng(targetI, 'A') + '.', 'ok').render();
        }
      });
    });
  }

  /* start: the shared set-up in the URL, otherwise a ready-built series circuit */
  var hsh = ui.readHash();
  if (typeof hsh.T === 'number' || typeof hsh.L === 'number') prm.set({ T: typeof hsh.T === 'number' ? U.clamp(hsh.T, -10, 100) : 25, L: typeof hsh.L === 'number' ? U.clamp(hsh.L, 0, 100) : 20 }, true);
  if (typeof hsh.c === 'string' && CB.decode(hsh.c).length) { parts = CB.decode(hsh.c); update(); }
  else presetCtl.select(0);
  if (typeof hsh.markX === 'string' && /^part_(\d+)$/.test(hsh.markX)) {
    var xi = Number(RegExp.$1);
    if (parts[xi]) {
      unknownPartIdx = xi;
      if (ui.markAsX) ui.markAsX('part_' + xi, { label: (nm(xi) || TY[parts[xi].t].label) + ' = x' });
    }
  }
  undo = [];
  syncActions();
  renderInspector();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
