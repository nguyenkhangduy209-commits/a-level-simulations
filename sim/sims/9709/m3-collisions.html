<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direct impact and coalescence</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/mech-momentum.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, MO = SIM.mom;
  var course = ui.course('9709'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Direct impact on a smooth line: momentum, coalescence, KE loss', g: g,
    tags: ['9709 4.3 Momentum', '9709 4.5 KE loss'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 20 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 6, onFrame: function () { drawScene(); drawPlots(); } });
  ui.legend(sceneCard, [{ color: 'var(--c-s1)', label: 'A' }, { color: 'var(--c-s2)', label: 'B' }, { color: 'var(--c-s3)', label: 'C' },
    { color: 'var(--c-velocity)', label: 'velocity (right = +)' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var pX = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'x / m (world-lines)' });
  var pV = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'v / m s⁻¹ (right +)' });
  var barCanvas = ui.canvas(plotWrap);
  var pB = new SIM.plot.Plot(barCanvas, { yLabel: 'momentum (kg m s⁻¹) and KE (J)', xLabel: 'event' });

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var nSel = ui.select(paramCard, { label: 'Particles', value: '2', options: [{ value: '2', label: 'A and B' }, { value: '3', label: 'A, B and C' }] }, update);
  var prm = ui.params(paramCard, [
    { key: 'mA', label: 'Mass of A', sym: 'm<sub>A</sub>', unit: 'kg', min: 0.01, max: 20, step: 0.01, value: 0.3 },
    { key: 'uA', label: 'Velocity of A', sym: 'u<sub>A</sub>', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.1, value: 4 },
    { key: 'xA', label: 'Start position of A', sym: 'x<sub>A</sub>', unit: 'm', min: -20, max: 20, step: 0.1, value: 0 },
    { key: 'mB', label: 'Mass of B', sym: 'm<sub>B</sub>', unit: 'kg', min: 0.01, max: 20, step: 0.01, value: 0.2 },
    { key: 'uB', label: 'Velocity of B', sym: 'u<sub>B</sub>', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.1, value: 0 },
    { key: 'xB', label: 'Start position of B', sym: 'x<sub>B</sub>', unit: 'm', min: -20, max: 20, step: 0.1, value: 1 },
    { key: 'mC', label: 'Mass of C', sym: 'm<sub>C</sub>', unit: 'kg', min: 0.01, max: 20, step: 0.01, value: 1 },
    { key: 'uC', label: 'Velocity of C', sym: 'u<sub>C</sub>', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.1, value: 0 },
    { key: 'xC', label: 'Start position of C', sym: 'x<sub>C</sub>', unit: 'm', min: -20, max: 30, step: 0.1, value: 3 },
    { key: 'xW', label: 'Wall position', sym: 'x<sub>W</sub>', unit: 'm', min: -10, max: 40, step: 0.1, value: 9, hidden: true },
    { key: 'wS', label: 'Speed after hitting the wall (given)', sym: 'w', unit: 'm s<sup>−1</sup>', min: 0, max: 40, step: 0.1, value: 0.5, hidden: true },
    { key: 'T', label: 'Time shown', sym: 't<sub>max</sub>', unit: 's', min: 0.5, max: 30, step: 0.5, value: 3 }
  ], update);
  var wallT = ui.toggle(paramCard, { label: 'Vertical wall on the right (rebound speed given)' }, update);
  var OUT = [
    { value: 'gl', label: 'velocity of LEFT particle after is given' }, { value: 'gr', label: 'velocity of RIGHT particle after is given' },
    { value: 'rl', label: 'LEFT particle brought to rest' }, { value: 'rr', label: 'RIGHT particle brought to rest' },
    { value: 'co', label: 'they coalesce' }, { value: 'ke', label: 'KE loss is given' }, { value: 'no', label: 'not specified (stop)' }];
  var oc = [], ocv = [];
  for (var k = 0; k < 3; k++) {
    oc.push(ui.select(paramCard, { label: 'Collision ' + (k + 1), value: k === 0 ? 'gr' : 'no', options: OUT }, update));
  }
  var prmO = ui.params(paramCard, [
    { key: 'v1', label: 'Given velocity after, collision 1', sym: 'v', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.05, value: 3 },
    { key: 'L1', label: 'Given KE loss, collision 1', sym: 'ΔKE', unit: 'J', min: 0, max: 500, step: 0.005, value: 1 },
    { key: 'v2', label: 'Given velocity after, collision 2', sym: 'v', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.05, value: 0 },
    { key: 'L2', label: 'Given KE loss, collision 2', sym: 'ΔKE', unit: 'J', min: 0, max: 500, step: 0.005, value: 1 },
    { key: 'v3', label: 'Given velocity after, collision 3', sym: 'v', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.05, value: 0 },
    { key: 'L3', label: 'Given KE loss, collision 3', sym: 'ΔKE', unit: 'J', min: 0, max: 500, step: 0.005, value: 1 }
  ], update);
  var solveSel = ui.select(paramCard, { label: 'Solve for (collision 1, A and B)', value: 'none', options: [
    { value: 'none', label: 'nothing — masses as set' },
    { value: 'mB', label: 'mass of B, given both velocities after' },
    { value: 'mA', label: 'mass of A, given both velocities after' },
    { value: 'scale', label: 'masses k·m_A, k·m_B: find k from the KE loss' }] }, update);
  var prmS = ui.params(paramCard, [
    { key: 'vBa', label: 'Velocity of B after collision 1 (given)', sym: 'v<sub>B</sub>', unit: 'm s<sup>−1</sup>', min: -40, max: 40, step: 0.05, value: 2, hidden: true },
    { key: 'Lk', label: 'Given KE loss in collision 1', sym: 'ΔKE', unit: 'J', min: 0, max: 1000, step: 0.01, value: 45, hidden: true }
  ], update);

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);
  var eq0 = R.eq; R.eq = function (l, w, v, u) { return eq0(l, w, typeof v === 'number' ? fmtX(v) : v, u); };
  /* exact values (e.g. 172.5) are shown in full; others to 3 s.f. */
  function fmtX(x) {
    if (typeof x !== 'number' || !isFinite(x)) return U.sf(x);
    for (var d = 0; d <= 4; d++) {
      var y = x * Math.pow(10, d);
      if (Math.abs(y - Math.round(y)) < 1e-9 * Math.max(1, Math.abs(y))) {
        var str = x.toFixed(d), dig = str.replace(/[-.]/g, '').replace(/^0+/, '').length;
        return dig <= 6 && Math.abs(x) < 1e6 && (Math.abs(x) >= 1e-3 || x === 0) ? str.replace('-', '−') : U.sf(x);
      }
    }
    return U.sf(x);
  }
  function pn(x) { return x < 0 ? '(' + U.sf(x) + ')' : U.sf(x); }

  function setOut(list) { list.forEach(function (v, i) { oc[i].set(v, true); }); for (var i = list.length; i < 3; i++) oc[i].set('no', true); }
  var presetCtl = ui.presets(presetCard, [
    { name: '0.3 kg at 4 m s⁻¹ hits 0.2 kg at rest; B then moves at 3 m s⁻¹', values: { mA: 0.3, uA: 4, xA: 0, mB: 0.2, uB: 0, xB: 1, T: 2, v1: 3 }, n: '2', out: ['gr'],
      note: 'Momentum: 0.3(4) + 0 = 0.3v + 0.2(3) ⇒ v = 2 m s⁻¹. Check: v_A ≤ v_B (no passing through) and KE does not increase.' },
    { name: '9709/42 M/J 25 Q2: 0.2 kg at 5 m s⁻¹ catches 0.1 kg at 2 m s⁻¹, coalesce', values: { mA: 0.2, uA: 5, xA: 0, mB: 0.1, uB: 2, xB: 1, T: 2 }, n: '2', out: ['co'],
      note: 'V = (0.2×5 + 0.1×2) ÷ 0.3 = 4 m s⁻¹. KE lost = 2.7 − 2.4 = 0.3 J.' },
    { name: '9709/41 M/J 24 Q7(b): P 0.2 kg up at 15, Q 0.1 kg down at 20; P brought to rest (line vertical, up = +)', values: { mA: 0.2, uA: 15, xA: 0, mB: 0.1, uB: -20, xB: 3.5, T: 0.6 }, n: '2', out: ['rl'],
      note: 'Take up as positive: 0.2(15) + 0.1(−20) = 0 + 0.1v ⇒ v = +10: Q moves UP at 10 m s⁻¹. (Here the line is vertical; gravity acts between collisions in the real question — this page only treats the instant of impact.)' },
    { name: '9709/42 O/N 23 Q5(b): A 0.5 kg up at 15, B 0.3 kg down at 32.5; B brought to rest', values: { mA: 0.5, uA: 15, xA: 0, mB: 0.3, uB: -32.5, xB: 4.75, T: 0.3 }, n: '2', out: ['rr'],
      note: '0.5(15) + 0.3(−32.5) = 0.5v ⇒ v = −4.5: A moves DOWN at 4.5 m s⁻¹.' },
    { name: '9709/42 F/M 26 Q6: P 4m at 6.5 hits Q 3m at rest; P after at 2; KE loss 45 J; wall 9 m on', values: { mA: 4, uA: 6.5, xA: -1, mB: 3, uB: 0, xB: 0, xW: 9, wS: 0.5, T: 6, v1: 2, Lk: 45 }, n: '2', out: ['gl'], wall: true, solve: 'scale',
      note: '(a)(i) 4m(6.5) = 4m(2) + 3mv ⇒ v = 6. (ii) KE loss 22.5m = 45 ⇒ m = 2 (the k shown). (b) Q reaches the wall after 1.5 s, P is then 6 m from it; closing speed 2 + 0.5 ⇒ 2.4 s ⇒ second collision 1.2 m from the wall.' },
    { name: '9709/41 M/J 26 Q6: A (3.5 kg) at 7, B (2 kg) at 5.5 towards A, C (4 kg) at rest', values: { mA: 3.5, uA: 7, xA: 0, mB: 2, uB: -5.5, xB: 1, mC: 4, uC: 0, xC: 3, T: 4, v1: 2, L2: 6.875 }, n: '3', out: ['gl', 'ke', 'no'],
      note: 'm(2m) − 2(m+2) = 2m + 2(3.25) ⇒ m = 3.5. B–C with KE loss 6.875 J gives two roots: v_B = 1.42, v_C = 0.917 is rejected (B would pass through C), so v_B = 0.75, v_C = 1.25. A (2 m s⁻¹) is faster than B ⇒ yes, a further collision.' },
    { name: 'Q (0.2 kg at 3) coalesces with R at rest; combined moves at 2: find m_R', values: { mA: 0.2, uA: 3, xA: 0, mB: 0.1, uB: 0, xB: 1, T: 2, v1: 2, vBa: 2 }, n: '2', out: ['gl'], solve: 'mB',
      note: '0.2(3) = (0.2 + m)(2) ⇒ m = 0.1 kg.' },
    { name: 'Chain: A hits B, B hits C, C rebounds from a wall', values: { mA: 2, uA: 5, xA: 0, mB: 1, uB: 1, xB: 2, mC: 3, uC: -1, xC: 5, xW: 9, wS: 1, T: 8, v1: 3, v2: 0.5 }, n: '3', out: ['gl', 'co', 'co'], wall: true,
      note: 'Find the position of each collision from the times: t = gap ÷ closing speed. A wall rebound speed is GIVEN data in 9709 (no restitution).' },
    { name: 'Impossible outcome: KE would increase', values: { mA: 1, uA: 4, xA: 0, mB: 1, uB: 0, xB: 1, T: 2, v1: -2 }, n: '2', out: ['gl'],
      note: 'Momentum alone gives v_B = 6, but KE 8 J → 20 J: impossible unless there is an explosion. Always check KE after ≤ KE before.' }
  ], function (p) {
    clock.pause(); nSel.set(p.n || '2', true); setOut(p.out || ['gr']); wallT.set(!!p.wall, true); solveSel.set(p.solve || 'none', true);
    var vals = Object.assign({}, p.values), ov = {}, sv = {};
    ['v1', 'v2', 'v3', 'L1', 'L2', 'L3'].forEach(function (k) { if (k in vals) { ov[k] = vals[k]; delete vals[k]; } });
    ['vBa', 'Lk'].forEach(function (k) { if (k in vals) { sv[k] = vals[k]; delete vals[k]; } });
    prmO.set(ov, true); prmS.set(sv, true); prm.set(vals); clock.seek(0);
  });

  ui.notes(noteCard, [
    'Choose a positive direction and give every velocity a <b>sign</b>. A particle moving towards the left has a negative velocity.',
    'Momentum before = momentum after: m₁u₁ + m₂u₂ = m₁v₁ + m₂v₂. Coalesce: (m₁ + m₂)V.',
    'If a question gives only a <b>speed</b> after impact, try both signs and reject the one where the particles pass through each other or KE increases.',
    'KE is <b>not</b> conserved in general: KE lost = KE before − KE after (always ≥ 0).',
    'Find where a later collision happens from the gap and the <b>closing speed</b>, not by adding speeds of particles moving the same way.',
    'Coefficient of restitution and impulse are not in 9709 — a rebound speed is always given.'
  ]);

  /* ---------- model ---------- */
  var COLS = ['s1', 's2', 's3'];
  var tl = null, used = null, solveInfo = null;
  function outcomeSpec(i) {
    var t = oc[i].get(), v = prmO.values['v' + (i + 1)], L = prmO.values['L' + (i + 1)];
    if (t === 'gl') return { type: 'given', who: 'left', v: v };
    if (t === 'gr') return { type: 'given', who: 'right', v: v };
    if (t === 'rl') return { type: 'rest', who: 'left' };
    if (t === 'rr') return { type: 'rest', who: 'right' };
    if (t === 'co') return { type: 'coalesce' };
    if (t === 'ke') return { type: 'keloss', loss: L };
    return { type: 'none' };
  }
  function update() {
    var v = prm.values, n = Number(nSel.get());
    ['mC', 'uC', 'xC'].forEach(function (k) { prm.show(k, n === 3); });
    prm.show('xW', wallT.get()); prm.show('wS', wallT.get());
    for (var i = 0; i < 3; i++) {
      var t = oc[i].get();
      prmO.show('v' + (i + 1), t === 'gl' || t === 'gr'); prmO.show('L' + (i + 1), t === 'ke');
      oc[i].row.style.display = (i < n || wallT.get()) ? '' : 'none';
    }
    var sv = solveSel.get();
    prmS.show('vBa', sv === 'mA' || sv === 'mB'); prmS.show('Lk', sv === 'scale');
    // masses actually used
    var mA = v.mA, mB = v.mB; solveInfo = null;
    prm.lock('mA', false); prm.lock('mB', false);
    if (sv === 'mA' || sv === 'mB') {
      var vAa = prmO.values.v1, vBa = prmS.values.vBa;
      var unk = sv === 'mA' ? 'm1' : 'm2';
      var val = MO.solveMomentum({ unknown: unk, m1: mA, u1: v.uA, m2: mB, u2: v.uB, v1: vAa, v2: vBa });
      solveInfo = { kind: sv, value: val, vAa: vAa, vBa: vBa };
      if (isFinite(val) && val > 0) { if (sv === 'mA') mA = val; else mB = val; prm.lock(sv, true, val); }
      oc[0].set('gl', true); prmO.show('v1', true);
    } else if (sv === 'scale') {
      var o1 = outcomeSpec(0), r1 = MO.collide({ m1: mA, u1: v.uA, m2: mB, u2: v.uB, type: o1.type === 'none' ? 'given' : o1.type, who: o1.who || 'left', v: o1.v, loss: o1.loss });
      var kk = r1.error ? NaN : MO.massScaleFromLoss(mA, v.uA, mB, v.uB, r1.v1, r1.v2, prmS.values.Lk);
      solveInfo = { kind: 'scale', value: kk, r1: r1, baseA: mA, baseB: mB };
      if (isFinite(kk) && kk > 0) { mA *= kk; mB *= kk; }
    }
    var parts = [{ name: 'A', m: mA, x: v.xA, u: v.uA }, { name: 'B', m: mB, x: v.xB, u: v.uB }];
    if (n === 3) parts.push({ name: 'C', m: v.mC, x: v.xC, u: v.uC });
    used = parts;
    tl = MO.timeline({ particles: parts, wall: wallT.get() ? { x: v.xW, speed: v.wS } : null, outcomes: [0, 1, 2].map(outcomeSpec), tMax: v.T });
    clock.setDuration(v.T);
    ui.writeHash(Object.assign({}, v, { n: n, wall: +wallT.get() }));
    drawScene(); drawPlots(); readout();
  }

  /* ---------- scene ---------- */
  function xRange() {
    var lo = Infinity, hi = -Infinity, T = prm.values.T;
    used.forEach(function (p) { lo = Math.min(lo, p.x); hi = Math.max(hi, p.x); });
    if (tl && !tl.error) for (var i = 0; i <= 60; i++) tl.stateAt(T * i / 60).forEach(function (b) { lo = Math.min(lo, b.x); hi = Math.max(hi, b.x); });
    if (wallT.get()) { hi = Math.max(hi, prm.values.xW); lo = Math.min(lo, prm.values.xW); }
    if (!(hi - lo > 1e-6)) { lo -= 1; hi += 1; }
    var pad = 0.08 * (hi - lo); return [lo - pad, hi + pad];
  }
  function drawScene() {
    if (!tl) return;
    var col = ui.colors(), xr = xRange();
    if (hold) vp.fit.apply(vp, hold.bounds);   // keep the scale still while a velocity arrow is dragged
    else vp.fit(xr[0], xr[1], -(xr[1] - xr[0]) * 0.22, (xr[1] - xr[0]) * 0.3);
    var c = vp.begin();
    geo = [];
    D.ground(c, vp.X(xr[0]), vp.Y(0), vp.X(xr[1]), vp.Y(0));
    D.label(c, 'smooth horizontal line — positive to the right →', 10, 14, col.muted, { align: 'left', size: 11 });
    if (wallT.get()) {
      var wx = vp.X(prm.values.xW);
      c.save(); c.strokeStyle = col['object-line']; c.lineWidth = 4; c.beginPath(); c.moveTo(wx, vp.Y(0)); c.lineTo(wx, vp.Y(0) - 70); c.stroke(); c.restore();
      D.label(c, 'wall', wx, vp.Y(0) - 80, col.muted, { size: 11 });
    }
    if (tl.error) { D.label(c, tl.error, vp.w / 2, vp.h / 2, col.warn, { bold: true }); return; }
    var st = tl.stateAt(clock.t);
    var mMax = Math.max.apply(null, used.map(function (p) { return p.m; }));
    st.forEach(function (b) {
      var r = 8 + 14 * Math.cbrt(b.m / (mMax * 2 || 1)), x = vp.X(b.x), y = vp.Y(0) - r;
      var colr = col[COLS[b.ids[0]]];
      D.particle(c, x, y, r, { fill: colr });
      D.label(c, b.name, x, y, '#fff', { bold: true, size: 12 });
      D.label(c, U.sf(b.m) + ' kg', x, vp.Y(0) + 14, col.muted, { size: 11 });
      if (Math.abs(b.v) > 1e-9) D.arrow(c, x, y - r - 12, x + U.sgn(b.v) * arrowLen(b.v), y - r - 12, col.velocity, { label: U.sf(b.v) + ' m/s', width: 2 });
      geo.push({ ids: b.ids, x: x, y: y, r: r, ay: y - r - 12, v: b.v });
    });
    var ev = tl.events.filter(function (e) { return e.t <= clock.t + 1e-9; });
    if (ev.length) D.label(c, 'last event: ' + (ev[ev.length - 1].kind === 'wall' ? 'wall' : 'collision') + ' at t = ' + U.sf(ev[ev.length - 1].t) + ' s, x = ' + U.sf(ev[ev.length - 1].x) + ' m', vp.w - 10, vp.h - 12, col.muted, { align: 'right', size: 11 });
    if (ix) ix.paint(c);
  }

  /* ---------- plots ---------- */
  function drawPlots() {
    if (!tl || tl.error) return;
    var T = prm.values.T, col = ui.colors(), series = [], vser = [];
    used.forEach(function (p, i) {
      var pts = [], vpts = [];
      for (var k = 0; k <= 300; k++) {
        var t = T * k / 300, st = tl.stateAt(t), b = st.filter(function (q) { return q.ids.indexOf(i) >= 0; })[0];
        if (b) { pts.push([t, b.x]); vpts.push([t, b.v]); }
      }
      tl.events.forEach(function (e) { if (e.t <= T) { var b0 = tl.stateAt(Math.max(0, e.t - 1e-9)).filter(function (q) { return q.ids.indexOf(i) >= 0; })[0], b1 = tl.stateAt(e.t + 1e-9).filter(function (q) { return q.ids.indexOf(i) >= 0; })[0]; if (b0) vpts.push([e.t - 1e-9, b0.v]); if (b1) vpts.push([e.t + 1e-9, b1.v]); } });
      vpts.sort(function (a, b) { return a[0] - b[0]; });
      series.push({ pts: pts, color: col[COLS[i]] }); vser.push({ pts: vpts, color: col[COLS[i]] });
    });
    var hl = wallT.get() ? [{ y: prm.values.xW, label: 'wall' }] : [];
    var mk = tl.events.filter(function (e) { return e.t <= T; }).map(function (e) { return { x: e.t, y: e.x, label: e.kind === 'wall' ? 'wall' : (e.kind === 'pending' ? '?' : '#' + e.n) }; });
    pX.draw({ x: [0, T], series: series, cursor: clock.t, hlines: hl, markers: mk });
    pV.draw({ x: [0, T], series: vser, cursor: clock.t });
    // momentum and KE before / after each collision
    var pe = tl.events.filter(function (e) { return e.kind === 'pair'; });
    if (!pe.length) { pB.draw({ x: [0, 1], series: [], title: 'no collision yet' }); return; }
    var pts1 = [], pts2 = [], k0 = [], k1 = [];
    pe.forEach(function (e, i) { pts1.push([i + 0.8, e.res.p0], [i + 1.2, e.res.p1]); k0.push([i + 0.8, e.res.K0], [i + 1.2, e.res.K1]); });
    pB.draw({ x: [0.5, pe.length + 0.5], series: [{ pts: pts1, color: col.s1 }, { pts: k0, color: col.warn, dash: [5, 4] }],
      markers: pts1.map(function (p, i) { return { x: p[0], y: p[1], color: col.s1, label: i % 2 ? 'p after' : 'p before' }; })
        .concat(k0.map(function (p, i) { return { x: p[0], y: p[1], color: col.warn, label: i % 2 ? 'KE after' : 'KE before' }; })),
      title: 'solid: momentum (flat ⇒ conserved); dashed: KE' });
  }

  /* ---------- live working ---------- */
  function sgnTxt(x) { return x < 0 ? '(' + U.sf(x) + ')' : U.sf(x); }
  function readout() {
    R.clear();
    if (!tl) return;
    if (tl.error) { R.badge(tl.error, 'warn').render(); return; }
    R.html('<div style="font-size:12.5px;color:var(--muted)">Sign convention: velocities positive to the right. “Left/right particle” refers to positions at the moment of impact.</div>');
    if (solveInfo) {
      R.head('Solve (collision 1)');
      if (solveInfo.kind === 'scale') {
        var r1 = solveInfo.r1;
        if (r1.error || !isFinite(solveInfo.value)) R.badge('Cannot find k: the stated outcome gives no KE change per unit mass scale.', 'warn');
        else {
          R.eq('velocities after', 'from momentum (independent of k)', 'v<sub>A</sub> = ' + U.sf(r1.v1) + ', v<sub>B</sub> = ' + U.sf(r1.v2), 'm s<sup>−1</sup>');
          R.eq('KE loss', 'k[½(' + U.sf(solveInfo.baseA) + ')(' + U.sf(prm.values.uA) + '² − ' + U.sf(r1.v1) + '²) + ½(' + U.sf(solveInfo.baseB) + ')(' + U.sf(prm.values.uB) + '² − ' + U.sf(r1.v2) + '²)] = ' + U.sf(prmS.values.Lk), '', '');
          R.eq('k', 'scale factor for both masses', solveInfo.value, '');
          if (!(solveInfo.value > 0)) R.badge('k ≤ 0: impossible (the stated loss has the wrong sign).', 'warn');
        }
      } else {
        var nm = solveInfo.kind === 'mA' ? 'm<sub>A</sub>' : 'm<sub>B</sub>';
        var fml = solveInfo.kind === 'mA' ? 'm<sub>B</sub>(v<sub>B</sub> − u<sub>B</sub>) ÷ (u<sub>A</sub> − v<sub>A</sub>)' : 'm<sub>A</sub>(u<sub>A</sub> − v<sub>A</sub>) ÷ (v<sub>B</sub> − u<sub>B</sub>)';
        R.eq(nm, fml, isFinite(solveInfo.value) ? solveInfo.value : 'undefined (denominator 0)', isFinite(solveInfo.value) ? 'kg' : '');
        if (isFinite(solveInfo.value) && solveInfo.value <= 0) R.badge('Mass ≤ 0: these velocities are impossible together.', 'warn');
        else if (Math.abs(solveInfo.vAa - solveInfo.vBa) < 1e-9) R.badge('Equal velocities after ⇒ they move together (coalesce).', 'info');
      }
    }
    var n = 0;
    tl.events.forEach(function (e) {
      if (e.kind === 'wall') { R.head('t = ' + U.sf(e.t) + ' s: wall'); R.html('<div class="eq">' + e.note + '</div>'); return; }
      if (e.kind === 'pending' || e.kind === 'error') {
        R.head('t = ' + U.sf(e.t) + ' s, x = ' + U.sf(e.x) + ' m: collision ' + (n + 1) + ' (' + e.names.join(' and ') + ')');
        R.badge(e.kind === 'pending' ? 'A further collision happens here (outcome not specified).' : e.note, e.kind === 'pending' ? 'info' : 'warn');
        if (e.kind === 'pending') R.eq('position', 'distance from the wall', wallT.get() ? Math.abs(prm.values.xW - e.x) : '—', wallT.get() ? 'm' : '');
        return;
      }
      n++;
      var r = e.res, L = e.names[0], Rn = e.names[1];
      R.head('Collision ' + e.n + ': ' + L + ' (left) and ' + Rn + ' (right) at t = ' + U.sf(e.t) + ' s, x = ' + U.sf(e.x) + ' m');
      R.eq('momentum before', U.sf(e.m[0]) + ' × ' + sgnTxt(e.u[0]) + ' + ' + U.sf(e.m[1]) + ' × ' + sgnTxt(e.u[1]), r.p0, 'kg m s<sup>−1</sup>');
      if (r.coalesced && Math.abs(r.v1 - r.v2) < 1e-12 && oc[e.n - 1].get() === 'co') R.eq('V', r.formula + ' = ' + U.sf(r.p0) + ' ÷ ' + U.sf(e.m[0] + e.m[1]), r.v1, 'm s<sup>−1</sup>');
      else {
        R.eq('v<sub>' + L + '</sub>', 'velocity of ' + L + ' after', r.v1, 'm s<sup>−1</sup>');
        R.eq('v<sub>' + Rn + '</sub>', 'velocity of ' + Rn + ' after', r.v2, 'm s<sup>−1</sup>');
        R.eq('check', U.sf(e.m[0]) + ' × ' + sgnTxt(r.v1) + ' + ' + U.sf(e.m[1]) + ' × ' + sgnTxt(r.v2), r.p1, 'kg m s<sup>−1</sup> ✓');
      }
      R.eq('KE before', '½m₁u₁² + ½m₂u₂²', r.K0, 'J');
      R.eq('KE after', '½m₁v₁² + ½m₂v₂²', r.K1, 'J');
      R.eq('KE lost', 'KE before − KE after', r.loss, 'J');
      if (r.roots) {
        r.roots.forEach(function (q) {
          R.eq('root', 'v<sub>' + L + '</sub> = ' + U.sf(q.v1) + ', v<sub>' + Rn + '</sub> = ' + U.sf(q.v2), q.valid ? 'valid' : 'rejected: pass through', '');
        });
      }
      r.warnings.forEach(function (w) { R.badge(w, 'warn'); });
      if (r.valid) R.badge('Consistent: they approach, do not pass through, and KE does not increase.', 'ok');
      var t0 = oc[e.n - 1].get();
      if (t0 === 'gl' || t0 === 'gr') {
        var bs = MO.bothSigns({ m1: e.m[0], u1: e.u[0], m2: e.m[1], u2: e.u[1], who: t0 === 'gl' ? 'left' : 'right', v: prmO.values['v' + e.n] });
        R.html('<div class="eq" style="font-size:12.5px">If only the <b>speed</b> ' + U.sf(Math.abs(prmO.values['v' + e.n])) + ' were given: ' +
          bs.map(function (b) { return (b.sign > 0 ? '+' : '−') + ' → other ' + U.sf(t0 === 'gl' ? b.v2 : b.v1) + ' (' + (b.valid ? 'valid' : 'impossible') + ')'; }).join('; ') + '</div>');
      }
    });
    if (!tl.events.length) R.badge('No collision in the time shown' + (tl.stopReason === 'no further collisions' ? ': the particles never meet (check the directions — they must approach).' : '.'), 'info');
    else if (tl.stopReason === 'no further collisions') R.badge('No further collisions: every particle is moving away from the next one (and from the wall).', 'ok');
    R.render();
  }

  /* ---------- direct manipulation: tap a particle to type its mass; drag its velocity arrow tip left/right (right +), tap the tip to type ---------- */
  var geo = [], hold = null, ix = null, APX = 3, NAMES = ['A', 'B', 'C'];   // arrow: 16 px + APX px per m s⁻¹
  function arrowLen(v) { return 16 + Math.min(40, Math.abs(v)) * APX; }
  function touched() { if (SIM.anim && SIM.anim.inputChanged) SIM.anim.inputChanged(); if (ui.syncChips) ui.syncChips(); }
  function massEditable(id) { var sv = solveSel.get(); return !(sv === 'scale' && id < 2) && sv !== 'm' + NAMES[id]; }
  function beforeFirstEvent() { return !!hold || !tl.events.length || clock.t < tl.events[0].t - 1e-9; }
  ix = SIM.view.interact(cv, {
    handles: function () {
      if (!tl || tl.error) return [];
      var col = ui.colors(), out = [], early = beforeFirstEvent();
      geo.forEach(function (b) {
        if (b.ids.length !== 1) return;   // a coalesced pair is not an input
        var id = b.ids[0], name = NAMES[id];
        if (early) out.push({ id: 'u' + name, key: 'u' + name, name: name, x: Math.abs(b.v) > 1e-9 ? b.x + U.sgn(b.v) * arrowLen(b.v) : b.x, y: b.ay, bx: b.x, color: col.velocity });
        if (massEditable(id)) out.push({ id: 'm' + name, key: 'm' + name, name: name, x: b.x, y: b.y, r: Math.max(12, b.r), color: col[COLS[id]] });
      });
      return out;
    },
    onDrag: function (hd, x) {
      if (hd.key[0] !== 'u') return;
      if (!hold) hold = { bounds: vp.bounds.slice(), base: hd.bx };
      var dx = x - hold.base, sp = Math.max(0, Math.abs(dx) - 16) / APX, o = {};
      o[hd.key] = U.clamp((dx < 0 ? -1 : 1) * Math.round(sp * 2) / 2, -40, 40);
      clock.pause(); prm.set(o); touched(); clock.seek(0);
    },
    onDrop: function () { if (hold) { hold = null; clock.seek(0); } },
    onTap: function (hd, x, y) {
      var key = hd.key, isM = key[0] === 'm';
      ui.askNumber({ title: (isM ? 'Mass of ' : 'Velocity of ') + hd.name, sub: isM ? 'Type the mass in kilograms.' : 'Right is positive: type a negative value for motion to the left.',
        value: prm.values[key], min: isM ? 0.01 : -40, max: isM ? 20 : 40, step: isM ? 0.1 : 0.5, decimals: 2, unit: isM ? 'kg' : 'm s⁻¹', at: { x: x, y: y },
        quick: isM ? [0.1, 0.2, 0.5, 1] : [-2, 0, 2, 4],
        onInput: function (v) { var o = {}; o[key] = isM ? U.clamp(v, 0.01, 20) : U.clamp(v, -40, 40); prm.set(o); touched(); } });
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Drag a velocity arrow tip left/right to set u (right +) · tap it to type u · tap a particle to type its mass');

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  var hsh = ui.readHash();
  if (hsh.n) nSel.set(String(hsh.n), true);
  if (hsh.wall) wallT.set(true, true);
  var init = {}; Object.keys(prm.values).forEach(function (k) { if (typeof hsh[k] === 'number') init[k] = hsh[k]; });
  prm.set(init, true);
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
