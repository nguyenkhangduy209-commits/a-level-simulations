<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Variable acceleration</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/mech-calculus.js"></script>
<style>
  .stack { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
  .stack canvas { aspect-ratio: 3 / 1; height: auto; border: 1px solid var(--line); width: 100%; }
  .piece, .cond, .term { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin: 6px 0; }
  .exprbox { width: 100%; font: 14px var(--mono, ui-monospace, monospace); padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); box-sizing: border-box; }
  .subtle { color: var(--muted); font-size: 12.5px; }
  .tblwrap { overflow-x: auto; }
  .expr { font-size: 15px; margin: 2px 0 6px; }
</style>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, C = SIM.calc;
  var course = ui.course('9709'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Variable acceleration: s, v and a as functions of t', g: g,
    tags: ['9709 4.2 Kinematics (calculus)', 'P1 calculus: powers of t only'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas'); cv.style.aspectRatio = '5 / 1';
  var vp = new SIM.view.Viewport(cv, { pad: 12 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 10, onFrame: function () { drawScene(); drawPlots(); readout(); } });
  ui.legend(sceneCard, [{ color: 'var(--c-s1)', label: 's(t)' }, { color: 'var(--c-velocity)', label: 'v(t)' }, { color: 'var(--c-accel)', label: 'a(t)' },
    { color: 'var(--c-pos)', label: '+ area under v–t (forwards)' }, { color: 'var(--c-neg)', label: '− area (backwards)' }]);
  var stack = ui.h('div', { class: 'stack' }); sceneCard.appendChild(stack);
  var pS = new SIM.plot.Plot(ui.canvas(stack), { yLabel: 's / m' });
  var pV = new SIM.plot.Plot(ui.canvas(stack), { yLabel: 'v / m s⁻¹' });
  var pA = new SIM.plot.Plot(ui.canvas(stack), { yLabel: 'a / m s⁻²' });
  var tabCard = pg.card('left', 'Interval table (split where v changes sign)');
  var tabDiv = ui.h('div', { class: 'tblwrap' }); tabCard.appendChild(tabDiv);

  var presetCard = pg.card('right', 'Exam setups');
  var exprCard = pg.card('right', 'Expression');
  var termCard = pg.card('right', 'Term sliders  c(pt + q)ⁿ');
  var condCard = pg.card('right', 'Conditions (to find the constants)');
  var winCard = pg.card('right', 'Time interval for distance');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  /* ---------- expression pieces ---------- */
  var nSel = ui.select(exprCard, { label: 'Number of time intervals (piecewise)', value: '1', options: [{ value: '1', label: '1' }, { value: '2', label: '2' }, { value: '3', label: '3' }] }, function () { refreshPieces(); update(); });
  var t0p = ui.params(exprCard, [{ key: 'T0', label: 'Start time', sym: 't<sub>0</sub>', unit: 's', min: 0, max: 50, step: 0.1, value: 0 }], function () { update(); });
  var pieces = [];
  for (var pi = 0; pi < 3; pi++) (function (i) {
    var box = ui.h('div', { class: 'piece' }); exprCard.appendChild(box);
    box.appendChild(ui.h('div', { class: 'subtle', text: 'Interval ' + (i + 1) }));
    var giv = ui.select(box, { label: 'Given', value: 'v', options: [{ value: 's', label: 's(t) — displacement' }, { value: 'v', label: 'v(t) — velocity' }, { value: 'a', label: 'a(t) — acceleration' }] }, function () { termRebuild(); update(); });
    var inp = ui.h('input', { type: 'text', class: 'exprbox', value: i === 0 ? '-0.1t^3 + 1.8t^2 - 6t + 5.6' : '0', 'aria-label': 'expression ' + (i + 1), spellcheck: 'false' });
    inp.addEventListener('change', function () { termRebuild(); update(); });
    box.appendChild(inp);
    var tp = ui.params(box, [{ key: 't1', label: 'Interval ends at', sym: 't', unit: 's', min: 0.1, max: 100, step: 0.1, value: 15 + 5 * i }], function () { update(); });
    pieces.push({ box: box, giv: giv, inp: inp, tp: tp });
  })(pi);
  ui.notes(exprCard, ['Type e.g. <code>t - 7t^(1/2) + 12</code>, <code>9/4 + b/(t+1)^2 - ct^2</code>, <code>0.2(t-9)^2 + 1.8</code>, <code>k√t</code>. Named constants: k, b, c (at most two).',
    '∫t⁻¹ dt needs ln and is not in 9709 P4, so a term in (pt + q)⁻¹ cannot be integrated here.']);
  function refreshPieces() { var n = Number(nSel.get()); pieces.forEach(function (p, i) { p.box.style.display = i < n ? '' : 'none'; }); termPieceSel.el.innerHTML = ''; for (var i = 0; i < n; i++) termPieceSel.el.appendChild(ui.h('option', { value: String(i), text: 'interval ' + (i + 1) })); if (Number(termPieceSel.get()) >= n || termPieceSel.get() === '') termPieceSel.el.value = '0'; termRebuild(); }

  /* ---------- term sliders ---------- */
  var termPieceSel = ui.select(termCard, { label: 'Edit the terms of', value: '0', options: [{ value: '0', label: 'interval 1' }] }, function () { termRebuild(); });
  var adv = ui.toggle(termCard, { label: 'Advanced: show p and q in (pt + q)ⁿ' }, function () { termRebuild(); });
  var termBox = ui.h('div'); termCard.appendChild(termBox);
  var NLIST = [-3, -2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2, 2.5, 3, 4];
  var termGen = 0;
  function termRebuild() {
    termGen++; var my = termGen;
    termBox.innerHTML = '';
    var idx = Number(termPieceSel.get()) || 0, P = pieces[idx];
    var terms;
    try { terms = C.parse(P.inp.value); } catch (e) { termBox.appendChild(ui.h('div', { class: 'subtle', text: 'Fix the expression to use the sliders: ' + e.message })); return; }
    function write() { P.inp.value = C.format(terms, { html: false }); update(); }
    terms.forEach(function (tm, j) {
      var box = ui.h('div', { class: 'term' }); termBox.appendChild(box);
      var headTxt = 'Term ' + (j + 1) + ': ' + C.format([tm]);
      box.appendChild(ui.h('div', { class: 'subtle', html: headTxt }));
      if (tm.sym) { box.appendChild(ui.h('div', { class: 'subtle', text: 'contains the constant ' + tm.sym + ' — edit it in the text box' })); return; }
      var specs = [{ key: 'c', label: 'Coefficient', sym: 'c', unit: '', min: -50, max: 50, step: 0.01, value: tm.c }];
      if (adv.get() && tm.n !== 0) specs.push({ key: 'p', label: 'p', sym: 'p', unit: '', min: -10, max: 10, step: 0.01, value: tm.p }, { key: 'q', label: 'q', sym: 'q', unit: '', min: -50, max: 50, step: 0.01, value: tm.q });
      var prm = ui.params(box, specs, function (key) {
        if (my !== termGen || key === '*') return;
        tm.c = prm.values.c;
        if (prm.values.p !== undefined) { tm.p = Math.abs(prm.values.p) < 1e-9 ? 0.01 : prm.values.p; tm.q = prm.values.q; }
        write();
      });
      var opts = NLIST.slice(); if (opts.indexOf(tm.n) < 0) { opts.push(tm.n); opts.sort(function (a, b) { return a - b; }); }
      ui.select(box, { label: 'Power n', value: String(tm.n), options: opts.map(function (n) { return { value: String(n), label: 'n = ' + n }; }) }, function (v) {
        if (my !== termGen) return; tm.n = Number(v); if (tm.n === 0) { tm.p = 1; tm.q = 0; } write(); termRebuild();
      });
      box.appendChild(ui.h('button', { class: 'btn', text: 'Remove term ' + (j + 1), onclick: function () { if (my !== termGen) return; terms.splice(j, 1); if (!terms.length) terms.push(C.term(0, null, 1, 0, 0)); write(); termRebuild(); } }));
    });
    if (terms.length < 5) termBox.appendChild(ui.h('button', { class: 'btn', text: '＋ Add a term in t', onclick: function () { if (my !== termGen) return; terms.push(C.term(1, null, 1, 0, 1)); write(); termRebuild(); } }));
  }

  /* ---------- conditions ---------- */
  var condHead = ui.h('div', { class: 'subtle' }); condCard.appendChild(condHead);
  var conds = [];
  var CDEF = [{ q: 's', t: 0, val: 0 }, { q: 'v', t: 0, val: 0 }, { q: 'v', t: 1, val: 0 }, { q: 'a', t: 0, val: 0 }];
  for (var ci = 0; ci < 4; ci++) (function (i) {
    var box = ui.h('div', { class: 'cond' }); condCard.appendChild(box);
    var qs = ui.select(box, { label: 'Condition ' + (i + 1), value: CDEF[i].q, options: [{ value: 's', label: 's(t₁) = value' }, { value: 'v', label: 'v(t₁) = value' }, { value: 'a', label: 'a(t₁) = value' }] }, function () { update(); });
    var cp = ui.params(box, [{ key: 't', label: 'at time', sym: 't₁', unit: 's', min: 0, max: 100, step: 0.01, value: CDEF[i].t },
      { key: 'val', label: 'value', sym: '', unit: '', min: -1000, max: 1000, step: 0.001, value: CDEF[i].val }], function () { update(); });
    conds.push({ box: box, qs: qs, cp: cp });
  })(ci);
  ui.notes(condCard, ['“Starts from rest at O” gives v(0) = 0 and s(0) = 0. “Passes through O with velocity 4.2” gives s(0) = 0, v(0) = 4.2.']);

  var findQ = null;
  var wp = ui.params(winCard, [
    { key: 'ta', label: 'From', sym: 't<sub>a</sub>', unit: 's', min: 0, max: 100, step: 0.01, value: 0 },
    { key: 'tb', label: 'To', sym: 't<sub>b</sub>', unit: 's', min: 0, max: 100, step: 0.01, value: 15 }
  ], function () { update(); });
  findQ = ui.select(winCard, { label: 'Also find the times when', value: 'v', options: [{ value: 'v', label: 'v = value' }, { value: 's', label: 's = value' }, { value: 'a', label: 'a = value' }] }, function () { update(); });
  var fp = ui.params(winCard, [{ key: 'V', label: 'value', sym: '', unit: '', min: -1000, max: 1000, step: 0.01, value: 0 }], function () { update(); });

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);

  /* ---------- presets ---------- */
  var PRESETS = [
    { name: '9709/42 O/N 23 Q7: v = −0.1t³ + 1.8t² − 6t + 5.6, distance 0 ≤ t ≤ 15', pieces: [{ given: 'v', expr: '-0.1t^3 + 1.8t^2 - 6t + 5.6', t1: 15 }], conds: [{ q: 's', t: 0, val: 0 }], ta: 0, tb: 15,
      note: 'a = 0 at t = 2 and 10. v(2) = 0 is a double root: instantaneously at rest but no change of direction. v(14) = 0 is a reversal, so distance = s(14) + [s(14) − s(15)] = 176.4 + 8.025 = 184.425 m.' },
    { name: '9709/41 M/J 26 Q3: s = 4t³ − 39t² + 120t, distance 1 ≤ t ≤ 4', pieces: [{ given: 's', expr: '4t^3 - 39t^2 + 120t', t1: 5 }], conds: [], ta: 1, tb: 4,
      note: 'v = 12t² − 78t + 120 = 6(2t − 5)(t − 4): at rest at t = 2.5 and 4. Distance = (118.75 − 85) + (118.75 − 112) = 40.5 m. a(3) = −6.' },
    { name: '9709/42 F/M 26 Q7: v = t − 7t^½ + 12, distance 0 ≤ t ≤ 25', pieces: [{ given: 'v', expr: 't - 7t^(1/2) + 12', t1: 25 }], conds: [{ q: 's', t: 0, val: 0 }], ta: 0, tb: 25,
      note: 'Put x = √t: x² − 7x + 12 = 0 ⇒ t = 9, 16. a = 1 − 3.5t^(−½) ⇒ a(4) = −0.75. Distance = 22.5 + 1.1667 + 7.8333 = 31.5 m.' },
    { name: 'Two s-conditions: a = 6t − 12 with s(1) = 5 and s(3) = 1', pieces: [{ given: 'a', expr: '6t - 12', t1: 4 }], conds: [{ q: 's', t: 1, val: 5 }, { q: 's', t: 3, val: 1 }], ta: 0, tb: 4,
      note: 's = t³ − 6t² + C₁t + C₂. Two equations: C₁ + C₂ = 10, 3C₁ + C₂ = 28 ⇒ C₁ = 9, C₂ = 1, so v = 3(t − 1)(t − 3).' },
    { name: '9709/42 M/J 21 Q7: piecewise a (6 + 4t, 14, 16 − 2t), starts from rest', pieces: [{ given: 'a', expr: '6 + 4t', t1: 2 }, { given: 'a', expr: '14', t1: 4 }, { given: 'a', expr: '16 - 2t', t1: 16 }],
      conds: [{ q: 'v', t: 0, val: 0 }, { q: 's', t: 0, val: 0 }], ta: 8, tb: 16, find: { q: 'v', V: 55 },
      note: 'No sudden change in velocity: v(2) = 20, v(4) = 48, then v = 16t − t². v = 55 at t = 5 and 11. Decelerating for 8 < t ≤ 16: distance 341⅓ m.' },
    { name: '9709/41 O/N 24 Q8: a = 0.6t − 2.7, passes O at 4.2 m s⁻¹; distance between rests', pieces: [{ given: 'a', expr: '0.6t - 2.7', t1: 9 }], conds: [{ q: 'v', t: 0, val: 4.2 }, { q: 's', t: 0, val: 0 }], ta: 2, tb: 7,
      note: 'v = 0.3t² − 2.7t + 4.2 = 0.3(t − 2)(t − 7). s = 0.1t³ − 1.35t² + 4.2t: |s(7) − s(2)| = 6.25 m.' },
    { name: '9709/43 M/J 22 Q7: v = 9/4 + b/(t + 1)² − ct²; v(5) = 0, a(5) = −13/12', pieces: [{ given: 'v', expr: '9/4 + b/(t+1)^2 - ct^2', t1: 10 }], conds: [{ q: 'v', t: 5, val: 0 }, { q: 'a', t: 5, val: -13 / 12 }, { q: 's', t: 0, val: 0 }], ta: 0, tb: 10,
      note: 'Two linear equations in b and c ⇒ b = 9, c = 0.1. Distance in the first 10 s = 14.583 + 17.235 = 31.8 m (350/11).' },
    { name: '9709/43 M/J 23 Q5: a = k t^½ (0 ≤ t ≤ 9), then v = 0.2(t − 9)² + 1.8', pieces: [{ given: 'a', expr: 'k t^(1/2)', t1: 9 }, { given: 'v', expr: '0.2(t-9)^2 + 1.8', t1: 18 }],
      conds: [{ q: 'v', t: 0, val: 0 }, { q: 's', t: 0, val: 0 }, { q: 'v', t: 9, val: 1.8 }], ta: 0, tb: 10,
      note: 'v = (2k/3)t^(3/2) and v(9) = 1.8 ⇒ k = 0.1. Distance 0–9 = 6.48 m, 9–18 = 64.8 m (ten times as far). Greatest a in the first 10 s is 0.4 at t = 10.' },
    { name: '9709/42 F/M 23 Q3: a = 4t^½ from rest at O', pieces: [{ given: 'a', expr: '4t^(1/2)', t1: 9 }], conds: [{ q: 'v', t: 0, val: 0 }, { q: 's', t: 0, val: 0 }], ta: 0, tb: 9,
      note: 'v = (8/3)t^(3/2) ⇒ v(9) = 72. s = (16/15)t^(5/2); s and v are numerically equal when t = 5/2.' }
  ];
  var presetCtl = ui.presets(presetCard, PRESETS, function (p) {
    clock.pause();
    nSel.set(String(p.pieces.length), true);
    t0p.set({ T0: 0 }, true);
    p.pieces.forEach(function (pp, i) { pieces[i].giv.set(pp.given, true); pieces[i].inp.value = pp.expr; pieces[i].tp.set({ t1: pp.t1 }, true); });
    conds.forEach(function (c, i) { var d = p.conds[i] || CDEF[i]; c.qs.set(d.q, true); c.cp.set({ t: d.t, val: d.val }, true); });
    wp.set({ ta: p.ta, tb: p.tb }, true);
    findQ.set(p.find ? p.find.q : 'v', true); fp.set({ V: p.find ? p.find.V : 0 }, true);
    termPieceSel.el.value = '0';
    refreshPieces(); update(); clock.seek(0);
  });

  ui.notes(noteCard, [
    'Differentiate: s → v → a. Integrate: a → v → s, and <b>always add a constant</b>; find it from a condition.',
    'Distance is not ∫v dt when v changes sign: find when v = 0, split the interval there, and add the sizes of the displacements.',
    'A double root of v (the graph touches the t-axis) is instantaneous rest <b>without</b> a change of direction — do not split there.',
    'Max/min velocity: where a = 0 (and check the ends of the interval).',
    'For a(t) with two conditions on s, write s = ∬a dt + C₁t + C₂ and solve the two equations.',
    'Piecewise motion: “no sudden change in velocity” means v (and s) carry on from one interval to the next.',
    'Fractional powers need t ≥ 0; t⁻¹ cannot be integrated in 9709 (needs ln).'
  ]);

  /* ---------- compute ---------- */
  var M = null, IA = null, T0 = 0, T1 = 1;
  function update() {
    var n = Number(nSel.get()), model = { pieces: [], conds: [] }, t = t0p.values.T0;
    for (var i = 0; i < n; i++) {
      var P = pieces[i];
      model.pieces.push({ t0: t, t1: P.tp.values.t1, given: P.giv.get(), expr: P.inp.value });
      t = P.tp.values.t1;
    }
    conds.forEach(function (c) { model.conds.push({ q: c.qs.get(), t: c.cp.values.t, val: c.cp.values.val }); });
    M = C.analyse(model);
    var need = M.needed || 0;
    conds.forEach(function (c, i) { c.box.style.display = i < need ? '' : 'none'; });
    condHead.innerHTML = M.unknowns && M.unknowns.length && need
      ? 'Need ' + need + ' condition' + (need > 1 ? 's' : '') + ' to find ' + M.unknowns.slice(0, need).map(function (u) { return C.fmtSym(u, true); }).join(', ') + '.' +
        (M.unknowns.length > need ? ' The other constants (' + M.unknowns.slice(need).map(function (u) { return C.fmtSym(u, true); }).join(', ') + ') come from continuity at the joins.' : '')
      : (M.error ? '' : 'No constants to find: s(t) is given.');
    T0 = model.pieces[0].t0; T1 = model.pieces[n - 1].t1;
    if (!(T1 > T0)) T1 = T0 + 1;
    var ta = U.clamp(wp.values.ta, T0, T1), tb = U.clamp(wp.values.tb, T0, T1);
    IA = M.ok ? C.intervalAnalysis(M, Math.min(ta, tb), Math.max(ta, tb)) : null;
    if (IA && !IA.ok) IA = null;
    clock.setDuration(T1 - T0);
    try { ui.writeHash({ n: n, T0: T0, e1: pieces[0].inp.value, g1: pieces[0].giv.get(), t1: pieces[0].tp.values.t1, ta: wp.values.ta, tb: wp.values.tb }); } catch (e) { /* ignore */ }
    drawScene(); drawPlots(); readout(); drawTable();
  }
  function tNow() { return T0 + clock.t; }

  /* ---------- scene ---------- */
  function drawScene() {
    lay = null;
    var col = ui.colors(), c = vp.begin();
    if (!M || !M.ok) { D.label(c, M && M.error ? 'Fix the expression or conditions' : '', vp.w / 2, vp.h / 2, col.warn, { bold: true }); return; }
    var lo = 0, hi = 0;
    for (var i = 0; i <= 300; i++) { var s = M.s(T0 + (T1 - T0) * i / 300); if (isFinite(s)) { lo = Math.min(lo, s); hi = Math.max(hi, s); } }
    if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
    var span = hi - lo, W = vp.w, H = vp.h, x0 = 26, x1 = W - 26, y = H * 0.58;
    function X(s) { return x0 + (s - lo + 0.04 * span) / (span * 1.08) * (x1 - x0); }
    var REAL = SIM.scene.real(), SC = SIM.scene;
    if (REAL) {   // a straight road under a soft sky; the particle becomes a car
      SC.sky(c, 0, 0, W, y, { horizon: y });
      SC.tree(c, W * 0.18, y, Math.min(46, y * 0.6)); SC.tree(c, W * 0.71, y, Math.min(38, y * 0.5));
      SC.ground(c, 0, W, y, { kind: 'road', depth: H - y + 2 });
    }
    c.strokeStyle = col.muted; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
    U.niceTicks(lo, hi, Math.max(3, Math.floor((x1 - x0) / 80))).ticks.forEach(function (v) {
      if (v < lo - 0.04 * span || v > hi + 0.04 * span) return;
      if (REAL) distPost(c, X(v), y);
      c.beginPath(); c.moveTo(X(v), y - 3); c.lineTo(X(v), y + 3); c.stroke(); D.label(c, U.num(v, 6), X(v), y + 13, col.muted, { size: 10, bg: REAL });
    });
    D.label(c, 'O', X(0), y - 12, col.ink, { size: 11, bold: true });
    var t = tNow(), s0 = M.s(t), v0 = M.v(t);
    if (!isFinite(s0)) return;
    var ay = y - 26;
    if (REAL) {
      // car length scales with the canvas; it faces the way it is moving (or about to move); wheels turn by the distance driven
      var L = U.clamp(W * 0.07, 34, 64), wr = L * 0.1, vf = isFinite(v0) && Math.abs(v0) > 1e-9 ? v0 : M.v(Math.min(T1, t + 1e-3 * (T1 - T0 || 1)));
      var face = vf < 0 ? -1 : 1, spin = (X(s0) - X(0)) / wr;
      if (isFinite(v0) && Math.abs(v0) > 1e-9) SC.motionLines(c, X(s0) - face * L * 0.45, y - L * 0.18, face, 0, Math.min(50, Math.abs(v0) * 3), null, 6);
      SC.car(c, X(s0), y, L, 0, { kind: 'car', facing: face, wheel: -spin * face, color: '#e9a0a0' });
      ay = y - L * 0.42 - wr - 12;
    } else D.particle(c, X(s0), y - 10, 8, { fill: col.s1 });
    if (isFinite(v0) && Math.abs(v0) > 1e-9) D.arrow(c, X(s0), ay, X(s0) + U.sgn(v0) * (12 + Math.min(60, Math.abs(v0) * 3)), ay, col.velocity, { label: 'v = ' + U.sf(v0) + ' m/s', width: 2 });
    D.label(c, 's / m  (positive →)', x1, 10, col.muted, { size: 10, align: 'right' });
    // t_a / t_b markers under the line (tap to type) and the layout used by direct manipulation
    lay = { X: X, y: y, body: [X(s0), y - 10], ta: null, tb: null };
    if (IA) {
      var tA = Math.min(U.clamp(wp.values.ta, T0, T1), U.clamp(wp.values.tb, T0, T1)), tB = Math.max(U.clamp(wp.values.ta, T0, T1), U.clamp(wp.values.tb, T0, T1));
      [['ta', tA, 't_a'], ['tb', tB, 't_b']].forEach(function (q) {
        var sq = M.s(q[1]); if (!isFinite(sq)) return;
        var mx = X(sq), my = y + 26;
        c.save(); c.fillStyle = col.accent; c.beginPath(); c.moveTo(mx, y + 4); c.lineTo(mx - 5, y + 13); c.lineTo(mx + 5, y + 13); c.closePath(); c.fill(); c.restore();
        D.label(c, q[2], mx, my, col.accent, { size: 10, bold: true });
        lay[q[0]] = [mx, my - 6];
      });
    }
    if (ix) ix.paint(c);
  }

  /** a small roadside distance post (soft pastel) standing at the road edge at screen x */
  function distPost(c, x, y) {
    var dk = SIM.scene.dark();
    c.save(); c.fillStyle = dk ? '#cfcbd8' : '#fbf8f2'; c.strokeStyle = 'rgba(90,80,70,.3)'; c.lineWidth = 1;
    c.beginPath(); if (c.roundRect) c.roundRect(x - 2.5, y - 16, 5, 16, 2); else c.rect(x - 2.5, y - 16, 5, 16); c.fill(); c.stroke();
    c.fillStyle = dk ? '#c98a8a' : '#f2a7a0'; c.fillRect(x - 2.5, y - 14, 5, 3.5);
    c.restore();
  }

  /* ---------- plots ---------- */
  function drawPlots() {
    var col = ui.colors(), x = [T0, T1];
    if (!M || !M.ok) {
      [pS, pV, pA].forEach(function (P) { P.draw({ x: x, series: [], title: 'no graph — see the message on the right' }); });
      return;
    }
    var joins = M.pieces.slice(1).map(function (p) { return p.t0; });
    var ta = IA ? Math.min(U.clamp(wp.values.ta, T0, T1), U.clamp(wp.values.tb, T0, T1)) : T0, tb = IA ? Math.max(U.clamp(wp.values.ta, T0, T1), U.clamp(wp.values.tb, T0, T1)) : T1;
    var vl = [{ x: ta, label: 't_a', color: col.accent }, { x: tb, label: 't_b', color: col.accent }];
    var mS = [], mV = [], mA = [];
    if (IA) {
      IA.rest.forEach(function (r) {
        var lab = r.kind === 'touch' ? 'rest, no reversal' : r.kind === 'end' ? 'v = 0' : 'turns';
        mV.push({ x: r.t, y: 0, label: lab + ' t = ' + U.sf(r.t), color: r.kind === 'touch' ? col.warn : col.ink });
        mS.push({ x: r.t, y: M.s(r.t), color: col.ink });
      });
      IA.turning.forEach(function (tp) { if (isFinite(tp.v)) { mV.push({ x: tp.t, y: tp.v, label: 'a = 0', color: col.muted }); mA.push({ x: tp.t, y: 0, color: col.muted }); } });
    }
    var cur = tNow();
    var fS = M.s, fV = M.v, fA = M.a;
    var vShade = function (t) { return t >= ta - 1e-12 && t <= tb + 1e-12 ? fV(t) : NaN; };
    pS.draw({ x: x, series: [{ fn: fS, color: col.s1, breaks: joins, steps: 600 }], cursor: cur, markers: mS, vlines: vl });
    pV.draw({ x: x, series: [{ fn: vShade, color: col.velocity, shade: true, breaks: joins.concat([ta, tb]), steps: 600, width: 0.01 }, { fn: fV, color: col.velocity, breaks: joins, steps: 600 }], cursor: cur, markers: mV, vlines: vl });
    pA.draw({ x: x, series: [{ fn: fA, color: col.accel, breaks: joins, steps: 600 }], cursor: cur, markers: mA, vlines: vl });
  }

  /* ---------- table ---------- */
  function drawTable() {
    if (!IA) { tabDiv.innerHTML = '<div class="subtle">' + (M && M.error ? ui.esc(M.error) : 'Choose a time interval with t<sub>b</sub> &gt; t<sub>a</sub>.') + '</div>'; return; }
    var s3 = U.sf;
    var rows = IA.table.map(function (r) {
      return '<tr><td>' + s3(r.t0) + ' → ' + s3(r.t1) + '</td><td>' + (r.dir > 0 ? 'forwards' : r.dir < 0 ? 'backwards' : 'at rest') + '</td><td>' + s3(r.s0) + '</td><td>' + s3(r.s1) + '</td><td>' + s3(r.ds) + '</td><td>' + s3(Math.abs(r.ds)) + '</td></tr>';
    }).join('');
    tabDiv.innerHTML = '<table class="tbl"><tr><th>t / s</th><th>moving</th><th>s at start</th><th>s at end</th><th>Δs</th><th>|Δs|</th></tr>' + rows +
      '<tr><th>total</th><td></td><td></td><td></td><td>' + s3(IA.displacement) + '</td><td>' + s3(IA.distance) + '</td></tr></table>';
  }

  /* ---------- live working ---------- */
  function affText(aff, target) {
    // Σ coef·sym = target − k0
    var parts = [];
    M.unknowns.forEach(function (u) {
      var k = aff.co[u] || 0; if (Math.abs(k) < 1e-12) return;
      var mag = C.fmtMag(Math.abs(k));
      parts.push({ neg: k < 0, txt: (Math.abs(Math.abs(k) - 1) < 1e-12 ? '' : mag) + C.fmtSym(u, true) });
    });
    if (!parts.length) return '0 = ' + U.sf(target - aff.k0);
    var lhs = parts.map(function (p, i) { return i === 0 ? (p.neg ? '−' : '') + p.txt : (p.neg ? ' − ' : ' + ') + p.txt; }).join('');
    var r = target - aff.k0;
    return lhs + ' = ' + C.fmtMag(Math.abs(r)).replace(/^/, r < -1e-12 ? '−' : '');
  }
  /** 3 s.f., plus the exact value when it is a short exact decimal that 3 s.f. would round */
  function pr(x) {
    if (!isFinite(x)) return U.sf(x);
    var t = U.sf(x);
    for (var k = 0; k <= 3; k++) {
      var m = x * Math.pow(10, k);
      if (Math.abs(m - Math.round(m)) < 1e-7 * Math.max(1, Math.abs(m))) {
        var ex = (Math.round(m) / Math.pow(10, k)).toFixed(k).replace('-', '−');
        return Number(ex.replace('−', '-')) === Number(t.replace('−', '-')) ? t : t + ' (= ' + ex + ')';
      }
    }
    return t;
  }
  function readout() {
    if (!M) return;
    var s3 = U.sf;
    R.clear();
    R.badge('s = displacement from O, v = ds/dt, a = dv/dt. Positive direction: forwards.', 'info');
    if (M.error) {
      R.badge((M.lnBlocked ? 'Blocked: ' : 'Problem: ') + ui.esc(M.error), 'warn');
      R.render(); return;
    }
    M.warnings.forEach(function (w) { R.badge(w, 'warn'); });
    M.notes.forEach(function (w) { R.badge(w, 'info'); });
    var multi = M.pieces.length > 1;
    M.pieces.forEach(function (pc, i) {
      R.head((multi ? 'Interval ' + (i + 1) + ': ' : '') + U.num(pc.t0, 4) + ' ≤ t ≤ ' + U.num(pc.t1, 4) + ' — given ' + pc.given + '(t)');
      var sy = pc.sym;
      if (pc.given === 's') {
        R.html('<div class="expr">s = ' + C.format(sy.s) + '</div>');
        R.html('<div class="expr">v = ds/dt = ' + C.format(sy.v) + '</div>');
        R.html('<div class="expr">a = dv/dt = ' + C.format(sy.a) + '</div>');
      } else if (pc.given === 'v') {
        R.html('<div class="expr">v = ' + C.format(sy.v) + '</div>');
        R.html('<div class="expr">a = dv/dt = ' + C.format(sy.a) + '</div>');
        R.html('<div class="expr">s = ∫v dt = ' + C.format(sy.s) + '</div>');
      } else {
        R.html('<div class="expr">a = ' + C.format(sy.a) + '</div>');
        R.html('<div class="expr">v = ∫a dt = ' + C.format(sy.v) + '</div>');
        R.html('<div class="expr">s = ∫v dt = ' + C.format(sy.s) + '</div>');
      }
    });
    if (M.unknowns.length) {
      R.head('Finding the constants');
      M.equations.forEach(function (e) {
        R.eq(e.kind === 'cond' ? e.label.replace(/^([sva])\(/, '$1(') : e.label, '', affText(e.aff, e.target), '', 'Each given condition (a value of s, v or a at a known time, or continuity at a join) gives one equation in the unknown constants.');
      });
      M.unknowns.forEach(function (u) { R.eq(C.fmtSym(u, true), 'solving the equation' + (M.unknowns.length > 1 ? 's simultaneously' : ''), pr(M.values[u]) + (C.fmtMag(Math.abs(M.values[u])).charAt(0) === '(' ? ' = ' + (M.values[u] < 0 ? '−' : '') + C.fmtMag(Math.abs(M.values[u])) : ''), '', 'Solve these equations for the constants of integration (simultaneously if there is more than one).'); });
      R.head('With the constants substituted');
      M.pieces.forEach(function (pc, i) {
        var pre = multi ? '(' + U.num(pc.t0, 4) + ' ≤ t ≤ ' + U.num(pc.t1, 4) + ')  ' : '';
        R.html('<div class="expr">' + pre + 's = ' + C.format(pc.num.s) + '</div>');
        R.html('<div class="expr">' + pre + 'v = ' + C.format(pc.num.v) + '</div>');
        R.html('<div class="expr">' + pre + 'a = ' + C.format(pc.num.a) + '</div>');
      });
    }
    if (IA) {
      var ta = IA.table.length ? IA.table[0].t0 : 0, tb = IA.table.length ? IA.table[IA.table.length - 1].t1 : 0;
      R.head('Motion for ' + s3(ta) + ' ≤ t ≤ ' + s3(tb));
      if (IA.restAll.length) R.badge('At rest throughout ' + IA.restAll.map(function (iv) { return s3(iv[0]) + ' ≤ t ≤ ' + s3(iv[1]); }).join(', '), 'info');
      if (!IA.rest.length && !IA.restAll.length) R.eq('v = 0', 'never in this interval', '—', '', 'Solve v(t) = 0: it has no root in this interval, so the particle never stops here.');
      IA.rest.forEach(function (r) {
        var why = r.kind === 'touch' ? 'double root: instantaneously at rest, NO change of direction' : r.kind === 'end' ? 'at an end of the interval' : r.kind === 'jump' ? 'velocity jumps through 0' : 'v changes sign: changes direction';
        R.eq('v = 0 at t', why, r.t, 's', 'Solve v(t) = 0. The particle changes direction only if v changes sign there.');
      });
      IA.turning.forEach(function (tp) { R.eq('a = 0 at t = ' + s3(tp.t), 'velocity there', tp.v, 'm s<sup>−1</sup>', 'v is greatest or least where dv/dt = a = 0: solve a(t) = 0, then substitute into v(t).'); });
      if (IA.vmax) R.eq('greatest v', 'at t = ' + s3(IA.vmax.t) + ' (check a = 0 points and the ends)', IA.vmax.v, 'm s<sup>−1</sup>', 'Compare v at the points where a = 0 and at the ends of the interval.');
      if (IA.vmin) R.eq('least v', 'at t = ' + s3(IA.vmin.t), IA.vmin.v, 'm s<sup>−1</sup>', 'Compare v at the points where a = 0 and at the ends of the interval.');
      IA.aInf.forEach(function (x) { R.badge('a is unbounded near t = ' + s3(x.t) + ' (a → ' + (x.sign > 0 ? '+' : '−') + '∞), so it has no ' + (x.sign > 0 ? 'greatest' : 'least') + ' value here', 'info'); });
      if (IA.amax) R.eq('greatest a', 'at t = ' + s3(IA.amax.t), IA.amax.a, 'm s<sup>−2</sup>', 'Compare a at its stationary points and at the ends of the interval.');
      if (IA.amin) R.eq('least a', 'at t = ' + s3(IA.amin.t), IA.amin.a, 'm s<sup>−2</sup>', 'Compare a at its stationary points and at the ends of the interval.');
      R.eq('displacement', 's(' + s3(tb) + ') − s(' + s3(ta) + ')', pr(IA.displacement), 'm', 'Displacement = ∫v dt from t_a to t_b = s(t_b) − s(t_a): backwards motion counts as negative.');
      R.eq('distance', IA.table.map(function (r) { return '|' + s3(r.ds) + '|'; }).join(' + '), pr(IA.distance), 'm', 'Distance ignores direction: split the interval where v = 0 and add the size of each part’s displacement.');
      var fq = findQ.get(), fv = fp.values.V, tw = C.timesWhen(M, fq, fv, T0, T1);
      R.eq(fq + ' = ' + s3(fv) + ' when t =', tw.length ? 'solving ' + fq + '(t) = ' + s3(fv) + ' for ' + s3(T0) + ' ≤ t ≤ ' + s3(T1) : 'no solution for ' + s3(T0) + ' ≤ t ≤ ' + s3(T1), tw.length ? tw.map(function (t) { return pr(t); }).join(', ') : '—', tw.length ? 's' : '', 'Set the expression equal to the given value and solve for t, keeping only roots inside the interval.');
    }
    var t = tNow();
    R.head('At t = ' + t.toFixed(2) + ' s');
    var sv = M.s(t), vv = M.v(t), av = M.a(t);
    R.eq('s', 'displacement', isFinite(sv) ? sv : '— (not defined)', isFinite(sv) ? 'm' : '', 'Substitute the current t into s(t).');
    R.eq('v', 'velocity', isFinite(vv) ? vv : '— (not defined)', isFinite(vv) ? 'm s<sup>−1</sup>' : '', 'v = ds/dt, evaluated at the current t.');
    R.eq('a', 'acceleration', isFinite(av) ? av : '— (not defined)', isFinite(av) ? 'm s<sup>−2</sup>' : '', 'a = dv/dt, evaluated at the current t.');
    R.render();
  }

  /* ---------- direct manipulation: drag the particle or the time cursor to scrub, drag t_a / t_b on the graphs, tap to type ---------- */
  var lay = null;
  function tStep() { var sp = T1 - T0; return sp > 40 ? 0.5 : 0.1; }
  function roundT(t) { var st = tStep(); return Number((Math.round(t / st) * st).toFixed(2)); }
  function setWin(k, t) {
    var sp = wp.rows[k].spec, o = {};
    o[k] = U.clamp(roundT(U.clamp(t, T0, T1)), Number(sp.min), Number(sp.max));
    if (o[k] !== wp.values[k]) { wp.set(o); ui.syncChips(); }
  }
  function seekT(t) { if (clock.playing) clock.pause(); clock.seek(U.clamp(t, T0, T1) - T0); }
  function askWin(k, at) {
    var sp = wp.rows[k].spec;
    ui.askNumber({ title: k === 'ta' ? 'Interval starts at t<sub>a</sub>' : 'Interval ends at t<sub>b</sub>', sub: 'Distance and displacement are found for t<sub>a</sub> ≤ t ≤ t<sub>b</sub>.',
      value: wp.values[k], min: Math.max(Number(sp.min), T0), max: Math.min(Number(sp.max), T1), step: tStep(), decimals: 2, unit: 's', at: at,
      quick: [T0, Math.round((T0 + T1) / 2), T1],
      onInput: function (v) { setWin(k, v); } });
  }
  function askTime(at) {
    ui.askNumber({ title: 'Time t', sub: 'Move the particle to this time.', value: Number(tNow().toFixed(2)), min: T0, max: T1, step: tStep(), decimals: 2, unit: 's', at: at,
      onInput: function (v) { seekT(v); } });
  }
  var ix = SIM.view.interact(cv, {
    handles: function () {
      if (!lay || !M || !M.ok) return [];
      var col = ui.colors(), hs = [{ id: 'body', x: lay.body[0], y: lay.body[1], color: col.s1 }];
      if (lay.ta) hs.push({ id: 'ta', x: lay.ta[0], y: lay.ta[1], r: 14 });
      if (lay.tb) hs.push({ id: 'tb', x: lay.tb[0], y: lay.tb[1], r: 14 });
      return hs;
    },
    onDrag: function (hd, x) {
      if (hd.id !== 'body') return;
      // scrub: the time whose position is nearest the pointer (ties go to the time nearest now)
      var best = tNow(), bc = Infinity, now = tNow(), span = T1 - T0;
      for (var i = 0; i <= 600; i++) {
        var t = T0 + span * i / 600, sx = M.s(t); if (!isFinite(sx)) continue;
        var cost = Math.abs(lay.X(sx) - x) + 25 * Math.abs(t - now) / span;
        if (cost < bc) { bc = cost; best = t; }
      }
      seekT(best);
    },
    onTap: function (hd, x, y) { if (hd.id === 'body') askTime({ x: x, y: y }); else askWin(hd.id, { x: x, y: y }); },
    onHover: function () { drawScene(); }
  });
  // the same gestures on each graph: drag the t_a / t_b lines or the time cursor
  [[pS, 's'], [pV, 'v'], [pA, 'a']].forEach(function (pp) {
    var P = pp[0], q = pp[1];
    P.draw = function (spec) { SIM.plot.Plot.prototype.draw.call(this, spec); if (this._ix) this._ix.paint(this.ctx); };
    function invX(x) { var a = P.px(0), b = P.px(1); return (x - a) / (b - a); }
    P._ix = SIM.view.interact(P.canvas, {
      handles: function () {
        if (!P.px || !M || !M.ok) return [];
        var col = ui.colors(), box = P.box, hs = [], cur = tNow(), fy = M[q](cur), yC = isFinite(fy) ? P.py(fy) : box.T + box.H - 10;
        hs.push({ id: 'cur', x: P.px(cur), y: U.clamp(yC, box.T, box.T + box.H), color: col.accent, r: 16 });
        if (IA) {
          hs.push({ id: 'ta', x: P.px(U.clamp(wp.values.ta, T0, T1)), y: box.T + 10, r: 16 });
          hs.push({ id: 'tb', x: P.px(U.clamp(wp.values.tb, T0, T1)), y: box.T + 10, r: 16 });
        }
        return hs;
      },
      onDrag: function (hd, x) { var t = invX(x); if (hd.id === 'cur') seekT(t); else setWin(hd.id, t); },
      onTap: function (hd, x, y) { var at = { canvas: P.canvas, x: x, y: y }; if (hd.id === 'cur') askTime(at); else askWin(hd.id, at); },
      onHover: function () { drawPlots(); }
    });
  });
  ui.stageTip('Drag the particle (or the cursor on a graph) to move through time · drag t_a / t_b on a graph to change the interval · tap to type');

  ui.onTheme(function () { drawScene(); drawPlots(); });
  vp.onResize = drawScene;
  var hsh = ui.readHash();
  if (typeof hsh.e1 === 'string' && hsh.e1) { pieces[0].inp.value = hsh.e1; if (['s', 'v', 'a'].indexOf(hsh.g1) >= 0) pieces[0].giv.set(hsh.g1, true); }
  if (typeof hsh.t1 === 'number') pieces[0].tp.set({ t1: hsh.t1 }, true);
  if (typeof hsh.ta === 'number' && typeof hsh.tb === 'number') wp.set({ ta: hsh.ta, tb: hsh.tb }, true);
  refreshPieces();
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
