<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>

<script src="../../core/plot.js"></script>

<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, FO = SIM.forces;
  var g = 10, NMAX = 5, SUB = ['₁', '₂', '₃', '₄', '₅'], HSUB = function (i) { return '<sub>' + (i + 1) + '</sub>'; };
  var pg = ui.page({ title: 'Coplanar forces at a point: resultant and equilibrium', g: g, tags: ['9709 4.1 Forces & equilibrium'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 18 });
  ui.legend(sceneCard, [
    { color: 'var(--c-s1)', label: 'F₁' }, { color: 'var(--c-s2)', label: 'F₂' }, { color: 'var(--c-s3)', label: 'F₃' },
    { color: 'var(--c-s4)', label: 'F₄' }, { color: 'var(--c-tension)', label: 'F₅' },
    { color: 'var(--c-resultant)', label: 'resultant R' }, { color: 'var(--c-component)', label: 'components (dashed)' }]);
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var polyCv = ui.canvas(plotWrap);
  var vp2 = new SIM.view.Viewport(polyCv, { pad: 26 });
  var tableBox = ui.h('div', { style: 'overflow-x:auto' }); plotWrap.appendChild(tableBox);

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  /* ---------- controls ---------- */
  var modeSel = ui.select(paramCard, { label: 'Mode', value: 'resultant', options: [
    { value: 'resultant', label: 'Resultant of the forces' },
    { value: 'solve', label: 'Equilibrium: solve for 2 unknowns' },
    { value: 'constraint', label: 'Resultant has no x- or y-component (1 unknown)' }] }, update);
  var unkOpts = [], i;
  for (i = 0; i < NMAX; i++) unkOpts.push({ value: 'F' + i, label: 'magnitude F' + SUB[i] });
  for (i = 0; i < NMAX; i++) unkOpts.push({ value: 'th' + i, label: 'direction θ' + SUB[i] });
  unkOpts.push({ value: 'k', label: 'F (the common force in c × F)' });
  var u1Sel = ui.select(paramCard, { label: 'Unknown 1', value: 'F2', options: unkOpts }, update);
  var u2Sel = ui.select(paramCard, { label: 'Unknown 2', value: 'th2', options: unkOpts }, update);
  var axisSel = ui.select(paramCard, { label: 'Condition', value: 'y', options: [
    { value: 'y', label: 'resultant has no y-component (Y = 0)' }, { value: 'x', label: 'resultant has no x-component (X = 0)' }] }, update);
  var ucOpts = []; for (i = 0; i < NMAX; i++) ucOpts.push({ value: 'F' + i, label: 'magnitude F' + SUB[i] }); ucOpts.push({ value: 'k', label: 'F (the common force in c × F)' });
  var ucSel = ui.select(paramCard, { label: 'Unknown', value: 'F1', options: ucOpts }, update);
  var solSel = ui.select(paramCard, { label: 'Show solution', value: '0', options: [{ value: '0', label: 'solution 1' }, { value: '1', label: 'solution 2' }] }, update);
  var compsAll = ui.toggle(paramCard, { label: 'Dashed components of every force (resultant always shown)' }, update);
  var angleMode = ui.select(paramCard, { label: 'Angle arcs', value: 'exam', options: [
    { value: 'exam', label: 'from the nearest x-direction (exam style)' }, { value: 'std', label: 'anticlockwise from +x (0–360°)' }] }, update);
  var realSceneSel = ui.select(paramCard, { label: 'Real-life scenario', value: 'harbour', options: [
    { value: 'harbour', label: 'Harbour tugboats & cargo barge' },
    { value: 'space', label: 'Spacecraft & thruster drones' },
    { value: 'crane', label: 'Heavy-lift winches & steel ring' },
    { value: 'tug', label: 'Lawn tug-of-war (people & ring)' }] }, function () { drawScene(); });

  var top = ui.params(paramCard, [{ key: 'n', label: 'Number of forces', sym: 'n', unit: '', min: 2, max: NMAX, step: 1, value: 3 }], update);
  var defaults = [[10, 0], [20, 90], [15, 210], [12, 300], [8, 135]];
  var blocks = [];
  // exact numbers for each force live in a collapsed section: the main way in is drawing on the diagram
  var adv = ui.h('details', { class: 'advanced' }, [ui.h('summary', { text: 'Exact values for each force (or draw them on the diagram)' })]);
  paramCard.appendChild(adv);
  for (i = 0; i < NMAX; i++) {
    var box = ui.h('div', { style: 'border-top:1px solid var(--line);margin-top:8px;padding-top:4px' });
    adv.appendChild(box);
    box.appendChild(ui.h('div', { html: '<b>Force ' + (i + 1) + '</b>', style: 'font-size:13.5px;margin-top:4px' }));
    var type = ui.select(box, { label: 'F' + SUB[i] + ' is given as', value: 'N', options: [{ value: 'N', label: 'a number of newtons' }, { value: 'mult', label: 'a multiple of F (c × F)' }] }, update);
    var p = ui.params(box, [
      { key: 'F', label: 'Magnitude', sym: 'F' + HSUB(i), unit: 'N', min: 0, max: 200, step: 0.1, value: defaults[i][0] },
      { key: 'th', label: 'Direction (anticlockwise from +x)', sym: 'θ' + HSUB(i), unit: '°', min: 0, max: 360, step: 0.5, value: defaults[i][1] },
      { key: 'c', label: 'Multiple of F', sym: 'c' + HSUB(i), unit: '', min: 0, max: 10, step: 0.5, value: 1 }
    ], update);
    blocks.push({ box: box, type: type, p: p, locked: {} });
  }
  var kp = ui.params(paramCard, [{ key: 'k', label: 'Common force F (used by every c × F force)', sym: 'F', unit: 'N', min: 0, max: 200, step: 0.01, value: 10 }], update);
  var kLocked = false;

  var exam = ui.examToggle(outCard, outCard);
  exam.el.querySelector('input').addEventListener('change', function () { update(); });
  var R = ui.Readout(outCard);

  var presetCtl = ui.presets(presetCard, [
    { name: 'Resultant of three forces: 10 N, 20 N, 15 N', mode: 'resultant',
      forces: [[10, 0], [20, 90], [15, 210]], note: 'X = 10 − 15 cos 30°, Y = 20 − 15 sin 30°. R = 12.9 N at 76.5° above the −x direction (103.5° from +x).' },
    { name: '9709/41 M/J 24 Q2(b): 20 N at 60° and F = 10 N downwards', mode: 'resultant',
      forces: [[20, 60], [10, 270]], note: 'MS: X = 20 cos 60° = 10, Y = 20 sin 60° − 10 = 7.32 ⇒ R = 12.4 N at 36.2° above the x-direction.' },
    { name: '9709/41 M/J 24 Q2(a): resultant has no y-component, find F', mode: 'constraint', axis: 'y', uc: 'F1',
      forces: [[20, 60], [10, 270]], note: 'Y = 20 sin 60° − F = 0 ⇒ F = 17.3 (MS: 17.3 or 10√3).' },
    { name: '9709/41 O/N 24 Q3: 52 N, 39 N and P N in equilibrium, find P and θ', mode: 'solve', u1: 'F2', u2: 'th2',
      forces: [[39, 0], [52, 90], [65, 233]], note: 'In the paper θ is measured below the −x direction: θ = 233.1° − 180° = 53.1°. MS: P cos θ = 39, P sin θ = 52 ⇒ P = 65, θ = 53.1.' },
    { name: '9709/42 F/M 26 Q3: F N, 2F N and 20 N in equilibrium, find F and θ', mode: 'solve', u1: 'k', u2: 'th0',
      forces: [[20, 50], [0, 270, 1], [0, 210, 2]], k: 7.5, note: '20 sin θ = F + 2F sin 30°, 20 cos θ = 2F cos 30° ⇒ tan θ = 2/√3. MS: θ = 49.1, F = 7.56.' },
    { name: '9709/41 M/J 26 Q1: four forces 55 N, 23 N, 20 N, 16 N, find the resultant', mode: 'resultant',
      forces: [[55, 30], [16, 180], [23, 345], [20, 220]], note: '55 N is 60° from the upward vertical (30° above +x); 20 N is 40° below the −x direction. MS: 39.5 N at 12.7° above the horizontal (to the right).' },
    { name: 'Two unknown magnitudes with known directions (Cramer’s rule)', mode: 'solve', u1: 'F1', u2: 'F2',
      forces: [[30, 270], [20, 30], [20, 135]], note: 'det = sin(θ₃ − θ₂) = sin 105°. P = 22.0 N, Q = 26.9 N.' },
    { name: 'Unknown forces along the same line: no unique solution', mode: 'solve', u1: 'F1', u2: 'F2',
      forces: [[10, 90], [5, 0], [5, 180]], note: 'Both unknowns are horizontal, so nothing can balance the vertical 10 N: det = sin 180° = 0.' },
    { name: 'A solved magnitude comes out negative', mode: 'solve', u1: 'F1', u2: 'F2',
      forces: [[20, 45], [5, 0], [5, 90]], note: 'P and Q would both have to be −14.1 N: the forces must act in the opposite directions to those drawn.' },
    { name: 'Two unknown directions, both 10 N: two mirror-image solutions', mode: 'solve', u1: 'th1', u2: 'th2',
      forces: [[10, 270], [10, 0], [10, 90]], note: 'The forces at 30° and 150° (or 150° and 30°) both close the triangle. Switch “Show solution”.' },
    { name: 'Five forces: the polygon closes only in equilibrium', mode: 'resultant',
      forces: [[40, 0], [30, 72], [50, 150], [20, 230], [35, 300]], note: 'The force polygon does not close, so the dashed side from start to finish is the resultant.' }
  ], function (pr) {
    modeSel.set(pr.mode, true);
    if (pr.u1) u1Sel.set(pr.u1, true); if (pr.u2) u2Sel.set(pr.u2, true);
    if (pr.axis) axisSel.set(pr.axis, true); if (pr.uc) ucSel.set(pr.uc, true);
    solSel.set('0', true); angleMode.set('exam', true);
    top.set({ n: pr.forces.length }, true);
    pr.forces.forEach(function (fv, j) {
      var b = blocks[j]; b.type.set(fv.length > 2 ? 'mult' : 'N', true);
      unlockAll();
      b.p.set(fv.length > 2 ? { F: b.p.values.F, th: fv[1], c: fv[2] } : { F: fv[0], th: fv[1] }, true);
    });
    if (pr.k !== undefined) kp.set({ k: pr.k }, true);
    update();
  });

  ui.notes(noteCard, [
    'Check which line each angle is measured from. “60° from the vertical” is 30° from the horizontal: then the <b>horizontal</b> component uses <b>sin 60°</b>.',
    'sin/cos swap: the component <b>next to</b> the angle uses cos, the one <b>opposite</b> it uses sin.',
    'Signs: give every component a sign from the diagram (right and up positive) before adding. A force pointing left has a negative x-component even if its angle is acute.',
    'Direction of the resultant: tan⁻¹(|Y| ÷ |X|) only gives the acute angle. Say which way it points, e.g. “76.5° above the −x direction”, and mark it on a diagram.',
    'Equilibrium ⇔ X = 0 and Y = 0 ⇔ the force polygon (tip to tail) closes.',
    'A negative magnitude from simultaneous equations means the force acts the other way; it is not a valid answer for a magnitude.',
    'Lami’s theorem / the triangle of forces are allowed alternatives but not required for 9709: resolving always works.',
    'Take g = 10 m s<sup>−2</sup> (9709 papers say “use 10”).'
  ]);

  /* ---------- model ---------- */
  function parseU(v) { if (v === 'k') return { kind: 'k' }; var mm = /^(F|th)(\d)$/.exec(v); return { kind: mm[1], i: Number(mm[2]) }; }
  function unlockAll() {
    blocks.forEach(function (b) { ['F', 'th'].forEach(function (key) { if (b.locked[key]) { b.p.lock(key, false); b.p.set(obj(key, b.p.values[key]), true); b.locked[key] = false; } }); });
    if (kLocked) { kp.lock('k', false); kp.set({ k: kp.values.k }, true); kLocked = false; }
  }
  function obj(k, v) { var o = {}; o[k] = v; return o; }
  function isUnknown(M, j, kind) {
    return (M.unk || []).some(function (u) { return u.kind === kind && u.i === j; });
  }
  var M = null;
  function compute() {
    var n = Math.round(top.values.n), list = [], k = kp.values.k;
    for (var j = 0; j < n; j++) {
      var b = blocks[j]; list.push({ F: b.p.values.F, th: b.p.values.th, c: b.type.get() === 'mult' ? b.p.values.c : null });
    }
    var out = { n: n, list: list, k: k, mode: modeSel.get(), unk: [], eff: null, sol: null, con: null };
    if (out.mode === 'solve') {
      out.unk = [parseU(u1Sel.get()), parseU(u2Sel.get())];
      out.sol = FO.solveEquilibrium(list, k, out.unk);
      if (out.sol.solutions.length) {
        out.solIdx = Math.min(Number(solSel.get()), out.sol.solutions.length - 1);
        var so = out.sol.solutions[out.solIdx]; out.eff = { list: so.list, k: so.k };
      }
    } else if (out.mode === 'constraint') {
      out.unk = [parseU(ucSel.get())];
      out.con = FO.solveConstraint(list, k, out.unk[0], axisSel.get());
      if (out.con.list) out.eff = { list: out.con.list, k: out.con.k };
    } else out.eff = { list: list, k: k };
    out.res = out.eff ? FO.resultant(out.eff.list, out.eff.k) : null;
    return out;
  }
  function update() {
    unlockAll();
    var n = Math.round(top.values.n), anyMult = false;
    blocks.forEach(function (b, j) {
      b.box.style.display = j < n ? '' : 'none';
      var mult = b.type.get() === 'mult'; if (j < n && mult) anyMult = true;
      b.p.show('F', !mult); b.p.show('c', mult);
    });
    var mode = modeSel.get();
    u1Sel.row.style.display = u2Sel.row.style.display = mode === 'solve' ? '' : 'none';
    axisSel.row.style.display = ucSel.row.style.display = mode === 'constraint' ? '' : 'none';
    M = compute();
    kp.show('k', anyMult);
    solSel.row.style.display = M.sol && M.sol.solutions.length > 1 ? '' : 'none';
    // lock the unknown sliders and show solved values in them
    M.unk.forEach(function (u, j) {
      var val = null;
      if (M.sol && M.sol.solutions.length) val = M.sol.solutions[M.solIdx].vals[j];
      else if (M.con && M.con.value !== undefined) val = M.con.value;
      if (u.kind === 'k') { kp.lock('k', true, val === null ? undefined : val); kLocked = true; }
      else if (u.i < n) {
        var key = u.kind === 'F' ? 'F' : 'th', b = blocks[u.i];
        b.p.lock(key, true, val === null ? undefined : val); b.locked[key] = true;
      }
    });
    tableBox.classList.toggle('exam-hidden', exam.get());
    var hv = {}; hv.n = n; hv.mode = mode;
    blocks.forEach(function (b, j) { if (j < n) { hv['F' + j] = b.p.values.F; hv['th' + j] = b.p.values.th; hv['c' + j] = b.p.values.c; hv['t' + j] = b.type.get(); } });
    ui.writeHash(hv);
    if (addBtn) addBtn.show(n < NMAX);
    drawScene(); drawPolygon(); drawTable(); readout();
  }

  /* ---------- drawing helpers ---------- */
  function forceColor(col, j) { return [col.s1, col.s2, col.s3, col.s4, col.tension][j % 5]; }
  function fname(j) { return 'F' + SUB[j]; }
  /** list of drawable forces: {j, mag, th, unknown} — unknown forces without a solution are left out */
  function drawList() {
    var out = [];
    var src = M.eff ? M.eff : { list: M.list, k: M.k };
    src.list.forEach(function (f, j) {
      var unknownForce = M.unk.some(function (u) { return (u.kind !== 'k' && u.i === j) || (u.kind === 'k' && FO.isMult(f)); });
      if (!M.eff && unknownForce) return;
      var mag = FO.magOf(f, src.k);
      if (!isFinite(mag)) return;
      out.push({ j: j, mag: mag, th: f.th, unknown: unknownForce, mult: FO.isMult(f), c: f.c });
    });
    return out;
  }
  function valueLabel(fd) {
    var hide = exam.get() && fd.unknown;
    var base = fname(fd.j) + (fd.mult ? ' = ' + (fd.c === 1 ? '' : U.num(fd.c, 3)) + 'F' : '');
    return hide ? base : base + ' = ' + U.num(fd.mag, 3) + ' N';
  }
  function arcFor(c, x, y, r, th, color, label) {
    var a = FO.norm360(th), d = FO.dirInfo(a);
    if (angleMode.get() === 'std') { if (a > 1e-9) D.arc(c, x, y, r, 0, U.rad(a), color, label || (U.dp(a, 1) + '°')); return; }
    if (d.ref === 'up' || d.ref === 'down' || d.beta < 1e-9) return;
    var a0 = d.ref === '+x' ? 0 : Math.PI, s = (d.ref === '+x') === (d.side === 'above') ? 1 : -1;
    D.arc(c, x, y, r, a0, a0 + s * U.rad(d.beta), color, label || (U.dp(d.beta, 1) + '°'));
  }

  /* ---------- scene: forces from O ---------- */
  function drawScene() {
    if (!M) return;
    var col = ui.colors(), c;
    vp.fit(-1.25, 1.25, -1.25, 1.25); c = vp.begin();
    var ox = vp.X(0), oy = vp.Y(0), L = Math.min(vp.w, vp.h) * 0.4, real = SC.real();
    var fl = drawList();
    if (real) realScene(c, col, ox, oy, L, fl);
    D.line(c, [[vp.X(-1.25) - 200, oy], [vp.X(1.25) + 200, oy]], real ? 'rgba(255,255,255,.75)' : col.grid, { dash: [4, 4] });
    D.line(c, [[ox, vp.Y(1.25) - 50], [ox, vp.Y(-1.25) + 50]], real ? 'rgba(255,255,255,.75)' : col.grid, { dash: [4, 4] });
    D.label(c, '+x', Math.min(vp.w - 14, ox + L + 30), oy - 10, real ? col.ink : col.muted, { size: 11, bg: real });
    D.label(c, '+y', ox + 14, Math.max(10, oy - L - 22), real ? col.ink : col.muted, { size: 11, bg: real });
    var mags = fl.map(function (x) { return x.mag; });
    if (M.res && M.res.R > 0) mags.push(M.res.R);
    var k = SIM.view.forceScale(mags, L);
    fl.forEach(function (fd, idx) {
      var color = forceColor(col, fd.j), ang = U.rad(fd.th);
      if (compsAll.get() && Math.abs(fd.mag) > 1e-9) {
        var ux = Math.cos(ang) * fd.mag, uy = Math.sin(ang) * fd.mag;
        if (Math.abs(ux) > 1e-9) D.arrow(c, ox, oy, ox + ux * k, oy, color, { dash: [4, 4], width: 1.2, head: 7 });
        if (Math.abs(uy) > 1e-9) D.arrow(c, ox, oy, ox, oy - uy * k, color, { dash: [4, 4], width: 1.2, head: 7 });
        D.line(c, [[ox + ux * k, oy], [ox + ux * k, oy - uy * k], [ox, oy - uy * k]], color, { dash: [2, 4], width: 1 });
      }
      if (Math.abs(fd.mag) > 1e-9) {
        D.arrowPolar(c, ox, oy, ang, fd.mag * k, color, { label: valueLabel(fd), dash: fd.mag < 0 ? [6, 4] : null });
        var lab = exam.get() && M.unk.some(function (u) { return u.kind === 'th' && u.i === fd.j; }) ? 'θ' + SUB[fd.j] : null;
        arcFor(c, ox, oy, 22 + 9 * idx, fd.th, color, lab);
      }
    });
    if (M.res && M.res.R > 0) {
      var rx = M.res.X * k, ry = M.res.Y * k;
      if (Math.abs(rx) > 0.5) D.arrow(c, ox, oy, ox + rx, oy, col.component, { dash: [5, 4], width: 1.6, label: exam.get() ? 'X' : 'X = ' + U.num(M.res.X, 3) });
      if (Math.abs(ry) > 0.5) D.arrow(c, ox, oy, ox, oy - ry, col.component, { dash: [5, 4], width: 1.6, label: exam.get() ? 'Y' : 'Y = ' + U.num(M.res.Y, 3) });
      D.line(c, [[ox + rx, oy], [ox + rx, oy - ry], [ox, oy - ry]], col.component, { dash: [2, 4], width: 1 });
      D.arrowPolar(c, ox, oy, U.rad(M.res.dir), M.res.R * k, col.resultant, { width: 3.4, label: exam.get() ? 'R' : 'R = ' + U.num(M.res.R, 3) + ' N' });
      arcFor(c, ox, oy, 16 + 9 * fl.length + 10, M.res.dir, col.resultant, exam.get() ? 'β' : null);
    }
    if (!real) D.particle(c, ox, oy, 4, {});
    scene = { ox: ox, oy: oy, k: k, list: fl };
    if (preview) {   // a force being drawn
      var pl = Math.hypot(preview.x - ox, preview.y - oy);
      D.arrow(c, ox, oy, preview.x, preview.y, forceColor(col, top.values.n % 5), { width: 3, dash: [7, 5] });
      D.label(c, 'F' + SUB[top.values.n] + ' at ' + preview.th + '°', preview.x + 12, preview.y - 12, forceColor(col, top.values.n % 5), { bold: true, bg: true, align: 'left' });
    }
    if (ix) ix.paint(c);
    var msg = null;
    if (M.res && M.res.equilibrium) msg = { t: 'R = 0: in equilibrium', col: col.ok };
    else if (!M.eff) msg = { t: 'No valid solution: unknown force not drawn', col: col.warn };
    else if (M.res && M.res.nearEquilibrium) msg = { t: 'R is under 0.5% of ΣF: approximately in equilibrium', col: col.ok };
    if (msg) D.label(c, msg.t, vp.w / 2, 14, msg.col, { bold: true, bg: true });
    D.label(c, real ? 'seen from above · angles anticlockwise from +x' : 'angles anticlockwise from +x', 8, vp.h - 10, real ? col.ink : col.muted, { align: 'left', size: 11, bg: real });
  }

  /* ---------- real-life scenarios (seen from above): Harbour tugboats, Space drones, Heavy-lift winches, or Lawn tug-of-war ---------- */
  var SC = SIM.scene;
  function harbourWater(c) {
    var dk = SC.dark(), w = vp.w, h = vp.h, i;
    c.save();
    var g = c.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, dk ? '#09223a' : '#7ec8e3'); g.addColorStop(0.5, dk ? '#0d3152' : '#56b4d3'); g.addColorStop(1, dk ? '#081e34' : '#3a96c4');
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    // subtle water ripples
    c.strokeStyle = dk ? 'rgba(160,220,255,0.08)' : 'rgba(255,255,255,0.22)'; c.lineWidth = 1.4;
    var s = 13;
    for (i = 0; i < Math.round(w * h / 7500); i++) {
      s = (s * 1664525 + 1013904223) >>> 0; var rx = (s / 4294967296) * w;
      s = (s * 1664525 + 1013904223) >>> 0; var ry = (s / 4294967296) * h;
      c.beginPath(); c.moveTo(rx - 14, ry); c.quadraticCurveTo(rx, ry - 4, rx + 14, ry); c.stroke();
    }
    c.restore();

  function readout() {

      R.eq('→', axisLine(M.list, 'x', kUnk) + ' = 0', '', '', 'In equilibrium the resultant is zero, so the horizontal components add to zero.');

          var vs = sol.solutions[0].vals, P = u[0].kind === 'F' ? vs[0] : vs[1], th = u[0].kind === 'F' ? vs[1] : vs[0];
          R.eq('F' + HSUB(j), 'square and add: √(' + sq(sol.Xp) + ' + ' + sq(sol.Yp) + ')', P, 'N', 'Square and add: (F cos θ)² + (F sin θ)² = F² because cos²θ + sin²θ = 1.');
          var di = FO.dirInfo(th);
          R.eq('θ' + HSUB(j), (di.ref === 'up' || di.ref === 'down' || Math.abs(sol.Yp) === 0 ? 'one component is zero' : 'divide: tan⁻¹(' + U.sf(Math.abs(sol.Yp)) + ' ÷ ' + U.sf(Math.abs(sol.Xp)) + ') = ' + U.dp(di.beta, 1) + '°, then use the signs'), angleText(th), '', 'Divide: F sin θ ÷ F cos θ = tan θ. The signs of the two components fix the quadrant.');
          R.badge('Solved: the force polygon closes', 'ok');
        }
      } else if (sol.method === 'cramer') {
        var twoMags = u[0].kind === 'F' && u[1].kind === 'F';
        if (twoMags) R.eq('det', 'sin(θ' + HSUB(u[1].i) + ' − θ' + HSUB(u[0].i) + ') = sin(' + U.num(M.list[u[1].i].th, 2) + '° − ' + U.num(M.list[u[0].i].th, 2) + '°)', sol.det, '', 'The two equations are linear in the unknown magnitudes. If this determinant is zero the two unknown forces are parallel and cannot balance the others.');
        else R.eq('det', 'a₁b₂ − a₂b₁ of the coefficients of the unknowns = ' + U.sf(sol.c1[0]) + ' × ' + U.sf(sol.c2[1]) + ' − ' + U.sf(sol.c2[0]) + ' × ' + U.sf(sol.c1[1]), sol.det, '', 'The two equations are linear in the unknowns. A zero determinant means there is no unique solution.');
        if (/parallel/.test(sol.status)) R.badge(sol.message, 'warn');
        else {
          var s0 = sol.solutions[0];
          R.eq(unkLabel(u[0]), 'solve simultaneously (Cramer’s rule)', s0.vals[0], 'N', 'Solve the → and ↑ equations simultaneously (elimination or substitution gives the same result).');
          R.eq(unkLabel(u[1]), 'solve simultaneously (Cramer’s rule)', s0.vals[1], 'N', 'Substitute back or use the second equation to find the other unknown.');
          if (sol.status === 'negative') R.badge('A magnitude came out negative: that force would have to act in the opposite direction. No equilibrium with the directions as given.', 'warn');
          else R.badge('Solved: the force polygon closes', 'ok');
        }
      } else {
        R.html('<div style="font-size:12.5px;color:var(--muted)">Solved numerically (Newton–Raphson from 12 starting angles). By hand: make one equation give sin θ and the other cos θ, then divide (tan θ) or square and add.</div>');
        if (sol.status === 'none' || sol.status === 'many') R.badge(sol.message, 'warn');
        sol.solutions.forEach(function (s, q) {
          if (sol.solutions.length > 1) R.head('Solution ' + (q + 1) + (q === M.solIdx ? ' (drawn)' : ''));
          s.vals.forEach(function (v, qq) { R.eq(unkLabel(u[qq]), u[qq].kind === 'th' ? 'direction' : 'magnitude', u[qq].kind === 'th' ? angleText(v) : v, u[qq].kind === 'th' ? '' : 'N', u[qq].kind === 'th' ? 'A direction that makes both component equations true at once.' : 'A magnitude that makes both component equations true at once.'); });
        });
        if (sol.status === 'ok') R.badge(sol.solutions.length > 1 ? 'Two solutions: both close the polygon (use “Show solution”)' : 'Solved: the force polygon closes', 'ok');
      }
      if (M.eff) resultantBlock(res, 'Check with the solved values');
    } else {
      var con = M.con, ax = axisSel.get(), uu = M.unk[0];
      R.head('Condition: ' + (ax === 'y' ? 'Y' : 'X') + ' = 0');
      if (con.status === 'invalid') { R.badge(con.message, 'warn').render(); return; }
      R.eq(ax === 'y' ? 'Y' : 'X', axisLine(M.list, ax, kUnk) + ' = 0', '', '', 'The resultant has no component in this direction, so the components of all the forces this way add to zero.');
      if (con.status === 'impossible' || con.status === 'any') { R.badge(con.message, 'warn').render(); return; }
      R.eq(unkLabel(uu), '−(' + (ax === 'y' ? 'y' : 'x') + '-components of the others) ÷ ' + (ax === 'y' ? 'sin' : 'cos') + ' θ = −(' + U.sf(con.known) + ') ÷ ' + U.sf(con.col), con.value, 'N', 'Only one unknown appears in this equation, so rearrange it for that unknown.');
      if (con.status === 'negative') R.badge('Negative: the force would have to act in the opposite direction', 'warn');
      if (M.eff) resultantBlock(res, 'Resultant with this value');
    }
    R.render();
  }

  /* ---------- direct manipulation: drag a tip to turn a force, tap it to type its size, draw a new one ---------- */
  var scene = null, preview = null, addBtn = null;
  function snapAngle(a) { a = Math.round(a) % 360; var near = Math.round(a / 15) * 15; return Math.abs(a - near) <= 2 ? near % 360 : a; }
  function canEditDir(j) { return !(M && M.unk.some(function (u) { return u.kind === 'th' && u.i === j; })); }
  function canEditMag(j) { return !(M && M.unk.some(function (u) { return (u.kind === 'F' && u.i === j) || (u.kind === 'k' && blocks[j].type.get() === 'mult'); })); }
  /** add an extra button (e.g. Remove) to the number editor that is open now */
  function popAction(ed, label, fn) {
    var sg = ui.stage(), ch = sg && sg.el && sg.el.children, pe = null, k;
    if (!ch) return;
    for (k = ch.length - 1; k >= 0 && !pe; k--) if (ch[k].classList && ch[k].classList.contains('pop')) pe = ch[k];
    var acts = pe && pe.children ? Array.prototype.filter.call(pe.children, function (e) { return e.classList && e.classList.contains('pop-actions'); })[0] : null;
    if (!acts) return;
    acts.insertBefore(ui.h('button', { class: 'btn', type: 'button', text: label, onclick: function () { if (ed && ed.close) ed.close(); fn(); } }), acts.firstChild || null);
  }
  function askMag(j, x, y, title) {
    var b = blocks[j], mult = b.type.get() === 'mult';
    var ed = ui.askNumber({ title: title || ('Size of force F' + SUB[j]), sub: mult ? 'This force is c × F. Type the multiple c.' : 'Type the magnitude in newtons.',
      value: mult ? b.p.values.c : b.p.values.F, min: 0, max: mult ? 10 : 200, step: mult ? 0.5 : 1, decimals: 2, unit: mult ? '× F' : 'N', at: { x: x, y: y },
      quick: mult ? [1, 2, 3] : [5, 10, 20, 50],
      onInput: function (v) { unlockAll(); b.p.set(mult ? { c: v } : { F: v }); } });
    if (Math.round(top.values.n) > 2) popAction(ed, 'Remove F' + SUB[j], function () { removeForce(j); });
  }
  /** remove force j: later forces move down one place so F₁, F₂, … stay in order */
  function removeForce(j) {
    var n = Math.round(top.values.n);
    if (n <= 2 || j >= n) return;
    unlockAll();
    for (var q = j; q < n - 1; q++) {
      var a = blocks[q], b = blocks[q + 1];
      a.type.set(b.type.get(), true);
      a.p.set({ F: b.p.values.F, th: b.p.values.th, c: b.p.values.c }, true);
    }
    // unknowns that pointed at a later force follow it down
    [u1Sel, u2Sel, ucSel].forEach(function (sel) {
      var u = parseU(sel.get());
      if (u.kind !== 'k' && u.i > j) sel.set(u.kind + (u.i - 1), true);
    });
    top.set({ n: n - 1 });
  }
  /** placeMode swallows the tap, so put the first-time hint away ourselves once the student has used it */
  function hideTip() { var sg = ui.stage(); if (sg && sg.tip && sg.tip.style) sg.tip.style.display = 'none'; }
  /** "+ Add a force": tap to set its direction from O (15° steps), then type its size */
  function startAdd() {
    if (Math.round(top.values.n) >= NMAX) return;
    ui.placeMode({ prompt: 'Tap where force F' + SUB[Math.round(top.values.n)] + ' should point', onPlace: function (x, y) {
      var j = Math.round(top.values.n);
      hideTip();
      if (!scene || j >= NMAX) return;
      if (Math.hypot(x - scene.ox, y - scene.oy) < 8) { startAdd(); return; }   // too close to O to tell a direction
      var th = Math.round(SIM.view.screenAngle(scene.ox, scene.oy, x, y) / 15) * 15 % 360;
      var est = Math.min(200, Math.max(1, Math.round(Math.hypot(x - scene.ox, y - scene.oy) / (scene.k || 1))));
      unlockAll();
      blocks[j].type.set('N', true); blocks[j].p.set({ F: est, th: th }, true);
      top.set({ n: j + 1 });
      askMag(j, x, y, 'New force F' + SUB[j] + ' at ' + th + '°: how big is it?');
    } });
  }
  var ix = SIM.view.interact(cv, {
    handles: function () {
      if (!scene) return [];
      return scene.list.filter(function (fd) { return canEditDir(fd.j) && Math.abs(fd.mag) > 1e-9; }).map(function (fd) {
        var a = U.rad(fd.th); return { id: 'f' + fd.j, j: fd.j, x: scene.ox + Math.cos(a) * fd.mag * scene.k, y: scene.oy - Math.sin(a) * fd.mag * scene.k, color: forceColor(ui.colors(), fd.j) };
      });
    },
    onDrag: function (hd, x, y) { blocks[hd.j].p.set({ th: snapAngle(SIM.view.screenAngle(scene.ox, scene.oy, x, y)) }); },
    onTap: function (hd, x, y) { if (canEditMag(hd.j)) askMag(hd.j, x, y); },
    canDraw: function (x, y) { return !!scene && top.values.n < NMAX && Math.hypot(x - scene.ox, y - scene.oy) > 4; },
    onDraw: function (x0, y0, x, y) { preview = { x: x, y: y, th: snapAngle(SIM.view.screenAngle(scene.ox, scene.oy, x, y)) }; drawScene(); },
    onDrawEnd: function (x0, y0, x, y) {
      if (!preview) return;
      var th = preview.th, j = top.values.n, est = Math.max(1, Math.round(Math.hypot(x - scene.ox, y - scene.oy) / (scene.k || 1)));
      preview = null; unlockAll();
      blocks[j].type.set('N', true); blocks[j].p.set({ F: est, th: th }, true);
      top.set({ n: j + 1 });
      askMag(j, x, y, 'New force F' + SUB[j] + ' at ' + th + '°: how big is it?');
    },
    onHover: function () { drawScene(); }
  });
  /** keep the hint clear of the + button over the top-right of the stage (desktop only: on phones the hint sits below the stage) */
  function tipClear(t, o) {
    if (!t || !t.style || (typeof matchMedia === 'function' && matchMedia('(max-width: 720px)').matches)) return;
    if (o.bottom) { t.style.top = 'auto'; t.style.bottom = '10px'; } else t.style.maxWidth = 'calc(100% - ' + o.right + 'px)';
  }
  addBtn = ui.stageAction({ label: 'Add a force', icon: '+', onClick: startAdd });
  tipClear(ui.stageTip('Press + Add a force, tap where it should point, then type its size · drag a tip to turn a force · tap a tip to change its size or remove it'), { right: 195 });

  ui.onTheme(function () { drawScene(); drawPolygon(); });
  vp.onResize = drawScene; vp2.onResize = drawPolygon;
  // restore a shared set-up from the URL hash
  var hsh = ui.readHash();
  if (typeof hsh.n === 'number') {
    top.set({ n: U.clamp(Math.round(hsh.n), 2, NMAX) }, true);
    if (hsh.mode === 'resultant' || hsh.mode === 'solve' || hsh.mode === 'constraint') modeSel.set(hsh.mode, true);
    blocks.forEach(function (b, j) {
      if (hsh['t' + j] === 'mult' || hsh['t' + j] === 'N') b.type.set(hsh['t' + j], true);
      var o = {}; ['F', 'th', 'c'].forEach(function (key) { if (typeof hsh[key + j] === 'number') o[key] = hsh[key + j]; });
      b.p.set(o, true);
    });
  }
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
