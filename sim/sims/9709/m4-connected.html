<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connected particles</title>
<link rel="stylesheet" href="../../assets/theme.css">
<script src="../../core/util.js"></script>
<script src="../../core/ui.js"></script>
<script src="../../core/view.js"></script>
<script src="../../core/scene.js"></script>
<script src="../../core/plot.js"></script>
<script src="../../core/anim.js"></script>
<script src="../../engine/mech-dynamics.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var U = SIM.util, ui = SIM.ui, D = SIM.view.draw, DY = SIM.dyn, SC = SIM.scene;
  var course = ui.course('9709'), g = ui.gFor(course);
  var pg = ui.page({ title: 'Connected particles: strings over smooth pulleys', g: g,
    tags: ['9709 4.4 Newton’s laws (connected particles)', '9709 4.1 Friction', '9709 4.2 suvat follow-on'] });

  /* ---------- layout ---------- */
  var sceneCard = pg.card('left');
  var cv = ui.canvas(sceneCard, 'main-canvas');
  var vp = new SIM.view.Viewport(cv, { pad: 18 });
  var clock = new SIM.anim.Clock(sceneCard, { duration: 3, onFrame: function () { drawScene(); drawFBD(); drawPlots(); readout(); } });
  ui.legend(sceneCard, [
    { color: 'var(--c-weight)', label: 'weight' }, { color: 'var(--c-normal)', label: 'normal reaction' }, { color: 'var(--c-friction)', label: 'friction' },
    { color: 'var(--c-tension)', label: 'tension' }, { color: 'var(--c-applied)', label: 'applied force' }, { color: 'var(--c-accel)', label: 'acceleration' }]);
  var fbdCard = pg.card('left', 'Free-body diagram of EACH particle (one F = ma per particle, along its own line of motion)');
  var fcv = ui.canvas(fbdCard, 'main-canvas');
  var fvp = new SIM.view.Viewport(fcv, { pad: 6 });
  var plotWrap = ui.h('div', { class: 'plots' }); sceneCard.appendChild(plotWrap);
  var pV = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'v / m s⁻¹ (each along its own positive direction)' });
  var pT = new SIM.plot.Plot(ui.canvas(plotWrap), { yLabel: 'tension / N' });

  var presetCard = pg.card('right', 'Exam setups');
  var paramCard = pg.card('right', 'Parameters');
  var outCard = pg.card('right', 'Live working');
  var noteCard = pg.card('right', 'Common traps');

  var cfgSel = ui.select(paramCard, { label: 'Set-up', value: 'atwood', options: [
    { value: 'atwood', label: 'Two hanging particles (Atwood)' }, { value: 'table', label: 'Table + hanging particle' },
    { value: 'incline', label: 'Incline (pulley at top) + hanging particle' }, { value: 'double', label: 'Two inclines, pulley at the apex' },
    { value: 'step', label: 'Two inclines, pulley at the corner (both slopes fall away)' },
    { value: 'ihh', label: 'Incline – horizontal – hanging (two strings)' }, { value: 'pair', label: 'Two particles on one slope, pulled by a force' }] }, function () { syncUI(); update(); });
  var prm = ui.params(paramCard, [
    { key: 'm1', label: 'Mass of A', sym: 'm<sub>A</sub>', unit: 'kg', min: 0.05, max: 50, step: 0.01, value: 1.2 },
    { key: 'm2', label: 'Mass of B', sym: 'm<sub>B</sub>', unit: 'kg', min: 0.05, max: 50, step: 0.01, value: 1.8 },
    { key: 'm3', label: 'Mass of C', sym: 'm<sub>C</sub>', unit: 'kg', min: 0.05, max: 50, step: 0.01, value: 5 },
    { key: 'mC', label: 'Extra mass attached below the descending particle', sym: 'Δm', unit: 'kg', min: 0, max: 50, step: 0.01, value: 0 },
    { key: 'th1', label: 'Angle of slope 1', sym: 'θ<sub>1</sub>', unit: '°', min: 0, max: 80, step: 0.5, value: 30 },
    { key: 'th2', label: 'Angle of slope 2', sym: 'θ<sub>2</sub>', unit: '°', min: 0, max: 80, step: 0.5, value: 30 },
    { key: 'mu1', label: 'Coefficient of friction for A', sym: 'μ<sub>A</sub>', unit: '', min: 0, max: 1.5, step: 0.001, value: 0 },
    { key: 'mu2', label: 'Coefficient of friction for B', sym: 'μ<sub>B</sub>', unit: '', min: 0, max: 1.5, step: 0.001, value: 0 },
    { key: 'P', label: 'Applied force along the line of motion', sym: 'P', unit: 'N', min: -100, max: 100, step: 0.1, value: 0 },
    { key: 'u', label: 'Initial velocity of the system (positive direction)', sym: 'u', unit: 'm s<sup>−1</sup>', min: -10, max: 10, step: 0.1, value: 0 },
    { key: 'h', label: 'Height of the descending particle above the floor (0 = no floor)', sym: 'h', unit: 'm', min: 0, max: 10, step: 0.01, value: 1 },
    { key: 'dP', label: 'Distance of the leading particle from its pulley (0 = far)', sym: 'd', unit: 'm', min: 0, max: 10, step: 0.01, value: 0 },
    { key: 'len', label: 'Gap between the particles = string length', sym: 'ℓ', unit: 'm', min: 0.1, max: 5, step: 0.01, value: 1 },
    { key: 'ev', label: 'Event value', sym: '', unit: '', min: 0, max: 10, step: 0.01, value: 1 },
    { key: 'T', label: 'Time shown', sym: 't<sub>max</sub>', unit: 's', min: 0.5, max: 20, step: 0.1, value: 3 }
  ], update);
  var evSel = ui.select(paramCard, { label: 'Event', value: 'none', options: [
    { value: 'none', label: 'none' }, { value: 'bt', label: 'string breaks at time t' }, { value: 'bs', label: 'string breaks when the speed reaches v' },
    { value: 'bd', label: 'string breaks after A has moved d' }, { value: 'dd', label: 'extra mass falls off after A has moved d' }] }, function () { syncUI(); update(); });
  var strSel = ui.select(paramCard, { label: 'Which string breaks', value: '0', options: [{ value: '0', label: 'string 1 (A–B)' }, { value: '1', label: 'string 2 (B–C)' }] }, update);
  var comps = ui.toggle(paramCard, { label: 'Show weight components on slopes', value: true }, function () { drawScene(); drawFBD(); });

  var exam = ui.examToggle(outCard, outCard);
  var R = ui.Readout(outCard);
  var eq0 = R.eq; R.eq = function (l, w, v, u, why) { return eq0(l, w, typeof v === 'number' ? fmtX(v) : v, u, why); };
  /* exact values (e.g. 172.5) are shown in full; others to 3 s.f. */
  function fmtX(x) {
    if (typeof x !== 'number' || !isFinite(x)) return U.sf(x);
    for (var d = 0; d <= 4; d++) {
      var y = x * Math.pow(10, d);
      if (Math.abs(y - Math.round(y)) < 1e-9 * Math.max(1, Math.abs(y))) {
        var str = x.toFixed(d), dig = str.replace(/[-.]/g, '').replace(/^0+/, '').length;
        return dig <= 6 && Math.abs(x) < 1e6 && (Math.abs(x) >= 1e-3 || x === 0) ? str.replace('-', '−') : U.sf(x);
      }
    }
    return U.sf(x);
  }
  function pn(x) { return x < 0 ? '(' + U.sf(x) + ')' : U.sf(x); }

  var base = { m1: 1, m2: 1, m3: 1, mC: 0, th1: 30, th2: 30, mu1: 0, mu2: 0, P: 0, u: 0, h: 0, dP: 0, len: 1, ev: 1 };
  function pre(name, cfg, vals, note, ev, str) { return { name: name, cfg: cfg, values: Object.assign({}, base, vals), note: note, ev: ev || 'none', str: str || '0' }; }
  var presetList = [
    pre('9709/41 O/N 24 Q1: 1.8 kg and 1.2 kg over a pulley (+ floor 1 m below)', 'atwood', { m1: 1.2, m2: 1.8, h: 1, T: 1.6 },
      'a = (1.8 − 1.2)g ÷ 3 = 2 m s⁻², T = 1.2(g + a) = 14.4 N. When B lands (v = 2) the string goes slack and A moves freely with a = −g: it rises a further 0.2 m.'),
    pre('9709/41 M/J 26 Q4: A 3 kg; B 1.5 kg with C 3.5 kg attached; C falls off after A rises 0.8 m', 'atwood', { m1: 3, m2: 1.5, mC: 3.5, ev: 0.8, T: 1.8 },
      'T = 37.5 N ⇒ a = 2.5 ⇒ m = 3.5. After C separates (v = 2 at t = 0.8 s) a = (15 − 30)/4.5 = −10/3, so A stops 0.6 s later: total 1.4 s.', 'dd'),
    pre('Table: 2 kg (μ = 0.25) pulled by 3 kg hanging 1.5 m above the floor', 'table', { m1: 2, mu1: 0.25, m2: 3, h: 1.5, dP: 6, T: 2.5 },
      'a = (30 − 0.25 × 20) ÷ 5 = 5 m s⁻², v = √15 when B lands; A then decelerates at μg = 2.5 m s⁻² and slides 3 m more.'),
    pre('Incline + hanging at rest: does it move? (2 kg on 30°, μ = 0.4, 0.5 kg hanging)', 'incline', { m1: 2, th1: 30, mu1: 0.4, m2: 0.5, T: 2 },
      '|D| = |0.5g − 2g sin 30°| = 5 N ≤ μR = 6.93 N ⇒ stays at rest. Friction is only 5 N (not μR); least μ = 5 ÷ 17.3 = 0.289.'),
    pre('Two inclines, pulley at the apex: 0.2 kg on 30°, 0.3 kg on 60°, smooth', 'double', { m1: 0.2, th1: 30, m2: 0.3, th2: 60, T: 1 },
      'a = (0.3g sin 60° − 0.2g sin 30°) ÷ 0.5 = 3√3 − 2 = 3.20 m s⁻², T = 0.2(a + g sin 30°) = 1.64 N.'),
    pre('9709/43 M/J 22 Q6(a): 0.3 kg on smooth 60° plane, 0.2 kg on smooth 30° plane, pulley at B', 'step', { m1: 0.3, th1: 60, m2: 0.2, th2: 30, T: 0.6 },
      'Both particles slide DOWN their planes: a = (0.3g sin 60° + 0.2g sin 30°) ÷ 0.5 = 7.20 m s⁻², T = 0.3(g sin 60° − a) = 0.439 N (mark scheme).'),
    pre('9709/43 M/J 22 Q6(b): BC rough, 3 N on Q directly up BC — least μ for rest', 'step', { m1: 0.3, th1: 60, m2: 0.2, th2: 30, mu2: 0.3453, P: -3, T: 1 },
      'P at rest: T = 0.3g sin 60° = 2.598. Q on the point of moving down: T + 0.2g sin 30° = F + 3 ⇒ F = 0.598 = μ(0.2g cos 30°) ⇒ μ = 0.345.'),
    pre('9709/42 M/J 25 Q5: A 3 kg on rough 30°, B 4 kg smooth table, C 5 kg hanging; string AB breaks at 1.5 s', 'ihh', { m1: 3, th1: 30, mu1: 0.42339, m2: 4, m3: 5, ev: 1.5, T: 2.2 },
      'a = 2 ⇒ T_BC = 40, T_AB = 32, F = 11 ⇒ μ = 0.423. After the break A decelerates at (15 + 11)/3: total distance up the plane 2.25 + 0.519 = 2.77 m.', 'bt', '0'),
    pre('9709/42 F/M 26 Q5: P 0.3 kg and Q 0.2 kg on rough 30° (μ 0.4), 12 N on Q; string breaks at 2 m s⁻¹', 'pair', { m1: 0.3, m2: 0.2, th1: 30, mu1: 0.4, mu2: 0.4, P: 12, ev: 2, len: 1, T: 0.6 },
      'a = (12 − 0.5g sin 30° − 0.4 × 0.5g cos 30°) ÷ 0.5 = 15.5, T = 7.2 N. After the break P decelerates at g sin 30° + 0.4g cos 30° = 8.46 ⇒ 0.236 s to rest.', 'bs'),
    pre('Two rough contacts at rest: the tension is statically indeterminate', 'ihh', { m1: 3, th1: 30, mu1: 0.5, m2: 4, mu2: 0.5, m3: 2, T: 2 },
      'D = 20 − 15 = 5 N is less than the total friction available, so nothing moves — but how the 5 N is shared between A and B is not fixed, so T_AB can be anything from 2.01 N to 28.0 N. Exam questions avoid this (or make one contact smooth / limiting).'),
    pre('String goes slack: the upper particle slides faster than the lower one', 'pair', { m1: 1, m2: 1, th1: 30, mu1: 0.5, mu2: 0.1, len: 2, T: 1.5 },
      'Treating them as one system would need T &lt; 0. A string cannot push: each particle moves on its own until they meet.')
  ];
  var presetCtl = ui.presets(presetCard, presetList, function (p) {
    clock.pause(); cfgSel.set(p.cfg, true); evSel.set(p.ev, true); strSel.set(p.str, true); syncUI(); prm.set(p.values); clock.seek(0);
  });

  ui.notes(noteCard, [
    'Write <b>one F = ma for each particle</b>, along that particle’s own line of motion. The tension acts on both particles in opposite senses along the string.',
    'Do not use the whole system’s weight as the driving force: only the weight component along each particle’s own line of motion counts (mg for hanging, mg sin θ on a slope, 0 on a table).',
    'Friction μR only when moving or on the point of moving. First ask: does the system move at all? Compare the net driving force with the total μR available.',
    'When the hanging particle hits the floor the string goes slack: the other particle continues with its OWN acceleration (often −g, or friction only).',
    'After a string breaks, a particle on a rough slope decelerates, stops, and must be re-tested: does it slide back?',
    'Smooth pulley: the tension is the same on both sides of it.'
  ]);

  /* ---------- UI sync ---------- */
  function syncUI() {
    var c = cfgSel.get(), ev = evSel.get();
    var lab = {
      atwood: ['Mass of A (rising side)', 'Mass of B (descending side)'], table: ['Mass of A (on the table)', 'Mass of B (hanging)'],
      incline: ['Mass of A (on the slope)', 'Mass of B (hanging)'], double: ['Mass of A (on slope 1)', 'Mass of B (on slope 2)'],
      step: ['Mass of A (on the steeper plane AB, below the pulley)', 'Mass of B (on plane BC, above the pulley)'],
      ihh: ['Mass of A (on the slope)', 'Mass of B (on the table)'], pair: ['Mass of A (lower particle)', 'Mass of B (upper particle)'] }[c];
    prm.label('m1', lab[0] + ' <span class="sym">m<sub>A</sub></span>'); prm.label('m2', lab[1] + ' <span class="sym">m<sub>B</sub></span>');
    prm.show('m3', c === 'ihh');
    var hangLast = c === 'atwood' || c === 'table' || c === 'incline' || c === 'ihh';
    prm.show('mC', hangLast); prm.show('h', hangLast);
    prm.show('th1', c !== 'atwood' && c !== 'table'); prm.show('th2', c === 'double' || c === 'step');
    prm.show('mu1', c !== 'atwood'); prm.show('mu2', c === 'double' || c === 'step' || c === 'ihh' || c === 'pair');
    prm.show('P', c !== 'atwood' && c !== 'ihh');
    var pl = { table: 'Applied force on A (+ towards the pulley)', incline: 'Applied force on A along the slope (+ up)', double: 'Applied force on B along slope 2 (+ down the slope)',
      step: 'Applied force on B along BC (+ down BC, towards the pulley)', pair: 'Force on B along the slope (+ up the slope)' }[c];
    if (pl) prm.label('P', pl + ' <span class="sym">P</span>');
    prm.show('dP', c !== 'pair'); prm.show('len', c === 'pair');
    prm.show('ev', ev !== 'none');
    prm.label('ev', { bt: 'Time at which the string breaks <span class="sym">t</span>', bs: 'Speed at which the string breaks <span class="sym">v</span>',
      bd: 'Distance moved by A when the string breaks <span class="sym">d</span>', dd: 'Distance moved by A when the extra mass falls off <span class="sym">d</span>', none: 'Event value' }[ev]);
    strSel.row.style.display = (c === 'ihh' && ev !== 'none' && ev !== 'dd') ? '' : 'none';
    if (c === 'atwood') prm.label('dP', 'Distance of A below the pulley (0 = far) <span class="sym">d</span>');
    else prm.label('dP', 'Distance of the leading particle from its pulley (0 = far) <span class="sym">d</span>');
  }

  /* ---------- model ---------- */
  var built = null, sim = null, first = null;
  function cfgObj() {
    var v = prm.values, c = cfgSel.get();
    return { type: c, m1: v.m1, m2: v.m2, m3: v.m3, mC: (c === 'atwood' || c === 'table' || c === 'incline' || c === 'ihh') ? v.mC : 0, th1: v.th1, th2: v.th2,
      mu1: v.mu1, mu2: v.mu2, P: v.P, h: v.h, dP: v.dP, len: v.len };
  }
  function update() {
    var v = prm.values, c = cfgObj(), ev = evSel.get();
    built = DY.build(c);
    var spec = { g: g, particles: built.particles, strLen: built.strLen, u: v.u, tMax: v.T };
    var lastIdx = built.particles.length - 1;
    if (ev === 'bt' || ev === 'bs' || ev === 'bd') {
      var k = c.type === 'ihh' ? Number(strSel.get()) : 0;
      spec.brk = { string: Math.min(k, built.particles.length - 2), at: { bt: 'time', bs: 'speed', bd: 'distance' }[ev], value: v.ev, ref: 0 };
    } else if (ev === 'dd') {
      spec.detach = { particle: lastIdx, dm: c.mC, at: 'distance', value: v.ev, ref: 0 };
    }
    sim = DY.simulate(spec);
    first = DY.analyse(built.particles, g, v.u);
    clock.setDuration(v.T);
    ui.writeHash(Object.assign({}, v, { cfg: c.type, ev: ev }));
    drawScene(); drawFBD(); drawPlots(); readout();
  }

  /* ---------- scene geometry ---------- */
  function idxOf(name) { for (var i = 0; i < built.particles.length; i++) if (built.particles[i].name === name) return i; return -1; }
  function motionRange() {
    var mx = 0, T = prm.values.T;
    if (!sim || sim.invalid) return 1;
    for (var i = 0; i <= 80; i++) { var s = sim.stateAt(T * i / 80); s.x.forEach(function (x) { mx = Math.max(mx, Math.abs(x)); }); }
    return mx;
  }
  function geometry() {
    var c = cfgSel.get(), v = prm.values, rad = U.rad, mr = motionRange();
    var ks = mr > 3 ? 3 / mr : 1;
    if (v.h > 0) ks = Math.min(ks, 3.2 / v.h);
    if (v.dP > 0) ks = Math.min(ks, 4.5 / v.dP);
    var G = { ks: ks, tracks: [], pulleys: [], strings: [], polys: [], floors: [], lines: [], slopes: [] };
    var dirOf = function (alphaDeg) { return [Math.cos(rad(alphaDeg)), Math.sin(rad(alphaDeg))]; };
    var hf = v.h > 0 ? v.h * ks : null, dp = v.dP > 0 ? v.dP * ks : null;
    if (c === 'atwood') {
      var top = 8.5, yB = hf !== null ? hf : 3.5, px = 0;
      var yA = dp !== null ? top - 0.3 - dp : yB;
      G.pulleys.push([px, top]);
      G.tracks[idxOf('A')] = { p0: [px - 0.55, yA], e: [0, 1], hang: true };
      G.tracks[idxOf('B')] = { p0: [px + 0.55, yB], e: [0, -1], hang: true };
      G.strings.push([[px - 0.55, top], [px + 0.55, top]]);
      G.floors.push([-3, 0, 3, 0]);
      G.bounds = [-4, 4, -0.6, top + 1];
    } else if (c === 'table' || c === 'incline') {
      var th = c === 'table' ? 0 : v.th1, e = dirOf(th), L = 7, pulX = 0, pulY = 5;
      var start = [pulX - e[0] * L, pulY - e[1] * L];
      G.polys.push(c === 'table' ? [[pulX - L, pulY], [pulX, pulY], [pulX, 0], [pulX - L, 0]] : [start, [pulX, pulY], [pulX, start[1]]]);
      if (c === 'incline') G.slopes.push({ key: 'th1', pivot: [pulX, pulY], end: start, ux: -1, uy: -1 });
      var dA = dp !== null ? dp : L * 0.55;
      G.tracks[idxOf('A')] = { p0: [pulX - e[0] * dA, pulY - e[1] * dA], e: e, angle: th };
      var yB2 = pulY - 1.4, floorY = hf !== null ? yB2 - hf : Math.min(0, start[1]);
      G.tracks[idxOf('B')] = { p0: [pulX + 0.45, yB2], e: [0, -1], hang: true };
      G.pulleys.push([pulX + 0.1, pulY + 0.1]);
      G.strings.push([[pulX + 0.1, pulY + 0.1]]);
      G.floors.push([Math.min(start[0], pulX - L) - 0.5, Math.min(floorY, start[1], 0), pulX + 2.5, Math.min(floorY, start[1], 0)]);
      if (hf !== null) G.floors.push([pulX - 0.2, floorY, pulX + 2.5, floorY]);
      G.bounds = [Math.min(start[0], pulX - L) - 0.8, pulX + 3, Math.min(floorY, start[1], 0) - 0.6, pulY + 1.4];
    } else if (c === 'double') {
      var e1 = dirOf(v.th1), L1 = 6, apex = [0, 5];
      var s1 = [apex[0] - e1[0] * L1, apex[1] - e1[1] * L1];
      var e2 = dirOf(-v.th2), s2 = [apex[0] + e2[0] * L1, apex[1] + e2[1] * L1];
      var baseY = Math.min(s1[1], s2[1]);
      G.polys.push([[s1[0], baseY], s1, apex, s2, [s2[0], baseY]]);
      G.slopes.push({ key: 'th1', pivot: apex, end: s1, ux: -1, uy: -1 }, { key: 'th2', pivot: apex, end: s2, ux: 1, uy: -1 });
      var dA2 = dp !== null ? dp : L1 * 0.5;
      G.tracks[idxOf('A')] = { p0: [apex[0] - e1[0] * dA2, apex[1] - e1[1] * dA2], e: e1, angle: v.th1 };
      G.tracks[idxOf('B')] = { p0: [apex[0] + e2[0] * dA2, apex[1] + e2[1] * dA2], e: e2, angle: -v.th2 };
      G.pulleys.push([apex[0], apex[1] + 0.15]); G.strings.push([[apex[0], apex[1] + 0.15]]);
      G.floors.push([Math.min(s1[0], s2[0]) - 0.5, baseY, Math.max(s1[0], s2[0]) + 0.5, baseY]);
      G.bounds = [Math.min(s1[0], s2[0]) - 0.8, Math.max(s1[0], s2[0]) + 0.8, baseY - 0.6, apex[1] + 1.5];
    } else if (c === 'step') {
      var corner = [0, 3.2], a1 = dirOf(v.th1), a2 = dirOf(v.th2), La = 4.2, Lb = 6;
      var Apt = [corner[0] - a1[0] * La, corner[1] - a1[1] * La], Cpt = [corner[0] + a2[0] * Lb, corner[1] + a2[1] * Lb];
      var bY = Math.min(Apt[1], 0);
      G.polys.push([[Apt[0], bY], Apt, corner, Cpt, [Cpt[0], bY]]);
      G.slopes.push({ key: 'th1', pivot: corner, end: Apt, ux: -1, uy: -1 }, { key: 'th2', pivot: corner, end: Cpt, ux: 1, uy: 1 });
      var dB = dp !== null ? dp : Lb * 0.5;
      // B moves down BC towards the corner (e_B = −a2), A moves down AB away from the corner (e_A = −a1)
      G.tracks[idxOf('B')] = { p0: [corner[0] + a2[0] * dB, corner[1] + a2[1] * dB], e: [-a2[0], -a2[1]], angle: v.th2 };
      G.tracks[idxOf('A')] = { p0: [corner[0] - a1[0] * La * 0.3, corner[1] - a1[1] * La * 0.3], e: [-a1[0], -a1[1]], angle: v.th1 };
      G.pulleys.push([corner[0], corner[1] + 0.15]); G.strings.push([[corner[0], corner[1] + 0.15]]);
      G.floors.push([Apt[0] - 0.5, bY, Cpt[0] + 0.5, bY]);
      G.lines.push({ t: 'A', p: Apt }, { t: 'B', p: corner }, { t: 'C', p: Cpt });

  /* ---------- real-life look helpers (soft pastel: a workshop with wooden ramps, a table and turning pulleys) ---------- */

    if (evSel.get() === 'dd' && !(cfgObj().mC > 0)) R.badge('“Extra mass falls off” needs an extra mass Δm attached below the descending hanging particle (set Δm > 0; not available for this set-up if there is no hanging particle).', 'info');

      if (Math.abs(q.P) > 0) R.eq(p.name + ': applied', 'along its line of motion', q.P, 'N', 'The applied force acts along the line of motion, so all of it counts (sign gives its direction).');
    });
    R.eq('D', 'net driving force without friction = Σ(weight components + applied)', f0.D, 'N', 'The tensions are internal to the system: each one pulls the two particles equally and oppositely, so they cancel when you add.');
    R.eq('total μR', 'friction available', f0.Fmax, 'N', 'Add the limiting friction at every rough contact: the most friction the system can supply.');
    R.eq('M', 'total mass', f0.M, 'kg', 'With taut strings all the particles share one speed and one acceleration, so they move like a single mass.');
    R.head('At release' + (Math.abs(v.u) > 0 ? ' (moving at u = ' + s3(v.u) + ' m s⁻¹)' : ' (from rest)'));
    if (f0.static) {
      R.badge(f0.limiting ? 'Limiting equilibrium: on the point of moving (friction = μR)' : 'Does not move: |D| = ' + s3(Math.abs(f0.D)) + ' N ≤ total μR = ' + s3(f0.Fmax) + ' N', f0.limiting ? 'warn' : 'ok');
      f0.T.forEach(function (T, k) {
        if (f0.indeterminate && f0.Thi[k] - f0.Tlo[k] > 1e-9) R.eq('T' + (k + 1), 'statically indeterminate: friction can be shared between the rough contacts in many ways', s3(f0.Tlo[k]) + ' ≤ T ≤ ' + s3(f0.Thi[k]), 'N', 'With two rough contacts at rest the friction can be shared in many ways, so the equations do not fix T.');
        else R.eq('T' + (k + 1), 'from equilibrium of the particles on one side', T, 'N', 'Nothing accelerates, so the forces on the particle(s) on one side of the string balance.');
      });
      if (f0.indeterminate) R.badge('Statically indeterminate: tension not fixed by the equations (exam questions avoid this).', 'info');
      f0.leastMu.forEach(function (m, i) { if (m !== null) R.eq('least μ for ' + P[i].name, '(|D| − μR of the others) ÷ R<sub>' + P[i].name + '</sub>', isFinite(m) ? m : '∞', '', 'For rest, the friction needed must not exceed μR, so μ ≥ friction needed ÷ R.'); });
    } else if (f0.ok) {
      var sg = f0.sigma > 0 ? '−' : '+';
      R.eq('a', '(D ' + sg + ' total μR) ÷ M = (' + s3(f0.D) + ' ' + sg + ' ' + s3(f0.Fmax) + ') ÷ ' + s3(f0.M), f0.a, 'm s<sup>−2</sup>', 'Newton’s second law for the whole system: resultant force ÷ total mass. Friction μR opposes the motion.');
      f0.T.forEach(function (T, k) {
        var q = fs[k];
        R.eq('T' + (k + 1), 'from ' + P[k].name + ': T = m a − (weight comp.) − P ' + (q.F > 0 ? (f0.sigma > 0 ? '+ μR' : '− μR') : '') + (k ? ' + T' + k : ''), T, 'N', 'Now write F = ma for ONE particle; its equation contains the tension, so it gives T.');
      });
      R.eq('check (' + P[N - 1].name + ')', 'last particle’s equation, residual', Math.abs(f0.residual) < 1e-9 * (1 + f0.M * g) ? 0 : f0.residual, 'N ✓', 'The last particle’s own equation was not used, so it is a check: it should balance exactly.');
    } else {
      if (f0.T && f0.T.length) R.badge('Treating the particles as one system gives a NEGATIVE tension (T = ' + f0.T.map(function (t) { return s3(t); }).join(', ') + ' N): a string cannot push, so it is slack and the particles move independently.', 'warn');
      else R.badge('The particles cannot stay together as one system: holding them would need a string to push. The string is slack and each particle moves (or rests) on its own — see below.', 'warn');
    }
    R.head('What happens');
    var ph0 = sim.phases[0];
    if (ph0) {
      var desc = ph0.groups.map(function (gq) {
        var nm = gq.idx.map(function (ii) { return P[ii].name; }).join('+');
        return nm + (gq.static ? ' at rest' : ': a = ' + s3(gq.a) + ' m s⁻²');
      }).join('; ');
      R.html('<div class="eq">t = 0: ' + desc + '</div>');
    }
    sim.log.forEach(function (l) { R.html('<div class="eq"' + (l.kind === 'warn' ? ' style="color:var(--warn)"' : '') + '>t = ' + s3(l.t) + ' s: ' + l.text + '</div>'); });
    sim.phases.slice(1).forEach(function (ph) {
      if (ph.stopped) return;
      var desc2 = ph.groups.map(function (gq) {
        var nm = gq.idx.map(function (ii) { return P[ii].name; }).join('+');
        return nm + (gq.static ? ' at rest' : ': a = ' + s3(gq.a) + ' m s⁻²' + (gq.idx.length > 1 ? ', T = ' + gq.T.map(function (t) { return s3(t); }).join(', ') + ' N' : ''));
      }).join('; ');
      R.html('<div class="eq" style="color:var(--muted)">from t = ' + s3(ph.t0) + ' s: ' + desc2 + '</div>');
    });
    var st = sim.stateAt(clock.t);
    R.head('At t = ' + clock.t.toFixed(2) + ' s' + (st.stopped ? ' (model stopped at ' + s3(sim.tStop) + ' s)' : ''));
    P.forEach(function (p, i) {
      R.eq(p.name, 'displacement along its positive direction; velocity', s3(st.x[i]) + ' m, ' + s3(st.v[i]) + ' m s⁻¹', '', 'From suvat in each stage, measured along the particle’s own line of motion.');
    });
    var e = sim.energyAt(clock.t);
    if (e) {
      R.eq('energy check', 'ΔKE + ΔGPE + W<sub>friction</sub> + KE lost on landing − W<sub>applied</sub> = ' + s3(e.KE - e.KE0) + ' + ' + s3(e.GPE) + ' + ' + s3(e.Wfric) + ' + ' + s3(e.impact) + ' − ' + s3(e.Wapp) +
        (e.carried ? ' + (energy carried off by the detached mass ' + s3(e.carried) + ')' : ''), Math.abs(e.balance) < 1e-9 * (1 + Math.abs(e.KE) + Math.abs(e.GPE)) ? 0 : e.balance, 'J', 'Energy is conserved overall: what the applied force puts in goes into KE, PE, work against friction and energy lost on landing, so this should be 0.');
    }
    R.render();
  }

  /* ---------- direct manipulation: tap a particle for its mass, drag the free end of a slope for its angle, tap under a block for μ ---------- */
  var scene = null, ix = null, MKEY = { A: 'm1', B: 'm2', C: 'm3' };
  function muKey(name) {
    var c = cfgSel.get();
    if (name === 'A') return c === 'atwood' ? null : 'mu1';
    if (name === 'B') return (c === 'double' || c === 'step' || c === 'ihh' || c === 'pair') ? 'mu2' : null;
    return null;
  }
  function snap15(a) { a = Math.round(a); var near = Math.round(a / 15) * 15; return Math.abs(a - near) <= 2 ? near : a; }
  ix = SIM.view.interact(cv, {
    handles: function () {
      if (!scene) return [];
      var col = ui.colors(), hs = [];
      scene.slopes.forEach(function (sl) { hs.push({ id: 'sl-' + sl.key, kind: 'slope', sl: sl, x: sl.x, y: sl.y, color: col.muted }); });
      scene.mus.forEach(function (q) { hs.push({ id: 'mu-' + q.key, kind: 'mu', q: q, x: q.x, y: q.y, color: col.friction }); });
      scene.parts.forEach(function (q) { hs.push({ id: 'm-' + q.key, kind: 'm', q: q, x: q.x, y: q.y, color: col.weight }); });
      return hs;
    },
    onDrag: function (hd, x, y) {
      if (hd.kind !== 'slope' || !scene) return;
      // use the pivot as drawn now (the view refits as the angle changes)
      var sl = null; scene.slopes.forEach(function (q) { if (q.key === hd.sl.key) sl = q; }); if (!sl) return;
      var a = Math.atan2(sl.uy * -(y - sl.py), sl.ux * (x - sl.px)) * 180 / Math.PI;
      if (a < 0) a = a < -90 ? 80 : 0;
      var o = {}; o[sl.key] = U.clamp(snap15(a), 0, 80); prm.set(o);
    },
    onTap: function (hd, x, y) {
      if (hd.kind === 'slope') {
        var key = hd.sl.key;
        ui.askNumber({ title: 'Angle of slope ' + (key === 'th1' ? '1' : '2'), sub: 'Angle above the horizontal, in degrees.', value: prm.values[key], min: 0, max: 80, step: 1, decimals: 1, unit: '°',
          at: { x: x, y: y }, quick: [30, 45, 60], onInput: function (v) { var o = {}; o[key] = U.clamp(v, 0, 80); prm.set(o); } });
      } else if (hd.kind === 'm') {
        var mk = hd.q.key;
        ui.askNumber({ title: 'Mass of ' + hd.q.name, sub: 'Type the mass in kilograms' + (prm.values.mC > 0 && cfgObj().mC > 0 ? ' (the extra mass Δm is set separately).' : '.'), value: prm.values[mk], min: 0.05, max: 50, step: 0.1, decimals: 3, unit: 'kg',
          at: { x: x, y: y }, quick: [0.2, 0.5, 1, 2, 5], onInput: function (v) { var o = {}; o[mk] = U.clamp(v, 0.05, 50); prm.set(o); } });
      } else if (hd.kind === 'mu') {
        var uk = hd.q.key;
        ui.askNumber({ title: 'Coefficient of friction for ' + hd.q.name, sub: '0 means a smooth surface.', value: prm.values[uk], min: 0, max: 1.5, step: 0.05, decimals: 3, unit: '',
          at: { x: x, y: y }, quick: [0, 0.2, 0.25, 0.4, 0.5], onInput: function (v) { var o = {}; o[uk] = U.clamp(v, 0, 1.5); prm.set(o); } });
      }
    },
    onHover: function () { drawScene(); }
  });
  ui.stageTip('Tap a particle to type its mass · drag the free end of a slope to change its angle (tap it to type) · tap the surface just under a block for μ');

  ui.onTheme(function () { drawScene(); drawFBD(); drawPlots(); });
  vp.onResize = drawScene; fvp.onResize = drawFBD;
  var hsh = ui.readHash();
  if (typeof hsh.cfg === 'string') cfgSel.set(hsh.cfg, true);
  if (typeof hsh.ev === 'string') evSel.set(hsh.ev, true);
  syncUI();
  var init = {}; Object.keys(prm.values).forEach(function (k) { if (typeof hsh[k] === 'number') init[k] = hsh[k]; });
  prm.set(init, true);
  update();
  presetCtl.fromQuery();
})();
</script>
</body>
</html>
