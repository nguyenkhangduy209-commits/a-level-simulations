  function getFocusNode(s) {
    var rec = [];
    try { rec = JSON.parse(localStorage.getItem('recent-sims') || '[]'); } catch (e) { rec = []; }
    for (var i = 0; i < rec.length; i++) {
      var m = /g=([^&]+)/.exec(rec[i].url || '');
      var n = m ? P.findNode(m[1]) : null;
      if (n) return n;
    }
    var unmastered = P.NODES.filter(function (n) { return !P.getNodeProgress(n.id, s).mastered; });
    return unmastered[0] || P.NODES[0];
  }

    var grp = (window.SIM_GROUPS || []).filter(function (g) { return g.id === node.id; })[0];

      '  <div class="sim-modal-head">' +

      '  </div>' +
      '  <div class="sim-modal-body">' +
      '    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px">' +

  function renderAtlas(s) {

      if (atlasFilter === '9702') return n.course === '9702';
      if (atlasFilter === 'mastered') return p.mastered;

      host.innerHTML = '<p style="grid-column:1/-1;color:var(--muted);margin:8px 0">No mastered nodes in this filter yet — tap any topic card to launch its Mastery Quest!</p>';

      var p = P.getNodeProgress(n.id, s);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'icon-tile ' + (p.mastered ? 'mastered' : p.started ? 'started' : 'locked');

  function renderContinue(s) {

    rec.forEach(function (r) {
      var m = /g=([^&]+)/.exec(r.url || '');
      var n = m ? P.findNode(m[1]) : null;
      if (n && picks.indexOf(n) < 0) picks.push(n);
    });
    if (picks.length < 2) {
      ['learn-eq', 'forces', 'kinematics2d', 'waves'].forEach(function (id) {
        var n = P.findNode(id);
        if (n && picks.length < 2 && picks.indexOf(n) < 0) picks.push(n);

    }).join('');

  /* Live Ambient Wave & Vector Animation inside Hero Spotlight */
  var heroPhase = 0, heroRaf = 0;
  function paintHeroCanvas() {
    var cv = document.getElementById('heroStageCv');
    if (!cv || !cv.getContext) return;
    var W = cv.clientWidth || 720, H = cv.clientHeight || 280, dpr = Math.min(2, window.devicePixelRatio || 1);
    if (cv.width !== W * dpr || cv.height !== H * dpr) { cv.width = W * dpr; cv.height = H * dpr; }
    var c = cv.getContext('2d');
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, W, H);
    // Harmonic standing wave + orbiting vector particles along right side
    var ox = W * 0.78, oy = H * 0.5;
    c.save();
    for (var ring = 0; ring < 2; ring++) {
      c.beginPath();
      c.ellipse(ox, oy, 74 + ring * 34, 28 + ring * 14, ring === 0 ? 0.32 : -0.32, 0, Math.PI * 2);
      c.strokeStyle = ring === 0 ? 'rgba(250,204,21,0.22)' : 'rgba(45,212,191,0.22)';
      c.lineWidth = 1.5; c.stroke();
      var ang = heroPhase * (ring === 0 ? 0.9 : -0.7) + ring * 1.4;
      var rx = (74 + ring * 34) * Math.cos(ang), ry = (28 + ring * 14) * Math.sin(ang);
      var rot = ring === 0 ? 0.32 : -0.32;
      var px = ox + rx * Math.cos(rot) - ry * Math.sin(rot);
      var py = oy + rx * Math.sin(rot) + ry * Math.cos(rot);
      c.beginPath(); c.arc(px, py, 4.5, 0, Math.PI * 2);
      c.fillStyle = ring === 0 ? '#facc15' : '#2dd4bf'; c.fill();
    }
    c.beginPath();
    for (var x = W * 0.35; x <= W; x += 4) {
      var y = H * 0.80 + Math.sin(x * 0.025 - heroPhase * 1.6) * 14 * Math.sin((x - W * 0.35) / (W * 0.65) * Math.PI);
      if (x === W * 0.35) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.strokeStyle = 'rgba(250,204,21,0.18)'; c.lineWidth = 2; c.stroke();
    c.restore();
  }
  function startHeroLoop() {
    if (heroRaf || typeof requestAnimationFrame !== 'function') return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { paintHeroCanvas(); return; }
    var last = 0;
    function tick(now) {
      heroRaf = 0;
      if (last) heroPhase += (now - last) * 0.0012;
      last = now;
      paintHeroCanvas();
      heroRaf = requestAnimationFrame(tick);
    }
    heroRaf = requestAnimationFrame(tick);
  }

  function paintMiniMap() {
    var cv = document.getElementById('miniMapCv');
    if (!cv || !cv.getContext) return;
    var W = cv.clientWidth || 380, H = cv.clientHeight || 110, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var s = P.getState();
    c.clearRect(0, 0, W, H);
    var cx = W * 0.14, cy = H * 0.5;
    var hubs = [{ x: W * 0.42, y: H * 0.30, c: '#facc15' }, { x: W * 0.42, y: H * 0.70, c: '#2dd4bf' }];
    hubs.forEach(function (hb) {
      c.beginPath(); c.moveTo(cx, cy);
      c.bezierCurveTo(cx + W * 0.14, cy, hb.x - W * 0.12, hb.y, hb.x, hb.y);
      c.strokeStyle = hb.c; c.globalAlpha = 0.55; c.lineWidth = 1.8; c.stroke();
    });
    var mIdx = 0, pIdx = 0;
    P.NODES.forEach(function (n) {
      var p = P.getNodeProgress(n.id, s);
      var hb = n.course === '9709' ? hubs[0] : hubs[1];
      var i = n.course === '9709' ? mIdx++ : pIdx++;
      var tot = n.course === '9709' ? 7 : 10;
      var nx = W * 0.86, ny = (n.course === '9709' ? 10 : H * 0.54) + (i / Math.max(1, tot - 1)) * (H * 0.36);
      c.beginPath(); c.moveTo(hb.x, hb.y);
      c.bezierCurveTo(hb.x + W * 0.2, hb.y, nx - W * 0.2, ny, nx, ny);
      c.strokeStyle = p.mastered ? '#facc15' : p.started ? '#2dd4bf' : 'rgba(148,163,184,0.22)';
      c.globalAlpha = p.mastered ? 0.88 : p.started ? 0.55 : 0.35;
      c.lineWidth = p.mastered ? 1.6 : 1; c.stroke();
      c.globalAlpha = 1;
      c.beginPath(); c.arc(nx, ny, p.mastered ? 3.5 : 2.5, 0, Math.PI * 2);
      c.fillStyle = p.mastered ? '#facc15' : p.started ? '#2dd4bf' : 'rgba(148,163,184,0.5)';
      c.fill();
    });
    c.globalAlpha = 1;
    hubs.forEach(function (hb) { c.beginPath(); c.arc(hb.x, hb.y, 5, 0, Math.PI * 2); c.fillStyle = hb.c; c.fill(); });
  }

  function renderAll() {
    var s = P.getState(), sum = P.getSummary(s);
    renderHeroAndTele(s, sum);
    renderAtlas(s);
    renderContinue(s);
    renderHeatmapAndBars(s, sum);
    renderBadgesAndVault(s, sum);
    paintMiniMap();
    startHeroLoop();
  }

  document.querySelectorAll('#wsTabs .ws-tab').forEach(function (tab) {
    tab.onclick = function () {
      activeWorkspace = tab.getAttribute('data-ws');
      document.querySelectorAll('#wsTabs .ws-tab').forEach(function (t) {
        var on = t === tab;
        t.classList.toggle('on', on);
        t.setAttribute('aria-selected', String(on));
      });
      ['atlas', 'analytics', 'vault'].forEach(function (id) {
        document.getElementById('ws-' + id).hidden = (id !== activeWorkspace);
      });
      if (activeWorkspace === 'atlas') paintMiniMap();
    };
  });

  document.querySelectorAll('#atlasFilters button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('#atlasFilters button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      atlasFilter = b.getAttribute('data-f');
      renderAtlas(P.getState());
    };
  });

  document.getElementById('atlasDensityBtn').onclick = function () {
    atlasCompact = !atlasCompact;
    this.textContent = atlasCompact ? '▤ Large Cards' : '⊞ Compact';
    renderAtlas(P.getState());
  };

  window.addEventListener('sim-progress-change', renderAll);
  window.addEventListener('resize', function () { paintMiniMap(); paintHeroCanvas(); });
  renderAll();
})();
</script>
</body>
</html>
