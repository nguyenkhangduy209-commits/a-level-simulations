<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Level Mechanics & Physics Simulations</title>
<link rel="stylesheet" href="assets/theme.css">
<style>
  .hub { max-width: 1100px; margin: 0 auto; padding: 18px 20px 60px; }
  .hub h1 { font-size: 26px; margin: 6px 0 4px; letter-spacing: -.015em; }
  .hub .lede { color: var(--muted); margin: 0 0 14px; max-width: 760px; }
  .tabs { display: flex; gap: 6px; margin: 10px 0 18px; flex-wrap: wrap; align-items: center; }
  .tabs button.tab { font: 600 14px var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .search { flex: 1 1 220px; font: 14px var(--sans); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .topic { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 6px 18px; padding: 14px 0; border-top: 1px solid var(--line); }
  @media (max-width: 720px) { .topic { grid-template-columns: minmax(0, 1fr); } }
  .topic .tname { font-weight: 650; font-size: 15.5px; }
  .topic .tref { color: var(--muted); font-size: 12.5px; }
  .sims { display: grid; gap: 10px; }
  .simcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .simcard h3 { margin: 0 0 3px; font-size: 16px; }
  .simcard h3 a { color: var(--ink); text-decoration: none; }
  .simcard h3 a:hover { color: var(--accent); }
  .simcard p { margin: 0 0 9px; font-size: 13px; color: var(--muted); }
  .modechips { display: flex; flex-wrap: wrap; gap: 6px; }
  .modechips a { font-size: 13px; text-decoration: none; color: var(--ink); background: var(--chip); border-radius: 999px; padding: 4px 10px; }
  .modechips a:hover { background: var(--accent); color: var(--accent-ink); }
  h2.section { font-size: 18px; margin: 30px 0 6px; }
  .types { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; align-items: start; }
  .types details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .types summary { font-size: 14px; color: var(--ink); font-weight: 600; }
  .types summary .n { color: var(--muted); font-weight: 400; }
  .types ol { font-size: 12.5px; padding-left: 18px; max-height: 320px; overflow: auto; margin: 8px 0 4px; }
  .types li { margin: 4px 0; }
  .types .ref { font-family: var(--mono); color: var(--muted); }
  .types .open { font-size: 12.5px; }
  .types .subs { font-size: 12px; color: var(--muted); margin: 4px 0; }
  .types .sub { font-size: 11px; background: var(--chip); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }
  .alsoin { font-size: 13px; color: var(--muted); padding: 2px 2px; }
  .start { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin: 0 0 8px; }
  .start h2 { font-size: 16px; margin: 0 0 4px; }
  .start .sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  .start .learnbtn { display: inline-block; text-decoration: none; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 8px; margin-bottom: 12px; }
  .start ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; counter-reset: s; }
  .start li { counter-increment: s; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px 8px 38px; position: relative; font-size: 13px; color: var(--muted); }
  .start li::before { content: counter(s); position: absolute; left: 10px; top: 8px; width: 20px; height: 20px; border-radius: 50%; background: var(--chip); color: var(--ink); font-weight: 700; font-size: 12px; display: grid; place-items: center; }
  .start li a { font-weight: 600; font-size: 14px; text-decoration: none; display: block; color: var(--ink); }
  .start li a:hover { color: var(--accent); }
  .start .rules { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
</style>
<script src="core/util.js"></script>
<script src="core/ui.js"></script>
<script src="catalog/groups.js"></script>
<script src="catalog/9709-plane.js"></script>
<script src="catalog/9709-forces.js"></script>
<script src="catalog/9709-kinematics.js"></script>
<script src="catalog/9709-dynamics.js"></script>
<script src="catalog/9702-projectile.js"></script>
<script src="catalog/9702-t1to3.js"></script>
<script src="catalog/9702-t4to7.js"></script>
<script src="catalog/9702-t8to11.js"></script>
<!-- tagged past-paper Paper 4 questions (generated by tools/papers) -->
<script src="data/p4-questions.js"></script>
</head>
<body>
<div class="hub">
  <h1>A Level Mechanics &amp; Physics Simulations</h1>
  <p class="lede">Cambridge 9709 Paper 4 Mechanics (g = 10) and 9702 AS Physics (g = 9.81). One simulation per idea: open it, then pick a mode or an exam setup inside. Every parameter has a slider, and the working is shown with your numbers.</p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-c="9709" aria-selected="true">9709 Mechanics</button>
    <button class="tab" role="tab" data-c="9702" aria-selected="false">9702 AS Physics</button>
    <input class="search" type="search" placeholder="Search, e.g. pulley, power, projectile, friction…" aria-label="Search">
    <button class="theme-btn" id="themeBtn">Light / dark</button>
  </div>
  <div id="start"></div>
  <div id="list"></div>
  <h2 class="section" id="ppHead">Past Paper 4 questions by type</h2>
  <p class="lede" id="ppNote" style="margin-top:0"></p>
  <div id="types" class="types"></div>
</div>
<script>
(function () {
  'use strict';
  var ui = SIM.ui, h = ui.h, esc = ui.esc;
  var TOPICS = {
    '9709': [
      ['9709-M1', 'Forces and equilibrium', '4.1'], ['9709-M2', 'Kinematics in a straight line', '4.2'], ['9709-M3', 'Momentum', '4.3'],
      ['9709-M4', 'Newton’s laws of motion', '4.4'], ['9709-M5', 'Energy, work and power', '4.5']],
    '9702': [
      ['9702-1', 'Physical quantities and units', 'Topic 1'], ['9702-2', 'Kinematics', 'Topic 2'], ['9702-3', 'Dynamics', 'Topic 3'],
      ['9702-4', 'Forces, density and pressure', 'Topic 4'], ['9702-5', 'Work, energy and power', 'Topic 5'], ['9702-6', 'Deformation of solids', 'Topic 6'],
      ['9702-7', 'Waves', 'Topic 7'], ['9702-8', 'Superposition', 'Topic 8'], ['9702-9', 'Electricity', 'Topic 9'], ['9702-10', 'D.C. circuits', 'Topic 10'],
      ['9702-11', 'Particle physics', 'Topic 11']]
  };
  var GROUPS = window.SIM_GROUPS || [], CAT = window.SIM_CATALOG || [];
  var state = { c: '9709', q: '' };
  try { var sc = localStorage.getItem('hub-course'); if (sc === '9702' || sc === '9709') state.c = sc; } catch (e) { /* ignore */ }

  function groupUrl(g, m, preset) { return 'group.html?g=' + g.id + (m ? '&m=' + m.id : '') + (preset !== undefined && preset !== null ? '&preset=' + preset : ''); }
  /** searchable text for a group: its title, summary, mode labels and the question types of its pages */
  function hay(g) {
    var t = g.title + ' ' + g.summary + ' ' + g.modes.map(function (m) { return m.label; }).join(' ');
    g.modes.forEach(function (m) { CAT.forEach(function (e) { if (e.path === m.path) t += ' ' + (e.summary || '') + ' ' + (e.questionTypes || []).map(function (x) { return x.text; }).join(' '); }); });
    return t.toLowerCase();
  }
  /** find the group/mode that shows a sim id (for past-paper links) */
  function locate(simId, course) {
    for (var i = 0; i < GROUPS.length; i++) {
      var g = GROUPS[i]; if (g.course !== course) continue;
      for (var j = 0; j < g.modes.length; j++) if (g.modes[j].path.indexOf('/' + simId + '.html') >= 0) return groupUrl(g, g.modes[j]);
    }
    return null;
  }

  function renderStart() {
    var box = document.getElementById('start'); box.innerHTML = '';
    if (state.c !== '9709' || state.q) return;
    // syllabus order: 4.1 first (resolving is used everywhere), 4.2 alongside it, then 4.4 and 4.5 which need both; 4.3 is self-contained
    box.innerHTML =
      '<section class="start" aria-labelledby="startH"><h2 id="startH">New to mechanics? Start here</h2>' +
      '<p class="sub">A guided first lesson that goes one idea at a time, then the topics in an order where each one builds on the last.</p>' +
      '<a class="learnbtn" href="learn/equilibrium.html">Learn: a particle held by two strings (11 short steps) →</a>' +
      '<ol>' +
      '<li><a href="group.html?g=forces">Forces and equilibrium</a>4.1: resolving forces, used in every later topic</li>' +
      '<li><a href="group.html?g=kinematics">Straight-line motion</a>4.2: v–t graphs, constant acceleration, calculus</li>' +
      '<li><a href="group.html?g=newton">Slopes, pulleys and lifts</a>4.4: F = ma, needs 4.1 and 4.2</li>' +
      '<li><a href="group.html?g=energy">Work and energy</a>4.5: work–energy and power, needs 4.4</li>' +
      '<li><a href="group.html?g=momentum">Momentum and collisions</a>4.3: self-contained, often combined with 4.2</li>' +
      '</ol>' +
      '<p class="rules">Every 9709 Paper 4: use g = 10 m s<sup>−2</sup>, give answers to 3 significant figures and angles to 1 decimal place, and write out each equation you use. ' +
      '9702 AS Physics is a separate course (g = 9.81).</p></section>';
  }

  function render() {
    renderStart();
    document.querySelectorAll('.tabs .tab').forEach(function (b) { b.setAttribute('aria-selected', String(b.getAttribute('data-c') === state.c)); });
    var list = document.getElementById('list'); list.innerHTML = '';
    var q = state.q.toLowerCase();
    TOPICS[state.c].forEach(function (tp) {
      var gs = GROUPS.filter(function (g) { return g.course === state.c && g.topics.indexOf(tp[0]) >= 0 && (!q || hay(g).indexOf(q) >= 0); });
      if (q && !gs.length) return;
      var sims = h('div', { class: 'sims' });
      // a simulation gets its full card only under its MAIN topic (topics[0]); elsewhere a one-line "also in" link
      var also = gs.filter(function (g) { return g.topics[0] !== tp[0]; });
      gs = gs.filter(function (g) { return g.topics[0] === tp[0]; });
      gs.forEach(function (g) {
        var chips = h('div', { class: 'modechips' });
        if (g.modes.length > 1) g.modes.forEach(function (m) { chips.appendChild(h('a', { href: groupUrl(g, m), text: m.label })); });
        sims.appendChild(h('div', { class: 'simcard' }, [h('h3', {}, [h('a', { href: groupUrl(g), text: g.title })]), h('p', { text: g.summary }), chips]));
      });
      if (also.length) {
        var line = h('div', { class: 'alsoin' }, [document.createTextNode(gs.length ? 'Also used here: ' : 'Covered in: ')]);
        also.forEach(function (g, i) { if (i) line.appendChild(document.createTextNode(', ')); line.appendChild(h('a', { href: groupUrl(g), text: g.title })); });
        sims.appendChild(line);
      }
      if (!gs.length && !also.length) sims.appendChild(h('div', { class: 'empty', text: 'Coming soon.' }));
      list.appendChild(h('section', { class: 'topic' }, [h('div', {}, [h('div', { class: 'tname', text: tp[1] }), h('div', { class: 'tref', text: state.c + ' · ' + tp[2] })]), sims]));
    });
    if (!list.children.length) list.appendChild(h('div', { class: 'empty', text: 'No simulation matches “' + state.q + '”.' }));
    renderTypes(q);
  }

  function renderTypes(q) {
    var box = document.getElementById('types'); box.innerHTML = '';
    var types = (window.P4_TYPES || []).filter(function (t) { return t.subject === state.c; });
    document.getElementById('ppHead').style.display = types.length ? '' : 'none';
    document.getElementById('ppNote').textContent = state.c === '9702'
      ? '9702 Paper 4 is the A Level paper (topics 12–25), so these questions go beyond the AS simulations above. Papers 2018–2021 include the old electronics and communication topics.'
      : 'Every 9709 Paper 4 question from 2018 to 2026, grouped by situation. Open a type to see the questions and its simulation.';
    types.forEach(function (t) {
      var items = t.items || [];
      if (q && (t.name + ' ' + items.map(function (i) { return i.text; }).join(' ')).toLowerCase().indexOf(q) < 0) return;
      var det = h('details');
      det.appendChild(h('summary', { html: esc(t.name) + ' <span class="n">(' + items.length + ')</span>' }));
      var gEntry = t.group ? GROUPS.filter(function (g) { return g.id === t.group; })[0] : null;
      var mEntry = gEntry ? gEntry.modes.filter(function (m) { return m.id === t.mode; })[0] : null;
      var url = gEntry ? groupUrl(gEntry, mEntry) : (t.sim ? locate(t.sim, t.subject) : null);
      if (url) det.appendChild(h('div', { class: 'open' }, [h('a', { href: url, text: 'Open the simulation for this type →' })]));
      var ol = h('ol');
      if (t.subtypes && t.subtypes.length > 1) det.appendChild(h('div', { class: 'subs', text: 'Includes: ' + t.subtypes.join(' · ') }));
      items.forEach(function (it) { ol.appendChild(h('li', { html: '<span class="ref">' + esc(it.ref) + (it.marks ? ' [' + esc(it.marks) + ']' : '') + '</span> ' + (it.sub && t.subtypes && t.subtypes.length > 1 ? '<span class="sub">' + esc(it.sub) + '</span> ' : '') + esc(it.text) })); });
      det.appendChild(ol); box.appendChild(det);
    });
  }

  document.querySelectorAll('.tabs .tab').forEach(function (b) {
    b.addEventListener('click', function () { state.c = b.getAttribute('data-c'); try { localStorage.setItem('hub-course', state.c); } catch (e) { /* ignore */ } render(); });
  });
  document.querySelector('.search').addEventListener('input', function (e) { state.q = e.target.value.trim(); render(); });
  try { var th = localStorage.getItem('sim-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) { /* ignore */ }
  document.getElementById('themeBtn').addEventListener('click', function () {
    var d = document.documentElement, cur = d.getAttribute('data-theme');
    var dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    d.setAttribute('data-theme', dark ? 'light' : 'dark'); try { localStorage.setItem('sim-theme', dark ? 'light' : 'dark'); } catch (e) { /* ignore */ }
  });
  render();
})();
</script>
</body>
</html>
