<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Level Atlas · Interactive Physics &amp; Mechanics Dashboard</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/app.css">
<script src="catalog/groups.js"></script>
<script src="core/progress.js"></script>
</head>
<body>
<script>
(function () {
  'use strict';
  var P = window.SIM_PROGRESS;
  var esc = P.esc, svg = P.svg;
  var shell = P.mountShell({
    active: 'dashboard',
    greetPrefix: 'Hi, ',
    subtitle: 'Welcome back — ignite nodes across 9709 Mechanics & 9702 AS Physics to unlock secret sandbox toys.'
  });
  var root = shell.content;
  var atlasFilter = 'all';

  root.innerHTML =
    '<section class="kpi-grid" id="kpiGrid"></section>' +
    '<section class="panel-card" aria-label="Icon Progress Atlas">' +
    '  <div class="panel-head">' +
    '    <div class="panel-title">' +
    '      <span class="kpi-badge">' + svg('map') + '</span>' +
    '      <div><h2>Icon Progress Atlas</h2><small>Tap any icon to inspect mastery, launch the simulation, or claim +50 XP via Mastery Quest</small></div>' +
    '    </div>' +
    '    <div class="filter-pills" id="atlasFilters">' +
    '      <button type="button" class="on" data-f="all">All (17)</button>' +
    '      <button type="button" data-f="9709">9709 Mechanics</button>' +
    '      <button type="button" data-f="9702">9702 AS Physics</button>' +
    '      <button type="button" data-f="mastered">Mastered</button>' +
    '    </div>' +
    '  </div>' +
    '  <div class="icon-atlas" id="iconAtlas"></div>' +
    '</section>' +
    '<div class="bento-grid">' +
    '  <div class="bento-col">' +
    '    <section class="panel-card">' +
    '      <div class="panel-head">' +
    '        <div class="panel-title"><span class="kpi-badge">' + svg('kinematics2d') + '</span><div><h2>Continue Learning</h2><small>Interactive sims &amp; guided lessons</small></div></div>' +
    '        <div style="display:flex;gap:8px;flex-wrap:wrap"><a class="pill-btn gold" href="solver.html">📸 AI Screenshot Solver</a><a class="pill-btn" href="course.html?c=9709">Browse Courses →</a></div>' +
    '      </div>' +
    '      <div class="cont-list" id="contList"></div>' +
    '    </section>' +
    '    <div id="dashCoachHost"></div>' +
    '  </div>' +
    '  <div class="bento-col">' +
    '    <section class="panel-card">' +
    '      <div class="panel-head">' +
    '        <div class="panel-title"><span class="kpi-badge">' + svg('spark') + '</span><div><h2>Radial Atlas Tree Preview</h2><small id="nextUnlockLbl">Next secret unlock</small></div></div>' +
    '        <a class="pill-btn gold" href="map.html">Open Tree Map →</a>' +
    '      </div>' +
    '      <div style="position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);height:190px;background:radial-gradient(circle at 25% 50%,rgba(45,212,191,.16),#070c0e 70%)">' +
    '        <canvas id="miniMapCv" style="width:100%;height:100%;display:block"></canvas>' +
    '        <a href="map.html" style="position:absolute;right:12px;bottom:12px" class="pill-btn">Explore 17 Nodes ↗</a>' +
    '      </div>' +
    '      <div id="unlockSegBar" style="margin-top:12px"></div>' +
    '    </section>' +
    '    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">' +
    '      <section class="panel-card">' +
    '        <div class="panel-head"><div class="panel-title"><span class="kpi-badge">' + svg('trophy') + '</span><div><h2>Atlas Breakdown</h2><small>Mastery distribution</small></div></div></div>' +
    '        <div id="donutBox"></div>' +
    '      </section>' +
    '      <section class="panel-card">' +
    '        <div class="panel-head"><div class="panel-title"><span class="kpi-badge">' + svg('energy-p') + '</span><div><h2>Weekly Activity</h2><small>Last 7 days</small></div></div></div>' +
    '        <div class="bar-chart" id="weeklyBars"></div>' +
    '      </section>' +
    '    </div>' +
    '    <section class="panel-card">' +
    '      <div class="panel-head">' +
    '        <div class="panel-title"><span class="kpi-badge">' + svg('uncertainty') + '</span><div><h2>Course Engagement</h2><small>12-week simulation &amp; quest activity</small></div></div>' +
    '        <div class="heat-legend"><span><i style="background:var(--grid)"></i>Low</span><span><i style="background:color-mix(in srgb,var(--accent) 40%,var(--grid))"></i>Medium</span><span><i style="background:color-mix(in srgb,var(--accent) 75%,var(--grid))"></i>High</span><span><i style="background:var(--accent)"></i>Best</span></div>' +
    '      </div>' +
    '      <div class="heatmap-wrap">' +
    '        <div class="heat-days"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div>' +
    '        <div class="heatmap" id="heatmapGrid"></div>' +
    '      </div>' +
    '    </section>' +
    '  </div>' +
    '</div>' +
    '<div class="bottom-bento">' +
    '  <section class="panel-card">' +
    '    <div class="panel-head"><div class="panel-title"><span class="kpi-badge">' + svg('trophy') + '</span><div><h2>Earned Icon Badges</h2><small id="badgeCountLbl">Unlock milestones</small></div></div></div>' +
    '    <div class="badge-grid" id="badgeGrid"></div>' +
    '  </section>' +
    '  <section class="panel-card">' +
    '    <div class="panel-head">' +
    '      <div class="panel-title"><span class="kpi-badge">' + svg('vault') + '</span><div><h2>Secret Vault &amp; Certificates</h2><small>Interactive physics toys, relics &amp; desk skins</small></div></div>' +
    '      <a class="pill-btn gold" href="vault.html">Open Vault →</a>' +
    '    </div>' +
    '    <div id="vaultPreview" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"></div>' +
    '  </section>' +
    '</div>';

  P.createCoachWidget(document.getElementById('dashCoachHost'), { prefix: '' });

  function renderKpis(s, sum) {
    var stackIcons = P.NODES.slice(0, 4).map(function (n) { return '<span>' + svg(n.id) + '</span>'; }).join('');
    var pctAll = Math.round((sum.masteredCount / sum.totalNodes) * 100);
    document.getElementById('kpiGrid').innerHTML =
      '<div class="kpi-card">' +
      '  <div class="kpi-head"><span class="kpi-badge">' + svg('spark') + '</span><span>Total XP &amp; Rank</span></div>' +
      '  <div class="kpi-val-row"><span class="kpi-num">' + sum.xp + '</span><span class="kpi-delta">' + esc(sum.rank.name) + '</span></div>' +
      '  <div class="xp-bar"><div style="width:' + sum.pctToNext + '%"></div></div>' +
      '  <div class="kpi-sub">' + (sum.nextRank ? (sum.nextRank.minXp - s.xp) + ' XP to ' + esc(sum.nextRank.name) : 'Max rank achieved!') + '</div>' +
      '</div>' +
      '<div class="kpi-card">' +
      '  <div class="kpi-head"><span class="kpi-badge">' + svg('forces') + '</span><span>In Progress Topics</span></div>' +
      '  <div class="kpi-val-row"><span class="kpi-num">' + sum.startedCount + '</span><div class="mini-stack">' + stackIcons + '</div></div>' +
      '  <div class="kpi-sub"><span class="kpi-delta">' + (sum.startedCount + sum.masteredCount) + '/' + sum.totalNodes + '</span><span>explored across both courses</span></div>' +
      '</div>' +
      '<div class="kpi-card">' +
      '  <div class="kpi-head"><span class="kpi-badge">' + svg('trophy') + '</span><span>Mastered Nodes</span></div>' +
      '  <div class="kpi-val-row"><span class="kpi-num">' + sum.masteredCount + '</span><span class="kpi-delta">' + pctAll + '% Atlas</span></div>' +
      P.segBarHtml(pctAll, 20) +
      '  <div class="kpi-sub">Pass a node quest (+50 XP) to ignite gold</div>' +
      '</div>' +
      '<div class="kpi-card">' +
      '  <div class="kpi-head"><span class="kpi-badge">' + svg('vault') + '</span><span>Badges &amp; Unlocks</span></div>' +
      '  <div class="kpi-val-row"><span class="kpi-num">' + sum.badgesEarned.length + '<small style="font-size:15px;color:var(--muted)">/' + P.BADGES.length + '</small></span><span class="kpi-delta">' + sum.unlockedToysCount + '/4 Toys</span></div>' +
      '  <div class="kpi-sub">' + sum.unlockedRelicsCount + ' relics collected in Trophy Cabinet</div>' +
      '</div>';
  }

  function openNodePopover(node) {
    var s = P.getState(), p = P.getNodeProgress(node.id, s);
    var grp = (window.SIM_GROUPS || []).filter(function (g) { return g.id === node.id; })[0];
    var modes = (grp && grp.modes) || node.modes || [{ id: 'main', label: node.title }];
    var old = document.getElementById('atlasNodeModal');
    if (old) old.remove();
    var back = document.createElement('div');
    back.id = 'atlasNodeModal'; back.className = 'sim-modal-back';
    back.innerHTML =
      '<div class="sim-modal" role="dialog" aria-modal="true">' +
      '  <div class="sim-modal-head">' +
      '    <span class="kpi-badge" style="width:32px;height:32px">' + svg(node.id) + '</span>' +
      '    <h2>' + esc(node.title) + '</h2>' +
      '    <button type="button" class="sim-modal-close" id="mClose">×</button>' +
      '  </div>' +
      '  <div class="sim-modal-body">' +
      '    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px">' +
      P.ringHtml(p.pct, node.id, p.mastered, p.started) +
      '      <div style="flex:1;min-width:180px">' +
      '        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px"><span class="chip">' + esc(node.syllabus) + '</span><span class="chip">' + p.pct + '% Mastery</span></div>' +
      '        <div style="font-size:13px;color:var(--muted)">Relic: <b>' + esc(node.relic.name) + '</b> — ' + esc(node.relic.fact) + '</div>' +
      '      </div>' +
      '    </div>' +
      '    <div class="chk-list" style="margin-bottom:14px">' +
      modes.map(function (m, idx) {
        var done = p.modesVisited.indexOf(m.id) >= 0 || p.mastered;
        var href = node.id === 'learn-eq' ? node.url : 'group.html?g=' + node.id + '&m=' + m.id;
        return '<a class="chk-row ' + (done ? 'done' : '') + '" href="' + href + '">' +
          '<span class="chk-num">' + String(idx + 1).padStart(2, '0') + '</span>' +
          '<span>' + esc(m.label) + '</span>' +
          '<span class="chk-stat">' + (done ? '✓ Explored' : 'Open →') + '</span></a>';
      }).join('') +
      '    </div>' +
      '    <div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '      <a class="btn primary" href="' + node.url + '">Launch Simulation →</a>' +
      '      <button type="button" class="btn" id="mQuest">' + (p.mastered ? 'Replay Mastery Quest' : '★ Take Mastery Quest (+50 XP)') + '</button>' +
      '      <a class="btn" href="map.html?focus=' + node.id + '">Locate on Map</a>' +
      '    </div>' +
      '  </div>' +
      '</div>';
    back.onclick = function (e) { if (e.target === back) back.remove(); };
    back.querySelector('#mClose').onclick = function () { back.remove(); };
    back.querySelector('#mQuest').onclick = function () {
      back.remove();
      P.openQuestModal(node.id, function () { renderAll(); });
    };
    document.body.appendChild(back);
  }

  function renderAtlas(s) {
    var host = document.getElementById('iconAtlas');
    host.innerHTML = '';
    var list = P.NODES.filter(function (n) {
      var p = P.getNodeProgress(n.id, s);
      if (atlasFilter === '9709') return n.course === '9709';
      if (atlasFilter === '9702') return n.course === '9702';
      if (atlasFilter === 'mastered') return p.mastered;
      return true;
    });
    if (!list.length) {
      host.innerHTML = '<p style="grid-column:1/-1;color:var(--muted);margin:8px 0">No mastered nodes in this filter yet — tap a node to launch its Mastery Quest!</p>';
      return;
    }
    list.forEach(function (n) {
      var p = P.getNodeProgress(n.id, s);
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'icon-tile ' + (p.mastered ? 'mastered' : p.started ? 'started' : 'locked');
      btn.innerHTML =
        P.ringHtml(p.pct, n.id, p.mastered, p.started) +
        '<span class="tile-name">' + esc(n.short) + '</span>' +
        '<span class="tile-meta">' + (p.mastered ? 'Mastered' : p.started ? p.pct + '% · In progress' : n.course) + '</span>';
      btn.onclick = function () { openNodePopover(n); };
      host.appendChild(btn);
    });
  }

  function renderContinue(s) {
    var rec = [];
    try { rec = JSON.parse(localStorage.getItem('recent-sims') || '[]'); } catch (e) { rec = []; }
    var picks = [];
    rec.forEach(function (r) {
      var m = /g=([^&]+)/.exec(r.url || '');
      var n = m ? P.findNode(m[1]) : null;
      if (n && picks.indexOf(n) < 0) picks.push(n);
    });
    if (picks.length < 2) {
      ['learn-eq', 'forces', 'kinematics2d', 'waves'].forEach(function (id) {
        var n = P.findNode(id);
        if (n && picks.length < 2 && picks.indexOf(n) < 0) picks.push(n);
      });
    }
    var box = document.getElementById('contList');
    box.innerHTML = picks.slice(0, 2).map(function (n) {
      var p = P.getNodeProgress(n.id, s);
      var miniSvg = n.course === '9709'
        ? '<svg width="88" height="58" viewBox="0 0 90 60" fill="none" stroke="var(--accent)" stroke-width="2.2"><path d="M8 52 H82 V14 Z" fill="color-mix(in srgb,var(--accent) 14%,transparent)"/><rect x="44" y="21" width="16" height="12" rx="2" transform="rotate(-27 52 27)" fill="var(--panel)"/></svg>'
        : '<svg width="88" height="58" viewBox="0 0 90 60" fill="none" stroke="var(--accent)" stroke-width="2.2"><path d="M6 50 Q 45 -4 84 50" stroke-dasharray="4 4"/><circle cx="45" cy="23" r="4" fill="var(--accent)"/></svg>';
      return '<a class="cont-card" href="' + n.url + '">' +
        '  <div class="cont-art">' +
        '    <div><span class="chip">' + esc(n.syllabus) + '</span><h3 style="margin:6px 0 0;font-size:15.5px">' + esc(n.title) + '</h3></div>' +
        miniSvg +
        '  </div>' +
        '  <div class="cont-tags">' + n.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
        P.segBarHtml(p.pct, 24) +
        '  <div class="cont-foot"><span>Progress: ' + P.miniRingHtml(p.pct) + '</span><span style="color:var(--accent);font-weight:700">Continue →</span></div>' +
        '</a>';
    }).join('');
  }

  function renderHeatmapAndBars(s, sum) {
    var db = document.getElementById('donutBox');
    if (db) db.innerHTML = P.donutHtml(sum.masteredCount, sum.startedCount, sum.totalNodes);
    var hm = document.getElementById('heatmapGrid');
    hm.innerHTML = sum.heatmap.map(function (c) {
      var lv = c.count >= 6 ? 'l4' : c.count >= 3 ? 'l3' : c.count >= 2 ? 'l2' : c.count >= 1 ? 'l1' : '';
      return '<div class="heat-cell ' + lv + '" title="' + c.date + ': ' + c.count + ' actions"></div>';
    }).join('');
    var maxW = Math.max(4, sum.weekly.reduce(function (m, w) { return Math.max(m, w.count); }, 0));
    document.getElementById('weeklyBars').innerHTML = sum.weekly.map(function (w) {
      var hPct = Math.max(10, Math.round((w.count / maxW) * 100));
      return '<div class="bar-col"><div class="bar-track" title="' + w.count + ' actions"><div class="bar-fill" style="height:' + hPct + '%"></div></div><span class="bar-lbl">' + w.label + '</span></div>';
    }).join('');
  }

  function renderBadgesAndVault(s, sum) {
    document.getElementById('badgeCountLbl').textContent = sum.badgesEarned.length + ' of ' + P.BADGES.length + ' badges earned';
    document.getElementById('badgeGrid').innerHTML = P.BADGES.map(function (b) {
      var ok = b.check(s, sum);
      return '<div class="badge-tile ' + (ok ? 'earned' : 'locked') + '">' +
        '<div class="b-ico">' + svg(b.icon) + '</div>' +
        '<b>' + esc(b.name) + '</b><small>' + esc(b.desc) + '</small></div>';
    }).join('');

    var nextToy = P.TOYS.filter(function (t) { return !P.isToyUnlocked(t, s, sum); })[0];
    document.getElementById('nextUnlockLbl').textContent = nextToy
      ? 'Next Secret Toy: ' + nextToy.name + ' (' + sum.xp + '/' + nextToy.reqXp + ' XP)'
      : 'All 4 Secret Sandbox Toys Unlocked!';
    var nextPct = nextToy ? Math.min(100, Math.round((sum.xp / nextToy.reqXp) * 100)) : 100;
    document.getElementById('unlockSegBar').innerHTML =
      '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:5px"><span>Unlock Milestone</span><b>' + nextPct + '%</b></div>' +
      P.segBarHtml(nextPct, 24);

    document.getElementById('vaultPreview').innerHTML = P.TOYS.map(function (t) {
      var ok = P.isToyUnlocked(t, s, sum);
      return '<a href="vault.html?toy=' + t.id + '" style="text-decoration:none;color:var(--ink);padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--panel2);display:flex;flex-direction:column;gap:6px">' +
        '<div style="display:flex;align-items:center;justify-content:space-between"><span class="kpi-badge" style="width:28px;height:28px">' + svg(ok ? 'spark' : 'vault') + '</span><span class="chip">' + (ok ? 'Unlocked' : t.reqXp + ' XP') + '</span></div>' +
        '<b style="font-size:13px">' + esc(t.name) + '</b><small style="font-size:11.5px;color:var(--muted)">' + (ok ? 'Tap to play →' : 'Or solve bonus riddle') + '</small></a>';
    }).join('');
  }

  function paintMiniMap() {
    var cv = document.getElementById('miniMapCv');
    if (!cv || !cv.getContext) return;
    var W = cv.clientWidth || 500, H = cv.clientHeight || 190, dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = W * dpr; cv.height = H * dpr;
    var c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
    var s = P.getState();
    c.clearRect(0, 0, W, H);
    // Image 2 Radial Bézier Tree mini-preview
    var cx = W * 0.14, cy = H * 0.5;
    var hubs = [{ x: W * 0.42, y: H * 0.30, c: '#facc15' }, { x: W * 0.42, y: H * 0.70, c: '#2dd4bf' }];
    hubs.forEach(function (hb) {
      c.beginPath(); c.moveTo(cx, cy);
      c.bezierCurveTo(cx + W * 0.14, cy, hb.x - W * 0.12, hb.y, hb.x, hb.y);
      c.strokeStyle = hb.c; c.globalAlpha = 0.55; c.lineWidth = 2; c.stroke();
    });
    var mIdx = 0, pIdx = 0;
    P.NODES.forEach(function (n) {
      var p = P.getNodeProgress(n.id, s);
      var hb = n.course === '9709' ? hubs[0] : hubs[1];
      var i = n.course === '9709' ? mIdx++ : pIdx++;
      var tot = n.course === '9709' ? 7 : 10;
      var nx = W * 0.86, ny = (n.course === '9709' ? 14 : H * 0.52) + (i / Math.max(1, tot - 1)) * (H * 0.40);
      c.beginPath(); c.moveTo(hb.x, hb.y);
      c.bezierCurveTo(hb.x + W * 0.2, hb.y, nx - W * 0.2, ny, nx, ny);
      c.strokeStyle = p.mastered ? '#facc15' : p.started ? '#2dd4bf' : 'rgba(148,163,184,0.22)';
      c.globalAlpha = p.mastered ? 0.88 : p.started ? 0.55 : 0.35;
      c.lineWidth = p.mastered ? 1.8 : 1.1; c.stroke();
      c.globalAlpha = 1;
      c.beginPath(); c.arc(nx, ny, p.mastered ? 4.5 : 3, 0, Math.PI * 2);
      c.fillStyle = p.mastered ? '#facc15' : p.started ? '#2dd4bf' : 'rgba(148,163,184,0.5)';
      c.fill();
    });
    c.globalAlpha = 1;
    hubs.forEach(function (hb) {
      c.beginPath(); c.arc(hb.x, hb.y, 7, 0, Math.PI * 2); c.fillStyle = hb.c; c.fill();
    });
    var og = c.createRadialGradient(cx, cy, 2, cx, cy, 22);
    og.addColorStop(0, '#5eead4'); og.addColorStop(0.5, 'rgba(45,212,191,.35)'); og.addColorStop(1, 'transparent');
    c.fillStyle = og; c.beginPath(); c.arc(cx, cy, 22, 0, Math.PI * 2); c.fill();
  }

  function renderAll() {
    var s = P.getState(), sum = P.getSummary(s);
    renderKpis(s, sum);
    renderAtlas(s);
    renderContinue(s);
    renderHeatmapAndBars(s, sum);
    renderBadgesAndVault(s, sum);
    paintMiniMap();
    var sr = document.getElementById('sideRankName'), sx = document.getElementById('sideXpNum');
    if (sr) sr.textContent = sum.rank.name;
    if (sx) sx.textContent = sum.xp + ' XP';
  }

  document.querySelectorAll('#atlasFilters button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('#atlasFilters button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      atlasFilter = b.getAttribute('data-f');
      renderAtlas(P.getState());
    };
  });

  window.addEventListener('sim-progress-change', renderAll);
  window.addEventListener('resize', paintMiniMap);
  renderAll();
})();
</script>
</body>
</html>
